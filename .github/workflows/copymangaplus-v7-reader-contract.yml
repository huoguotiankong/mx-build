name: CopyManga Plus v7 reader contract

on:
  push:
    branches: [main]
    paths:
      - ".github/copymangaplus-v7-reader-contract-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copymangaplus-v7-reader-contract
  cancel-in-progress: false

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build helpers
        uses: actions/checkout@v5
        with:
          path: buildrepo
          persist-credentials: false

      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Apply v7 Copy reader contract patch
        run: python3 buildrepo/scripts/patch_copymangaplus_v7_reader_contract.py dev

      - name: Validate source layout
        working-directory: dev
        run: |
          python3 scripts/validate_sources.py
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay CopyManga Plus module
        run: |
          rm -rf upstream/src/zh/copymangaplus
          cp -a dev/src/zh/copymangaplus upstream/src/zh/copymangaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless build and lint
        working-directory: upstream
        run: ./gradlew :src:zh:copymangaplus:spotlessCheck :src:zh:copymangaplus:assembleDebug :src:zh:copymangaplus:lintRelease --stacktrace

      - name: Commit verified v7 source
        working-directory: dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zh/copymangaplus docs/sources/copymangaplus.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix(copymangaplus): update Copy chapter and reader contract'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: copymangaplus-v1.6.7-reader-contract-debug
          path: upstream/src/zh/copymangaplus/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
