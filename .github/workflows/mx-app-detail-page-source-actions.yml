name: MX App Detail Page Source Actions
# Retriggered after the private mx-app workflow failed before runner assignment.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-detail-page-source-actions.yml"
      - "scripts/mx-app-detail-page-source-actions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout MX build scripts
        uses: actions/checkout@v5
        with:
          path: build-infra

      - name: Checkout private MX App feature branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: feat/detail-page-source-actions
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Reset already-staged detail-chip file to main baseline
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- app/src/main/java/eu/kanade/presentation/manga/components/MangaDetailInfoSection.kt

      - name: Apply detail page source action enhancements
        working-directory: source
        run: python3 ../build-infra/scripts/mx-app-detail-page-source-actions.py

      - name: Fix Kotlin cross-module rating access
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/eu/kanade/presentation/manga/components/MangaRatingDialog.kt")
          text = path.read_text(encoding="utf-8")

          old_check = "                        if (ratingInfo.averageScore != null) {\n"
          new_check = (
              "                        val averageScore = ratingInfo.averageScore\n"
              "                        if (averageScore != null) {\n"
          )
          if text.count(old_check) != 1:
              raise SystemExit(f"rating average check mismatch: {text.count(old_check)}")
          text = text.replace(old_check, new_check, 1)

          old_value = "formatRating(ratingInfo.averageScore)"
          if text.count(old_value) != 1:
              raise SystemExit(f"rating average value mismatch: {text.count(old_value)}")
          text = text.replace(old_value, "formatRating(averageScore)", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Spotless
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Spotless check
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Build Preview APK
        working-directory: source
        run: ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Commit validated feature branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add source-owned detail actions"
          git push origin HEAD:feat/detail-page-source-actions
