name: MX App Detail Page Source Actions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-detail-page-source-actions.yml"
      - "scripts/mx-app-detail-page-source-actions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout MX build scripts
        uses: actions/checkout@v5
        with:
          path: build-infra

      - name: Checkout private MX App feature branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: feat/detail-page-source-actions
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply detail page source action enhancements
        working-directory: source
        run: python3 ../build-infra/scripts/mx-app-detail-page-source-actions.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Apply Spotless
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Spotless check
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Build Preview APK
        working-directory: source
        run: ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Commit validated feature branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add source-owned detail actions"
          git push origin HEAD:feat/detail-page-source-actions
