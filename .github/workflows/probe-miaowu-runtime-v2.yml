name: Probe Miaowu runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Discover official APK endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          urls=['https://zyz.iqtao.cn/index.php/share/app/10001','https://mwapk.jsj66.com','https://mwapk.jss66.com']
          H={'User-Agent':'Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'}
          for url in urls:
              print('\nURL',url)
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=20)
                  body=r.read(1000000)
                  print('STATUS',getattr(r,'status',None),'FINAL',r.geturl(),'TYPE',r.headers.get('content-type'),'LEN',len(body))
                  if b'<html' in body.lower() or b'http' in body.lower():
                      t=body.decode('utf-8','replace')
                      found=[]
                      for x in re.findall(r'https?://[^\"\'<>\s]+|(?:href|src)=[\"\']([^\"\']+)',t,re.I):
                          if isinstance(x,tuple): x=next((z for z in x if z),'')
                          if x and x not in found: found.append(x)
                      for x in found[:100]: print('LINK',x)
                      for key in ['apk','download','安卓','android','version']:
                          p=t.lower().find(key.lower())
                          if p>=0: print('AROUND',key,re.sub(r'\s+',' ',t[max(0,p-300):p+700])[:1000])
              except Exception as e: print('ERR',type(e).__name__,str(e)[:300])
          PY
