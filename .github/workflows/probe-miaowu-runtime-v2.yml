name: Probe Miaowu runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install Capstone
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.9
      - name: Disassemble Miaowu parser and helper
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          regions = [
            ('parser', 0x35fc00, ''),
            ('helper33154c', 0x331480, ''),
          ]
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for name,base,b64 in regions:
              print(f'===== {name} {base:#x} =====')
              for ins in md.disasm(base64.b64decode(b64),base):
                  if name == 'parser' or (0x3314d0 <= ins.address <= 0x331680):
                      print(f'{ins.address:#010x}: {ins.mnemonic:<8} {ins.op_str}')
          PY
