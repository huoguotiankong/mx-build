name: Probe Miaowu runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect official share page
        shell: bash
        run: |
          set -euo pipefail
          curl -kL --connect-timeout 15 --max-time 30 -A 'Mozilla/5.0' \
            'https://zyz.iqtao.cn/index.php/share/app/10001' -o /tmp/share.html
          python3 - <<'PY'
          import re
          t=open('/tmp/share.html','r',encoding='utf-8',errors='replace').read()
          print('LEN',len(t))
          for line in t.splitlines():
              if re.search(r'apk|download|android|安卓|下载|jsj|iqtao',line,re.I):
                  print(re.sub(r'\s+',' ',line)[:1500])
          PY
