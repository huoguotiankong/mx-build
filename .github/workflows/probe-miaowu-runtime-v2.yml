name: Probe Miaowu runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect web list routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          H={'User-Agent':'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36','Accept':'text/html,application/xhtml+xml,*/*'}
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=20) as r:
                      t=r.read(500000).decode('utf-8','replace'); print('\nURL',url,'STATUS',r.status,'LEN',len(t)); return t
              except urllib.error.HTTPError as e:
                  print('\nURL',url,'HTTP',e.code); return ''
          def dump(label,t):
              print('\n###',label,'TITLE',re.findall(r'<title>(.*?)</title>',t,re.I|re.S)[:1])
              for mark in ['今日推荐','最新漫画','最近更新','热门','排行','漫画分类','全部','热血','完结']:
                  p=t.find(mark)
                  if p>=0: print('MARK',mark, re.sub(r'\s+',' ',t[max(0,p-700):p+2200])[:3000])
              links=re.findall(r'href=["\']([^"\']+)["\']',t,re.I)
              print('LINKS', [x for x in links if re.search(r'(custom|rank|category|search|/\d+\.html)',x)][:100])
          for label,url in [
              ('home','https://mh.iqtao.cn/'),
              ('top','https://mh.iqtao.cn/custom/top'),
              ('ticket','https://mh.iqtao.cn/custom/ticket'),
              ('categoryroot','https://mh.iqtao.cn/category'),
              ('categorytags9','https://mh.iqtao.cn/category/tags/9'),
              ('categoryfinish1','https://mh.iqtao.cn/category/finish/1'),
          ]:
              dump(label,get(url))

          # Extract the exact search getmore AJAX block from core.js.
          js=get('https://npm.elemecdn.com/banwl/maocdn/template/wap/default/js/core.js')
          p=js.find('search : function')
          if p<0: p=js.find('search:function')
          print('\nSEARCH_FUNCTION_START',p)
          if p>=0: print(js[p:p+10000])
          PY
