name: Probe Miaowu runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe bootstrap response shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, time, uuid
          url='https://maowu.iqtao.cn/appv1/bootstrap/start'
          ua='Dart/3.9 (dart:io)'
          forms=[{}, {
            'package_name':'com.scdmx.hebqykj.mao.mao',
            'app_version':'1.2.17',
            'os_version':'16',
            'os_sdk_int':'36',
            'user_agent':ua,
            'current_timestamp':str(int(time.time()*1000)),
            'request_id':str(uuid.uuid4()),
          }]
          for form in forms:
            print('FIELDS',sorted(form.keys()))
            req=urllib.request.Request(url,data=urllib.parse.urlencode(form).encode(),headers={'User-Agent':ua,'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'})
            try:
              r=urllib.request.urlopen(req,timeout=20); raw=r.read(200000).decode('utf-8','replace'); status=r.status
            except urllib.error.HTTPError as e:
              raw=e.read(200000).decode('utf-8','replace'); status=e.code
            except Exception as e:
              print('ERR',type(e).__name__,str(e)[:200]); continue
            print('STATUS',status,'LEN',len(raw))
            try:
              obj=json.loads(raw)
              def shape(v,depth=0):
                if depth>3:return type(v).__name__
                if isinstance(v,dict): return {str(k): ('string(len=%d)'%len(vv) if isinstance(vv,str) else shape(vv,depth+1)) for k,vv in v.items()}
                if isinstance(v,list): return [shape(x,depth+1) for x in v[:2]]
                return v
              print(json.dumps(shape(obj),ensure_ascii=False,indent=2)[:12000])
            except Exception:
              print(raw[:1500])
          PY
