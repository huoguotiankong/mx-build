name: Probe Miaowu runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Validate web pagination and image codec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, re, hashlib
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
          H={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*'}
          def get(url, limit=500000, referer=None):
              h=dict(H)
              if referer: h['Referer']=referer
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      b=r.read(limit)
                      print('\nURL',url,'STATUS',r.status,'FINAL',r.geturl(),'LEN',len(b))
                      return b
              except urllib.error.HTTPError as e:
                  b=e.read(4000); print('\nURL',url,'HTTP',e.code,'BODY',b.decode('utf-8','replace')[:800]); return b''
              except Exception as e:
                  print('\nURL',url,'ERR',repr(e)); return b''
          def text(url): return get(url).decode('utf-8','replace')
          def summary(label,t):
              print('\n--',label,'--')
              print('TITLE',re.findall(r'<title>(.*?)</title>',t,re.I|re.S)[:1])
              print('ITEMS',[(u,re.sub('<.*?>','',n).strip()) for u,n in re.findall(r'<a[^>]+href=["\'](/\d+\.html)["\'][^>]*>.*?(?:class=["\']comic-name["\'][^>]*>(.*?)</|alt=["\']([^"\']+))',t,re.I|re.S)[:8]])
              print('PAGINATION',re.findall(r'href=["\']([^"\']+)["\'][^>]*>(?:\s*<[^>]+>)*\s*(\d+|下一页|下页|&gt;)',t,re.I)[:30])
              print('ALL PAGE LINKS', [x for x in re.findall(r'href=["\']([^"\']+)["\']',t,re.I) if 'rank/' in x or 'category/' in x or 'search' in x][-40:])

          for label,url in [
              ('rank1p1','https://mh.iqtao.cn/rank/1-1.html'),
              ('rank1p2','https://mh.iqtao.cn/rank/1-2.html'),
              ('rank5p1','https://mh.iqtao.cn/rank/5-1.html'),
              ('category','https://mh.iqtao.cn/category/tags/642'),
              ('search19','https://mh.iqtao.cn/search?key=19%E5%A4%A9'),
              ('searchdouluo','https://mh.iqtao.cn/search?key=%E6%96%97%E7%BD%97'),
          ]:
              summary(label,text(url))

          reader=text('https://mh.iqtao.cn/128/221583.html')
          imgs=[]
          for u in re.findall(r'(?:data-src|src)=["\']((?:https?:)?//[^"\']+\.(?:jpg|jpeg|png|webp|avif)(?:\?[^"\']*)?)["\']',reader,re.I):
              if '/scomic/' in u and u not in imgs: imgs.append(u)
          print('\nREADER ENCRYPTED IMAGES',len(imgs),imgs[:12])
          if imgs:
              u='https:'+imgs[0] if imgs[0].startswith('//') else imgs[0]
              for ref in [None,'https://mh.iqtao.cn/128/221583.html']:
                  b=get(u,200000,ref)
                  print('IMAGE REF',ref,'PREFIX',b[:16].hex(),'SHA',hashlib.sha256(b).hexdigest() if b else '')
                  if b:
                      dec=bytes((((x-47)&255)^0xAB) for x in b)
                      print('DECRYPT PREFIX',dec[:16].hex(),'ASCII',repr(dec[:12]))
                      print('MAGIC', dec[:3]==b'\xff\xd8\xff', dec[:4]==b'\x89PNG', dec[:4]==b'RIFF' and dec[8:12]==b'WEBP')
          PY
