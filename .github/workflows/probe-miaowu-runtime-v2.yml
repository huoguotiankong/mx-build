name: Probe Miaowu runtime v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-runtime-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install Capstone
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.9
      - name: Disassemble Miaowu piclist transform
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          base=0x360e80
          data=base64.b64decode('')
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for ins in md.disasm(data,base):
              mark=' <<< piclist_transform' if ins.address==0x360ec8 else ''
              print(f'{ins.address:#010x}: {ins.mnemonic:<8} {ins.op_str}{mark}')
          PY
