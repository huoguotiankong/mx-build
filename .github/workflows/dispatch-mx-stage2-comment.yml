name: Dispatch MX Stage2 Comment Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-mx-stage2-comment.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prepare-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check required secret
        shell: bash
        env:
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || { echo "::error::Missing MX_APP_PUBLISH_TOKEN"; exit 1; }

      - name: Checkout Stage 2 private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: integration/mx-stage2-comment-20260906
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Bump Stage 2 version to 1.14.7/87
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 87', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.14.7"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Unable to set Stage 2 version')
          p.write_text(s, encoding='utf-8')
          PY
          grep -F 'versionCode = 87' app/build.gradle.kts
          grep -F 'versionName = "1.14.7"' app/build.gradle.kts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/build.gradle.kts
            git commit -m "build: prepare MX stage2 comment preview 1.14.7"
            git push origin HEAD:integration/mx-stage2-comment-20260906
          fi

      - name: Dispatch isolated Stage 2 preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run mx-app-preview.yml \
            --repo huoguotiankong/mx-build \
            --ref main \
            -f ref=integration/mx-stage2-comment-20260906 \
            -f publish=true
          echo "Dispatched MX App Preview for integration/mx-stage2-comment-20260906"
