name: Promote Qingman v14 test store

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-qingman-v14-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-qingman-v14-test
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check repository token
        shell: bash
        env:
          MX_REPO_TOKEN: ${{ secrets.MX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_REPO_TOKEN" ]] || { echo "::error::Missing MX_REPO_TOKEN"; exit 1; }

      - name: Checkout staged test store
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify staged Qingman v14
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.qingman'
          expected = ('1.6.14', 106014)
          data = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          if len(items) != 1:
              raise SystemExit(f'Expected one staged {package}, got {len(items)}')
          item = items[0]
          actual = (item.get('versionName'), item.get('versionCode'))
          if actual != expected:
              raise SystemExit(f'{package}: expected {expected}, got {actual}')

          apk = Path('staging/test/apk/tachiyomi-zh.qingman-v1.6.14.apk')
          icon = Path('staging/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v106014.png')
          if not apk.is_file() or not icon.is_file():
              raise SystemExit('Staged Qingman v14 APK/icon missing')
          print(f'Staged Qingman v14 verified: {actual}, apkSha256={hashlib.sha256(apk.read_bytes()).hexdigest()}')
          PY

      - name: Checkout public repository
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          ref: repo
          token: ${{ secrets.MX_REPO_TOKEN }}
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Promote only Qingman v14
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.qingman'
          public_path = Path('repo/test/index.json')
          staged_path = Path('staging/test/index.json')
          public = json.loads(public_path.read_text('utf-8'))
          staged = json.loads(staged_path.read_text('utf-8'))

          staged_items = [x for x in staged['extensionList']['extensions'] if x.get('packageName') == package]
          if len(staged_items) != 1:
              raise SystemExit('Expected exactly one staged Qingman entry')
          public_items = public['extensionList']['extensions']
          positions = [i for i, x in enumerate(public_items) if x.get('packageName') == package]
          if len(positions) != 1:
              raise SystemExit(f'Expected exactly one public Qingman entry, got {len(positions)}')
          public_items[positions[0]] = staged_items[0]
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY

          rm -f repo/test/apk/tachiyomi-zh.qingman-v*.apk
          rm -f repo/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v*.png
          cp staging/test/apk/tachiyomi-zh.qingman-v1.6.14.apk repo/test/apk/
          cp staging/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v106014.png repo/test/icon/
          git -C repo status --short

      - name: Commit public Qingman v14 test
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/index.json test/apk test/icon
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Qingman test-store changes to promote"
          else
            git commit -m "Publish Qingman v1.6.14 test"
            git push origin HEAD:repo
          fi

      - name: Verify promoted Qingman v14 locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.qingman'
          data = json.loads(Path('repo/test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          assert len(items) == 1
          item = items[0]
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.14', 106014)
          assert Path('repo/test/apk/tachiyomi-zh.qingman-v1.6.14.apk').is_file()
          assert Path('repo/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v106014.png').is_file()
          print('Promoted Qingman v14 index/APK/icon verified')
          PY
