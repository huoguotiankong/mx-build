name: Probe Current Manwa Domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-manwaplus-current.yml"
      - ".github/manwaplus-current-probe-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe likely content hosts
        shell: bash
        run: |
          set -u
          mkdir -p probe
          MOBILE_UA='Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro Build/AP2A.240805.005) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          DESKTOP_UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          hosts=(
            'manwa.me' 'www.manwa.me'
            'manwass.cc' 'www.manwass.cc'
            'manwatg.cc' 'www.manwatg.cc'
            'manwaqp.cc' 'www.manwaqp.cc'
            'manwafl.cc' 'www.manwafl.cc'
            'manwaqr.cc' 'www.manwaqr.cc'
            'manwaqs.cc' 'www.manwaqs.cc'
            'manwagd.cc' 'www.manwagd.cc'
          )
          : > probe/summary.tsv
          i=0
          for host in "${hosts[@]}"; do
            for ua_name in mobile desktop; do
              if [ "$ua_name" = mobile ]; then UA="$MOBILE_UA"; else UA="$DESKTOP_UA"; fi
              i=$((i+1))
              for spec in 'home:/' 'rank:/rank' 'latest:/getUpdate?page=0&date=' 'browse:/booklist' 'detail:/book/509384'; do
                name="${spec%%:*}"
                path="${spec#*:}"
                body="probe/${i}_${name}.body"
                meta=$(curl -L --compressed --max-redirs 5 --max-time 20 --connect-timeout 6 -sS \
                  -A "$UA" \
                  -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
                  -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.7' \
                  -H 'Cache-Control: no-cache' \
                  -H 'Pragma: no-cache' \
                  -H 'Sec-Fetch-Dest: document' \
                  -H 'Sec-Fetch-Mode: navigate' \
                  -H 'Sec-Fetch-Site: none' \
                  -o "$body" \
                  -w '%{http_code}\t%{content_type}\t%{url_effective}\t%{num_redirects}' \
                  "https://$host$path" 2>"probe/${i}_${name}.err" || true)
                bytes=$(wc -c < "$body" 2>/dev/null || echo 0)
                printf '%s\t%s\t%s\t%s\t%s\n' "$host" "$ua_name" "$name" "$meta" "$bytes" >> probe/summary.tsv
              done
            done
          done
          cat probe/summary.tsv

      - name: Detect usable Manwa responses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('probe')
          lines = root.joinpath('summary.tsv').read_text(errors='ignore').splitlines()
          groups = {}
          request_index = 0
          last_key = None
          for line in lines:
              p = line.split('\t')
              if len(p) < 8:
                  continue
              host, ua, name, code, ctype, final_url, redirects, size = p[:8]
              key = (host, ua)
              if key != last_key:
                  request_index += 1
                  last_key = key
              body_path = root / f'{request_index}_{name}.body'
              body = body_path.read_text(errors='ignore') if body_path.exists() else ''
              g = groups.setdefault(key, {'signals': [], 'finals': set()})
              g['finals'].add(final_url)
              if name == 'latest':
                  try:
                      obj = json.loads(body)
                      if isinstance(obj, dict) and isinstance(obj.get('books'), list) and 'total' in obj:
                          g['signals'].append(f'latest-json:{len(obj["books"])}')
                  except Exception:
                      pass
              if name == 'rank' and ('rankList_2' in body or '/book/' in body):
                  g['signals'].append('rank-html')
              if name == 'browse' and ('manga-filter-row' in body or 'manga-list-2' in body):
                  g['signals'].append('browse-html')
              if name == 'detail' and 'detail-main-info-title' in body and '/chapter/' in body:
                  g['signals'].append('detail-html')
                  if 'detail-list-comment' in body or '查看更多回复数' in body:
                      g['signals'].append('comments-html')

          usable = []
          for (host, ua), data in groups.items():
              signals = sorted(set(data['signals']))
              finals = sorted(data['finals'])
              print('probe-result', host, ua, 'signals=', signals, 'finals=', finals)
              if signals:
                  usable.append((host, ua, signals))
          print('usable-hosts', usable)
          PY

      - name: Upload probe metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manwaplus-current-probe
          path: |
            probe/summary.tsv
            probe/*.err
          retention-days: 3
          if-no-files-found: warn
