name: Trace Qingman Login Serializers And Callsite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-login-serializer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace serializers and login callsite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          print(a['downloadUrl']); print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          allowed={
              'userName','username','password','passWord','pwd','deviceId','loginType','type','platform','android',
              'email','phone','mobile','userId','uid','memberId','user_info','qm_user_id','qm_auth_token',
              'qm_is_guest','qm_identity_type','code','msg','data','result','accessToken','refreshToken','token',
              'appVersion','deviceModel','mobileOs','appCode','clientIp','userPlatform','X-Register-Channel',
              'status','nickName','nickname','avatar','avatarUrl','headImg','headimg',
          }
          deny=re.compile(r'(?i)(clientp12|private|certificate|keystore|bootstrapproof|bootstrapsign|k1a|k1b|k2a|k2b|k3a|k3b|secret)')
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True

          def annot(v):
              if deny.search(v): return '<redacted>'
              m=re.fullmatch(r'String: "([^"]*)"',v)
              if m:
                  s=m.group(1)
                  if s in allowed or s.startswith('api/appapi/user/f9384dh/'):
                      return v
                  return ''
              if any(x in v for x in ('Type','Field <','Closure','AnonymousClosure','Function')):
                  return v[:220]
              return ''

          def dump(title,start,end,full=False):
              print(f'\n=== {title} {start:#x}-{end:#x} ===')
              pending={}
              for ins in md.disasm(data[start-base:end-base],start):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=ins.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if ins.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),24)
                  elif ins.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              a=annot(pp[off])
                              if a: ann=f' ; PP+0x{off:x}={a}'
                  if full or ann or ins.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','b.ls','b.hi','cbz','cbnz','tbz','tbnz') or ins.mnemonic.startswith('st'):
                      print(f'0x{ins.address:x} {ins.mnemonic:<7} {ins.op_str}{ann}')

          # Generated request/response serializers used directly by login async function.
          dump('login serializer cluster',0x3e9f70,0x3ea2b0)
          dump('login response fromJson candidate',0x3ea120,0x3ea1c0,True)
          dump('ftb toJson wrapper',0xaaf5b0,0xaaf610,True)
          # Full local callsite around the call into login async request.
          dump('login caller before and after request',0xaaf860,0xaaf9e0,True)

          print('\n=== EBm FTB CLASS ===')
          for p in Path('/tmp/blutter-out/asm').rglob('EBm.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  if re.search(r'\bclass\s+ftb\b',s):
                      for z in lines[max(0,i-4):min(len(lines),i+90)]:
                          if deny.search(z): continue
                          z=re.sub(r'"[^"]*"','"<literal-omitted>"',z)
                          print(z[:520])

          print('\n=== TYPES JEb WMB ILB ===')
          for type_name in ('JEb','wmb','ilb'):
              for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
                  lines=p.read_text('utf-8',errors='replace').splitlines()
                  for i,s in enumerate(lines):
                      if re.search(r'\bclass\s+'+re.escape(type_name)+r'\b',s):
                          print('TYPE '+type_name+' FILE='+p.name)
                          for z in lines[max(0,i-3):min(len(lines),i+45)]:
                              if deny.search(z): continue
                              z=re.sub(r'"[^"]*"','"<literal-omitted>"',z)
                              print(z[:520])
          PY
