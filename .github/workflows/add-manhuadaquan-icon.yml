name: Add Manga Daquan icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-manhuadaquan-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Build official site icon payload
        shell: bash
        run: |
          set -euo pipefail
          logo=/tmp/manhuadaquan-logo.png
          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36' \
            -e 'http://m.yueman1.cc/' \
            -o "$logo" \
            'http://www.yueman1.cc/template/skin4_20110501/images/logo_wap.gif'
          test -s "$logo"
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open('/tmp/manhuadaquan-logo.png').convert('RGBA')
          size = 96
          canvas = Image.new('RGBA', (size, size), 'white')
          target_w = int(size * 0.88)
          target_h = max(1, round(src.height * target_w / src.width))
          logo = src.resize((target_w, target_h), Image.Resampling.LANCZOS)
          canvas.alpha_composite(logo, ((size-target_w)//2, (size-target_h)//2))
          out = Path('/tmp/ic_launcher.png')
          canvas.convert('RGB').save(out, 'PNG', optimize=True)
          assert Image.open(out).size == (96, 96)
          PY
          printf 'ICON_BASE64='
          base64 -w0 /tmp/ic_launcher.png
          printf '\n'
