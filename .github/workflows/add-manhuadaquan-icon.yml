name: Add Manga Daquan icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-manhuadaquan-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and prepare site icon
        shell: bash
        run: |
          set -euo pipefail
          logo=/tmp/manhuadaquan-logo.gif
          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36' \
            -e 'http://m.yueman1.cc/' \
            -o "$logo" \
            'http://www.yueman1.cc/template/skin4_20110501/images/logo_wap.gif'
          test -s "$logo"
          file "$logo"
          command -v convert >/dev/null 2>&1 || { echo '::error::ImageMagick convert not found'; exit 1; }
          res='source/src/zh/manhuadaquan/res'
          rm -rf "$res"
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            size="${sizes[$density]}"
            mkdir -p "$res/mipmap-$density"
            convert "$logo" -coalesce -resize "$((size*84/100))x$((size*84/100))>" \
              -background white -gravity center -extent "${size}x${size}" \
              "$res/mipmap-$density/ic_launcher.png"
            identify "$res/mipmap-$density/ic_launcher.png"
          done
          test "$(identify -format '%wx%h' "$res/mipmap-xhdpi/ic_launcher.png")" = '96x96'

      - name: Validate and commit icon
        shell: bash
        run: |
          set -euo pipefail
          python3 source/scripts/validate_sources.py
          git -C source diff --check
          git -C source config user.name 'github-actions[bot]'
          git -C source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C source add src/zh/manhuadaquan/res
          git -C source commit -m 'feat(manhuadaquan): add site icon'
          git -C source pull --rebase origin main
          git -C source push origin HEAD:main
