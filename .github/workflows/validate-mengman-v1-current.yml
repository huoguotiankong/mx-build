name: Validate Mengman v1 Current

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-mengman-v1-current.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mengman-v1-current
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::MX_PRIVATE_READ_TOKEN missing"; exit 1; }

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Mengman development branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: source/mengman-v1
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Overlay Mengman module
        shell: bash
        run: |
          set -euo pipefail
          test -f dev/src/zh/mengman/build.gradle.kts
          test -f dev/src/zh/mengman/src/eu/kanade/tachiyomi/extension/zh/mengman/Mengman.kt
          test -f dev/src/zh/mengman/src/eu/kanade/tachiyomi/extension/zh/mengman/MengmanBootstrapCipher.kt
          rm -rf upstream/src/zh/mengman
          cp -a dev/src/zh/mengman upstream/src/zh/mengman

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply and verify formatting
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:mengman:spotlessApply
          ./gradlew :src:zh:mengman:spotlessCheck

      - name: Build debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:mengman:assembleDebug --stacktrace

      - name: Sync validated formatting to development branch
        shell: bash
        run: |
          set -euo pipefail
          cp upstream/src/zh/mengman/src/eu/kanade/tachiyomi/extension/zh/mengman/Mengman.kt \
             dev/src/zh/mengman/src/eu/kanade/tachiyomi/extension/zh/mengman/Mengman.kt
          cp upstream/src/zh/mengman/src/eu/kanade/tachiyomi/extension/zh/mengman/MengmanBootstrapCipher.kt \
             dev/src/zh/mengman/src/eu/kanade/tachiyomi/extension/zh/mengman/MengmanBootstrapCipher.kt
          cd dev
          changed="$(git status --short -- src/zh/mengman)"
          if [[ -z "$changed" ]]; then
            echo "No formatting changes to sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zh/mengman
          git commit -m "style(mengman): apply Keiyoushi formatting"
          git push origin HEAD:source/mengman-v1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mengman-v1-debug
          path: upstream/src/zh/mengman/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
