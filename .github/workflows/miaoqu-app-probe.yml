name: Probe Miaoqu app protocol

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/miaoqu-app-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe TLS and HTTP fallbacks
        shell: bash
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests, ssl, socket
          targets = [
              'https://apitong.zqykfz.cn/api/com.xinmiaoqu.app/index.json',
              'http://apitong.zqykfz.cn/api/com.xinmiaoqu.app/index.json',
              'https://tong.zqykfz.cn/fengmiantu/0/9/fengmiantu.webp',
              'http://tong.zqykfz.cn/fengmiantu/0/9/fengmiantu.webp',
              'https://api.zqykfz.cn/sousuo?keyword=%E6%B5%B7%E8%B4%BC%E7%8E%8B',
              'http://api.zqykfz.cn/sousuo?keyword=%E6%B5%B7%E8%B4%BC%E7%8E%8B',
          ]
          for u in targets:
              for verify in (True, False):
                  try:
                      r=requests.get(u,timeout=15,allow_redirects=False,verify=verify,headers={'User-Agent':'QingManLSLand/1.0'})
                      print('REQ',u,'verify=',verify,'->',r.status_code,'loc=',r.headers.get('location'),'type=',r.headers.get('content-type'),'len=',len(r.content))
                  except Exception as e:
                      print('REQ',u,'verify=',verify,'-> ERROR',repr(e))
                  if verify is True: continue
              print()

          for host in ('apitong.zqykfz.cn','tong.zqykfz.cn','api.zqykfz.cn'):
              try:
                  ctx=ssl.create_default_context()
                  with socket.create_connection((host,443),timeout=10) as sock:
                      with ctx.wrap_socket(sock,server_hostname=host) as ssock:
                          cert=ssock.getpeercert()
                          print('CERT_OK',host,'subject=',cert.get('subject'),'issuer=',cert.get('issuer'),'expires=',cert.get('notAfter'))
              except Exception as e:
                  print('CERT_FAIL',host,repr(e))
          PY
