name: Probe Miaoqu app protocol

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/miaoqu-app-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify current config category chapter and page indexing
        shell: bash
        run: |
          python -m pip install --quiet requests cryptography
          python - <<'PY'
          import base64, json, re
          from urllib.parse import quote
          import requests, urllib3
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          KEY=b'0000o9iu10pol777'
          H={'User-Agent':'QingManLSLand/1.0','Accept':'*/*'}
          RH={'User-Agent':'MangaApp/1.0','Accept':'application/json'}

          def get(url, headers=None, timeout=20):
              try:
                  r=requests.get(url,headers=headers or H,timeout=timeout,allow_redirects=True,verify=False)
                  print('GET',url,'->',r.status_code,r.headers.get('content-type'),'len=',len(r.content),'final=',r.url)
                  return r
              except Exception as e:
                  print('GET',url,'-> ERROR',repr(e)); return None

          def dec(raw):
              blob=base64.b64decode(re.sub(rb'\s+',b'',raw),validate=True)
              return AESGCM(KEY).decrypt(blob[:12],blob[12:],None)

          cr=get('https://apitong.zqykfz.cn/api/com.xinmiaoqu.app/index.json')
          assert cr and cr.ok
          cfg=cr.json()
          print('RAW_CONFIG',json.dumps(cfg,ensure_ascii=False,sort_keys=True))
          api=cfg['apiurl']
          text=api.get('txturl','').rstrip('/')
          cover=api.get('fengmiantuurl','').rstrip('/')
          other=api.get('qitaurl','').rstrip('/')
          print('CONFIG_KEYS',sorted(cfg.keys()))
          print('API_KEYS',sorted(api.keys()))

          # Verify paginated category naming observed in the app.
          for path in [
              '/fenlei/com.xinmiaoqu.app/'+quote('冒险',safe='')+'.json',
              '/fenlei/com.xinmiaoqu.app/'+quote('冒险',safe='')+'1.json',
              '/fenlei/com.xinmiaoqu.app/'+quote('冒险',safe='')+'2.json',
          ]:
              r=get(text+path)
              if r and r.ok:
                  try:
                      x=r.json()
                      print('CATEGORY',path,'type=',type(x).__name__,'count=',len(x) if hasattr(x,'__len__') else None,'prefix=',json.dumps(x,ensure_ascii=False)[:700])
                  except Exception as e: print('CATEGORY_PARSE_ERR',repr(e))

          rr=get(text+'/api/com.xinmiaoqu.app/'+quote('推荐',safe='')+'.json')
          assert rr and rr.ok
          listing=rr.json()
          first=next(x for section in listing for x in section.get('data',[]) if x.get('manhuaid'))
          mid=int(first['manhuaid'])
          print('LISTING_FIRST',json.dumps(first,ensure_ascii=False))

          dr=get(f'{text}/miaoqu46/{mid//1000}/{mid}/info.json',RH)
          assert dr and dr.ok
          detail=json.loads(dec(dr.content).decode('utf-8'))
          print('DETAIL_KEYS',sorted(detail.keys()))
          print('DETAIL_META',json.dumps({k:detail.get(k) for k in detail.keys() if k != 'chapter'},ensure_ascii=False))
          chapters=detail.get('chapter') or []
          print('CHAPTER_COUNT',len(chapters))
          print('CHAPTER_FIRST',json.dumps(chapters[0],ensure_ascii=False))
          print('CHAPTER_LAST',json.dumps(chapters[-1],ensure_ascii=False))
          ch=next(x for x in chapters if int(x.get('geshu') or 0)>0)
          cid=int(ch['chapterid']); pages=int(ch['geshu'])
          print('SAMPLE mid=',mid,'cid=',cid,'pages=',pages,'sort=',ch.get('paixuid'))

          # Exact page-index boundary test.
          for p in list(range(0,min(pages+2,8))):
              u=f'{cover}/tu/{mid//1000}/{mid}/{cid}/{p}.jpeg'
              r=get(u,{'User-Agent':'MangaApp/1.0'},15)
              if r is None: continue
              b=r.content
              print('PAGE',p,'status=',r.status_code,'len=',len(b),'magic=',b[:16].hex(),'riff=',b[:4], 'webp8=',b[8:12])

          # Search and HTTP-vs-HTTPS behavior.
          kw=quote('海贼王',safe='')
          for u in [f'{other}/sousuo?keyword={kw}', f'http://api.zqykfz.cn/sousuo?keyword={kw}']:
              r=get(u)
              if r is not None:
                  print('SEARCH_BODY',u,r.text[:900].replace('\n',' '))
          PY
