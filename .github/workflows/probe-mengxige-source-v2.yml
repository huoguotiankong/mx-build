name: Probe MengXiGe source v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mengxige-source-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper
        uses: actions/checkout@v5
        with:
          path: helper
          fetch-depth: 0
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Probe official source endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, re, subprocess, time, urllib.parse, urllib.request
          from pathlib import Path
          src=Path('source/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt').read_text('utf-8')
          def c(name):
              m=re.search(rf'private const val {name} = "([^"]*)"',src)
              if not m: raise SystemExit('missing '+name)
              return m.group(1)
          package,secret,version,channel,app_id=[c(x) for x in ('APP_PACKAGE','APP_SECRET','APP_VERSION','APP_CHANNEL','APP_ID')]
          def headers():
              now=str(int(time.time())); sign=hashlib.md5((package+'1'+now+secret).encode()).hexdigest()
              return {'User-Agent':'OPPO_R821T/1.0 Linux/3.4.5 Android/4.2.2 Release/03.26.2013 Browser/AppleWebKit534.30 Mobile Safari/534.30 MBBMS/2.2 System/Android 4.2.2_'+package,'Accept':'*/*','Referer':'https://book.folongteng.com/','pt':'1','version':version,'channel':channel,'uuid':'probe-00000000-0000-0000-0000-000000000002','xf-appid':app_id,'fc-session-id':'','package':package,'time':now,'stamp':'','sign':sign}
          def raw_fetch(url):
              req=urllib.request.Request(url,headers=headers())
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.read().decode('utf-8','replace')
          def decode(raw):
              try: root=json.loads(raw)
              except Exception: return raw
              data=root.get('data') if isinstance(root,dict) else None
              if not isinstance(data,dict) or str(data.get('ver'))!='1' or not data.get('content'): return raw
              b=base64.b64decode(data['content'])
              if len(b)<32:return raw
              head,tail=b[:16],b[-16:]; key=hashlib.sha256(head).digest(); md5hex=hashlib.md5(tail).hexdigest().encode('ascii'); iv=bytes((~(md5hex[i]^tail[i]))&255 for i in range(16))
              p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex()],input=b[16:-16],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              return p.stdout.decode('utf-8','replace') if p.returncode==0 else raw
          def fetch_json(url):
              status,raw=raw_fetch(url); body=decode(raw); return status,json.loads(body)
          q=urllib.parse.quote('海贼王')
          status,sj=fetch_json(f'https://s.folongteng.com/v4/1/lists.api?keyword={q}&form=3')
          books=sj.get('book',[]) if isinstance(sj,dict) else []
          candidates=[]
          for b in books[:12]:
              bid=str(b.get('book_id') or b.get('id') or '')
              if not bid: continue
              floor=int(bid)//1000
              try:
                  ds,d=fetch_json(f'https://book.folongteng.com/comics/details/v4/{floor}/{bid}.html')
              except Exception as e:
                  continue
              if isinstance(d,dict): candidates.append((int(d.get('source_count') or 0),bid,d.get('name'),d))
          if not candidates: raise SystemExit('no detail candidates')
          candidates.sort(key=lambda x:x[0],reverse=True)
          sc,bid,title,detail=candidates[0]; floor=int(bid)//1000
          result={'selected':{'bookId':bid,'title':title,'sourceCount':sc,'detail':detail},'source':{},'config':{}}
          source_url=f'https://book.folongteng.com/book/source/v4/{floor}/{bid}.html'
          try:
              s,o=fetch_json(source_url); result['source']={'url':source_url,'status':s,'json':o}
          except Exception as e: result['source']={'url':source_url,'error':type(e).__name__+': '+str(e)}
          for host in ('book','conf','c-catalog'):
              url=f'https://{host}.folongteng.com/v4/source/site.html'
              try:
                  s,o=fetch_json(url); result['config'][host]={'url':url,'status':s,'json':o}
              except Exception as e: result['config'][host]={'url':url,'error':type(e).__name__+': '+str(e)}
          out=Path('helper/probe-results/mengxige-source-v2.json'); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps({'selected':result['selected']['bookId'],'sourceCount':sc,'source':result['source'],'config':result['config']},ensure_ascii=False)[:12000])
          PY
      - name: Commit probe result
        working-directory: helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/mengxige-source-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'probe: record MengXiGe source v2 response'
            git push origin HEAD:main
          fi
