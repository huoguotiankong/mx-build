name: Check Tencent v29 final branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-tencent-v29-final-branch.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]
      - name: Checkout final v29 branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: fix/tencent-v29-complete-emoji-coverage
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false
      - name: Verify final branch diff and markers
        shell: bash
        run: |
          set -euo pipefail
          cd dev
          python3 scripts/validate_sources.py
          git diff --check
          grep -F 'versionCode = 29' src/zh/tencentcomics/build.gradle.kts
          grep -F '118/118' docs/sources/tencentcomics-v29-validation.md
          grep -F 'TENCENT_NAMED_EMOJI_TEXT[label] ?: "🙂[$label]"' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt').read_text('utf-8')
          named = text[text.index('val TENCENT_NAMED_EMOJI_TEXT = mapOf('):text.index('val JSON = Json {')]
          labels = set(re.findall(r'^\s*"([^"]+)"\s+to\s+"', named, flags=re.M))
          assert len(labels) == 118, len(labels)
          numeric = text[text.index('val TENCENT_EMOJI_TEXT = mapOf('):text.index('val TENCENT_NAMED_EMOJI_TEXT = mapOf(')]
          codes = {int(x) for x in re.findall(r'^\s*(\d+)\s+to\s+"', numeric, flags=re.M)}
          assert codes == set(range(90)), sorted(set(range(90)) - codes)
          PY
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Overlay Tencent extension
        run: |
          rm -rf upstream/src/zh/tencentcomics
          cp -a dev/src/zh/tencentcomics upstream/src/zh/tencentcomics
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate final branch
        working-directory: upstream
        run: |
          ./gradlew :src:zh:tencentcomics:spotlessCheck
          ./gradlew :src:zh:tencentcomics:assembleDebug :src:zh:tencentcomics:assembleRelease
          ./gradlew :src:zh:tencentcomics:lintRelease
