name: Tencent Reply API Decompile

on:
  push:
    paths:
      - ".github/workflows/tencent-reply-decompile.yml"
      - ".github/tencent-reply-decompile-trigger"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK and jadx
        shell: bash
        run: |
          set -euo pipefail
          curl -A 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36' \
            -L --fail --retry 3 --connect-timeout 15 --max-time 240 \
            -o tencent.apk \
            'https://wap.pp.cn/app/dl/fs08/2026/07/31/6/110_1d0689776bd9df3cabc573c6ccee1db0.apk'
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 240 \
            -o jadx.zip \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip'
          unzip -q jadx.zip -d jadx
          mkdir -p out

      - name: Decompile reply call sites
        shell: bash
        run: |
          set -euo pipefail
          classes=(
            'com.qq.ac.android.model.q3'
            'com.qq.ac.android.model.x0'
            'com.qq.ac.android.view.activity.TopicDetailActivity'
            'com.qq.ac.android.view.activity.TopicCommentDetailActivity'
            'com.qq.ac.android.view.activity.CommentListActivity'
          )
          for cls in "${classes[@]}"; do
            safe="${cls##*.}"
            ./jadx/bin/jadx --single-class "$cls" --single-class-output "out/$safe.java" tencent.apk
          done

          echo '=== getTopicCommentList / getReplyList / getCommentReplyList call-site excerpts ==='
          grep -n -A30 -B30 -E 'getTopicCommentList|getReplyList|getCommentReplyList|new x0|x0\.|q3\.' out/*.java || true
          echo '=== end/list pagination excerpts ==='
          grep -n -A25 -B25 -E 'endOfList|end_of_list|getEndOfList|replyCount|reply_count|replyList|getReplyList' out/*.java || true
