name: Build Dongman Manhua Plus v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-dongmanmanhuaplus-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dongmanmanhuaplus-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check required secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]
          [[ -n "$MANGA_SIGNING_BUNDLE" ]]

      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          ref: main
          path: helper
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: 31dae02665e8ea6303feee29cb2ef7185a0d8939
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare final Dongman v2 source tree
        shell: bash
        run: |
          set -euo pipefail
          module='dev/src/zh/dongmanmanhuaplus'
          gradle="$module/build.gradle.kts"
          grep -Fq 'versionCode = 2' "$gradle"
          grep -Fq 'lang = "zh"' "$gradle"
          grep -Fq 'id = 4940002032762570168' "$gradle"
          ! grep -Fq 'lang = "zh-Hans"' "$gradle"

          target="$module/res"
          rm -rf "$target"/mipmap-mdpi "$target"/mipmap-hdpi "$target"/mipmap-xhdpi "$target"/mipmap-xxhdpi "$target"/mipmap-xxxhdpi
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="upstream/src/zh/dongmanmanhua/res/mipmap-$density"
            dst="$target/mipmap-$density"
            mkdir -p "$dst"
            icon="$(find "$src" -maxdepth 1 -type f -name 'ic_launcher.*' | head -n1)"
            test -n "$icon"
            cp "$icon" "$dst/$(basename "$icon")"
          done

          # Current androidx preference API accepts Context only for EditTextPreference.
          # Only adapt plain Preference construction used by the source to the current framework.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dev/src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt')
          s = p.read_text('utf-8')
          s = s.replace('Preference(screen.context).apply {', 'Preference().apply {')
          s = s.replace('            isSelectable = false\n', '')
          p.write_text(s, 'utf-8')
          PY

          python3 dev/scripts/validate_sources.py
          git -C dev diff --check

      - name: Overlay into current framework
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/dongmanmanhuaplus
          cp -a dev/src/zh/dongmanmanhuaplus upstream/src/zh/dongmanmanhuaplus

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format and validate
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessApply
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessCheck

      - name: Sync formatted final source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/dongmanmanhuaplus
          rsync -a --exclude build/ upstream/src/zh/dongmanmanhuaplus/ dev/src/zh/dongmanmanhuaplus/
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check

      - name: Prepare stable signing key
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          b = json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for env_name, key in [('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')]:
                  value = str(b[key])
                  print(f'::add-mask::{value}')
                  f.write(f'{env_name}<<EOF_SIGN\n{value}\nEOF_SIGN\n')
          PY

      - name: Verify configured signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          expected='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          actual="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" == "$expected" ]]
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"

      - name: Build Debug Release and lint
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:dongmanmanhuaplus:assembleDebug :src:zh:dongmanmanhuaplus:assembleRelease :src:zh:dongmanmanhuaplus:lintRelease

      - name: Verify APK metadata signing icons and MX ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream/src/zh/dongmanmanhuaplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          jar="$(find upstream/src/zh/dongmanmanhuaplus -path '*/build/outputs/jar/release/*.jar' -type f | head -n1)"
          test -f "$apk"
          test -f "$jar"
          [[ "$(basename "$apk")" == 'tachiyomi-zh.dongmanmanhuaplus-v1.6.2.apk' ]]

          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          cert="$("$apksigner" verify --print-certs "$apk" 2>&1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$cert" == *'1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'* ]]
          jarsigner -verify "$jar" >/dev/null

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            find "dev/src/zh/dongmanmanhuaplus/res/mipmap-$density" -maxdepth 1 -type f -name 'ic_launcher.*' | grep -q .
          done

          info="$(find upstream/src/zh/dongmanmanhuaplus -path '*/build/keiyoushi-source-info.json' -type f | head -n1)"
          test -f "$info"
          INFO="$info" python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ['INFO'], encoding='utf-8'))
          assert d['versionCode'] == 2, d
          assert d['versionName'] == '1.6.2', d
          sources = d['sources']
          assert len(sources) == 1, sources
          src = sources[0]
          assert src['lang'] == 'zh', src
          assert int(src['id']) == 4940002032762570168, src
          print('verified source metadata', src['name'], src['lang'], src['id'])
          PY

          rm -rf /tmp/dongmanplus-dex && mkdir -p /tmp/dongmanplus-dex
          unzip -qq "$apk" 'classes*.dex' -d /tmp/dongmanplus-dex
          strings /tmp/dongmanplus-dex/classes*.dex > /tmp/dongmanplus-strings.txt
          grep -Fq 'eu/kanade/tachiyomi/source/mx/CommentSource' /tmp/dongmanplus-strings.txt
          grep -Fq 'eu/kanade/tachiyomi/source/mx/AccountSource' /tmp/dongmanplus-strings.txt
          grep -Fq 'eu/kanade/tachiyomi/source/mx/ChapterContentReplacementSource' /tmp/dongmanplus-strings.txt

      - name: Checkout extension staging
        uses: actions/checkout@v5
        with:
          ref: extension-staging
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Generate isolated test store snapshot
        shell: bash
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/dongmanmanhuaplus' > targets.txt
          python3 dev/scripts/publish_test_repo.py \
            --targets targets.txt \
            --upstream-root upstream \
            --source-root dev \
            --repo-dir staging/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/apk/tachiyomi-zh.dongmanmanhuaplus-v1.6.2.apk
          python3 - <<'PY'
          import json
          d=json.load(open('staging/test/index.json', encoding='utf-8'))
          x=[e for e in d['extensionList']['extensions'] if e['packageName']=='eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus']
          assert len(x)==1, x
          e=x[0]
          assert e['versionName']=='1.6.2', e
          assert int(e['versionCode'])==106002, e
          assert e['sources'][0]['language']=='zh', e
          assert int(e['sources'][0]['id'])==4940002032762570168, e
          print('test index verified', e['versionName'], e['versionCode'], e['sources'][0]['language'])
          PY

      - name: Checkout formal distribution snapshot
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          ref: repo
          path: prodrepo
          fetch-depth: 1
          persist-credentials: false

      - name: Generate formal production snapshot
        shell: bash
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check protobuf
          python3 dev/scripts/publish_repo.py \
            --artifacts-root upstream/src \
            --source-root dev \
            --repo-dir prodrepo \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT" \
            --upstream-root upstream
          python3 - <<'PY'
          import json
          d=json.load(open('prodrepo/index.json', encoding='utf-8'))
          x=[e for e in d['extensionList']['extensions'] if e['packageName']=='eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus']
          assert len(x)==1, x
          e=x[0]
          assert e['versionName']=='1.6.2', e
          assert int(e['versionCode'])==2, e
          assert e['sources'][0]['language']=='zh', e
          assert int(e['sources'][0]['id'])==4940002032762570168, e
          a=json.load(open('prodrepo/index-android.json', encoding='utf-8'))
          ea=[z for z in a['extensionList']['extensions'] if z['packageName']==e['packageName']][0]
          assert int(ea['versionCode'])==106002, ea
          print('formal indexes verified', e['versionCode'], ea['versionCode'], e['sources'][0]['language'])
          PY

      - name: Export formal production handoff
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/production-handoff"
          rm -rf "$out"
          mkdir -p "$out"
          cd prodrepo
          git status --porcelain=v1 | while IFS= read -r line; do
            rel="${line:3}"
            [[ -n "$rel" ]] || continue
            if [[ -f "$rel" ]]; then
              mkdir -p "$out/$(dirname "$rel")"
              cp -a "$rel" "$out/$rel"
            fi
          done
          printf '%s\n' '31dae02665e8ea6303feee29cb2ef7185a0d8939' > "$out/SOURCE_SHA.txt"
          test -f "$out/tachiyomi-zh.dongmanmanhuaplus-v1.6.2.apk"
          test -f "$out/tachiyomi-zh.dongmanmanhuaplus-v1.6.2.jar"

      - name: Save test and formal handoffs to extension-staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging/production-handoff
          mkdir -p staging/production-handoff
          cp -a "$RUNNER_TEMP/production-handoff/." staging/production-handoff/
          git -C staging config user.name 'github-actions[bot]'
          git -C staging config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C staging add test production-handoff
          git -C staging diff --cached --check
          if git -C staging diff --cached --quiet; then
            echo 'Dongman v2 staging already current'
          else
            git -C staging commit -m 'Stage Dongman Manhua Plus v1.6.2 test and production handoffs'
            git -C staging pull --rebase origin extension-staging
            git -C staging push origin HEAD:extension-staging
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dongmanmanhuaplus-v2-signed-apk
          path: upstream/src/zh/dongmanmanhuaplus/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
