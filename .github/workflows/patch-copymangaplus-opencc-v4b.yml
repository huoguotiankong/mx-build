name: Patch Dongman comments v1.6.7 temporary runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-copymangaplus-opencc-v4b.yml"

permissions:
  contents: read

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout build helpers
        uses: actions/checkout@v5
        with:
          path: infra
          persist-credentials: false

      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Patch source
        run: python3 infra/scripts/patch_dongman_comments_v167.py --source-root source

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay module
        run: |
          rm -rf upstream/src/zh/dongmanmanhuaplus
          cp -a source/src/zh/dongmanmanhuaplus upstream/src/zh/dongmanmanhuaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: upstream

      - name: Format and build
        working-directory: upstream
        run: |
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessApply
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessCheck :src:zh:dongmanmanhuaplus:assembleRelease :src:zh:dongmanmanhuaplus:lintRelease

      - name: Verify live pagination
        run: python3 infra/scripts/patch_dongman_comments_v167.py --verify-live

      - name: Copy formatted module back
        run: |
          rm -rf source/src/zh/dongmanmanhuaplus
          cp -a upstream/src/zh/dongmanmanhuaplus source/src/zh/dongmanmanhuaplus

      - name: Validate private source tree
        working-directory: source
        run: |
          python3 scripts/validate_sources.py
          grep -Fq 'versionCode = 7' src/zh/dongmanmanhuaplus/build.gradle.kts
          grep -Fq 'private const val COMMENT_PAGE_SIZE = 10' src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt
          grep -Fq 'showTotalCount' src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt

      - name: Commit verified source
        working-directory: source
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zh/dongmanmanhuaplus docs/sources/dongmanmanhuaplus.md
          git commit -m 'fix(dongmanmanhuaplus): load all chapter comments'
          git pull --rebase origin main
          git push origin HEAD:main
