name: Probe Tencent comment image delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tencent-comment-image-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tencent-comment-image-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Probe failing Tencent CDN URLs
        shell: bash
        run: |
          set -u
          out="$RUNNER_TEMP/tencent-image-probe.txt"
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36'
          referer='https://ac.qq.com/'
          urls=(
            'https://manhua.acimg.cn/manhua/0/05_16_49_f1ebabbb7cddf4f34cb4805f1e02b306.jpg/0?tp=sharp'
            'https://manhua.acimg.cn/manhua/0/15_09_39_13170f3f334f7e005496d9311df42127.jpg/0?tp=sharp'
          )

          probe() {
            local label="$1" url="$2"
            shift 2
            local result
            result=$(curl -sS -L --range 0-1023 --max-time 20 -o /dev/null \
              -w '%{http_code}|%{content_type}|%{size_download}|%{url_effective}' \
              "$@" "$url" 2>&1) || true
            printf '%s|%s\n' "$label" "$result" >> "$out"
          }

          : > "$out"
          i=0
          for transformed in "${urls[@]}"; do
            i=$((i + 1))
            raw="${transformed%%/0\?tp=sharp}"
            echo "URL $i transformed=$transformed" >> "$out"
            echo "URL $i raw=$raw" >> "$out"
            probe "url${i}-transformed-bare" "$transformed"
            probe "url${i}-transformed-referer" "$transformed" -H "Referer: $referer"
            probe "url${i}-transformed-referer-ua" "$transformed" -H "Referer: $referer" -H "User-Agent: $ua"
            probe "url${i}-raw-bare" "$raw"
            probe "url${i}-raw-referer" "$raw" -H "Referer: $referer"
            probe "url${i}-raw-referer-ua" "$raw" -H "Referer: $referer" -H "User-Agent: $ua"
            echo >> "$out"
          done

          cat "$out"
          mkdir -p diagnostics
          cp "$out" diagnostics/tencent-comment-image-probe-latest.txt

      - name: Publish compact probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/tencent-comment-image-probe-latest.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'diagnostics: update Tencent comment image probe'
          git push
