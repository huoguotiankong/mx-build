name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Identify bootstrap main request setup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1 || true
          echo '=== individual bootstrap header pool entries ==='
          grep -nE 'String: "X-(Timestamp|Signature|QM-Proof-Version|QM-Request-Id|QM-Proof)"' /tmp/blutter-out/pp.txt || true
          echo '=== function owning 0xb1a3e0 ==='
          grep -RInE -C 16 '0xb1a3e0|0xb1a4c0|0xb1a760' /tmp/blutter-out/asm | head -800 || true
          python3 - <<'PY'
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          START=0xb1a300; END=0xb1a470
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f)
              sec=next(s for s in elf.iter_sections() if s['sh_addr'] <= START < s['sh_addr']+s['sh_size'])
              data=sec.data()[START-sec['sh_addr']:END-sec['sh_addr']]
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          print('=== bootstrap prologue raw disassembly ===')
          for x in md.disasm(data,START):
              print(f'{x.address:08x}: {x.mnemonic:<7} {x.op_str}')
          PY
