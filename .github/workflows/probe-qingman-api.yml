name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace bootstrap AOT references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          mkdir -p /tmp/app-lib /tmp/blutter-out
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          echo '=== current embedded domains ==='
          strings /tmp/app-lib/libapp.so | grep -E 'https?://[^ ]+|[A-Za-z0-9.-]+\.qingman\.mom' | grep -E 'qingman|zermh|dmzj' | sort -u | head -120 || true
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1 || true
          tail -10 /tmp/blutter.log || true
          echo '=== bootstrap pool entries ==='
          grep -nE 'bootstrap: 原生签名失败|bootstrap/domain|apiDomain|appAccessToken|bootstrapProof|bootstrapSign|String: "nonce"' /tmp/blutter-out/pp.txt || true
          echo '=== asm PP syntax sample ==='
          grep -RInE -m 40 'PP|\[x27' /tmp/blutter-out/asm | head -80 || true
          echo '=== decimal pool offset references ==='
          grep -RInE -C 30 '#(49104|49152|49168|49200|49208|49296|49304|49312|49320|49464|49472)\b|\[(PP|x27)[^]]*(49104|49152|49168|49200|49208|49296|49304|49312|49320|49464|49472)' /tmp/blutter-out/asm | head -16000 || true
          echo '=== pp-index neighborhood references ==='
          grep -RInE -C 36 '#0x(17fa|1800|1802|1806|1807|1812|1813|1814|1815|1827|1828)\b' /tmp/blutter-out/asm | head -16000 || true
