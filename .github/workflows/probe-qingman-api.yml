name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Qingman bootstrap required fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, ssl, time, urllib.error, urllib.request, uuid
          BOOT='https://mu8xm4cx.zermh.com/bootstrap/domain'
          COMMON={'Accept':'application/json, text/plain, */*','User-Agent':'qingman/4.4.3 (Android)','appVersion':'4.4.3','platform':'android'}
          device='probe-' + uuid.uuid4().hex
          now=str(int(time.time()))
          def req(label, payload):
              body=json.dumps(payload,separators=(',',':')).encode()
              h=dict(COMMON); h['Content-Type']='application/json'
              r=urllib.request.Request(BOOT,data=body,headers=h,method='POST')
              try:
                  with urllib.request.urlopen(r,timeout=20,context=ssl.create_default_context()) as p:
                      raw=p.read(65536); status=p.status
              except urllib.error.HTTPError as e:
                  raw=e.read(65536); status=e.code
              except Exception as e:
                  print(label, 'transport_error', type(e).__name__, str(e)); return
              txt=raw.decode('utf-8','replace')
              try:
                  obj=json.loads(txt)
                  # Do not print any returned token/key/proof/signature values.
                  out={k:v for k,v in obj.items() if k.lower() in {'code','status','msg','message','error','success'}}
                  if isinstance(obj.get('data'),dict): out['data_keys']=list(obj['data'].keys())
                  elif obj.get('data') is not None: out['data_type']=type(obj['data']).__name__
                  print(label, 'status=',status, json.dumps(out,ensure_ascii=False))
              except Exception:
                  print(label, 'status=',status, 'body_prefix=',repr(txt[:200]))
          base={'appVersion':'4.4.3','platform':'android'}
          cases=[
            ('deviceId', {**base,'deviceId':device}),
            ('device_id', {**base,'device_id':device}),
            ('deviceId versionCode', {**base,'deviceId':device,'versionCode':'443'}),
            ('deviceId versionCode channel', {**base,'deviceId':device,'versionCode':'443','channel':'qm1'}),
            ('deviceId registerChannel', {**base,'deviceId':device,'registerChannel':'qm1'}),
            ('deviceId clientIp', {**base,'deviceId':device,'clientIp':'127.0.0.1'}),
            ('deviceId timestamp', {**base,'deviceId':device,'timestamp':now}),
            ('deviceId current_timestamp', {**base,'deviceId':device,'current_timestamp':now}),
            ('deviceId nonce timestamp', {**base,'deviceId':device,'nonce':uuid.uuid4().hex,'timestamp':now}),
            ('deviceId package', {**base,'deviceId':device,'packageName':'com.qingman.app'}),
            ('deviceId appKey placeholder', {**base,'deviceId':device,'appKey':'android'}),
            ('all metadata', {**base,'deviceId':device,'versionCode':'443','channel':'qm1','registerChannel':'qm1','packageName':'com.qingman.app','clientIp':'127.0.0.1','nonce':uuid.uuid4().hex,'timestamp':now}),
          ]
          for label,payload in cases: req(label,payload)
          PY
