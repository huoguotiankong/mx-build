name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev binutils-aarch64-linux-gnu >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Inspect bootstrap function metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          mkdir -p /tmp/app-lib /tmp/blutter-out
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1 || true
          tail -8 /tmp/blutter.log || true
          echo '=== files generated ==='
          find /tmp/blutter-out -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== metadata mentioning upb / 516018 ==='
          grep -RInE -C 80 'upb|516018|0x516018|_HYh@1486071866' /tmp/blutter-out --exclude='*.dart' | head -18000 || true
          echo '=== dart functions around addresses 0x515000..0x518000 ==='
          grep -RInE '\*\* addr: 0x51[5-7][0-9a-f]{3}' /tmp/blutter-out/asm | sort | head -1000 || true
          echo '=== raw arm64 disassembly 0x515000..0x518000 ==='
          aarch64-linux-gnu-objdump -d --start-address=0x515000 --stop-address=0x518000 /tmp/app-lib/libapp.so | head -12000 || true
