name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace bootstrap AOT references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          mkdir -p /tmp/app-lib /tmp/blutter-out
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1 || true
          tail -10 /tmp/blutter.log || true
          echo '=== bootstrap pool entries ==='
          grep -nE 'bootstrap: 原生签名失败|bootstrap/domain|apiDomain|appAccessToken|bootstrapProof|bootstrapSign|String: "nonce"' /tmp/blutter-out/pp.txt || true
          echo '=== raw exact offset references ==='
          grep -RInE -C 18 '0xbfd0|0xc000|0xc010|0xc030|0xc038|0xc090|0xc098|0xc0a0|0xc0a8|0xc138|0xc140' /tmp/blutter-out/asm | head -12000 || true
          echo '=== PP reference forms ==='
          grep -RInE -C 24 '\[PP[^]]*(bfd0|c000|c010|c030|c038|c090|c098|c0a0|c0a8|c138|c140)|\[x27[^]]*(bfd0|c000|c010|c030|c038|c090|c098|c0a0|c0a8|c138|c140)' /tmp/blutter-out/asm | head -12000 || true
          echo '=== nearest bootstrap-containing assembly file/function blocks ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          wanted={'bfd0','c000','c010','c030','c038','c090','c098','c0a0','c0a8','c138','c140'}
          hits=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*'):
              if not p.is_file(): continue
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(re.search(r'0x0*'+re.escape(o)+r'\b',low) for o in wanted):
                      hits.append((p,i))
          print('hit_count=',len(hits))
          seen=set()
          for p,i in hits[:120]:
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              start=max(0,i-100); end=min(len(lines),i+180)
              # Blutter emits function headers as lines ending in ':' and usually includes an address/name.
              for j in range(i,-1,-1):
                  s=lines[j].strip()
                  if j < i and s.endswith(':') and ('0x' in s or 'Function' in s or '::' in s):
                      start=j; break
                  if i-j>500: break
              key=(str(p),start)
              if key in seen: continue
              seen.add(key)
              print(f'\n--- {p}:{i+1} block_start={start+1} ---')
              for k in range(start,end):
                  print(f'{k+1:06d}: {lines[k]}')
          PY
