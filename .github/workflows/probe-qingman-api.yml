name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect Qingman native security exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('current_version',a.get('version'),'versionCode',a.get('versionCode'),file=open('/tmp/version','w'))
          PY
          echo "$(cat /tmp/version)"
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          unzip -p /tmp/qingman.apk lib/arm64-v8a/libqx_security.so > /tmp/libqx_security.so
          unzip -p /tmp/qingman.apk lib/arm64-v8a/libapp.so > /tmp/libapp.so
          echo '=== native ELF ==='
          file /tmp/libqx_security.so
          readelf -h /tmp/libqx_security.so | sed -n '1,30p'
          echo '=== native needed libs ==='
          readelf -d /tmp/libqx_security.so | grep -E 'NEEDED|SONAME' || true
          echo '=== exported symbols ==='
          readelf -Ws /tmp/libqx_security.so | grep -Ei 'Java_|bootstrap|proof|sign|header|guard|key|decrypt|encrypt|sha|md5|aes|rsa|hkdf|JNI_OnLoad' | head -250 || true
          echo '=== defined dynamic symbols ==='
          nm -D --defined-only /tmp/libqx_security.so | grep -Ei 'Java_|bootstrap|proof|sign|header|guard|key|decrypt|encrypt|sha|md5|aes|rsa|hkdf|JNI_OnLoad' | head -250 || true
          echo '=== native relevant strings with offsets ==='
          strings -a -t x /tmp/libqx_security.so | grep -Ei 'qm-bootstrap|qm-native|bootstrap(Sign|Proof|Decrypt)|buildHeaders|initializeSignKeys|apiGuard|appAccess|proofVersion|requestId|deviceId|registerChannel|signature|timestamp|AES|RSA|SHA|HKDF|MD5|android|key' | head -400 || true
          echo '=== dart relevant strings with offsets ==='
          strings -a -t x /tmp/libapp.so | grep -Ei 'bootstrap/domain|bootstrap(Sign|Proof|Decrypt)|initializeSignKeys|buildHeaders|X-(Api-Guard|Device-Id|QM-App-Access|QM-Proof|QM-Proof-Version|QM-Request-Id|Register-Channel|Signature|Timestamp)|appAccessToken|appKeyStr|sign/key|device/risk/token/report' | head -400 || true
          echo '=== disassembly of exported JNI/security functions ==='
          llvm-objdump -d --no-show-raw-insn /tmp/libqx_security.so \
            | grep -E -A160 -B8 '<(JNI_OnLoad|Java_.*|.*bootstrap.*|.*buildHeaders.*|.*initializeSignKeys.*|.*apiGuard.*)>' \
            | head -5000 || true
