name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect current Qingman APK public routes
        shell: bash
        run: |
          set -euo pipefail
          CFG='https://bass8ycl.zermh.com/api/radio/api/config/version'
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('VERSION='+str(a.get('version','')),file=open('/tmp/ver','w'))
          print('VERSION_CODE='+str(a.get('versionCode','')),file=open('/tmp/vc','w'))
          PY
          APK_URL="$(cat /tmp/apk_url)"
          echo "current $(cat /tmp/ver) $(cat /tmp/vc)"
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 "$APK_URL" -o /tmp/qingman.apk
          echo "apk_sha256=$(sha256sum /tmp/qingman.apk | cut -d' ' -f1)"
          unzip -p /tmp/qingman.apk lib/arm64-v8a/libapp.so > /tmp/libapp.so
          unzip -p /tmp/qingman.apk lib/arm64-v8a/libqx_security.so > /tmp/libqx_security.so || true
          echo '=== current app public URL hosts ==='
          strings -a /tmp/libapp.so \
            | grep -Eo 'https?://[^[:space:]"'"'"'<>]+' \
            | sed -E 's/[),;\]}]+$//' \
            | grep -Ei 'qingman|zermh|dmzj|pwpni|urlg|comic' \
            | sort -u | head -100 || true
          echo '=== current app comic/bootstrap paths ==='
          strings -a /tmp/libapp.so \
            | grep -E '^(api/(comic|appapi|radio)/|https://[^ ]+/bootstrap/domain$|X-(Api-Guard|Device-Id|QM-App-Access|QM-Proof|QM-Proof-Version|QM-Request-Id|Register-Channel|Signature|Timestamp)$|bootstrap(Sign|Proof|Decrypt)$|buildHeaders$|initializeSignKeys$)' \
            | sort -u | head -300 || true
          echo '=== native public algorithm markers ==='
          strings -a /tmp/libqx_security.so \
            | grep -E '^(qm-(bootstrap|native)-proof-v[0-9]+\|android|bootstrap(Sign|Proof|Decrypt)|buildHeaders|initializeSignKeys|apiGuard|AES_|RSA_|sha256|hkdfSha256|md5Hex)$' \
            | sort -u || true
