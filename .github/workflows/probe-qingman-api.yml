name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Isolate bootstrap AOT function
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          mkdir -p /tmp/app-lib /tmp/blutter-out
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1 || true
          tail -10 /tmp/blutter.log || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          pp=Path('/tmp/blutter-out/pp.txt').read_text(encoding='utf-8',errors='replace').splitlines()
          targets=['https://mu8xm4cx.zermh.com/bootstrap/domain','bootstrap: 原生签名失败','bootstrapSign','bootstrapProof','apiDomain','appAccessToken','nonce']
          offsets=[]
          print('=== target pool entries ===')
          for line in pp:
              if any(t in line for t in targets):
                  print(line)
                  for pat in (r'\[PP[^#]*#0x([0-9a-fA-F]+)',r'PP[^0-9a-fA-F]*0x([0-9a-fA-F]+)',r'^0x([0-9a-fA-F]+)'):
                      m=re.search(pat,line)
                      if m:
                          x=m.group(1).lower()
                          if x not in offsets: offsets.append(x)
          print('offsets=',offsets)
          if not offsets:
              # Blutter pp.txt commonly begins each pool row with decimal index/address-like metadata.
              for i,line in enumerate(pp):
                  if 'https://mu8xm4cx.zermh.com/bootstrap/domain' in line:
                      print('bootstrap_pp_line_number=',i+1)
          asm_files=list(Path('/tmp/blutter-out/asm').rglob('*'))
          asm_files=[p for p in asm_files if p.is_file()]
          refs=[]
          for p in asm_files:
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  low=line.lower()
                  matched=[o for o in offsets if f'#0x{o}' in low or f'0x{o}' in low]
                  if not matched: continue
                  # Keep only obvious PP/object-pool references where possible.
                  if 'pp' not in low and '[x27' not in low: continue
                  refs.append((p,i,line,matched))
          print('=== exact asm references ===')
          print('reference_count=',len(refs))
          for p,i,line,matched in refs[:80]:
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              # Locate a likely function boundary in Blutter asm: previous blank/header containing address/function marker.
              start=max(0,i-220); end=min(len(lines),i+320)
              for j in range(i,-1,-1):
                  s=lines[j]
                  if re.search(r'^(?:Function|\w.*Function|\[0x[0-9a-fA-F]+\].*):?$',s) or ('function' in s.lower() and '0x' in s.lower()):
                      start=j; break
                  if i-j>700: break
              for j in range(i+1,min(len(lines),i+900)):
                  s=lines[j]
                  if j>i+20 and (re.search(r'^(?:Function|\w.*Function|\[0x[0-9a-fA-F]+\].*):?$',s) or ('function' in s.lower() and '0x' in s.lower())):
                      end=j; break
              print(f'\n--- {p}:{i+1} offsets={matched} ---')
              for k in range(start,end):
                  print(f'{k+1:06d}: {lines[k]}')
          PY
