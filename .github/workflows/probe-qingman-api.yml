name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Locate structural references globally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          mkdir -p /tmp/app-lib /tmp/blutter-out
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1 || true
          tail -8 /tmp/blutter.log || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM

          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text(encoding='utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s*(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          targets={
              0x8e10,0x8e30,0x8e38,0x8e40,0x90a0,0x96d8,
              0xbfd0,0xbfd8,0xbfe0,0xbfe8,0xbff0,0xbff8,
              0xc000,0xc008,0xc010,0xc018,0xc020,0xc028,0xc030,0xc038,0xc040,
              0xc048,0xc050,0xc058,0xc060,0xc090,0xc098,0xc0a0,0xc0a8,0xc0b8,
              0xc128,0xc138,0xc140,0xc148,0xc150,
          }
          safe_words=('bootstrap','nonce','sign','apiDomain','appAccessToken','Content-Type','timestamp',
                      'deviceId','requestId','canonicalRequest','X-QM-','X-Timestamp','X-Signature','body',
                      'code','msg','Field <upb.','AnonymousClosure','Type: Map')
          def desc(off):
              s=pp.get(off,'')
              if any(w.lower() in s.lower() for w in safe_words) or s.startswith(('Field <upb.','AnonymousClosure:','Type: Map')):
                  return s
              return '<structural target>'

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f)
              sec=elf.get_section_by_name('.text')
              if sec is None:
                  # Flutter AOT sometimes places code in another executable section.
                  sec=next(s for s in elf.iter_sections() if (s['sh_flags'] & 0x4) and s['sh_size']>0x100000)
              base=sec['sh_addr']; data=sec.data()

          md=Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          insns=list(md.disasm(data,base))
          hits=[]
          # Pool loads are usually ADD xN, PP(x27), #page followed closely by LDR xM,[xN,#disp].
          pending={}
          for idx,ins in enumerate(insns):
              op=ins.op_str.lower()
              # age pending bases to avoid carrying dataflow across arbitrary code.
              pending={r:(b,ttl-1) for r,(b,ttl) in pending.items() if ttl>1}
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0) << int(m.group(3) or 0),6)
              if ins.mnemonic in ('ldr','ldur','ldrsw'):
                  mm=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if mm:
                      br=mm.group(2); disp=int(mm.group(3),0) if mm.group(3) else 0
                      off=None
                      if br=='x27': off=disp
                      elif br in pending: off=pending[br][0]+disp
                      if off in targets:
                          hits.append((idx,ins.address,off))
          print('=== target reference hits ===')
          for idx,addr,off in hits:
              print(f'0x{addr:x} -> PP+0x{off:x} {desc(off)}')
          print('=== grouped code windows ===')
          # Merge overlapping windows around hits so main bootstrap construction is readable.
          ranges=[]
          for idx,_,_ in hits:
              a=max(0,idx-18); b=min(len(insns),idx+26)
              if ranges and a <= ranges[-1][1]+4: ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else: ranges.append((a,b))
          hit_by_addr={addr:(off,desc(off)) for _,addr,off in hits}
          for a,b in ranges:
              print(f'\n--- 0x{insns[a].address:x}..0x{insns[b-1].address:x} ---')
              for ins in insns[a:b]:
                  extra=''
                  if ins.address in hit_by_addr:
                      off,d=hit_by_addr[ins.address]; extra=f' ; TARGET PP+0x{off:x} {d}'
                  print(f'{ins.address:08x}: {ins.mnemonic:<7} {ins.op_str}{extra}')
          print('hit_count=',len(hits))
          PY
