name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace bootstrap helpers from PP offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          test -s /tmp/blutter-out/pp.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('/tmp/blutter-out/asm')
          pp_targets={
              'qm_device_id':'0x90a8',
              'uuid_':'0x90b0',
              'oaid:':'0x90b8',
              'default_device_id':'0x90c0',
              'getOaid':'0x90d0',
              'getUDID':'0x96a8',
              'getRawAndroidId':'0x96c8',
              'nonce':'0xc000',
              'bootstrapDecrypt':'0xc0b8',
              'bootstrapProof':'0xc138',
              'bootstrapSign':'0xc140',
              'timestamp':'0x8e38',
          }

          files=[]
          for p in root.rglob('*'):
              if p.is_file():
                  try: files.append((p,p.read_text(encoding='utf-8',errors='replace').splitlines()))
                  except Exception: pass

          def bounds(lines,idx):
              s=idx
              while s>0 and '** addr:' not in lines[s]: s-=1
              if '** addr:' not in lines[s]: s=max(0,idx-100)
              e=min(len(lines),s+1600)
              for j in range(s+1,len(lines)):
                  if '** addr:' in lines[j]:
                      e=j; break
              return s,e

          dumped=set()
          for label,off in pp_targets.items():
              print(f'\n### TARGET {label} pp+{off}')
              hits=0
              for p,lines in files:
                  for i,line in enumerate(lines):
                      low=line.lower()
                      # Blutter renders e.g. [pp+0x90a8] or add/ldr split comments.
                      if f'[pp+{off}]' not in low:
                          continue
                      hits+=1
                      s,e=bounds(lines,i)
                      key=(str(p),s,e)
                      print(f'HIT {label} {p.name}:{i+1} function={lines[s].strip()}')
                      if key in dumped:
                          continue
                      dumped.add(key)
                      print(f'===== BEGIN {p.name}:{s+1}-{e} =====')
                      for n in range(s,e): print(lines[n])
                      print(f'===== END {p.name} =====')
              print(f'HITS={hits}')

          print('\n### PP target lines')
          pp=Path('/tmp/blutter-out/pp.txt').read_text(encoding='utf-8',errors='replace').splitlines()
          for line in pp:
              if any(f'[pp+{off}]' in line.lower() for off in pp_targets.values()):
                  print(line)
          PY
