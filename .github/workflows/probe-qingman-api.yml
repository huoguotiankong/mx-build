name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace bootstrap fallback and ready callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          test -s /tmp/blutter-out/pp.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('/tmp/blutter-out/asm')
          # Offsets are public strings/control-flow markers only. No signing material is extracted.
          targets={
              'before_bootstrap_resolve':'0x3740',
              'after_bootstrap_resolve':'0x3748',
              'bootstrap_url':'0xc010',
              'bootstrap_code':'0xc018',
              'api_domain_key':'0xc030',
              'bootstrap_fallback':'0xc040',
              'missing_access_token':'0xc090',
              'access_token_applied':'0xc098',
              'api_domain_parse_failed':'0xc0a0',
              'api_domain_applied':'0xc0a8',
              'retry_delay':'0x1ee28',
              'api_ready_after_retry':'0x1ee38',
              'builtin_old_domain':'0x2be28',
          }

          files=[]
          for p in root.rglob('*.dart'):
              try: files.append((p,p.read_text(encoding='utf-8',errors='replace').splitlines()))
              except Exception: pass

          def bounds(lines,idx):
              s=idx
              while s>0 and '** addr:' not in lines[s]: s-=1
              if '** addr:' not in lines[s]: s=max(0,idx-180)
              e=len(lines)
              for j in range(s+1,len(lines)):
                  if '** addr:' in lines[j]: e=j; break
              return s,e

          dumped=set()
          print('=== RESOLVED PP REFERENCES ===')
          for label,off in targets.items():
              needle=f'[pp+{off}]'.lower()
              hits=[]
              for p,lines in files:
                  for i,line in enumerate(lines):
                      if needle in line.lower(): hits.append((p,i,line))
              print(f'\n### {label} {off} hits={len(hits)}')
              for p,i,line in hits[:20]:
                  print(f'{p.name}:{i+1}: {line.strip()}')
              for p,i,line in hits[:6]:
                  lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
                  s,e=bounds(lines,i)
                  key=(str(p),s,e)
                  if key in dumped: continue
                  dumped.add(key)
                  print(f'===== FUNCTION {p.name}:{s+1}-{e} trigger={label} =====')
                  for n in range(s,min(e,s+1200)):
                      text=lines[n]
                      # Only redact values if an unrelated sensitive-looking literal happens to be nearby.
                      text=re.sub(r'(?i)((?:token|proof|signature|secret|sign|key)\s*[=:]\s*)[^ ]+',r'\1<redacted>',text)
                      print(text)
                  print('===== END FUNCTION =====')

          print('\n=== STATIC FIELD / DOMAIN WRITE CLUES ===')
          clues=['StoreStaticField','LoadStaticField','field_table_values','baseUrl','apiDomain','domain resolve','bootstrap retry']
          shown=0
          for p,lines in files:
              for i,line in enumerate(lines):
                  if any(c.lower() in line.lower() for c in clues):
                      # Only show lines near functions already identified through target refs when possible.
                      if any(f'[pp+{off}]'.lower() in '\n'.join(lines[max(0,i-80):min(len(lines),i+80)]).lower() for off in targets.values()):
                          print(f'{p.name}:{i+1}: {line.strip()}')
                          shown+=1
                          if shown>=300: break
              if shown>=300: break
          print('clue_lines=',shown)
          PY
