name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Focus Qingman bootstrap bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('current_version',a.get('version'),'versionCode',a.get('versionCode'),file=open('/tmp/version','w'))
          PY
          echo "$(cat /tmp/version)"
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o /tmp/jadx.zip
          mkdir -p /tmp/jadx-bin /tmp/jadx-out
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          /tmp/jadx-bin/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out /tmp/qingman.apk >/tmp/jadx.log 2>&1 || true
          BRIDGE=/tmp/jadx-out/sources/P/z.java
          CRYPTO=/tmp/jadx-out/sources/com/bycgti/xfc/security/QxSecurityCrypto.java
          CONFIG=/tmp/jadx-out/sources/com/baidu/mobstat/Config.java
          echo '=== bridge 220-570 ==='
          sed -n '220,570p' "$BRIDGE"
          echo '=== bridge helpers 1-220 ==='
          sed -n '1,220p' "$BRIDGE"
          echo '=== crypto full ==='
          sed -n '1,320p' "$CRYPTO"
          echo '=== Config path constant ==='
          grep -nE 'FEED_LIST_ITEM_PATH|path' "$CONFIG" | head -80 || true
          echo '=== security channel registration ==='
          grep -RInE -C 8 'new MethodChannel.*qx/|setMethodCallHandler' /tmp/jadx-out/sources/P /tmp/jadx-out/sources/com/bycgti/xfc 2>/dev/null | head -600 || true
