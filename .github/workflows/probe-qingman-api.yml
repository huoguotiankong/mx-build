name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decompile Qingman native bridge callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('current_version',a.get('version'),'versionCode',a.get('versionCode'),file=open('/tmp/version','w'))
          PY
          echo "$(cat /tmp/version)"
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' \
            -o /tmp/jadx.zip
          mkdir -p /tmp/jadx-bin /tmp/jadx-out
          unzip -q /tmp/jadx.zip -d /tmp/jadx-bin
          /tmp/jadx-bin/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out /tmp/qingman.apk >/tmp/jadx.log 2>&1 || true
          echo '=== JADX summary ==='
          tail -80 /tmp/jadx.log || true
          echo '=== QxSecurityNative ==='
          find /tmp/jadx-out -type f -path '*QxSecurityNative*' -print -exec sed -n '1,260p' {} \; || true
          echo '=== security caller files ==='
          grep -RIlE 'bootstrapSign|bootstrapProof|bootstrapDecrypt|initializeSignKeys|buildHeaders|QxSecurityNative' /tmp/jadx-out/sources 2>/dev/null | head -80 || true
          echo '=== security caller excerpts ==='
          grep -RInE -C 12 'bootstrapSign|bootstrapProof|bootstrapDecrypt|initializeSignKeys|buildHeaders|QxSecurityNative' /tmp/jadx-out/sources 2>/dev/null | head -1800 || true
          echo '=== method channel / bridge excerpts ==='
          grep -RInE -C 10 'MethodChannel|security|qx_security|native_security|QxSecurity' /tmp/jadx-out/sources/com 2>/dev/null | head -1800 || true
