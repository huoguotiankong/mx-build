name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace Qingman route object-pool references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl']); print('version='+str(a.get('version',''))); print('versionCode='+str(a.get('versionCode','')))
          PY
          tail -2 /tmp/apk_url
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          test -s /tmp/blutter-out/pp.txt

          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/blutter-out/asm')
          targets={
              'comic_read':'0x7058',
              'comic_home':'0x16e10',
              'comic_update':'0x16e28',
              'comic_category':'0x16e38',
              'comic_ranking':'0x16e48',
              'comic_detail':'0x16f68',
              'comic_search':'0x16fe8',
              'chapter_url_key':'0x224a0',
              'official_site':'0x2e6e0',
          }
          files=[]
          for p in root.rglob('*.dart'):
              try: files.append((p,p.read_text(encoding='utf-8',errors='replace').splitlines()))
              except Exception: pass

          def bounds(lines,idx):
              s=idx
              while s>0 and '** addr:' not in lines[s]: s-=1
              if '** addr:' not in lines[s]: s=max(0,idx-140)
              e=len(lines)
              for j in range(s+1,len(lines)):
                  if '** addr:' in lines[j]: e=j; break
              return s,e

          dumped=set()
          for label,off in targets.items():
              needle=f'[pp+{off}]'.lower(); hits=[]
              for p,lines in files:
                  for i,line in enumerate(lines):
                      if needle in line.lower(): hits.append((p,i,line))
              print(f'\n### {label} {off} hits={len(hits)}')
              for p,i,line in hits[:30]: print(f'HIT {p.name}:{i+1}: {line.strip()}')
              for p,i,line in hits[:12]:
                  s,e=bounds(lines,i); key=(str(p),s,e)
                  if key in dumped: continue
                  dumped.add(key)
                  print(f'===== FUNCTION {p.name}:{s+1}-{e} trigger={label} =====')
                  for n in range(s,min(e,s+900)):
                      text=lines[n]
                      text=re.sub(r'(?i)((?:token|proof|signature|secret|password|privatekey)\s*[=:]\s*)[^ ]+',r'\1<redacted>',text)
                      print(text)
                  print('===== END FUNCTION =====')
          PY
