name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace high-level bootstrap and domain flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          test -s /tmp/blutter-out/pp.txt

          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('/tmp/blutter-out/asm')
          needles=[
              'https://mu8xm4cx.zermh.com/bootstrap/domain',
              'apiDomain',
              'bootstrap: code=',
              'apiDomain 已应用',
              'apiDomain 解析失败',
              'bootstrap: 下发失败',
              'bootstrap: 原生签名失败',
              'proof 生成失败',
              'bootstrap: 解密失败',
              '未下发 appAccessToken',
              'appAccessToken 已应用',
              'appAccessToken',
              'App bootstrap: before _initAppEnv',
              'App bootstrap: after _initAppEnv',
          ]

          files=[]
          for p in root.rglob('*.dart'):
              try:
                  files.append((p,p.read_text(encoding='utf-8',errors='replace').splitlines()))
              except Exception:
                  pass

          def function_bounds(lines,idx):
              s=idx
              while s>0 and '** addr:' not in lines[s]:
                  s-=1
              if '** addr:' not in lines[s]:
                  s=max(0,idx-180)
              e=len(lines)
              for j in range(s+1,len(lines)):
                  if '** addr:' in lines[j]:
                      e=j
                      break
              return s,e

          hits=[]
          for p,lines in files:
              for i,line in enumerate(lines):
                  for needle in needles:
                      if needle.lower() in line.lower():
                          hits.append((needle,p,i,line))

          print('=== HIGH LEVEL STRING HITS ===')
          print('hit_count=',len(hits))
          for needle,p,i,line in hits:
              print(f'{needle} -> {p.name}:{i+1}: {line.strip()}')

          print('\n=== ENCLOSING FUNCTIONS ===')
          dumped=set()
          for needle,p,i,line in hits:
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              s,e=function_bounds(lines,i)
              key=(str(p),s,e)
              if key in dumped:
                  continue
              dumped.add(key)
              print(f'\n===== FUNCTION {p.name}:{s+1}-{e} trigger={needle} =====')
              for n in range(s,min(e,s+1100)):
                  text=lines[n]
                  # Redact any accidentally inlined token/proof/signature values; field names stay visible.
                  text=re.sub(r'(?i)((?:token|proof|signature|secret|sign|key)\s*[=:]\s*)[^ ]+',r'\1<redacted>',text)
                  print(text)
              print('===== END FUNCTION =====')

          print('\n=== DOMAIN / FALLBACK RELATED OBJECT POOL ===')
          pp=Path('/tmp/blutter-out/pp.txt').read_text(encoding='utf-8',errors='replace').splitlines()
          pool_needles=['apiDomain','baseUrl','baseURL','fallback','domain','bootstrap','qingman.mom','zermh.com','appAccessToken']
          count=0
          for line in pp:
              if any(x.lower() in line.lower() for x in pool_needles):
                  safe=re.sub(r'(?i)((?:token|proof|signature|secret|sign|key)[^\"]*\"?)[:=]?[^\"]*',r'\1<redacted>',line)
                  print(safe[:1200])
                  count+=1
                  if count>=300:
                      break
          print('pool_matches=',count)
          PY
