name: Probe Qingman API

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Qingman public domain candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, socket, ssl, urllib.error, urllib.parse, urllib.request
          ctx=ssl.create_default_context()
          ua='qingman/4.4.5 (Android)'
          hosts=[
            'sf85sdq66h.qingman.mom','bass8ycl.zermh.com','mu8xm4cx.zermh.com',
            'www.qingman.pro','www.qingman.xyz','www.qingman.my','www.qingman.dev','www.qingman.vip',
            'ios.qingman.vip','rx6vxp6wil2ra0cg.f37.top','y4h4s84eqqlwmlu5.urlg.cc',
          ]
          paths=['/api/comic/categories/list','/api/comic/comics/v1/homeList?page=1&pageNum=1&pageSize=20','/api/comic/comics/sign/key']
          for host in hosts:
              try: ips=sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
              except Exception as e: ips=['dns:'+type(e).__name__]
              print('\nHOST',host,'IPS',ips[:6])
              for path in paths:
                  url='https://'+host+path
                  req=urllib.request.Request(url,headers={'Accept':'application/json, text/plain, */*','User-Agent':ua,'appVersion':'4.4.5','platform':'android'})
                  try:
                      with urllib.request.urlopen(req,timeout=8,context=ctx) as r: raw=r.read(4096); status=r.status; ct=r.headers.get('content-type','')
                  except urllib.error.HTTPError as e: raw=e.read(4096); status=e.code; ct=e.headers.get('content-type','')
                  except Exception as e:
                      print(path,'transport',type(e).__name__); continue
                  text=raw.decode('utf-8','replace')
                  summary=''
                  try:
                      o=json.loads(text)
                      summary=json.dumps({k:o.get(k) for k in ['code','status','msg','message','error','success'] if k in o},ensure_ascii=False)
                  except Exception:
                      summary=text[:80].replace('\n',' ')
                  print(path,'status',status,'ct',ct,'body',summary[:180])
          # Public certificate-transparency discovery for zermh.com; names only, no secrets.
          try:
              q='https://crt.sh/?q=%25.zermh.com&output=json'
              req=urllib.request.Request(q,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as r: arr=json.load(r)
              names=[]
              for row in arr:
                  for n in str(row.get('name_value','')).splitlines():
                      n=n.strip().lower().lstrip('*.')
                      if n.endswith('.zermh.com') and n not in names: names.append(n)
              print('\nCT_ZERMH_NAMES',names[-100:])
          except Exception as e: print('CT_ERROR',type(e).__name__,str(e))
          PY
