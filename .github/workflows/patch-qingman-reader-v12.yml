name: Patch Qingman Reader v12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-qingman-reader-v12.yml'
      - '.github/scripts/patch_qingman_v12.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check private source token
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: test -n "$MX_PRIVATE_READ_TOKEN"
      - name: Checkout Qingman runtime branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: fix/qingman-v3-runtime-clean
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true
      - name: Apply v12 patch
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_qingman_v12.py
          git -C dev diff --check
      - name: Commit Qingman v12 source patch
        run: |
          set -euo pipefail
          git -C dev config user.name 'github-actions[bot]'
          git -C dev config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dev add src/zh/qingman docs/sources/qingman.md
          git -C dev commit -m 'fix(qingman): refresh signed reader URLs via cache detail'
          git -C dev push origin HEAD:fix/qingman-v3-runtime-clean
