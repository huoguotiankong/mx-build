name: Trace Qingman Reader Image Line Selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-reader-line-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev python3-pyelftools python3-capstone >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace line selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))['data']['datas']['android']
          if (str(a.get('version','')),str(a.get('versionCode',''))) != ('4.4.5','445'): raise SystemExit('version changed')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --max-time 180 "$(cat /tmp/url)" -o /tmp/a.apk
          rm -rf /tmp/lib /tmp/out /tmp/x; mkdir -p /tmp/lib /tmp/out /tmp/x
          unzip -q /tmp/a.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/x
          cp /tmp/x/lib/arm64-v8a/libapp.so /tmp/lib/; cp /tmp/x/lib/arm64-v8a/libflutter.so /tmp/lib/
          cd /tmp/blutter && python3 blutter.py /tmp/lib /tmp/out >/tmp/b.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from capstone import *
          from elftools.elf.elffile import ELFFile
          import re
          deny=re.compile(r'(?i)(password|cookie|authorization|bearer|clientp12|privatekey|certificate|secret|token)')
          pp={}
          for l in Path('/tmp/out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',l)
              if m: pp[int(m.group(1),16)]=m.group(2)
          with open('/tmp/lib/libapp.so','rb') as f:
              e=ELFFile(f); s=e.get_section_by_name('.text'); base=int(s['sh_addr']); data=s.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          windows=[('free_line_getter',0x489c80,0x489fb0),('selected_line_flow',0x48ecf0,0x48f250),('reader_followup',0x48f250,0x490700)]
          for title,start,end in windows:
              print(f'=== {title} ==='); pending={}; count=0
              for ins in md.disasm(data[start-base:end-base],start):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}; op=ins.op_str.lower(); anns=[]
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if ins.mnemonic=='add' and m: pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),28)
                  if ins.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); d=int(m.group(3),0) if m.group(3) else 0; off=d if br=='x27' else (pending[br][0]+d if br in pending else None)
                          if off in pp:
                              v=pp[off]; anns.append(f'PP+0x{off:x}='+('<redacted>' if deny.search(v) else v[:160]))
                  if anns or ins.mnemonic in ('bl','blr','b','ret','cbz','cbnz','tbz','tbnz') or ins.mnemonic.startswith('b.'):
                      text=f'0x{ins.address:x}: {ins.mnemonic:<7} {ins.op_str:<46}'+((' ; '+' | '.join(anns)) if anns else '')
                      if not deny.search(text): print(text[:560]); count+=1
                      if count>1200: print('TRUNCATED'); break
          print('=== reader-related pool ===')
          terms=('freeLine','ComicReadSelectedImageLine','加速线路','备用线路','pageUrls','referer','baseImgUrl','freeUrl','线路','line','imageUrl')
          for o,v in sorted(pp.items()):
              if deny.search(v): continue
              if any(t.lower() in v.lower() for t in terms): print(f'PP+0x{o:x} {v[:300]}')
          PY
