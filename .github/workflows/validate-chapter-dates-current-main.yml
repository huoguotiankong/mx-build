name: Validate Tencent v31 and Kuaikan v27 chapter dates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-chapter-dates-current-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-chapter-dates-current-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private read token
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo '::error::Missing MX_PRIVATE_READ_TOKEN'; exit 1; }

      - name: Checkout current private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify target versions and date logic
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 31' source/src/zh/tencentcomics/build.gradle.kts
          grep -F 'Comic/comicChapterList' source/src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F 'date_upload = chapterId?.let(uploadDates::get) ?: 0L' source/src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F 'versionCode = 27' source/src/zh/kuaikanmanhua/build.gradle.kts
          grep -F 'publishedTime' source/src/zh/kuaikanmanhua/src/eu/kanade/tachiyomi/extension/zh/kuaikanmanhua/Kuaikanmanhua.kt
          grep -F 'loadOfficialPublicationDates(topicId)' source/src/zh/kuaikanmanhua/src/eu/kanade/tachiyomi/extension/zh/kuaikanmanhua/Kuaikanmanhua.kt
          python3 source/scripts/validate_sources.py
          git -C source diff --check

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Overlay target modules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/tencentcomics upstream/src/zh/kuaikanmanhua
          cp -a source/src/zh/tencentcomics upstream/src/zh/tencentcomics
          cp -a source/src/zh/kuaikanmanhua upstream/src/zh/kuaikanmanhua

      - name: Spotless checks
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:tencentcomics:spotlessCheck :src:zh:kuaikanmanhua:spotlessCheck

      - name: Build debug and release
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:tencentcomics:assembleDebug :src:zh:tencentcomics:assembleRelease :src:zh:kuaikanmanhua:assembleDebug :src:zh:kuaikanmanhua:assembleRelease

      - name: Lint releases
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:tencentcomics:lintRelease :src:zh:kuaikanmanhua:lintRelease
