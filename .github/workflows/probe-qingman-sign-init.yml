name: Trace Qingman Signing Key Init

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-sign-init.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Resolve sign-key AOT xrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request, sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')), file=sys.stderr)
          print('OFFICIAL_VERSION_CODE='+str(a.get('versionCode','')), file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM

          pp_lines=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          pp={}
          for line in pp_lines:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          needles={
              'sign_key_route':'api/comic/comics/sign/key',
              'initialize':'initializeSignKeys',
              'build_headers':'buildHeaders',
              'canonical':'canonicalRequest',
              'seed':'String: "seed"',
              'k1a':'String: "k1a"',
              'k1b':'String: "k1b"',
              'k2a':'String: "k2a"',
              'k2b':'String: "k2b"',
              'k3a':'String: "k3a"',
              'k3b':'String: "k3b"',
              'detail_path':'detailPath',
              'chapter_list_path':'chapterListPath',
              'read_path':'readPath',
              'cache_path':'cachePath',
              'app_access':'X-QM-App-Access',
              'api_guard':'X-Api-Guard',
          }
          offsets={}
          for label,needle in needles.items():
              matches=[off for off,val in pp.items() if needle.lower() in val.lower()]
              if matches:
                  offsets[label]=matches[0]
                  print(f'POOL {label}=0x{matches[0]:x} {pp[matches[0]][:180]}')
              else:
                  print(f'POOL {label}=MISSING')

          # Scan AOT code for object-pool loads. Dart ARM64 normally keeps PP in x27.
          lib='/tmp/app-lib/libapp.so'
          with open(lib,'rb') as f:
              elf=ELFFile(f)
              sec=elf.get_section_by_name('.text')
              if sec is None:
                  sec=max((s for s in elf.iter_sections() if int(s['sh_flags']) & 0x4), key=lambda s:int(s['sh_size']))
              base=int(sec['sh_addr']); data=sec.data()

          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          target_to_label={v:k for k,v in offsets.items()}
          targets=set(target_to_label)
          pending={}
          hits=[]
          for x in md.disasm(data,base):
              if x.mnemonic.startswith('.'):
                  pending.clear(); continue
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=x.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if x.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),12)
              if x.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if m:
                      br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                      off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                      if off in targets:
                          hits.append((int(x.address),off,target_to_label[off]))

          print('XREF_TOTAL='+str(len(hits)))
          for addr,off,label in hits:
              print(f'XREF {label} addr=0x{addr:x} pp=0x{off:x}')

          asm=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try:
                  lines=p.read_text('utf-8',errors='replace').splitlines()
                  # min/max addresses for quick filtering
                  ads=[]
                  for i,line in enumerate(lines):
                      m=re.search(r'//\s+0x([0-9a-fA-F]+):',line)
                      if m: ads.append((int(m.group(1),16),i))
                  if ads: asm.append((p,lines,ads))
              except Exception: pass

          def locate(addr):
              exact=[]
              for p,lines,ads in asm:
                  for a,i in ads:
                      if a==addr: exact.append((p,lines,i)); break
              return exact

          emitted=set(); printed=0
          focus={'sign_key_route','initialize','build_headers','canonical','seed','k1a','detail_path','chapter_list_path','read_path','cache_path'}
          print('=== FUNCTIONS ===')
          for addr,off,label in hits:
              if label not in focus: continue
              for p,lines,i in locate(addr):
                  start=i
                  while start>0 and '** addr:' not in lines[start]: start-=1
                  if '** addr:' not in lines[start]: start=max(0,i-80)
                  end=len(lines)
                  for j in range(start+1,len(lines)):
                      if '** addr:' in lines[j]: end=j; break
                  key=(str(p),start,end)
                  if key in emitted: continue
                  emitted.add(key)
                  header=' | '.join(x.strip() for x in lines[max(0,start-3):min(end,start+5)])
                  print(f'FUNCTION trigger={label} xref=0x{addr:x} file={p.name} lines={start+1}-{end} header={header[:500]}')
                  lo=max(start,i-110); hi=min(end,i+220)
                  for n in range(lo,hi):
                      line=lines[n]
                      # Keep method/path/schema/control-flow, but redact accidental credential literals.
                      if re.search(r'(?i)(clientp12|privatekey|certificate|password|secret)',line):
                          line=re.sub(r'"[^"]*"','"<redacted>"',line)
                      if len(line)>420: line=line[:420]+'...'
                      print(line)
                      printed+=1
                      if printed>=2200: break
                  if printed>=2200: break
              if printed>=2200: break
          print('FUNCTION_DUMP_LINES='+str(printed))
          PY
