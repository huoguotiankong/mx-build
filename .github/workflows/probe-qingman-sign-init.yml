name: Trace Qingman Signing Key Init

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-sign-init.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare AOT analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace safe signing initialization metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request, sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')), file=sys.stderr)
          print('OFFICIAL_VERSION_CODE='+str(a.get('versionCode','')), file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re

          pp_path=Path('/tmp/blutter-out/pp.txt')
          pp_lines=pp_path.read_text('utf-8',errors='replace').splitlines()
          pp={}
          for line in pp_lines:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m:
                  pp[int(m.group(1),16)]=m.group(2)

          wanted={
              'sign_key_route':'api/comic/comics/sign/key',
              'initialize':'initializeSignKeys',
              'build_headers':'buildHeaders',
              'canonical':'canonicalRequest',
              'seed':'seed',
              'k1a':'k1a','k1b':'k1b','k2a':'k2a','k2b':'k2b','k3a':'k3a','k3b':'k3b',
              'detail_path':'detailPath','chapter_list_path':'chapterListPath','read_path':'readPath','cache_path':'cachePath',
              'app_access':'X-QM-App-Access','api_guard':'X-Api-Guard',
              'timestamp':'X-Timestamp','signature':'X-Signature','proof':'X-QM-Proof','request_id':'X-QM-Request-Id',
          }

          found={}
          for label,needle in wanted.items():
              matches=[]
              for off,val in pp.items():
                  if needle.lower() in val.lower(): matches.append((off,val))
              found[label]=matches
              print(f'TARGET {label} count={len(matches)}')
              for off,val in matches[:12]:
                  # These are only schema/method/path names. Never print opaque key/token/cert values.
                  if len(val)>220: val=val[:220]+'...'
                  print(f'  PP+0x{off:x} {val}')

          print('=== SIGN KEY OBJECT-POOL NEIGHBORHOOD ===')
          route=found.get('sign_key_route',[])
          for off,_ in route[:2]:
              for p in sorted(k for k in pp if off-0x180 <= k <= off+0x280):
                  v=pp[p]
                  low=v.lower()
                  safe=(
                      any(x in low for x in (
                          'api/comic/','sign','seed','k1a','k1b','k2a','k2b','k3a','k3b',
                          'path','header','request','timestamp','proof','guard','device','domain','initialize',
                          'code','msg','data','format','失败','缺少','初始化'
                      ))
                      and not re.search(r'(?i)(private|password|clientp12|certificate|secret)',v)
                  )
                  if safe:
                      print(f'  PP+0x{p:x} {v[:260]}')

          asm_root=Path('/tmp/blutter-out/asm')
          asm_files=[]
          for p in asm_root.rglob('*.dart'):
              try: asm_files.append((p,p.read_text('utf-8',errors='replace').splitlines()))
              except Exception: pass

          print('=== AOT REFERENCES ===')
          focus_labels=('sign_key_route','initialize','build_headers','canonical','seed','k1a','detail_path','chapter_list_path','read_path','cache_path')
          emitted=set(); total=0
          for label in focus_labels:
              for off,_ in found.get(label,[])[:4]:
                  needle=f'[pp+0x{off:x}]'.lower()
                  hits=[]
                  for path,lines in asm_files:
                      for i,line in enumerate(lines):
                          if needle in line.lower(): hits.append((path,lines,i))
                  print(f'REF {label} PP+0x{off:x} hits={len(hits)}')
                  for path,lines,i in hits[:8]:
                      # Expand to the containing Blutter function when possible.
                      start=i
                      while start>0 and '** addr:' not in lines[start]: start-=1
                      if '** addr:' not in lines[start]: start=max(0,i-70)
                      end=len(lines)
                      for j in range(start+1,len(lines)):
                          if '** addr:' in lines[j]: end=j; break
                      key=(str(path),start,end)
                      if key in emitted: continue
                      emitted.add(key)
                      print(f'FUNCTION file={path.name} lines={start+1}-{end} trigger={label} hitline={i+1}')
                      lo=max(start,i-90); hi=min(end,i+140)
                      for n in range(lo,hi):
                          line=lines[n]
                          # Redact any accidental opaque secret/certificate literals while preserving control-flow/schema clues.
                          if re.search(r'(?i)(clientp12|password|privatekey|certificate|secret)',line):
                              line=re.sub(r'"[^"]*"','"<redacted>"',line)
                          if len(line)>420: line=line[:420]+'...'
                          print(line)
                          total+=1
                          if total>=1600: break
                      if total>=1600: break
                  if total>=1600: break
              if total>=1600: break
          print('TRACE_LINES='+str(total))
          PY
