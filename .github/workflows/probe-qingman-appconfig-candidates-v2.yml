name: Probe Qingman AppConfig Candidates V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-appconfig-candidates-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe legacy AppConfig route on current backend
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64, hashlib, json, os, tempfile, time, urllib.error, urllib.parse, urllib.request, uuid, zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile

          UA='qingman/4.4.5 (Android)'
          VERSION='https://bass8ycl.zermh.com/api/radio/api/config/version'
          BOOTSTRAP='https://mu8xm4cx.zermh.com/bootstrap/domain'
          vr=json.load(urllib.request.urlopen(urllib.request.Request(VERSION,headers={'User-Agent':'mx-qingman-probe/1.0'}),timeout=20))['data']['datas']['android']
          if str(vr.get('version'))!='4.4.5' or str(vr.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')

          with tempfile.TemporaryDirectory() as td:
              apk=os.path.join(td,'q.apk'); so=os.path.join(td,'libqx_security.so')
              with urllib.request.urlopen(urllib.request.Request(vr['downloadUrl'],headers={'User-Agent':'mx-qingman-probe/1.0'}),timeout=60) as r, open(apk,'wb') as f:
                  while True:
                      b=r.read(1<<20)
                      if not b: break
                      f.write(b)
              with zipfile.ZipFile(apk) as z, z.open('lib/arm64-v8a/libqx_security.so') as src, open(so,'wb') as dst:
                  dst.write(src.read())
              with open(so,'rb') as f:
                  elf=ELFFile(f)
                  def rv(va,n):
                      for seg in elf.iter_segments():
                          if seg['p_type']!='PT_LOAD': continue
                          s=int(seg['p_vaddr']); e=s+int(seg['p_filesz'])
                          if s<=va and va+n<=e:
                              f.seek(int(seg['p_offset'])+va-s); return f.read(n)
                      raise RuntimeError('VA')
                  seed=rv(0x14a40,16)+rv(0x14af0,16); sc=rv(0x17d1f,33); ac=rv(0x17d40,32)

          base=hashlib.sha256(seed).digest()
          def deob(c,k):
              stream=b''; i=0
              while len(stream)<len(c):
                  stream += hashlib.sha256(base+bytes([k])+i.to_bytes(4,'big')).digest(); i+=1
              return bytes(a^b for a,b in zip(c,stream))
          sm=deob(sc,1); aes=deob(ac,2)
          ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sm).hexdigest()
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          bh={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':UA,'appVersion':'4.4.5','platform':'android','X-Device-Id':did}
          br=json.load(urllib.request.urlopen(urllib.request.Request(BOOTSTRAP,data=body,headers=bh,method='POST'),timeout=20))
          enc=br['data']; blob=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4))
          cfg=json.loads(AESGCM(aes).decrypt(blob[:12],blob[12:],(ts+'|'+nonce).encode()))
          api_host=urllib.parse.urlsplit(cfg['apiDomain']).hostname; access=cfg['appAccessToken']
          if not api_host or not access: raise SystemExit('bootstrap fields missing')
          headers={'Accept':'application/json, text/plain, */*','Content-Type':'application/json','User-Agent':UA,'appVersion':'4.4.5','platform':'android','X-Device-Id':did,'X-QM-App-Access':access}

          def req(method,path):
              u='http://'+api_host+'/'+path
              data=b'{}' if method=='POST' else None
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=headers,data=data,method=method),timeout=20) as r:
                      raw=r.read(1024*1024).decode('utf-8','replace'); status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(256*1024).decode('utf-8','replace'); status=e.code
              except Exception as e:
                  print(f'route={path} method={method} transport_error={type(e).__name__}'); return None
              try: obj=json.loads(raw)
              except Exception:
                  print(f'route={path} method={method} http={status} nonjson=true'); return None
              code=obj.get('code') if isinstance(obj,dict) else None
              msg=obj.get('msg') if isinstance(obj,dict) else None
              print(f'route={path} method={method} http={status} code={code} msg={repr(str(msg)[:120])}')
              return obj

          def find(x,key):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if str(k).lower()==key.lower(): return v
                      z=find(v,key)
                      if z is not None:return z
              elif isinstance(x,list):
                  for v in x:
                      z=find(v,key)
                      if z is not None:return z
              return None

          def find_relative_cover(x):
              if isinstance(x,dict):
                  for k in ('verticalCover','comicCoverUrl','cover','horizontalCover'):
                      v=x.get(k)
                      if isinstance(v,str) and v.startswith('/'): return v
                  for v in x.values():
                      z=find_relative_cover(v)
                      if z:return z
              elif isinstance(x,list):
                  for v in x:
                      z=find_relative_cover(v)
                      if z:return z
              return None

          home=req('POST','api/comic/comics/v1/homeList?page=1&pageNum=1&pageSize=20')
          cover=find_relative_cover(home)
          print('relative_cover_found='+str(bool(cover)).lower())

          candidates=[
              'api/appapi/theme/appconfig',
              'api/appapi/theme/appConfig',
              'api/appapi/theme/config',
              'api/appapi/theme/getappconfig',
              'api/appapi/theme/getAppConfig',
          ]
          found_base=None
          for path in candidates:
              for method in ('GET','POST'):
                  obj=req(method,path)
                  if obj is None: continue
                  b=find(obj,'baseImgUrl')
                  if isinstance(b,str) and b.strip():
                      p=urllib.parse.urlsplit(b.strip())
                      print(f'FOUND_BASE_IMG route={path} method={method} scheme={p.scheme} host={p.hostname or ""} path={p.path[:120]}')
                      found_base=b.strip(); break
              if found_base: break

          if found_base and cover:
              url=found_base.rstrip('/')+'/'+cover.lstrip('/')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'image/avif,image/webp,image/*,*/*;q=0.8','Referer':'https://www.qingman.app/'}),timeout=20) as r:
                      magic=r.read(16); ctype=r.headers.get('Content-Type','')
                      print(f'VERIFY_COVER http={r.status} ctype={ctype} magic={magic.hex()} final_host={urllib.parse.urlsplit(r.geturl()).hostname or ""}')
              except urllib.error.HTTPError as e:
                  print(f'VERIFY_COVER http={e.code} ctype={e.headers.get("Content-Type","")}')
              except Exception as e:
                  print(f'VERIFY_COVER error={type(e).__name__}:{str(e)[:100]}')
          PY
