name: Export Formatted JMComic Plus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-formatted-jmcomicplus.yml"
  workflow_dispatch:

permissions:
  contents: write

# Ephemeral encrypted handoff for jmcomicplus v4 formatting sync.
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public handoff repo
        uses: actions/checkout@v5
        with:
          path: handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Format private module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus
          cd upstream
          ./gradlew :src:zh:jmcomicplus:spotlessApply
          ./gradlew :src:zh:jmcomicplus:spotlessCheck

      - name: Encrypt formatted module
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/jmplus-format-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtu31WehU/S+Dw1W5WJQx
          THPxcCXZevEDp8n0ujJX9pvJ+QBWcY5baUbw5Uh81OB/N2f1065fpwnHc4uTM5kd
          87ElskvnHBwv8r/jFS/Rwg8cB8q6aPr8PCnXehAxGk/Os2O50q9pO8mB5vgnRZKM
          PZnZfJqnP6nAhXucj1QmBdHiBll1eRFgDpvCSCQ+8d2vnx/3n1xxeHhU1+QYLN1K
          iY9MeJmJ4qEEc511oNSlXLRqtC/O3TBvM626EOSNGQt10deDDDU/8MAqRhVtoE5N
          Ls1q75ffomPrIXoe0XfJZsQOqmTQJsFOfOdUE0XQn5OHP8NnJuJih4XutyhaJHqR
          iA422RmmntU81+LlYn7BZ+XmtR7+j1G2a6Euc3qCbmZslCSNh4nlpdZ7rTDFApFg
          Mq5omuIuCkFB9K6lC7+a5ZzWp64o1HToCKQ0nvGW3gKi8yrhWt+7AGXl8q1kmo9m
          HRqUNxKXpMX8lLNtH4ka2XDxiiOJgTZ7sP3hDL+aaKw1AgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -czf /tmp/jmplus-formatted.tar.gz -C upstream/src/zh jmcomicplus
          openssl rand -hex 32 >/tmp/jmplus-aes-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/jmplus-formatted.tar.gz -out /tmp/jmplus-formatted.tar.enc -pass file:/tmp/jmplus-aes-key.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/jmplus-format-public.pem -in /tmp/jmplus-aes-key.txt -out /tmp/jmplus-aes-key.enc
          mkdir -p handoff/secure-handoff
          base64 -w0 /tmp/jmplus-formatted.tar.enc > handoff/secure-handoff/jmplus-formatted.tar.enc.b64
          base64 -w0 /tmp/jmplus-aes-key.enc > handoff/secure-handoff/jmplus-key.enc.b64

      - name: Publish encrypted handoff
        shell: bash
        run: |
          set -euo pipefail
          cd handoff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure-handoff/jmplus-formatted.tar.enc.b64 secure-handoff/jmplus-key.enc.b64
          git commit -m "chore(jmcomicplus): encrypted formatted handoff v4"
          git pull --rebase origin main
          git push origin HEAD:main
