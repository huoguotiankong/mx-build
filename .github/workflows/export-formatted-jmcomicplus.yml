name: Export Formatted JMComic Plus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-formatted-jmcomicplus.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public handoff repo
        uses: actions/checkout@v5
        with:
          path: handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Format private module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus
          cd upstream
          ./gradlew :src:zh:jmcomicplus:spotlessApply

      - name: Encrypt formatted module
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/jmplus-format-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAxpV+utn+gLYyZT5Adc77
          xyQ1judXHSnLFjgba5SKNgG+FohYg0QMhf23kMEANCfEZbQVPctaxzuQJqUUGWZK
          UPKQuHXg4VnnjwDeC6+rsEaJmowQWwphKK1g3H4L0I698tFA8e2pNXG9aG6oVn+q
          Y1B4ItSdcbIu/z2i97fojT7atHmuzE7zwBRwhfJRlOOqk21n7QrPEdEZLZun7jdT
          2yobISDvadErCyLSBNIiP74X1WGy+S66Avjnrs8F4CK0Klwa0k3WA2Swf/C/h8Sp
          2cyeWicroUONHVffUXMQYsadcrL/xeCMfBsyPsz7BkDRIBbNQX3ZaKRETyN23jK4
          lT1lY966ChwLxp+JUDYuqXwuNp2WaB5BhqXRJFV00XmPDmXkmkWpbFGh+mIREDLj
          jt9unTYoJ5an+tmPEP2+pDk+k5fnTq6kpPN1mTXowY3awvRwzqfeEiSscVrumZVU
          l6Nl0GKDDiLJwtJBKaAAQkATrkC2HYQWHevPYkvYDsb9AgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -czf /tmp/jmplus-formatted.tar.gz -C upstream/src/zh jmcomicplus
          openssl rand -hex 32 >/tmp/jmplus-aes-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/jmplus-formatted.tar.gz -out /tmp/jmplus-formatted.tar.enc -pass file:/tmp/jmplus-aes-key.txt
          openssl pkeyutl -encrypt -pubin -inkey /tmp/jmplus-format-public.pem -in /tmp/jmplus-aes-key.txt -out /tmp/jmplus-aes-key.enc
          mkdir -p handoff/secure-handoff
          base64 -w0 /tmp/jmplus-formatted.tar.enc > handoff/secure-handoff/jmplus-formatted.tar.enc.b64
          base64 -w0 /tmp/jmplus-aes-key.enc > handoff/secure-handoff/jmplus-key.enc.b64

      - name: Publish encrypted handoff
        shell: bash
        run: |
          set -euo pipefail
          cd handoff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure-handoff/jmplus-formatted.tar.enc.b64 secure-handoff/jmplus-key.enc.b64
          git commit -m "chore(jmcomicplus): encrypted formatted handoff"
          git pull --rebase origin main
          git push origin HEAD:main
