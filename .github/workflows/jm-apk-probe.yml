name: JM APK Comment Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/jm-apk-probe-trigger"
      - ".github/workflows/jm-apk-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Download latest public JMComic APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          api="https://api.github.com/repos/hect0x7/JMComic-APK/releases/latest"
          req=urllib.request.Request(api, headers={"User-Agent":"mx-jm-probe"})
          release=json.load(urllib.request.urlopen(req))
          assets=[a for a in release.get("assets",[]) if a.get("name","").endswith(".apk")]
          if len(assets)!=1:
              raise SystemExit(f"expected exactly one APK, got {len(assets)}")
          asset=assets[0]
          print("JM_RELEASE_TAG="+release.get("tag_name",""))
          print("JM_APK_NAME="+asset["name"])
          print("JM_APK_DIGEST="+str(asset.get("digest","")))
          urllib.request.urlretrieve(asset["browser_download_url"], "jm.apk")
          PY
          sha256sum jm.apk

      - name: Inspect packaged web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,zipfile
          terms=[
              "段评","段落评","页评","吐槽",
              "/forum","/comment","comment_id","isSpoiler","is_spoiler",
              "photo_id","photoId","pageComment","imageComment","paragraphComment",
              "segmentComment","commentTotal","comment_total"
          ]
          rx=re.compile("|".join(re.escape(x) for x in terms),re.I)
          with zipfile.ZipFile("jm.apk") as z:
              names=[n for n in z.namelist() if n.startswith("assets/") and n.lower().endswith((".js",".json",".html",".css",".txt"))]
              print("ASSET_TEXT_FILES="+str(len(names)))
              hits=[]
              for n in names:
                  try: text=z.read(n).decode("utf-8","ignore")
                  except Exception: continue
                  ms=list(rx.finditer(text))
                  if ms: hits.append((len(ms),n,text,ms))
              hits.sort(key=lambda x:(-x[0],x[1]))
              print("ASSET_MATCHED_FILES="+str(len(hits)))
              emitted=0
              for count,n,text,ms in hits:
                  if emitted>=40: break
                  print(f"\\n### ASSET {n} hits={count}")
                  seen=[]
                  for m in ms[:25]:
                      a=max(0,m.start()-900); b=min(len(text),m.end()+1300)
                      if any(abs(m.start()-x)<500 for x in seen): continue
                      seen.append(m.start())
                      snippet=text[a:b].replace("\\n"," ")
                      print(snippet)
                      print("---")
                  emitted+=1
          PY

      - name: Summarize comment identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,zipfile
          terms=["/forum","/comment","comment_id","isSpoiler","is_spoiler","photo_id","photoId","pid","ncid","aid","段评","段落评","页评","吐槽","pageComment","imageComment","segmentComment"]
          with zipfile.ZipFile("jm.apk") as z:
              docs=[]
              for n in z.namelist():
                  if n.startswith("assets/") and n.lower().endswith((".js",".json",".html",".txt")):
                      try: docs.append((n,z.read(n).decode("utf-8","ignore")))
                      except Exception: pass
              for term in terms:
                  found=[]
                  for n,text in docs:
                      start=0
                      while True:
                          i=text.find(term,start)
                          if i<0: break
                          found.append((n,i,text))
                          start=i+len(term)
                  print(f"TERM {term!r} COUNT={len(found)} FILES={len(set(x[0] for x in found))}")
                  for n,i,text in found[:6]:
                      a=max(0,i-450); b=min(len(text),i+len(term)+750)
                      print(f"  FILE {n}")
                      print("  "+text[a:b].replace("\\n"," "))
                      print("  ---")
          PY

      - name: Download JADX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          api="https://api.github.com/repos/skylot/jadx/releases/latest"
          req=urllib.request.Request(api, headers={"User-Agent":"mx-jm-probe"})
          release=json.load(urllib.request.urlopen(req))
          assets=[a for a in release.get("assets",[]) if a.get("name","").startswith("jadx-") and a.get("name","").endswith(".zip")]
          if not assets:
              raise SystemExit("jadx zip asset not found")
          urllib.request.urlretrieve(assets[0]["browser_download_url"], "jadx.zip")
          print("JADX="+release.get("tag_name",""))
          PY
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile code only
        shell: bash
        run: |
          set -euo pipefail
          ./jadx/bin/jadx --no-res --show-bad-code -d decompiled jm.apk >/tmp/jadx.log 2>&1 || true
          tail -n 40 /tmp/jadx.log

      - name: Report comment protocol evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("decompiled/sources")
          needles=[
              r"段评", r"段落评", r"页评", r"吐槽",
              r"/forum", r"/comment", r"comment_id", r"isSpoiler", r"is_spoiler",
              r"photo_id", r"photoId", r"\bpid\b", r"\baid\b",
              r"paragraph", r"segment", r"pageComment", r"imageComment",
          ]
          rx=re.compile("|".join(needles), re.I)
          scored=[]
          for p in root.rglob("*.java"):
              try: lines=p.read_text(errors="ignore").splitlines()
              except Exception: continue
              hit_idx=[i for i,line in enumerate(lines) if rx.search(line)]
              if not hit_idx: continue
              score=sum(4 if re.search(r"段评|段落评|页评|吐槽|pageComment|imageComment",lines[i],re.I) else 1 for i in hit_idx)
              scored.append((score,p,lines,hit_idx))
          scored.sort(key=lambda x:(-x[0],str(x[1])))
          print(f"MATCHED_FILES={len(scored)}")
          emitted=0
          for score,p,lines,idxs in scored:
              if emitted>=45: break
              interesting=idxs
              if not interesting: continue
              print(f"\n### FILE {p} score={score}")
              used=set()
              for i in interesting[:8]:
                  a=max(0,i-5); b=min(len(lines),i+8)
                  if any(j in used for j in range(a,b)): continue
                  used.update(range(a,b))
                  for j in range(a,b):
                      print(f"{j+1}: {lines[j]}")
                  print("---")
              emitted+=1
          PY
