name: Probe Qingman v17 AOT Image Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-v17-aot-image-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare current official APK and analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))['data']['datas']['android']
          print(a['downloadUrl'])
          print('official='+str(a.get('version'))+'/'+str(a.get('versionCode')),file=sys.stderr)
          if (str(a.get('version')),str(a.get('versionCode'))) != ('4.4.5','445'): raise SystemExit('unexpected official version')
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/

      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Generate and distill reader image AOT evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          cd "$GITHUB_WORKSPACE"
          mkdir -p reports
          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          out=[]
          def log(s): out.append(str(s)); print(s)
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          exact_terms=(
              'pageUrls','referer','baseImgUrl','freeUrl','freeLine','ComicReadSelectedImageLine',
              'claimedImageUrl','decryptImage','decryptCacheImage','QxComicCacheImageProvider',
              'signature_url','x-custom-timestamp','x-custom-signature','X-Signature',
              'Timestamp not set','X-Signature not set','imageUrl','imageUrls'
          )
          targets={}
          log('=== PP TARGETS ===')
          for off,val in sorted(pp.items()):
              low=val.lower()
              for key in exact_terms:
                  if key.lower() in low:
                      targets.setdefault(off,key)
                      safe=re.sub(r'(?i)(authorization|bearer|cookie|password|token)[^,; ]*','<redacted>',val)
                      log(f'pp=0x{off:x} key={key} value={safe[:220]}')
                      break

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); text_base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          insns=list(md.disasm(data,text_base))
          pending={}; refs=[]
          for idx,ins in enumerate(insns):
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=ins.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),40); continue
              if ins.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in targets: refs.append((idx,int(ins.address),off,targets[off]))

          log('\n=== XREF ADDRESSES ===')
          bykey={}
          for idx,addr,off,key in refs:
              bykey.setdefault(key,[]).append(addr)
          for key in exact_terms:
              vals=sorted(set(bykey.get(key,[])))
              if vals: log(key+'='+','.join(f'0x{x:x}' for x in vals[:40]))

          # Group references that occur within 0x800 bytes; this is useful for deciding whether
          # normal pageUrls consumption and custom signing/header strings share one code region.
          log('\n=== NEARBY CONTRACT GROUPS (<=0x800) ===')
          focus=[(addr,key) for _,addr,_,key in refs]
          pairs=set()
          for a,ka in focus:
              for b,kb in focus:
                  if ka==kb: continue
                  if abs(a-b)<=0x800:
                      pair=tuple(sorted((ka,kb)))
                      if pair not in pairs:
                          pairs.add(pair); log(f'{pair[0]} <-> {pair[1]} distance<=0x800')

          # Distilled generated text contexts: filename + matching line only and nearby declaration lines.
          log('\n=== GENERATED TEXT MATCHES ===')
          deny=re.compile(r'(?i)(password|passwd|pwd|cookie|authorization|bearer|clientp12|privatekey|certificate|keystore|storepassword|keypassword|appaccesstoken)')
          terms=tuple(t.lower() for t in exact_terms)
          emitted=0
          for p in Path('/tmp/blutter-out').rglob('*'):
              if not p.is_file() or p.name in ('pp.txt','blutter_frida.js') or p.stat().st_size>20*1024*1024: continue
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if not any(t in line.lower() for t in terms): continue
                  start=max(0,i-5); end=min(len(lines),i+7)
                  log(f'FILE={p.relative_to("/tmp/blutter-out")} MATCH_LINE={i+1}')
                  for j in range(start,end):
                      s=lines[j]
                      if deny.search(s): s='<redacted-sensitive-line>'
                      log(f'{j+1:06d}: {s[:360]}')
                  emitted+=1
                  if emitted>=45: break
              if emitted>=45: break
          log('text_contexts='+str(emitted))
          Path('reports/qingman-v17-aot-image-contract.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Commit redacted AOT report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/qingman-v17-aot-image-contract.txt
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'probe(qingman): record v17 AOT image contract'
            git push origin HEAD:main
          fi
