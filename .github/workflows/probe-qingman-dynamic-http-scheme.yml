name: Probe Qingman Dynamic HTTP Scheme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-dynamic-http-scheme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current APK and bootstrap host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/qm_version
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          print(a['downloadUrl']); print(a.get('version','')); print(a.get('versionCode',''))
          PY
          sed -n '2,3p' /tmp/qm_version | paste -sd ' ' - | sed 's/^/official_version=/'
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/qm_version)" -o /tmp/qingman.apk
          rm -rf /tmp/qm-native && mkdir -p /tmp/qm-native
          unzip -q -j /tmp/qingman.apk 'lib/arm64-v8a/libqx_security.so' -d /tmp/qm-native

      - name: Bootstrap without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64,hashlib,json,time,urllib.request,uuid,os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile
          so='/tmp/qm-native/libqx_security.so'
          with open(so,'rb') as f:
              elf=ELFFile(f)
              def rv(va,n):
                  for seg in elf.iter_segments():
                      if seg['p_type']!='PT_LOAD': continue
                      s=int(seg['p_vaddr']); e=s+int(seg['p_filesz'])
                      if s<=va and va+n<=e:
                          f.seek(int(seg['p_offset'])+va-s); return f.read(n)
                  raise RuntimeError('VA not backed')
              seed=rv(0x14a40,16)+rv(0x14af0,16); sc=rv(0x17d1f,33); ac=rv(0x17d40,32)
          base=hashlib.sha256(seed).digest()
          def deob(c,k):
              stream=b''; i=0
              while len(stream)<len(c): stream+=hashlib.sha256(base+bytes([k])+i.to_bytes(4,'big')).digest(); i+=1
              return bytes(a^b for a,b in zip(c,stream))
          sm=deob(sc,1); aes=deob(ac,2); ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sm).hexdigest(); body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          req=urllib.request.Request('https://mu8xm4cx.zermh.com/bootstrap/domain',data=body,headers={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':'qingman/4.4.5 (Android)','appVersion':'4.4.5','platform':'android','X-Device-Id':did},method='POST')
          resp=json.load(urllib.request.urlopen(req,timeout=20)); enc=resp['data']; payload=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4)); obj=json.loads(AESGCM(aes).decrypt(payload[:12],payload[12:],(ts+'|'+nonce).encode()))
          from urllib.parse import urlsplit
          host=urlsplit(obj['apiDomain']).hostname; access=obj['appAccessToken']
          open('/tmp/qm_dynamic_host','w').write(host+'\n'); open('/tmp/qm_app_access','w').write(access); open('/tmp/qm_device_id','w').write(did)
          os.chmod('/tmp/qm_app_access',0o600); os.chmod('/tmp/qm_device_id',0o600)
          print('bootstrap_ok=true'); print('dynamic_host='+host); print('sensitive_bootstrap_fields_logged=false')
          PY

      - name: Probe cache detail readonly route
        shell: bash
        run: |
          set -euo pipefail
          host=$(cat /tmp/qm_dynamic_host); access=$(cat /tmp/qm_app_access); did=$(cat /tmp/qm_device_id); comic='1965626277746577408'
          common=(-H 'Accept: application/json, text/plain, */*' -H 'User-Agent: qingman/4.4.5 (Android)' -H 'appVersion: 4.4.5' -H 'platform: android' -H "X-Device-Id: $did" -H "X-QM-App-Access: $access")

          chap=$(mktemp)
          curl -sS --connect-timeout 8 --max-time 25 "${common[@]}" -o "$chap" "http://$host/api/comic/chapter/ie84hfh8/homelist/$comic?comicId=$comic"
          python3 - "$chap" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1])); found=[]
          def w(x):
              if isinstance(x,dict):
                  cid=x.get('chapterId') or x.get('id'); name=x.get('chapterName') or x.get('chapterTitle') or x.get('title') or x.get('name')
                  if cid and name and not found: found.append((str(cid),str(name)))
                  for v in x.values(): w(v)
              elif isinstance(x,list):
                  for v in x:w(v)
          w(o); print('chapter_list_code='+str(o.get('code')),'chapter='+(found[0][1] if found else ''))
          if found: open('/tmp/qm_chapter_id','w').write(found[0][0])
          PY
          rm -f "$chap"
          chapter=$(cat /tmp/qm_chapter_id)

          summarize() {
            python3 - "$1" "$2" "$3" <<'PY'
          import json,sys,urllib.parse,os,re
          raw=open(sys.argv[1],'rb').read(1048576); text=raw.decode('utf-8','replace')
          try: o=json.loads(text)
          except Exception:
              print(sys.argv[3]+'_http='+sys.argv[2]+' non_json='+re.sub(r'\s+',' ',text[:160])); raise SystemExit
          urls=[]
          def w(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k in ('pageUrls','pageUrl','imageUrl','url','picList'):
                          if isinstance(v,str) and v.startswith(('http://','https://')): urls.append(v)
                          elif isinstance(v,list):
                              for q in v:
                                  if isinstance(q,str) and q.startswith(('http://','https://')): urls.append(q)
                                  elif isinstance(q,dict):
                                      z=q.get('pageUrl') or q.get('imageUrl') or q.get('url')
                                      if isinstance(z,str) and z.startswith(('http://','https://')): urls.append(z)
                      if isinstance(v,(dict,list)): w(v)
              elif isinstance(x,list):
                  for v in x:w(v)
          w(o); urls=list(dict.fromkeys(urls)); hosts=sorted(set(urllib.parse.urlsplit(u).hostname or '' for u in urls)); schemes=sorted(set(urllib.parse.urlsplit(u).scheme for u in urls))
          print(sys.argv[3]+'_http='+sys.argv[2],'code='+str(o.get('code')),'msg='+str(o.get('msg')),'pages='+str(len(urls)),'schemes='+','.join(schemes),'hosts='+','.join(hosts[:8]))
          if urls and not os.path.exists('/tmp/qm_first_page'): open('/tmp/qm_first_page','w').write(urls[0])
          PY
          }

          echo '=== CACHE_DETAIL_MATRIX ==='
          for method in GET POST; do
            for type in 0 1 2 3; do
              out=$(mktemp); err=$(mktemp)
              url="http://$host/api/comic/chapter/ie84hfh8/cache/detail?comicId=$comic&chapterId=$chapter&type=$type"
              if [[ "$method" == POST ]]; then
                code=$(curl -sS --connect-timeout 8 --max-time 25 -X POST "${common[@]}" -H 'Content-Type: application/json' --data '{}' -o "$out" -w '%{http_code}' "$url" 2>"$err" || true)
              else
                code=$(curl -sS --connect-timeout 8 --max-time 25 "${common[@]}" -o "$out" -w '%{http_code}' "$url" 2>"$err" || true)
              fi
              summarize "$out" "$code" "cache_${method}_${type}"
              rm -f "$out" "$err"
            done
          done

          if [[ -s /tmp/qm_first_page ]]; then
            echo '=== FIRST_PAGE_TRANSPORT ==='
            page=$(cat /tmp/qm_first_page)
            for mode in direct plain; do
              u="$page"; [[ "$mode" == plain ]] && u=$(python3 -c 'import sys,urllib.parse;x=urllib.parse.urlsplit(sys.argv[1]);print(urllib.parse.urlunsplit(("http",x.netloc,x.path,x.query,x.fragment)))' "$page")
              hdr=$(mktemp); body=$(mktemp); err=$(mktemp)
              code=$(curl -sS --connect-timeout 8 --max-time 20 -D "$hdr" -o "$body" -w '%{http_code}' "$u" 2>"$err" || true)
              ctype=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{v=$0}END{sub(/^content-type:[ ]*/,"",v);gsub("\r", "", v);print v}' "$hdr")
              printf 'page_mode=%s http=%s bytes=%s ctype=%s\n' "$mode" "$code" "$(wc -c < "$body" | tr -d ' ')" "$ctype"
              rm -f "$hdr" "$body" "$err"
            done
          fi
          rm -f /tmp/qm_app_access /tmp/qm_device_id /tmp/qm_chapter_id /tmp/qm_first_page
