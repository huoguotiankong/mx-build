name: Probe Qingman Dynamic HTTP Scheme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-dynamic-http-scheme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current APK and bootstrap host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/qm_version
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl']); print(a.get('version','')); print(a.get('versionCode',''))
          PY
          sed -n '2,3p' /tmp/qm_version | paste -sd ' ' - | sed 's/^/official_version=/'
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/qm_version)" -o /tmp/qingman.apk
          rm -rf /tmp/qm-native && mkdir -p /tmp/qm-native
          unzip -q -j /tmp/qingman.apk 'lib/arm64-v8a/libqx_security.so' -d /tmp/qm-native
          test -s /tmp/qm-native/libqx_security.so

      - name: Bootstrap without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64,hashlib,json,time,urllib.request,uuid,os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile
          SO='/tmp/qm-native/libqx_security.so'; BOOTSTRAP='https://mu8xm4cx.zermh.com/bootstrap/domain'
          with open(SO,'rb') as f:
              elf=ELFFile(f)
              def read_va(va,n):
                  for seg in elf.iter_segments():
                      if seg['p_type']!='PT_LOAD': continue
                      start=int(seg['p_vaddr']); end=start+int(seg['p_filesz'])
                      if start<=va and va+n<=end:
                          f.seek(int(seg['p_offset'])+va-start); return f.read(n)
                  raise RuntimeError('VA not file-backed')
              seed=read_va(0x14a40,16)+read_va(0x14af0,16); sign_cipher=read_va(0x17d1f,33); aes_cipher=read_va(0x17d40,32)
          base=hashlib.sha256(seed).digest()
          def deob(cipher,kind):
              stream=b''; counter=0
              while len(stream)<len(cipher):
                  stream+=hashlib.sha256(base+bytes([kind])+counter.to_bytes(4,'big')).digest(); counter+=1
              return bytes(a^b for a,b in zip(cipher,stream))
          sign_material=deob(sign_cipher,1); aes_key=deob(aes_cipher,2)
          ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sign_material).hexdigest()
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          req=urllib.request.Request(BOOTSTRAP,data=body,headers={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':'qingman/4.4.5 (Android)','appVersion':'4.4.5','platform':'android','X-Device-Id':did},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r: resp=json.load(r)
          enc=resp['data']; payload=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4))
          obj=json.loads(AESGCM(aes_key).decrypt(payload[:12],payload[12:],(ts+'|'+nonce).encode()))
          domain=str(obj.get('apiDomain','')).strip(); access=str(obj.get('appAccessToken','')).strip()
          if not domain or not access: raise RuntimeError('bootstrap missing required fields')
          from urllib.parse import urlsplit
          host=urlsplit(domain if '://' in domain else 'https://'+domain).hostname
          if not host: raise RuntimeError('invalid apiDomain')
          open('/tmp/qm_dynamic_host','w').write(host+'\n'); open('/tmp/qm_app_access','w').write(access); open('/tmp/qm_device_id','w').write(did)
          os.chmod('/tmp/qm_app_access',0o600); os.chmod('/tmp/qm_device_id',0o600)
          print('bootstrap_ok=true'); print('dynamic_host='+host); print('sensitive_bootstrap_fields_logged=false')
          PY

      - name: Probe chapters and reader without logging URLs or credentials
        shell: bash
        run: |
          set -euo pipefail
          host=$(cat /tmp/qm_dynamic_host); access=$(cat /tmp/qm_app_access); did=$(cat /tmp/qm_device_id)
          comic='1965626277746577408'
          common=(-H 'Accept: application/json, text/plain, */*' -H 'User-Agent: qingman/4.4.5 (Android)' -H 'appVersion: 4.4.5' -H 'platform: android' -H "X-Device-Id: $did" -H "X-QM-App-Access: $access")

          echo "=== LATEST_QUERY_FIX host=$host ==="
          tmp=$(mktemp)
          code=$(curl -sS --connect-timeout 8 --max-time 20 -X POST "${common[@]}" -H 'Content-Type: application/json' --data '{}' -o "$tmp" -w '%{http_code}' "http://$host/api/comic/comics/homerecentUpdates?page=1&size=20" || true)
          python3 - "$tmp" "$code" <<'PY'
          import json,sys
          o=json.load(open(sys.argv[1])); d=o.get('data') or {}; rows=d.get('datas') if isinstance(d,dict) else []
          print('latest_http='+sys.argv[2],'code='+str(o.get('code')),'msg='+str(o.get('msg')),'count='+str(len(rows) if isinstance(rows,list) else -1))
          if isinstance(rows,list): print('latest_titles='+','.join(str(x.get('title') or x.get('comicTitle') or '') for x in rows[:8] if isinstance(x,dict)))
          PY
          rm -f "$tmp"

          echo '=== CHAPTER_LIST_GET ==='
          chap=$(mktemp)
          ccode=$(curl -sS --connect-timeout 8 --max-time 25 "${common[@]}" -o "$chap" -w '%{http_code}' "http://$host/api/comic/chapter/ie84hfh8/homelist/$comic?comicId=$comic" || true)
          python3 - "$chap" "$ccode" <<'PY'
          import json,sys,re
          o=json.load(open(sys.argv[1])); found=[]
          def walk(x):
              if isinstance(x,dict):
                  cid=x.get('chapterId') or x.get('id'); name=x.get('chapterName') or x.get('chapterTitle') or x.get('title') or x.get('name')
                  if cid and name and len(found)<12: found.append((str(cid),str(name)))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(o)
          print('chapters_http='+sys.argv[2],'code='+str(o.get('code')),'msg='+str(o.get('msg')),'sampleCount='+str(len(found)))
          print('chapter_names='+','.join(n for _,n in found[:10]))
          if found: open('/tmp/qm_chapter_id','w').write(found[0][0])
          PY
          rm -f "$chap"

          if [[ -s /tmp/qm_chapter_id ]]; then
            chapter=$(cat /tmp/qm_chapter_id)
            echo '=== CHAPTER_DETAIL_GET ==='
            pages=$(mktemp)
            pcode=$(curl -sS --connect-timeout 8 --max-time 25 "${common[@]}" -o "$pages" -w '%{http_code}' "http://$host/api/comic/chapter/ie84hfh8/detail?comicId=$comic&chapterId=$chapter" || true)
            python3 - "$pages" "$pcode" <<'PY'
          import json,sys,urllib.parse
          o=json.load(open(sys.argv[1])); urls=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k in ('pageUrls','pageUrl','imageUrl','url'):
                          if isinstance(v,str) and v.startswith(('http://','https://')): urls.append(v)
                          elif isinstance(v,list):
                              for q in v:
                                  if isinstance(q,str) and q.startswith(('http://','https://')): urls.append(q)
                                  elif isinstance(q,dict):
                                      z=q.get('pageUrl') or q.get('imageUrl') or q.get('url')
                                      if isinstance(z,str) and z.startswith(('http://','https://')): urls.append(z)
                      if isinstance(v,(dict,list)): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(o); urls=list(dict.fromkeys(urls))
          print('reader_http='+sys.argv[2],'code='+str(o.get('code')),'msg='+str(o.get('msg')),'pageCount='+str(len(urls)))
          schemes=sorted(set(urllib.parse.urlsplit(u).scheme for u in urls)); hosts=sorted(set(urllib.parse.urlsplit(u).hostname or '' for u in urls))
          print('page_schemes='+','.join(schemes)); print('page_hosts='+','.join(hosts[:12]))
          if urls: open('/tmp/qm_first_page','w').write(urls[0])
          PY
            rm -f "$pages"
          fi

          if [[ -s /tmp/qm_first_page ]]; then
            echo '=== FIRST_PAGE_TRANSPORT ==='
            page=$(cat /tmp/qm_first_page)
            for mode in plain direct; do
              testurl="$page"
              if [[ "$mode" == plain ]]; then testurl=$(python3 -c 'import sys,urllib.parse;u=urllib.parse.urlsplit(sys.argv[1]);print(urllib.parse.urlunsplit(("http",u.netloc,u.path,u.query,u.fragment)))' "$page"); fi
              hdr=$(mktemp); out=$(mktemp); err=$(mktemp)
              status=$(curl -sS --connect-timeout 8 --max-time 20 -D "$hdr" -o "$out" -w '%{http_code}' "$testurl" 2>"$err" || true)
              ctype=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{v=$0}END{sub(/^content-type:[ ]*/,"",v);gsub("\r", "", v);print v}' "$hdr")
              printf 'page_mode=%s http=%s bytes=%s ctype=%s err=%s\n' "$mode" "$status" "$(wc -c < "$out" | tr -d ' ')" "$ctype" "$(tr '\n' ' ' < "$err" | cut -c1-140)"
              rm -f "$hdr" "$out" "$err"
            done
          fi

          rm -f /tmp/qm_app_access /tmp/qm_device_id /tmp/qm_chapter_id /tmp/qm_first_page
