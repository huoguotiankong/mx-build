name: Probe Qingman Dynamic HTTP Scheme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-dynamic-http-scheme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current APK and bootstrap host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/qm_version
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl']); print(a.get('version','')); print(a.get('versionCode',''))
          PY
          sed -n '2,3p' /tmp/qm_version | paste -sd ' ' - | sed 's/^/official_version=/'
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/qm_version)" -o /tmp/qingman.apk
          rm -rf /tmp/qm-native && mkdir -p /tmp/qm-native
          unzip -q -j /tmp/qingman.apk 'lib/arm64-v8a/libqx_security.so' -d /tmp/qm-native
          test -s /tmp/qm-native/libqx_security.so

      - name: Bootstrap without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64,hashlib,json,time,urllib.request,uuid,os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile
          SO='/tmp/qm-native/libqx_security.so'; BOOTSTRAP='https://mu8xm4cx.zermh.com/bootstrap/domain'
          with open(SO,'rb') as f:
              elf=ELFFile(f)
              def read_va(va,n):
                  for seg in elf.iter_segments():
                      if seg['p_type']!='PT_LOAD': continue
                      start=int(seg['p_vaddr']); end=start+int(seg['p_filesz'])
                      if start<=va and va+n<=end:
                          f.seek(int(seg['p_offset'])+va-start); return f.read(n)
                  raise RuntimeError('VA not file-backed')
              seed=read_va(0x14a40,16)+read_va(0x14af0,16); sign_cipher=read_va(0x17d1f,33); aes_cipher=read_va(0x17d40,32)
          base=hashlib.sha256(seed).digest()
          def deob(cipher,kind):
              stream=b''; counter=0
              while len(stream)<len(cipher):
                  stream+=hashlib.sha256(base+bytes([kind])+counter.to_bytes(4,'big')).digest(); counter+=1
              return bytes(a^b for a,b in zip(cipher,stream))
          sign_material=deob(sign_cipher,1); aes_key=deob(aes_cipher,2)
          ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sign_material).hexdigest()
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          req=urllib.request.Request(BOOTSTRAP,data=body,headers={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':'qingman/4.4.5 (Android)','appVersion':'4.4.5','platform':'android','X-Device-Id':did},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r: resp=json.load(r)
          enc=resp['data']; payload=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4))
          obj=json.loads(AESGCM(aes_key).decrypt(payload[:12],payload[12:],(ts+'|'+nonce).encode()))
          domain=str(obj.get('apiDomain','')).strip(); access=str(obj.get('appAccessToken','')).strip()
          if not domain or not access: raise RuntimeError('bootstrap missing required fields')
          from urllib.parse import urlsplit
          host=urlsplit(domain if '://' in domain else 'https://'+domain).hostname
          if not host: raise RuntimeError('invalid apiDomain')
          open('/tmp/qm_dynamic_host','w').write(host+'\n'); open('/tmp/qm_app_access','w').write(access); open('/tmp/qm_device_id','w').write(did)
          os.chmod('/tmp/qm_app_access',0o600); os.chmod('/tmp/qm_device_id',0o600)
          print('bootstrap_ok=true'); print('dynamic_host='+host); print('sensitive_bootstrap_fields_logged=false')
          PY

      - name: Probe readonly endpoint method matrix
        shell: bash
        run: |
          set -euo pipefail
          host=$(cat /tmp/qm_dynamic_host); access=$(cat /tmp/qm_app_access); did=$(cat /tmp/qm_device_id)
          COMIC_ID='1965626277746577408'
          common=(-H 'Accept: application/json, text/plain, */*' -H 'User-Agent: qingman/4.4.5 (Android)' -H 'appVersion: 4.4.5' -H 'platform: android' -H "X-Device-Id: $did" -H "X-QM-App-Access: $access")

          summarize() {
            python3 - "$1" <<'PY'
          import json,sys,re,urllib.parse
          raw=open(sys.argv[1],'rb').read(1048576); text=raw.decode('utf-8','replace')
          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|certificate|proof|signature|sign|key|seed)')
          def walk(x,out,depth=0):
              if depth>8:return
              if isinstance(x,dict):
                  item={}
                  for k in ('id','comicId','comicTitle','title','name','chapterId','chapterName','chapterTitle','categoryId','categoryName','country','status','totalPages','pageNum','page','pageSize'):
                      v=x.get(k)
                      if isinstance(v,(str,int,float,bool)) or v is None and k in x: item[k]=v
                  if item and any(k in item for k in ('id','comicId','comicTitle','chapterId','title','categoryId','country')) and len(out['items'])<12:
                      out['items'].append(item)
                  for k,v in x.items():
                      if sensitive.search(str(k)): continue
                      if k in ('comicCoverUrl','coverUrl','cover','thumbnail','imageUrl') and isinstance(v,str):
                          h=urllib.parse.urlsplit(v).hostname
                          if h and h not in out['imageHosts']: out['imageHosts'].append(h)
                      elif isinstance(v,(dict,list)): walk(v,out,depth+1)
              elif isinstance(x,list):
                  for v in x[:40]: walk(v,out,depth+1)
          try:
              obj=json.loads(text); out={'code':obj.get('code') if isinstance(obj,dict) else None,'msg':obj.get('msg') if isinstance(obj,dict) else None,'items':[],'imageHosts':[]}; walk(obj,out); print(json.dumps(out,ensure_ascii=False,separators=(',',':'))[:7000])
          except Exception:
              print('non_json:'+re.sub(r'\s+',' ',text[:220]))
          PY
          }

          probe_post() {
            name="$1"; url="$2"; ctype="$3"; payload="$4"
            body=$(mktemp); err=$(mktemp)
            code=$(curl -sS --connect-timeout 8 --max-time 25 -X POST "${common[@]}" -H "Content-Type: $ctype" --data "$payload" -o "$body" -w '%{http_code}' "$url" 2>"$err" || true)
            printf 'POST name=%s http=%s bytes=%s summary=%s err=%s\n' "$name" "$code" "$(wc -c < "$body" | tr -d ' ')" "$(summarize "$body")" "$(tr '\n' ' ' < "$err" | cut -c1-160)"
            rm -f "$body" "$err"
          }

          echo "=== DATASET_CONFIRMATION host=$host ==="
          probe_post home "http://$host/api/comic/comics/v1/homeList" 'application/json' '{"page":1,"pageNum":1,"pageSize":20}'
          probe_post rank "http://$host/api/comic/comics/getComicRankList" 'application/json' '{"page":1,"pageNum":1,"pageSize":20}'

          echo '=== LATEST_METHOD_MATRIX ==='
          probe_post latest_query "http://$host/api/comic/comics/homerecentUpdates?page=1&pageNum=1&pageSize=20" 'application/json' '{}'
          probe_post latest_json "http://$host/api/comic/comics/homerecentUpdates" 'application/json' '{"page":1,"pageNum":1,"pageSize":20}'
          probe_post latest_form "http://$host/api/comic/comics/homerecentUpdates" 'application/x-www-form-urlencoded' 'page=1&pageNum=1&pageSize=20'

          echo '=== DETAIL_METHOD_MATRIX ==='
          probe_post detail_query "http://$host/api/comic/comics/ie84hfh8/detail?comicId=$COMIC_ID" 'application/json' '{}'
          probe_post detail_json "http://$host/api/comic/comics/ie84hfh8/detail" 'application/json' "{\"comicId\":\"$COMIC_ID\"}"
          probe_post detail_form "http://$host/api/comic/comics/ie84hfh8/detail" 'application/x-www-form-urlencoded' "comicId=$COMIC_ID"

          echo '=== CHAPTER_LIST_METHOD_MATRIX ==='
          probe_post chapters_path_query "http://$host/api/comic/chapter/ie84hfh8/homelist/$COMIC_ID?comicId=$COMIC_ID" 'application/json' '{}'
          probe_post chapters_path_json "http://$host/api/comic/chapter/ie84hfh8/homelist/$COMIC_ID" 'application/json' "{\"comicId\":\"$COMIC_ID\"}"

          echo '=== SEARCH_METHOD_MATRIX ==='
          probe_post search_query "http://$host/api/comic/categories/comicList?page=1&pageNum=1&pageSize=20&keyword=%E6%88%91%E7%8B%AC%E8%87%AA%E5%8D%87%E7%BA%A7" 'application/json' '{}'
          probe_post search_json "http://$host/api/comic/categories/comicList" 'application/json' '{"page":1,"pageNum":1,"pageSize":20,"keyword":"我独自升级"}'

          rm -f /tmp/qm_app_access /tmp/qm_device_id
