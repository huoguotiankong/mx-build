name: Format Dongman Manhua Plus v1.6.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-dongmanmanhuaplus-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MX_PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: c254d96478e3268216980384384dd2f2c9172859
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: 064c1a0e8c58be4b36c21444c3d3df6840636950
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay module
        shell: bash
        run: |
          set -euo pipefail
          test -f dev/src/zh/dongmanmanhuaplus/build.gradle.kts
          grep -Fq 'versionCode = 4' dev/src/zh/dongmanmanhuaplus/build.gradle.kts
          rm -rf upstream/src/zh/dongmanmanhuaplus
          cp -a dev/src/zh/dongmanmanhuaplus upstream/src/zh/dongmanmanhuaplus

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply canonical formatting
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessApply
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessCheck

      - name: Verify only formatting changed
        shell: bash
        run: |
          set -euo pipefail
          diff -ru --exclude=build dev/src/zh/dongmanmanhuaplus upstream/src/zh/dongmanmanhuaplus > formatting.diff || true
          test -s formatting.diff
          sed -n '1,240p' formatting.diff

      - name: Upload formatted module
        uses: actions/upload-artifact@v4
        with:
          name: dongmanmanhuaplus-v4-formatted
          path: upstream/src/zh/dongmanmanhuaplus
          if-no-files-found: error
