name: Format Dongman Manhua Plus v1.6.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-dongmanmanhuaplus-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MX_PRIVATE_READ_TOKEN"

      - name: Checkout private source main
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: 064c1a0e8c58be4b36c21444c3d3df6840636950
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay module
        shell: bash
        run: |
          set -euo pipefail
          module='dev/src/zh/dongmanmanhuaplus'
          test -f "$module/build.gradle.kts"
          grep -Fq 'versionCode = 4' "$module/build.gradle.kts"
          grep -Fq 'M_genre-page_' "$module/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt"
          grep -Fq '#_episodeList li[data-episode-no]' "$module/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt"
          rm -rf upstream/src/zh/dongmanmanhuaplus
          cp -a "$module" upstream/src/zh/dongmanmanhuaplus

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply canonical formatting
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessApply
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessCheck

      - name: Copy formatting back and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/dongmanmanhuaplus
          rsync -a --exclude build/ upstream/src/zh/dongmanmanhuaplus/ dev/src/zh/dongmanmanhuaplus/
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check
          changed="$(git -C dev status --short -- src/zh/dongmanmanhuaplus)"
          if [[ -z "$changed" ]]; then
            echo 'No formatting changes to commit'
            exit 0
          fi
          git -C dev config user.name 'github-actions[bot]'
          git -C dev config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dev add src/zh/dongmanmanhuaplus
          git -C dev commit -m 'style(dongmanmanhuaplus): apply Keiyoushi formatting'
          git -C dev pull --rebase origin main
          git -C dev push origin HEAD:main
