name: CopyManga Plus API Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copymangaplus-api-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Probe CopyManga and HotManga API routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime as dt, hashlib, hmac, json, random, re, string, subprocess, time
          import urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          out = Path('probe-result.json')
          src = Path('source/src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt').read_text('utf-8')

          def const(name):
              m = re.search(rf'private const val {re.escape(name)} = "([^"]+)"', src)
              if not m: raise RuntimeError(f'missing source constant {name}')
              return m.group(1)

          copy_version = const('COPY_VERSION')
          secret_b64 = const('SECRET_B64')
          umstring = const('UMSTRING')
          copy_bootstrap = const('COPY_BOOTSTRAP')
          hot_bootstrap = const('HOT_BOOTSTRAP')

          summary = {
              'source_commit': subprocess.check_output(['git','-C','source','rev-parse','HEAD'], text=True).strip(),
              'copy': {'bootstrap': copy_bootstrap, 'network2': False, 'discovered': [], 'working_host': None},
              'hot': {'bootstrap': hot_bootstrap, 'network2': False, 'discovered': [], 'working_host': None},
              'core': {'list': False, 'detail': False, 'chapters': False, 'pages': False},
              'samples': [],
              'comments': {'manga_read': False, 'chapter_read': False},
          }

          def save():
              out.write_text(json.dumps(summary, ensure_ascii=False, indent=2), 'utf-8')

          def rand_text(n):
              a=string.ascii_letters+string.digits
              return ''.join(random.choice(a) for _ in range(n))

          def copy_headers():
              ts=str(int(time.time()))
              sig=hmac.new(base64.b64decode(secret_b64), ts.encode(), hashlib.sha256).hexdigest()
              device=f'{random.choice(string.ascii_uppercase)}{random.choice(string.ascii_uppercase)}{random.randrange(10)}{random.choice(string.ascii_uppercase)}.' + ''.join(str(random.randrange(10)) for _ in range(6)) + '.' + ''.join(str(random.randrange(10)) for _ in range(3))
              return {'User-Agent':f'COPY/{copy_version}','source':'copyApp','deviceinfo':f'{random.randrange(1000000,10000000)}V-{random.randrange(1000,10000)}','dt':dt.datetime.now().strftime('%Y.%m.%d'),'platform':'3','referer':f'com.copymanga.app-{copy_version}','version':copy_version,'device':device,'pseudoid':rand_text(16),'Accept':'application/json','region':'0','authorization':'Token','umstring':umstring,'x-auth-timestamp':ts,'x-auth-signature':sig}

          def hot_headers():
              return {'User-Agent':'COPY/2.2.0','Accept':'application/json','webp':'1','platform':'3','version':'2024.04.28','X-Requested-With':'com.manga2020.app'}

          def request_json(host,path,kind,timeout=12):
              req=urllib.request.Request(f'https://{host}{path}', headers=copy_headers() if kind=='copy' else hot_headers())
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      status=r.status; raw=r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code; raw=e.read().decode('utf-8','replace')
              if not 200 <= status < 300: raise RuntimeError(f'HTTP {status}')
              try: data=json.loads(raw)
              except Exception: raise RuntimeError('invalid JSON')
              code=data.get('code') if isinstance(data,dict) else None
              if code not in (None,200): raise RuntimeError(f'API code {code}')
              return data

          def normalize(v):
              return re.sub(r'^https?://','',(v or '').strip()).strip('/')

          def discover(host,kind):
              root=request_json(host,'/api/v3/system/network2?platform=3',kind)
              results=root.get('results') or {}; hosts=[]
              for key in ('api','share'):
                  for node in results.get(key) or []:
                      if isinstance(node,list): hosts.extend(str(x) for x in node)
                      elif isinstance(node,str): hosts.append(node)
              return list(dict.fromkeys(h for h in map(normalize,hosts) if h))

          try:
              route_hosts={}
              for kind,bootstrap in [('copy',copy_bootstrap),('hot',hot_bootstrap)]:
                  try:
                      found=discover(bootstrap,kind)
                      summary[kind]['network2']=True; summary[kind]['discovered']=found[:20]
                  except Exception as e:
                      summary[kind]['network2_error']=str(e); found=[]
                  for host in list(dict.fromkeys([bootstrap]+found)):
                      try:
                          request_json(host,'/api/v3/comics?limit=10&offset=0&ordering=-popular&_update=true',kind)
                          summary[kind]['working_host']=host; route_hosts[kind]=host; break
                      except Exception as e:
                          summary[kind].setdefault('candidate_errors',{})[host]=str(e)

              if not route_hosts: raise RuntimeError('No working CopyManga/HotManga API route')
              kind,host=next(iter(route_hosts.items()))
              root=request_json(host,'/api/v3/comics?limit=10&offset=0&ordering=-popular&_update=true',kind)
              items=((root.get('results') or {}).get('list') or [])
              summary['core']['list']=bool(items)
              if not items: raise RuntimeError('Working route returned no manga list sample')

              chosen=None
              for raw in items[:10]:
                  item=raw.get('comic') if isinstance(raw,dict) and isinstance(raw.get('comic'),dict) else raw
                  path_word=item.get('path_word') if isinstance(item,dict) else None
                  if not path_word: continue
                  sample={'path_word':path_word,'groups_type':None,'group_candidates':[],'chapter_attempts':[]}
                  summary['samples'].append(sample)
                  try:
                      detail=request_json(host,f'/api/v3/comic2/{urllib.parse.quote(path_word)}?platform=3&_update=true',kind)
                      results=detail.get('results') or {}; comic=results.get('comic') or {}
                      sample['detail']=bool(comic); summary['core']['detail'] |= bool(comic)
                      groups=results.get('groups')
                      sample['groups_type']=type(groups).__name__
                      candidates=[]
                      if isinstance(groups,dict):
                          for key,value in groups.items():
                              word=(value or {}).get('path_word') if isinstance(value,dict) else None
                              candidates.append(word or key)
                      elif isinstance(groups,list):
                          for value in groups:
                              if isinstance(value,dict):
                                  word=value.get('path_word') or value.get('uuid') or value.get('name')
                                  if word: candidates.append(str(word))
                      candidates=list(dict.fromkeys(candidates+['default']))
                      sample['group_candidates']=candidates[:12]
                      for gw in candidates[:12]:
                          try:
                              cr=request_json(host,f'/api/v3/comic/{urllib.parse.quote(path_word)}/group/{urllib.parse.quote(gw)}/chapters?limit=5&offset=0&platform=3',kind)
                              chapters=((cr.get('results') or {}).get('list') or [])
                              sample['chapter_attempts'].append({'group':gw,'count':len(chapters)})
                              if chapters:
                                  chosen=(path_word, comic.get('uuid') or path_word, chapters, gw)
                                  summary['core']['chapters']=True
                                  break
                          except Exception as e:
                              sample['chapter_attempts'].append({'group':gw,'error':str(e)})
                      if chosen: break
                  except Exception as e:
                      sample['detail_error']=str(e)

              if not chosen: raise RuntimeError('No chapter list found across 10 popular samples/group variants')
              path_word,comic_id,chapters,group_word=chosen
              chapter_id=chapters[0].get('uuid')
              if not chapter_id: raise RuntimeError('Sample chapter missing uuid')

              chapter=None
              page_errors={}
              for suffix in ('chapter','chapter2'):
                  try:
                      pr=request_json(host,f'/api/v3/comic/{urllib.parse.quote(path_word)}/{suffix}/{urllib.parse.quote(chapter_id)}?platform=3&_update=true',kind)
                      chapter=(pr.get('results') or {}).get('chapter') or {}
                      if chapter.get('contents'): break
                  except Exception as e: page_errors[suffix]=str(e)
              summary['core']['pages']=bool(chapter and chapter.get('contents'))
              summary['core']['page_errors']=page_errors
              if not summary['core']['pages']: raise RuntimeError('Sample chapter returned no page images')
              summary['core']['page_count_sample']=len(chapter.get('contents') or [])
              summary['core']['working_group']=group_word

              try:
                  c=request_json(host,f'/api/v3/comments?comic_id={urllib.parse.quote(str(comic_id))}&limit=5&offset=0&_update=true',kind)
                  summary['comments']['manga_read']=isinstance(c.get('results'),dict)
              except Exception as e: summary['comments']['manga_error']=str(e)
              try:
                  c=request_json(host,f'/api/v3/comments?comic_id={urllib.parse.quote(str(chapter_id))}&limit=5&offset=0&_update=true',kind)
                  summary['comments']['chapter_read']=isinstance(c.get('results'),dict)
              except Exception as e: summary['comments']['chapter_error']=str(e)

          except Exception as e:
              summary['fatal_error']=str(e)
              save()
              print(json.dumps(summary,ensure_ascii=False,indent=2))
              raise
          else:
              save()
              print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Summarize probe
        if: always()
        shell: bash
        run: |
          if [[ -f probe-result.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d=json.loads(Path('probe-result.json').read_text('utf-8'))
          print('### CopyManga Plus API probe\n')
          print(f"- Source commit: `{d.get('source_commit')}`")
          for kind in ('copy','hot'):
              r=d[kind]; print(f"- {kind}: network2={'OK' if r.get('network2') else 'FAIL'}, working_host=`{r.get('working_host') or 'none'}`")
          c=d['core']; print(f"- Core: list={c.get('list')}, detail={c.get('detail')}, chapters={c.get('chapters')}, pages={c.get('pages')}, sample_pages={c.get('page_count_sample',0)}, working_group=`{c.get('working_group','none')}`")
          cm=d['comments']; print(f"- Anonymous comments: manga={cm.get('manga_read')}, chapter={cm.get('chapter_read')}")
          if d.get('fatal_error'): print(f"- Fatal: `{d['fatal_error']}`")
          for s in d.get('samples',[]):
              print(f"- sample `{s.get('path_word')}` groups={s.get('groups_type')} candidates={s.get('group_candidates')} attempts={s.get('chapter_attempts')}")
          PY
          fi

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copymangaplus-api-probe
          path: probe-result.json
          if-no-files-found: warn
          retention-days: 7
