name: MX Rich Comments Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/mx-app-rich-comments-preview-trigger"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]
          [[ -n "$MX_APP_SIGNING_BUNDLE" ]]
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]]

      - name: Checkout validated MX App feature
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: 6838945364a1bc70c25b8798450eb33568fbef43
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Record source revision
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" == "6838945364a1bc70c25b8798450eb33568fbef43" ]]
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Prepare stable signing key
        shell: bash
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle=json.loads(os.environ['MX_APP_SIGNING_BUNDLE'])
          required=('signingKey','alias','storePassword')
          missing=[k for k in required if not bundle.get(k)]
          if missing: raise SystemExit('Signing bundle missing required fields')
          path=Path(os.environ['RUNNER_TEMP'])/'mx-app.jks'
          path.write_bytes(base64.b64decode(bundle['signingKey']))
          values={
              'MX_KEYSTORE_PATH':str(path),
              'MX_KEY_ALIAS':str(bundle['alias']),
              'MX_KEYSTORE_PASSWORD':str(bundle['storePassword']),
              'MX_KEY_PASSWORD':str(bundle['storePassword']),
          }
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for name,value in values.items():
                  print(f'::add-mask::{value}')
                  f.write(f'{name}<<__MX_SIGNING_EOF__\n{value}\n__MX_SIGNING_EOF__\n')
          PY

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]

      - name: Spotless
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Build signed Preview APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assemblePreview \
            -Pdisable-code-shrink \
            --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Normalize Preview APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            signed="${apk%.apk}.mx-signed.apk"
            "$apksigner" sign \
              --ks "$MX_KEYSTORE_PATH" \
              --ks-key-alias "$MX_KEY_ALIAS" \
              --ks-pass env:MX_KEYSTORE_PASSWORD \
              --key-pass env:MX_KEY_PASSWORD \
              --out "$signed" "$apk"
            mv "$signed" "$apk"
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]

      - name: Verify APK identity and certificate
        shell: bash
        run: |
          set -euo pipefail
          expected_cert="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            badging="$("$aapt_bin" dump badging "$apk")"
            package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            app_label="$(printf '%s\n' "$badging" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1)"
            [[ "$package_name" == "com.huoguotiankong.mx.beta" ]]
            [[ "$app_label" == "MX漫画" ]]
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$normalized" == *"$expected_cert"* ]]
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]

      - name: Checkout private APK publication target
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: publisher
          fetch-depth: 1

      - name: Publish signed phone APKs to private downloads branch
        shell: bash
        run: |
          set -euo pipefail
          cd publisher
          git switch --orphan mx-public-builder-downloads
          git rm -rf . || true
          git clean -fdx
          mkdir -p apks
          found=0
          while IFS= read -r apk; do
            base="$(basename "$apk")"
            case "$base" in
              *arm64-v8a*) target="MX-Manga-arm64-v8a-preview.apk" ;;
              *armeabi-v7a*) target="MX-Manga-armeabi-v7a-preview.apk" ;;
              *) continue ;;
            esac
            found=1
            cp "$apk" "apks/$target"
          done < <(find ../source/app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]
          cat > README.md <<EOF
          # MX漫画 Private Preview

          当前 Preview 包含评论图片渲染与书评已加载数量显示修复。

          - ARM64：\`apks/MX-Manga-arm64-v8a-preview.apk\`
          - 32 位 ARM：\`apks/MX-Manga-armeabi-v7a-preview.apk\`
          - 私有源码提交：\`$SOURCE_SHA\`
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apks
          git commit -m "Publish MX漫画 rich-comments Preview ${SOURCE_SHA:0:7}"
          git push --force origin HEAD:downloads

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
