name: MX Rich Comments Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/mx-app-rich-comments-preview-trigger"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" && -n "$MX_APP_SIGNING_BUNDLE" && -n "$MX_APP_PUBLISH_TOKEN" ]]
      - name: Checkout isolated Stage 2
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: 600b8788e8b30ab8d7defede66b65fd018d7a77a
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Record source revision
        working-directory: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" == "600b8788e8b30ab8d7defede66b65fd018d7a77a" ]]
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source
      - name: Prepare stable signing key
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          b=json.loads(os.environ['MX_APP_SIGNING_BUNDLE'])
          p=Path(os.environ['RUNNER_TEMP'])/'mx-app.jks'; p.write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
            for k,v in {'MX_KEYSTORE_PATH':str(p),'MX_KEY_ALIAS':b['alias'],'MX_KEYSTORE_PASSWORD':b['storePassword'],'MX_KEY_PASSWORD':b['storePassword']}.items():
              print(f'::add-mask::{v}'); f.write(f'{k}<<EOF\n{v}\nEOF\n')
          PY
      - name: Verify stable signing identity
        run: |
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
      - name: Spotless
        working-directory: source
        run: ./gradlew spotlessCheck
      - name: Build signed Preview APK
        working-directory: source
        run: |
          ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"
      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest
      - name: Normalize and verify APK signing certificate
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          found=0
          while IFS= read -r apk; do
            found=1; out="${apk%.apk}.signed.apk"
            "$signer" sign --ks "$MX_KEYSTORE_PATH" --ks-key-alias "$MX_KEY_ALIAS" --ks-pass env:MX_KEYSTORE_PASSWORD --key-pass env:MX_KEY_PASSWORD --out "$out" "$apk"; mv "$out" "$apk"
            badging="$("$aapt" dump badging "$apk")"
            [[ "$badging" == *"package: name='com.huoguotiankong.mx.beta'"* ]]
            cert="$("$signer" verify --print-certs "$apk" 2>&1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$cert" == *"$expected"* ]]
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]
      - name: Checkout private publication target
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: publisher
          fetch-depth: 1
      - name: Publish Stage 2 APKs
        run: |
          set -euo pipefail
          cd publisher; git switch --orphan mx-stage2-downloads; git rm -rf . || true; git clean -fdx; mkdir -p apks
          found=0
          while IFS= read -r apk; do
            case "$(basename "$apk")" in *arm64-v8a*) t=MX-Manga-arm64-v8a-preview.apk;; *armeabi-v7a*) t=MX-Manga-armeabi-v7a-preview.apk;; *) continue;; esac
            found=1; cp "$apk" "apks/$t"
          done < <(find ../source/app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]
          printf '# MX漫画 Stage 2 Preview\n\n- ARM64：`apks/MX-Manga-arm64-v8a-preview.apk`\n- 源码：`%s`\n- Stage 1 + 评论富媒体增强；未合入 E-Hentai 最终增强。\n' "$SOURCE_SHA" > README.md
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md apks; git commit -m "Publish MX Stage2 ${SOURCE_SHA:0:7}"; git push --force origin HEAD:downloads
      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
