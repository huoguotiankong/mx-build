name: Probe Miaoqu public API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/probe-miaoqu-api.yml
      - probes/miaoqu/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe current chapter payload
        shell: bash
        run: |
          python3 - <<'PY'
          import ssl, urllib.request

          ctx = ssl._create_unverified_context()
          headers = {"User-Agent": "MangaApp/1.0", "Accept": "application/json"}
          url = "https://apitong.zqykfz.cn/miaoqu46/13/13959/info.json"
          print("CHAPTER_URL", url)
          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                  raw = r.read(500000)
                  text = raw.decode("utf-8", "replace")
                  print("CHAPTER_STATUS", r.status)
                  print("CHAPTER_TYPE", r.headers.get("content-type"))
                  print("CHAPTER_BYTES", len(raw))
                  print("CHAPTER_BODY_BEGIN")
                  print(text)
                  print("CHAPTER_BODY_END")
          except Exception as e:
              print("CHAPTER_ERROR", type(e).__name__, str(e))
          PY
