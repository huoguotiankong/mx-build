name: Build Dongman Manhua Plus v1 Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-dongmanmanhuaplus-v1-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          test -n "$MX_PRIVATE_READ_TOKEN"
          test -n "$MANGA_SIGNING_BUNDLE"

      - name: Checkout helper
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: main
          path: helper
          fetch-depth: 0

      - name: Checkout development source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare module and icons
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/dongmanmanhuaplus
          cp -a dev/src/zh/dongmanmanhuaplus upstream/src/zh/dongmanmanhuaplus
          target='upstream/src/zh/dongmanmanhuaplus/res'
          rm -rf "$target"/mipmap-*
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="upstream/src/zh/dongmanmanhua/res/mipmap-$density"
            dst="$target/mipmap-$density"
            mkdir -p "$dst"
            icon="$(find "$src" -maxdepth 1 -type f -name 'ic_launcher.*' | head -n1)"
            test -n "$icon"
            cp "$icon" "$dst/$(basename "$icon")"
          done

      - name: Normalize preference UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt')
          s=p.read_text('utf-8')
          s=s.replace('EditTextPreference(screen.context, null).apply {','EditTextPreference(screen.context).apply {')
          s=s.replace('Preference(screen.context).apply {\n            key = LOGIN_ACTION_PREF','EditTextPreference(screen.context).apply {\n            key = LOGIN_ACTION_PREF')
          info='''\n        Preference(screen.context).apply {\n            title = "付费章节正文替换"\n            summary = "已启用 MX 章节替换入口。官方账号已解锁/已购买章节优先读取咚漫官方内容；未解锁章节可由 MX 选择其它已安装且可访问的漫画源替换，不绕过源站付费限制。"\n            isSelectable = false\n        }.also(screen::addPreference)\n'''
          s=s.replace(info,'\n')
          s=s.replace('import androidx.preference.Preference\n','')
          p.write_text(s,'utf-8')
          PY
          file='upstream/src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt'
          test "$(grep -Fc 'EditTextPreference(screen.context).apply {' "$file")" -ge 3
          ! grep -Fq 'Preference(screen.context)' "$file"
          nl -ba "$file" | sed -n '100,155p'
          python3 dev/scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format
        working-directory: upstream
        run: |
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessApply
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessCheck

      - name: Prepare signing
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
            for e,k in [('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')]:
              v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF\n{v}\nEOF\n')
          PY

      - name: Build Debug Release and lint
        working-directory: upstream
        run: ./gradlew :src:zh:dongmanmanhuaplus:assembleDebug :src:zh:dongmanmanhuaplus:assembleRelease :src:zh:dongmanmanhuaplus:lintRelease

      - name: Verify release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          actual="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"
          apk="$(find upstream/src/zh/dongmanmanhuaplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          rm -rf /tmp/dex && mkdir /tmp/dex
          unzip -qq "$apk" 'classes*.dex' -d /tmp/dex
          strings /tmp/dex/classes*.dex > /tmp/dex.txt
          for abi in CommentSource CommentTarget AccountSource ChapterContentReplacementSource; do grep -Fq "eu/kanade/tachiyomi/source/mx/$abi" /tmp/dex.txt; done
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do find "upstream/src/zh/dongmanmanhuaplus/res/mipmap-$density" -name 'ic_launcher.*' | grep -q .; done

      - name: Save validated handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff='helper/.github/handoff/dongmanmanhuaplus-v1'
          rm -rf "$handoff"
          mkdir -p "$handoff"
          cp -a upstream/src/zh/dongmanmanhuaplus "$handoff/module"
          rm -rf "$handoff/module/build"
          cp dev/docs/sources/dongmanmanhuaplus.md "$handoff/dongmanmanhuaplus.md"
          printf '%s\n' '1.6.1 / source 1 / Android 106001' 'Spotless Debug Release Lint signed and MX ABI verified' > "$handoff/VALIDATED.txt"
          git -C helper config user.name 'github-actions[bot]'
          git -C helper config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C helper add .github/handoff/dongmanmanhuaplus-v1
          if ! git -C helper diff --cached --quiet; then
            git -C helper commit -m 'handoff: validated Dongman Manhua Plus v1'
            git -C helper pull --rebase origin main
            git -C helper push origin HEAD:main
          fi

      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 0

      - name: Generate test store
        env:
          SIGNING_FINGERPRINT: ${{ steps.verify.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/dongmanmanhuaplus
          cp -a upstream/src/zh/dongmanmanhuaplus dev/src/zh/dongmanmanhuaplus
          rm -rf dev/src/zh/dongmanmanhuaplus/build
          printf '%s\n' 'zh/dongmanmanhuaplus' > targets.txt
          python3 dev/scripts/publish_test_repo.py --targets targets.txt --upstream-root upstream --source-root dev --repo-dir staging/test --owner huoguotiankong --repository mx-repo --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/apk/tachiyomi-zh.dongmanmanhuaplus-v1.6.1.apk
          grep -q 'eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus' staging/test/index.json
          git -C staging config user.name 'github-actions[bot]'
          git -C staging config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C staging add test
          if ! git -C staging diff --cached --quiet; then git -C staging commit -m 'Stage Dongman Manhua Plus v1.6.1 test store'; git -C staging push origin HEAD:extension-staging; fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dongmanmanhuaplus-v1-signed-apk
          path: upstream/src/zh/dongmanmanhuaplus/**/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -f upstream/signingkey.jks
