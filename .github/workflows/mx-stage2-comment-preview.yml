name: MX Stage2 Comment Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-stage2-comment-preview.yml"
      - ".github/mx-stage2-comment-preview-trigger"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]
          [[ -n "$MX_APP_SIGNING_BUNDLE" ]]
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]]

      - name: Checkout Stage 2 source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: 600b8788e8b30ab8d7defede66b65fd018d7a77a
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Record source revision
        working-directory: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" == "600b8788e8b30ab8d7defede66b65fd018d7a77a" ]]
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Prepare stable signing key
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle=json.loads(os.environ['MX_APP_SIGNING_BUNDLE'])
          for key in ('signingKey','alias','storePassword'):
              if not bundle.get(key): raise SystemExit(f'Missing {key}')
          path=Path(os.environ['RUNNER_TEMP'])/'mx-app.jks'
          path.write_bytes(base64.b64decode(bundle['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for name,value in {
                  'MX_KEYSTORE_PATH':str(path), 'MX_KEY_ALIAS':str(bundle['alias']),
                  'MX_KEYSTORE_PASSWORD':str(bundle['storePassword']), 'MX_KEY_PASSWORD':str(bundle['storePassword'])
              }.items():
                  print(f'::add-mask::{value}')
                  f.write(f'{name}<<__EOF__\n{value}\n__EOF__\n')
          PY

      - name: Verify stable signing identity
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]

      - name: Spotless
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Build signed Preview APK
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Normalize Preview APK signing certificate
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            signed="${apk%.apk}.mx-signed.apk"
            "$apksigner" sign --ks "$MX_KEYSTORE_PATH" --ks-key-alias "$MX_KEY_ALIAS" --ks-pass env:MX_KEYSTORE_PASSWORD --key-pass env:MX_KEY_PASSWORD --out "$signed" "$apk"
            mv "$signed" "$apk"
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]

      - name: Verify APK identity and signing certificate
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            badging="$("$aapt_bin" dump badging "$apk")"
            [[ "$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)" == "com.huoguotiankong.mx.beta" ]]
            [[ "$(printf '%s\n' "$badging" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n1)" == "MX漫画" ]]
            normalized="$("$apksigner" verify --print-certs "$apk" 2>&1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$normalized" == *"$expected"* ]]
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]

      - name: Checkout private APK publication target
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: publisher
          fetch-depth: 1

      - name: Publish Stage 2 APKs to private downloads branch
        run: |
          set -euo pipefail
          cd publisher
          git switch --orphan mx-stage2-downloads
          git rm -rf . || true
          git clean -fdx
          mkdir -p apks
          found=0
          while IFS= read -r apk; do
            base="$(basename "$apk")"
            case "$base" in
              *arm64-v8a*) target="MX-Manga-arm64-v8a-preview.apk" ;;
              *armeabi-v7a*) target="MX-Manga-armeabi-v7a-preview.apk" ;;
              *) continue ;;
            esac
            found=1
            cp "$apk" "apks/$target"
          done < <(find ../source/app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]
          printf '# MX漫画 Stage 2 Preview\n\n- ARM64：`apks/MX-Manga-arm64-v8a-preview.apk`\n- 32 位 ARM：`apks/MX-Manga-armeabi-v7a-preview.apk`\n- 私有源码提交：`%s`\n- 阶段：Stage 1 + 评论富媒体增强；未合入 E-Hentai 最终增强。\n' "$SOURCE_SHA" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apks
          git commit -m "Publish MX漫画 Stage 2 Preview ${SOURCE_SHA:0:7}"
          git push --force origin HEAD:downloads

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
