name: Publish verified MX 1.14.10 Tencent reader fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-tencent-reader-theme-v11410-publish-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-app-tencent-reader-theme-v11410-publish-v2
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }
          [[ -n "$MX_APP_SIGNING_BUNDLE" ]] || { echo "::error::Missing MX_APP_SIGNING_BUNDLE"; exit 1; }
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || { echo "::error::Missing MX_APP_PUBLISH_TOKEN"; exit 1; }

      - name: Checkout verified MX source commit
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: 25b6b8e8ea1aac8aa01f891668b16e172176e210
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and fixes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          expected="25b6b8e8ea1aac8aa01f891668b16e172176e210"
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || { echo "::error::Unexpected MX source commit $actual"; exit 1; }
          echo "SOURCE_SHA=$actual" >> "$GITHUB_ENV"
          grep -F 'versionCode = 90' app/build.gradle.kts
          grep -F 'versionName = "1.14.10"' app/build.gradle.kts
          grep -F '"acimg.cn"' app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt
          grep -F '(?=/|[?#]|$)' app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt
          grep -F 'tencent transformed acimg urls become rich images' app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt
          grep -F 'seedColor = null' app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          ! grep -Fq 'seedColor = seedColorState().takeIf { themeCoverBased }' app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderActivity.kt
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify formatting
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Prepare stable signing key
        shell: bash
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ['MX_APP_SIGNING_BUNDLE'])
          required = ('signingKey', 'alias', 'storePassword')
          missing = [key for key in required if not bundle.get(key)]
          if missing:
              raise SystemExit(f"Signing bundle missing fields: {', '.join(missing)}")
          path = Path(os.environ['RUNNER_TEMP']) / 'mx-app.jks'
          path.write_bytes(base64.b64decode(bundle['signingKey']))
          store_password = str(bundle['storePassword'])
          values = {
              'MX_KEYSTORE_PATH': str(path),
              'MX_KEY_ALIAS': str(bundle['alias']),
              'MX_KEYSTORE_PASSWORD': store_password,
              'MX_KEY_PASSWORD': store_password,
          }
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for name, value in values.items():
                  print(f'::add-mask::{value}')
                  f.write(f'{name}<<__MX_EOF__\n{value}\n__MX_EOF__\n')
          PY

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::MX signing certificate mismatch"; exit 1; }

      - name: Verify private key password
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/mx-private-key-probe.p12"
          rm -f "$probe"
          keytool -importkeystore \
            -srckeystore "$MX_KEYSTORE_PATH" \
            -srcstorepass "$MX_KEYSTORE_PASSWORD" \
            -srcalias "$MX_KEY_ALIAS" \
            -srckeypass "$MX_KEY_PASSWORD" \
            -destkeystore "$probe" \
            -deststoretype PKCS12 \
            -deststorepass "$MX_KEYSTORE_PASSWORD" \
            -destkeypass "$MX_KEYSTORE_PASSWORD" \
            -noprompt >/dev/null
          rm -f "$probe"
          echo "Private signing key password verified"

      - name: Build signed Preview APKs
        id: preview_build
        working-directory: source
        shell: bash
        timeout-minutes: 30
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/mx-preview-build.log"
          summary="$RUNNER_TEMP/mx-preview-build-summary.txt"
          rm -f "$log" "$summary"

          set +e
          ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD" \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -ne 0 ]]; then
            python3 - "$log" "$summary" <<'PY'
          import re
          import sys
          from pathlib import Path

          log_path = Path(sys.argv[1])
          summary_path = Path(sys.argv[2])
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          useful = [
              line for line in lines
              if "malformed kotlin.Metadata" not in line
          ]
          pattern = re.compile(
              r"(?:FAILURE:|What went wrong:|Execution failed|Task .* FAILED|^e: |error:|AAPT|R8|OutOfMemory|KeytoolException|Failed to read key|Get Key failed|Caused by:)",
              re.IGNORECASE,
          )
          hits = [line for line in useful if pattern.search(line)]
          tail = useful[-60:]
          merged = []
          seen = set()
          for line in hits[-60:] + tail:
              if line not in seen:
                  seen.add(line)
                  merged.append(line)
          if not merged:
              merged = ["Preview build failed but no diagnostic lines were captured."]
          summary_path.write_text("\n".join(merged[-120:]) + "\n", encoding="utf-8")
          PY

            {
              echo "### MX Preview build failed"
              echo
              echo '```text'
              tail -n 60 "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Preview APK build failed. Compact diagnostics saved as mx-preview-build-summary artifact."
            exit "$status"
          fi

      - name: Upload compact Preview build diagnostics
        if: ${{ failure() && steps.preview_build.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: mx-preview-build-summary
          path: ${{ runner.temp }}/mx-preview-build-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: Normalize and verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          expected_cert="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          [[ -n "$aapt_bin" && -n "$apksigner" ]] || { echo "::error::Android verification tools missing"; exit 1; }
          found=0
          while IFS= read -r apk; do
            found=1
            signed="${apk%.apk}.mx-signed.apk"
            "$apksigner" sign \
              --ks "$MX_KEYSTORE_PATH" \
              --ks-key-alias "$MX_KEY_ALIAS" \
              --ks-pass env:MX_KEYSTORE_PASSWORD \
              --key-pass env:MX_KEY_PASSWORD \
              --out "$signed" \
              "$apk"
            mv "$signed" "$apk"
            badging="$("$aapt_bin" dump badging "$apk")"
            [[ "$badging" == *"name='com.huoguotiankong.mx.beta'"* ]] || { echo "::error::Unexpected package for $apk"; exit 1; }
            [[ "$badging" == *"versionCode='90'"* ]] || { echo "::error::Unexpected versionCode for $apk"; exit 1; }
            [[ "$badging" == *"versionName='1.14.10-"* ]] || { echo "::error::Unexpected versionName for $apk"; exit 1; }
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$normalized" == *"$expected_cert"* ]] || { echo "::error::APK signing certificate mismatch for $apk"; exit 1; }
          done < <(find source/app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]] || { echo "::error::No Preview APK found"; exit 1; }

      - name: Checkout APK publication target
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: publisher
          fetch-depth: 1
          persist-credentials: true

      - name: Publish MX 1.14.10 test APKs
        shell: bash
        run: |
          set -euo pipefail
          cd publisher
          git switch --orphan mx-v11410-tencent-reader-downloads-v2
          git rm -rf . || true
          git clean -fdx
          mkdir -p apks
          found_arm64=0
          while IFS= read -r apk; do
            case "$(basename "$apk")" in
              *arm64-v8a*)
                found_arm64=1
                cp "$apk" apks/MX-Manga-arm64-v8a-preview.apk
                cp "$apk" apks/MX-Manga-arm64-v1.14.10-tencent-reader-preview.apk
                ;;
              *armeabi-v7a*)
                cp "$apk" apks/MX-Manga-armeabi-v7a-preview.apk
                cp "$apk" apks/MX-Manga-armeabi-v1.14.10-tencent-reader-preview.apk
                ;;
            esac
          done < <(find ../source/app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | sort)
          [[ "$found_arm64" -eq 1 ]] || { echo "::error::No ARM64 Preview APK found"; exit 1; }
          cat > README.md <<EOF
          # MX漫画 1.14.10 Tencent / Reader Theme Test

          - 版本：1.14.10 / versionCode 90
          - ARM64：\`apks/MX-Manga-arm64-v1.14.10-tencent-reader-preview.apk\`
          - 固定地址：\`apks/MX-Manga-arm64-v8a-preview.apk\`
          - 源码：\`$SOURCE_SHA\`
          - 腾讯评论：识别 \`.jpg/0?tp=sharp\` 等转换图片地址。
          - 阅读器主题：工具栏、章节列表、章节切换与加载界面跟随应用全局主题，不再继承漫画封面黄色调色板。
          - 构建验证：Spotless、Release 单元测试、Preview 构建、包名/versionCode、固定签名均由 CI 校验。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apks
          git commit -m "Publish MX漫画 1.14.10 Tencent reader fix ${SOURCE_SHA:0:7}"
          git push --force origin HEAD:downloads

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mx-app.jks" "$RUNNER_TEMP/mx-private-key-probe.p12"
