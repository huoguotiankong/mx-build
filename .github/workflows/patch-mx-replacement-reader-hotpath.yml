name: Patch MX replacement reader hot path

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-mx-replacement-reader-hotpath.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-mx-replacement-reader-hotpath
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check private source write token
        env:
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || { echo "::error::Missing MX_APP_PUBLISH_TOKEN"; exit 1; }

      - name: Checkout replacement cache branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/replacement-reader-latency-cache
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Fix Kotlin import order
        shell: bash
        run: |
          set -euo pipefail
          cd source
          expected_base="73e300a34d71cb15790be395382ecda15e448943"
          actual_base="$(git rev-parse HEAD)"
          [[ "$actual_base" == "$expected_base" ]] || {
            echo "::error::cache branch moved; expected $expected_base but found $actual_base"
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt')
          text = path.read_text(encoding='utf-8')
          old = '''import eu.kanade.tachiyomi.ui.reader.ChapterContentReplacementCodec\nimport eu.kanade.tachiyomi.ui.reader.ChapterContentCatalogCache\n'''
          new = '''import eu.kanade.tachiyomi.ui.reader.ChapterContentCatalogCache\nimport eu.kanade.tachiyomi.ui.reader.ChapterContentReplacementCodec\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one unsorted import pair, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          [[ "$(git diff --name-only)" == "app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt" ]] || {
            echo "::error::Unexpected files changed"
            git diff --name-only
            exit 1
          }

      - name: Commit format fix
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt
          git diff --cached --check
          git commit -m 'style: sort replacement cache import'
          git push origin HEAD:fix/replacement-reader-latency-cache
