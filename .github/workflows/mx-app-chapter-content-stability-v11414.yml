name: Verify MX 1.14.14 chapter replacement reliability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-chapter-content-stability-v11414.yml"
      - "scripts/patch_mx_chapter_content_reliability_v11414.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-app-chapter-content-reliability-v11414
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check required private/build secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }
          [[ -n "$MX_APP_SIGNING_BUNDLE" ]] || { echo "::error::Missing MX_APP_SIGNING_BUNDLE"; exit 1; }

      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: main
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout serial-roadmap maintenance branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/chapter-content-safe-whole-manga
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded chapter replacement reliability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/scripts/patch_mx_chapter_content_reliability_v11414.py source
          git -C source diff --check
          grep -F 'versionCode = 94' source/app/build.gradle.kts
          grep -F 'versionName = "1.14.14"' source/app/build.gradle.kts
          grep -F 'keeping last verified markers' source/app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt
          grep -F 'markChapterContentWholeMangaMatch' source/app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt
          grep -F 'AUTO_MANGA_MATCH_THRESHOLD' source/app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReplacementMangaMatcher.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply formatting
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Create local verified-source candidate commit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReplacementMangaMatcher.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/reader/setting/ReaderPreferences.kt \
            app/src/test/java/eu/kanade/tachiyomi/ui/reader/ReplacementMangaMatcherTest.kt \
            docs/CHAPTER_CONTENT.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::No chapter replacement reliability changes to commit"
            exit 1
          fi
          git commit -m "fix: stabilize replacement markers and edition matching"
          echo "MX_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify clean formatted source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew spotlessCheck
          git diff --exit-code

      - name: Run chapter replacement regression tests
        working-directory: source
        run: |
          ./gradlew :app:testReleaseUnitTest \
            --tests 'eu.kanade.tachiyomi.ui.reader.ChapterContentMatcherTest' \
            --tests 'eu.kanade.tachiyomi.ui.reader.ReplacementMangaMatcherTest'

      - name: Run full Release unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Prepare stable signing key
        shell: bash
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ["MX_APP_SIGNING_BUNDLE"])
          required = ("signingKey", "alias", "storePassword")
          missing = [key for key in required if not bundle.get(key)]
          if missing:
              raise SystemExit(f"Signing bundle missing fields: {', '.join(missing)}")
          path = Path(os.environ["RUNNER_TEMP"]) / "mx-app.jks"
          path.write_bytes(base64.b64decode(bundle["signingKey"]))
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as f:
              for name, value in {
                  "MX_KEYSTORE_PATH": str(path),
                  "MX_KEY_ALIAS": str(bundle["alias"]),
                  "MX_KEYSTORE_PASSWORD": str(bundle["storePassword"]),
                  "MX_KEY_PASSWORD": str(bundle["storePassword"]),
              }.items():
                  print(f"::add-mask::{value}")
                  f.write(f"{name}<<__MX_EOF__\n{value}\n__MX_EOF__\n")
          PY

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::MX signing certificate mismatch"; exit 1; }

      - name: Build signed Preview APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assemblePreview \
            -Pdisable-code-shrink \
            --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"

      - name: Normalize and verify APK identity signing and version
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          expected_cert="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            signed="${apk%.apk}.mx-signed.apk"
            "$apksigner" sign \
              --ks "$MX_KEYSTORE_PATH" \
              --ks-key-alias "$MX_KEY_ALIAS" \
              --ks-pass env:MX_KEYSTORE_PASSWORD \
              --key-pass env:MX_KEY_PASSWORD \
              --out "$signed" "$apk"
            mv "$signed" "$apk"
            badging="$("$aapt_bin" dump badging "$apk")"
            package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
            version_name="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
            app_label="$(printf '%s\n' "$badging" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1)"
            [[ "$package_name" == "com.huoguotiankong.mx.beta" ]]
            [[ "$app_label" == "MX漫画" ]]
            [[ "$version_code" == "94" ]]
            [[ "$version_name" == 1.14.14-* ]]
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$normalized" == *"$expected_cert"* ]]
          done < <(find app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]

      - name: Upload device-test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mx-1.14.14-v94-chapter-replacement-reliability
          path: source/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Push verified source commit to maintenance branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/chapter-content-safe-whole-manga

      - name: Report verified source
        working-directory: source
        shell: bash
        run: |
          {
            echo "### MX 1.14.14 / versionCode 94"
            echo ""
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- Branch: fix/chapter-content-safe-whole-manga"
            echo "- Marker snapshot stability: patched"
            echo "- Reader-success marker authority: patched"
            echo "- Relaxed edition matching: patched"
            echo "- Spotless: passed"
            echo "- Focused replacement tests: passed"
            echo "- Full Release unit tests: passed"
            echo "- Signed Preview APK: passed"
            echo "- APK identity/version/certificate: passed"
            echo "- Real-device validation: still required before merge"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
