name: Probe MengXiGe reload source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mengxige-reload-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          path: helper
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Probe catalog and reload payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,re,subprocess,time,urllib.request
          from pathlib import Path
          src=Path('source/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt').read_text('utf-8')
          def c(n):
              m=re.search(rf'private const val {n} = "([^"]*)"',src)
              if not m: raise SystemExit('missing '+n)
              return m.group(1)
          package,secret,version,channel,app_id=[c(x) for x in ('APP_PACKAGE','APP_SECRET','APP_VERSION','APP_CHANNEL','APP_ID')]
          def headers():
              now=str(int(time.time())); sign=hashlib.md5((package+'1'+now+secret).encode()).hexdigest()
              return {'User-Agent':'OPPO_R821T/1.0 Linux/3.4.5 Android/4.2.2 Release/03.26.2013 Browser/AppleWebKit534.30 Mobile Safari/534.30 MBBMS/2.2 System/Android 4.2.2_'+package,'Accept':'*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Referer':'https://book.folongteng.com/','pt':'1','version':version,'channel':channel,'uuid':'probe-00000000-0000-0000-0000-000000000006','xf-appid':app_id,'fc-session-id':'','package':package,'time':now,'stamp':'','sign':sign}
          def decode(raw):
              try: root=json.loads(raw)
              except Exception: return raw
              data=root.get('data') if isinstance(root,dict) else None
              if not isinstance(data,dict) or str(data.get('ver'))!='1' or not data.get('content'): return raw
              b=base64.b64decode(data['content'])
              if len(b)<32:return raw
              head,tail=b[:16],b[-16:]; key=hashlib.sha256(head).digest(); md5hex=hashlib.md5(tail).hexdigest().encode('ascii'); iv=bytes((~(md5hex[i]^tail[i]))&255 for i in range(16))
              p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex()],input=b[16:-16],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              return p.stdout.decode('utf-8','replace') if p.returncode==0 else raw
          def get_json(url):
              req=urllib.request.Request(url,headers=headers())
              with urllib.request.urlopen(req,timeout=25) as r:
                  body=decode(r.read().decode('utf-8','replace'))
                  try:return {'status':r.status,'json':json.loads(body)}
                  except Exception:return {'status':r.status,'bodyPrefix':body[:8000]}
          result={}
          for bid in ('5002663','5003998'):
              floor=int(bid)//1000
              detail=get_json(f'https://book.folongteng.com/comics/details/v4/{floor}/{bid}.html')
              item={'detail':detail}
              obj=detail.get('json') if isinstance(detail,dict) else None
              d=obj if isinstance(obj,dict) else {}
              paths=[]
              for key in ('list_path','list_reload_path'):
                  val=d.get(key)
                  if isinstance(val,str) and val:
                      paths.append((key,val))
              item['paths']={}
              for key,path in paths:
                  url='https://c-catalog.folongteng.com/'+path.lstrip('/')
                  try:item['paths'][key]={'url':url,**get_json(url)}
                  except Exception as e:item['paths'][key]={'url':url,'error':type(e).__name__+': '+str(e)}
              result[bid]=item
          p=Path('helper/probe-results/mengxige-reload-source.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps(result,ensure_ascii=False)[:30000])
          PY
      - name: Commit result
        working-directory: helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/mengxige-reload-source.json
          if ! git diff --cached --quiet; then
            git commit -m 'probe: record MengXiGe reload source payload'
            git push origin HEAD:main
          fi
