name: Prepare CopyManga Plus v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-copymangaplus-v2.yml"
      - ".github/scripts/patch_copymangaplus_v2.py"
      - ".github/scripts/refine_copymangaplus_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5
        with:
          path: buildrepo
          persist-credentials: false

      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Patch CopyManga Plus v2
        run: |
          python3 buildrepo/.github/scripts/patch_copymangaplus_v2.py
          python3 buildrepo/.github/scripts/refine_copymangaplus_v2.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay patched module
        run: |
          rm -rf upstream/src/zh/copymangaplus
          cp -a source/src/zh/copymangaplus upstream/src/zh/copymangaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format patched source
        working-directory: upstream
        run: ./gradlew :src:zh:copymangaplus:spotlessApply

      - name: Sync formatted module back
        run: |
          rm -rf source/src/zh/copymangaplus
          cp -a upstream/src/zh/copymangaplus source/src/zh/copymangaplus

      - name: Validate v2
        working-directory: upstream
        run: ./gradlew :src:zh:copymangaplus:spotlessCheck :src:zh:copymangaplus:assembleDebug :src:zh:copymangaplus:lintRelease

      - name: Upload patched v2 module
        uses: actions/upload-artifact@v4
        with:
          name: copymangaplus-v2-module
          path: source/src/zh/copymangaplus
          if-no-files-found: error
          retention-days: 7
