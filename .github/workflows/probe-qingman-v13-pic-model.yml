name: Resolve Qingman v13 Pic Model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-v13-pic-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev python3-pyelftools python3-capstone >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Resolve pic model and request options
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))['data']['datas']['android']
          if (str(a.get('version','')),str(a.get('versionCode',''))) != ('4.4.5','445'): raise SystemExit('official version changed')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/out /tmp/x && mkdir -p /tmp/app-lib /tmp/out /tmp/x
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/x
          cp /tmp/x/lib/arm64-v8a/libapp.so /tmp/app-lib/ && cp /tmp/x/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter && python3 blutter.py /tmp/app-lib /tmp/out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          deny=re.compile(r'(?i)(password|authorization|bearer|cookie|clientp12|privatekey|certificate|keystore|qm_auth_token)')
          print('=== Dvb MODEL SOURCE ===')
          for p in Path('/tmp/out/asm').glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if 'class Dvb ' in line or 'class Dvb extends' in line:
                      for x in lines[max(0,i-10):min(len(lines),i+180)]: print('<redacted>' if deny.search(x) else x[:700])
          pp={}
          for line in Path('/tmp/out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)',line)
              if m and not deny.search(line): pp[int(m.group(1),16)]=m.group(2)
          with open('/tmp/x/lib/arm64-v8a/libapp.so','rb') as f:
              e=ELFFile(f); s=e.get_section_by_name('.text'); base=int(s['sh_addr']); data=s.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          def dump(start,end,title):
              print(f'\n=== {title} 0x{start:x}-0x{end:x} ===')
              regs={}
              for ins in md.disasm(data[start-base:end-base],start):
                  regs={r:(v,n-1) for r,(v,n) in regs.items() if n>1}
                  op=ins.op_str.lower(); ann=[]
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if ins.mnemonic=='add' and m: regs[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),64)
                  if ins.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          b=m.group(2); d=int(m.group(3),0) if m.group(3) else 0
                          off=d if b=='x27' else (regs[b][0]+d if b in regs else None)
                          if off in pp: ann.append(f'PP+0x{off:x}={pp[off]}')
                  if ann or ins.mnemonic in ('bl','blr','ret'):
                      text=f'0x{ins.address:x}: {ins.mnemonic:<6} {ins.op_str:<52}'
                      if ann: text += ' ; ' + ' | '.join(ann)
                      print(text[:1000])
          dump(0x462368,0x462f9c,'Dvb parser candidate')
          dump(0xacc6f0,0xacc860,'cache refreshed pic extraction')
          dump(0xaccd40,0xacd140,'official image request build')
          PY
