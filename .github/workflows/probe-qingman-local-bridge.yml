name: Inspect Qingman Local Bridge Markers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-local-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Inspect local server and IPC strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          keys=('127.0.0.1','localhost','0.0.0.0','HttpServer','ServerSocket','bind(','loopback','MethodChannel','EventChannel','BasicMessageChannel','content://','fileprovider','provider','intent://','broadcast','startService','bindService','socket')
          print('=== LOCAL_BRIDGE_MARKERS ===')
          out=[]
          for line in lines:
              low=line.lower()
              if any(k.lower() in low for k in keys):
                  if re.search(r'(?i)(clientp12|privatekey|certificate|password|secret|token)',line): continue
                  t=re.sub(r'[A-Za-z0-9_-]{80,}','<opaque>',line)
                  out.append(t[:650])
          seen=set()
          for x in out:
              if x in seen: continue
              seen.add(x); print(x)
              if len(seen)>=400: break
          print('marker_count='+str(len(seen)))
          PY
