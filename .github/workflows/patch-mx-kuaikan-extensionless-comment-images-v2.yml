name: Patch MX Kuaikan extensionless comment images v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-mx-kuaikan-extensionless-comment-images-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-mx-kuaikan-extensionless-comment-images-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check private source write token
        env:
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || { echo "::error::Missing MX_APP_PUBLISH_TOKEN"; exit 1; }

      - name: Checkout validated MX App checkpoint
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/kuaikan-extensionless-comment-images-v2
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded Kuaikan CDN image detection patch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          expected_base="a46c8830ce4d7a8609fc1df7f33f9173970b3339"
          actual_base="$(git rev-parse HEAD)"
          [[ "$actual_base" == "$expected_base" ]] || {
            echo "::error::target branch moved; expected $expected_base but found $actual_base"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt')
          test_path = Path('app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt')

          src = source_path.read_text(encoding='utf-8')
          old_function = '''private fun isCommentImageUrl(url: String): Boolean {
              val normalized = url.lowercase()
              return COMMENT_IMAGE_FILE_REGEX.containsMatchIn(normalized) ||
                  normalized.startsWith("https://cc-image.kkmh.com/comment/image/") ||
                  COMMENT_V3MH_SOCIAL_IMAGE_REGEX.containsMatchIn(normalized)
          }
          '''
          new_function = '''private fun isCommentImageUrl(url: String): Boolean {
              val normalized = url.lowercase()
              return COMMENT_IMAGE_FILE_REGEX.containsMatchIn(normalized) ||
                  normalized.startsWith("https://cc-image.kkmh.com/comment/image/") ||
                  COMMENT_V3MH_SOCIAL_IMAGE_REGEX.containsMatchIn(normalized) ||
                  COMMENT_V3MH_TNCACHE_IMAGE_REGEX.containsMatchIn(normalized)
          }
          '''
          if src.count(old_function) != 1:
              raise SystemExit(f'comment image detector anchor mismatch: {src.count(old_function)}')
          src = src.replace(old_function, new_function, 1)

          old_regex = 'private val COMMENT_V3MH_SOCIAL_IMAGE_REGEX = Regex("^https?://[^/]*\\\\.v3mh\\\\.com/social/", RegexOption.IGNORE_CASE)\n'
          new_regex = old_regex + '''private val COMMENT_V3MH_TNCACHE_IMAGE_REGEX =
              Regex("^https?://tncache[^/]*\\\\.v3mh\\\\.com/[^?#\\\\s]+(?:[?#].*)?$", RegexOption.IGNORE_CASE)
          '''
          if src.count(old_regex) != 1:
              raise SystemExit(f'v3mh social regex anchor mismatch: {src.count(old_regex)}')
          source_path.write_text(src.replace(old_regex, new_regex, 1), encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          anchor = '''    @Test
              fun `normal links stay as comment text`() {
          '''
          addition = '''    @Test
              fun `kuaikan tncache urls without extension become rich images`() {
                  val urls = listOf(
                      "https://tncache1-f1.v3mh.com/FsZV2ww4LTAj38JinwnZ2hQQ2oBB",
                      "https://tncache1-f1.v3mh.com/963dae9010dfdde8bc1815556f39fd3e1646900621150",
                      "https://tncache1-f1.v3mh.com/Fm_GlxdU1T3FaqD_Unc9xjUN1klj",
                      "https://tncache1-f1.v3mh.com/82b0a13c55c35605d5e270c296b3d4e31646900552667",
                  )
                  val result = parseCommentRichContent("历史图片\\n" + urls.joinToString("\\n"))
                  assertEquals("历史图片", result.text)
                  assertEquals(urls, result.imageUrls)
              }

              @Test
              fun `unrelated opaque urls stay as comment text`() {
                  val url = "https://example.com/963dae9010dfdde8bc1815556f39fd3e1646900621150"
                  val result = parseCommentRichContent("普通链接 $url")
                  assertEquals("普通链接 $url", result.text)
                  assertEquals(emptyList<String>(), result.imageUrls)
              }

          '''
          if test.count(anchor) != 1:
              raise SystemExit(f'comment parser test anchor mismatch: {test.count(anchor)}')
          test_path.write_text(test.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt\napp/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt'
          [[ "$changed" == "$expected" ]] || {
            echo "::error::Unexpected changed files: $changed"
            exit 1
          }
          grep -Fq 'COMMENT_V3MH_TNCACHE_IMAGE_REGEX' app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt
          grep -Fq 'FsZV2ww4LTAj38JinwnZ2hQQ2oBB' app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt
          grep -Fq 'unrelated opaque urls stay as comment text' app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt

      - name: Commit Kuaikan image recognition fix
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt \
            app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt
          git diff --cached --check
          git commit -m 'fix: recognize Kuaikan extensionless comment images'
          git push origin HEAD:fix/kuaikan-extensionless-comment-images-v2
