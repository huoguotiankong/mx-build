name: Probe MengXiGe d source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mengxige-source-d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: helper
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve config and fetch official source list
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,re,subprocess,time,urllib.parse,urllib.request
          from pathlib import Path
          src=Path('source/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt').read_text('utf-8')
          def c(n):
              m=re.search(rf'private const val {n} = "([^"]*)"',src)
              if not m: raise SystemExit('missing '+n)
              return m.group(1)
          package,secret,version,channel,app_id=[c(x) for x in ('APP_PACKAGE','APP_SECRET','APP_VERSION','APP_CHANNEL','APP_ID')]
          def headers():
              now=str(int(time.time())); sign=hashlib.md5((package+'1'+now+secret).encode()).hexdigest()
              return {'User-Agent':'OPPO_R821T/1.0 Linux/3.4.5 Android/4.2.2 Release/03.26.2013 Browser/AppleWebKit534.30 Mobile Safari/534.30 MBBMS/2.2 System/Android 4.2.2_'+package,'Accept':'*/*','Referer':'https://book.folongteng.com/','pt':'1','version':version,'channel':channel,'uuid':'probe-00000000-0000-0000-0000-000000000004','xf-appid':app_id,'fc-session-id':'','package':package,'time':now,'stamp':'','sign':sign}
          def decode(raw):
              try: root=json.loads(raw)
              except Exception: return raw
              data=root.get('data') if isinstance(root,dict) else None
              if not isinstance(data,dict) or str(data.get('ver'))!='1' or not data.get('content'): return raw
              b=base64.b64decode(data['content'])
              if len(b)<32:return raw
              head,tail=b[:16],b[-16:]; key=hashlib.sha256(head).digest(); md5hex=hashlib.md5(tail).hexdigest().encode('ascii'); iv=bytes((~(md5hex[i]^tail[i]))&255 for i in range(16)); p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex()],input=b[16:-16],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              return p.stdout.decode('utf-8','replace') if p.returncode==0 else raw
          def get(url):
              req=urllib.request.Request(url,headers=headers())
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,decode(r.read().decode('utf-8','replace'))
          result={'configAttempts':{},'sourceAttempts':{}}
          config_obj=None
          for suffix in ('folongteng.com','xiangxung.com'):
              for q in ('', '?t='+str(int(time.time()))):
                  url=f'https://conf.{suffix}/v4/android/{package}/{channel}{q}'
                  key=suffix+q
                  try:
                      st,body=get(url); obj=json.loads(body); result['configAttempts'][key]={'url':url,'status':st,'json':obj}; config_obj=obj; break
                  except Exception as e: result['configAttempts'][key]={'url':url,'error':type(e).__name__+': '+str(e)}
              if config_obj is not None: break
          def find_secondary(x):
              if isinstance(x,dict):
                  if 'secondary_domain' in x and isinstance(x['secondary_domain'],dict): return x['secondary_domain']
                  if 'secondaryDomain' in x and isinstance(x['secondaryDomain'],dict): return x['secondaryDomain']
                  for v in x.values():
                      r=find_secondary(v)
                      if r:return r
              elif isinstance(x,list):
                  for v in x:
                      r=find_secondary(v)
                      if r:return r
              return None
          secondary=find_secondary(config_obj) if config_obj is not None else None
          result['secondaryDomain']=secondary
          candidates=[]
          if isinstance(secondary,dict) and secondary.get('d'):
              candidates.append(str(secondary['d']).rstrip('/'))
          for suffix in ('folongteng.com','xiangxung.com'):
              candidates.append('https://d.'+suffix)
          for base in dict.fromkeys(candidates):
              url=base+'/book/source/v4/5002/5002663.html'
              try:
                  st,body=get(url); obj=json.loads(body); result['sourceAttempts'][base]={'url':url,'status':st,'json':obj}
              except Exception as e: result['sourceAttempts'][base]={'url':url,'error':type(e).__name__+': '+str(e)}
          p=Path('helper/probe-results/mengxige-source-d.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps(result,ensure_ascii=False)[:20000])
          PY
      - name: Commit result
        working-directory: helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/mengxige-source-d.json
          if ! git diff --cached --quiet; then git commit -m 'probe: record MengXiGe resolved d source'; git push origin HEAD:main; fi
