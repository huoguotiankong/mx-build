name: Probe MengXiGe d source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mengxige-source-d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: helper
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch source list from official d domain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,re,subprocess,time,urllib.request
          from pathlib import Path
          src=Path('source/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt').read_text('utf-8')
          def c(n):
              m=re.search(rf'private const val {n} = "([^"]*)"',src)
              return m.group(1)
          package,secret,version,channel,app_id=[c(x) for x in ('APP_PACKAGE','APP_SECRET','APP_VERSION','APP_CHANNEL','APP_ID')]
          now=str(int(time.time())); sign=hashlib.md5((package+'1'+now+secret).encode()).hexdigest()
          h={'User-Agent':'OPPO_R821T/1.0 Linux/3.4.5 Android/4.2.2 Release/03.26.2013 Browser/AppleWebKit534.30 Mobile Safari/534.30 MBBMS/2.2 System/Android 4.2.2_'+package,'Accept':'*/*','Referer':'https://book.folongteng.com/','pt':'1','version':version,'channel':channel,'uuid':'probe-00000000-0000-0000-0000-000000000003','xf-appid':app_id,'fc-session-id':'','package':package,'time':now,'stamp':'','sign':sign}
          url='https://d.folongteng.com/book/source/v4/5002/5002663.html'
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=20) as r:
              raw=r.read().decode('utf-8','replace'); status=r.status
          try: root=json.loads(raw)
          except Exception: root=None
          data=root.get('data') if isinstance(root,dict) else None
          body=raw
          if isinstance(data,dict) and str(data.get('ver'))=='1' and data.get('content'):
              b=base64.b64decode(data['content']); head,tail=b[:16],b[-16:]; key=hashlib.sha256(head).digest(); md5hex=hashlib.md5(tail).hexdigest().encode('ascii'); iv=bytes((~(md5hex[i]^tail[i]))&255 for i in range(16)); p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex()],input=b[16:-16],stdout=subprocess.PIPE,stderr=subprocess.PIPE); body=p.stdout.decode('utf-8','replace') if p.returncode==0 else raw
          obj=json.loads(body)
          out={'url':url,'status':status,'json':obj}
          p=Path('helper/probe-results/mengxige-source-d.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n','utf-8')
          print(json.dumps(out,ensure_ascii=False)[:16000])
          PY
      - name: Commit result
        working-directory: helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/mengxige-source-d.json
          if ! git diff --cached --quiet; then git commit -m 'probe: record MengXiGe d source response'; git push origin HEAD:main; fi
