name: Probe Miaowu v1.6.5 Web Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-web-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Confirm web host and reader codec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          BASE='https://mh.iqtao.cn'
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  b=r.read(); print('GET',url,'status',r.status,'len',len(b)); return b
          for path in ['/custom/top','/custom/ticket','/category','/170.html']:
              get(BASE+path)
          html=get(BASE+'/170/1095305.html').decode('utf-8','replace')
          m=re.search(r'<img[^>]+(?:src|data-src|alt)=["\']((?://)?img\d*\.iqtao\.cn/(?:hp|scomic)/[^"\']+)["\']',html,re.I)
          if not m: raise SystemExit('NO_READER_IMAGE_URL')
          u=m.group(1); u='https:'+u if u.startswith('//') else u
          raw=get(u)
          dec=bytes((((x-47)&255)^0xAB) for x in raw)
          def magic(b):
              return b.startswith(b'\xff\xd8\xff') or b.startswith(b'\x89PNG') or b.startswith(b'GIF8') or (len(b)>=12 and b[:4]==b'RIFF' and b[8:12]==b'WEBP')
          print('IMAGE',u,'raw',raw[:16].hex(),'decoded',dec[:16].hex(),'rawMagic',magic(raw),'decodedMagic',magic(dec))
          if not magic(raw) and not magic(dec): raise SystemExit('IMAGE_CODEC_UNCONFIRMED')
          print('MIAOWU_WEB_V5_CODEC_OK')
          PY
