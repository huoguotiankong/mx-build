name: Persist Qingman Cache Detail Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-cache-detail-result.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev python3-pyelftools python3-capstone >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Resolve cache helper model, arguments, serializer and URL refresh path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))['data']['datas']['android']
          if (str(a.get('version','')),str(a.get('versionCode',''))) != ('4.4.5','445'):
              raise SystemExit('official version changed')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/out /tmp/x
          mkdir -p /tmp/app-lib /tmp/out /tmp/x
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/x
          cp /tmp/x/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/x/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter && python3 blutter.py /tmp/app-lib /tmp/out >/tmp/blutter.log 2>&1
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY' > .github/qingman-cache-detail-result.txt
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re,bisect

          # Never persist credential values. We only keep structure, field/header names and code flow.
          secret_value=re.compile(r'(?i)(bearer\s+[A-Za-z0-9._~+/=-]{8,}|password\s*[:=]\s*[^,}\s]+|cookie\s*[:=]\s*[^,}\s]+|appaccesstoken\s*[:=]\s*[^,}\s]+)')
          dangerous_name=re.compile(r'(?i)(clientp12|privatekey|keystore|storepassword|keypassword|bootstrapproof|bootstrapdecrypt)')
          safe_markers=(
              'cache/detail','comicId','chapterId','type','deviceId','pageUrls','pageUrl','picList',
              'imageUrl','image_url','resourceUrl','signature_url','signedUrl','downloadUrl','download_url',
              'referer','freeLine','line','x-custom-timestamp','x-custom-signature','X-Signature',
              'Authorization','qm_auth_token','Get chapter cache detail failed','QxComicCacheImageProvider',
              'Get Signature exception','Timestamp not set','X-Signature not set'
          )

          def safe_text(s, limit=500):
              s=secret_value.sub('<redacted>',s)
              if dangerous_name.search(s):
                  return '<redacted-sensitive-structure>'
              return s[:limit]

          pp={}
          for line in Path('/tmp/out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          syms={}
          for line in Path('/tmp/out/ida_script/addNames.py').read_text('utf-8',errors='replace').splitlines():
              m=re.search(r'set_name\((0x[0-9a-fA-F]+|\d+),\s*[ru]?([\'\"])(.*?)\2',line)
              if m:
                  try: syms[int(m.group(1),0)]=m.group(3)
                  except: pass

          funcs=[]
          asm_files=list(Path('/tmp/out/asm').rglob('*.dart'))
          for p in asm_files:
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  m=re.search(r'\*\* addr: 0x([0-9a-fA-F]+), size: 0x([0-9a-fA-F]+)',s)
                  if not m: continue
                  st=int(m.group(1),16); sz=int(m.group(2),16); decl=''
                  for j in range(i-1,max(-1,i-10),-1):
                      t=lines[j].strip()
                      if t and not t.startswith('//'):
                          decl=t
                          break
                  funcs.append((st,st+sz,p,decl))
          funcs.sort(key=lambda x:x[0]); starts=[x[0] for x in funcs]

          def owner(addr):
              k=bisect.bisect_right(starts,addr)-1
              return funcs[k] if k>=0 and funcs[k][0]<=addr<funcs[k][1] else None

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); blob=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True

          def annotate(ins,pending):
              anns=[]
              op=ins.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),48)
              if ins.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if m:
                      br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                      off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                      if off in pp:
                          anns.append('PP='+safe_text(pp[off],260))
              if ins.mnemonic=='bl' and ins.op_str.startswith('#'):
                  try: target=int(ins.op_str[1:],0)
                  except: target=None
                  if target is not None:
                      anns.append('CALL='+safe_text(syms.get(target,f'0x{target:x}'),220))
              return anns

          def dump(start,end,label,max_lines=500):
              print(f'\n===== {label} 0x{start:x}-0x{end:x} =====')
              pending={}; count=0
              for ins in md.disasm(blob[start-base:end-base],start):
                  pending={r:(o,n-1) for r,(o,n) in pending.items() if n>1}
                  anns=annotate(ins,pending)
                  text=f'0x{ins.address:x}: {ins.mnemonic:<7} {ins.op_str:<48}'
                  if anns: text+=' ; '+' | '.join(anns)
                  print(safe_text(text,950)); count+=1
                  if count>=max_lines:
                      print('[truncated-range]')
                      break

          print('Qingman 4.4.5 cache/detail deep contract probe')
          print('\n===== TARGET OWNERS / SYMBOLS =====')
          targets=[
              0xacc358,0xacc3e0,0xacc934,0x3ea090,0x45b890,0x464410,0x4643b4,
              0xaa1538,0xaa0250,0x461990,0xacb36c,0xacbcec,0xaccef0
          ]
          for t in targets:
              f=owner(t)
              desc=f'{f[2].name} :: {f[3]}' if f else '<unmapped>'
              print(f'0x{t:x}: symbol={safe_text(syms.get(t,"<unnamed>"),220)} owner={safe_text(desc,500)}')

          print('\n===== MODEL-NAME SYMBOLS (stb / oub) =====')
          model_hits=[]
          for addr,name in sorted(syms.items()):
              low=name.lower()
              if re.search(r'(^|[^a-z0-9])(stb|oub)([^a-z0-9]|$)',low) or '<stb' in low or '<oub' in low:
                  model_hits.append((addr,name))
          for addr,name in model_hits[:160]:
              print(f'0x{addr:x}: {safe_text(name,500)}')
          if not model_hits: print('<no direct symbol-name hits>')

          print('\n===== MODEL/CONTRACT TEXT CONTEXT =====')
          context_patterns=[
              re.compile(r'\bstb\b',re.I), re.compile(r'\boub\b',re.I),
              re.compile(r'cache/detail',re.I), re.compile(r'QxComicCacheImageProvider',re.I),
              re.compile(r'signature_url',re.I), re.compile(r'pageUrls?',re.I)
          ]
          emitted=0
          for p in asm_files:
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if not any(r.search(line) for r in context_patterns): continue
                  print(f'--- {p.name}:{i+1} ---')
                  for s in lines[max(0,i-5):min(len(lines),i+11)]:
                      print(safe_text(s,800))
                  emitted+=1
                  if emitted>=100: break
              if emitted>=100: break
          if emitted==0: print('<no asm context hits>')

          print('\n===== SAFE PP CONTRACT MARKERS =====')
          for off,val in sorted(pp.items()):
              if dangerous_name.search(val): continue
              if any(k.lower() in val.lower() for k in safe_markers):
                  print(f'PP+0x{off:x}: {safe_text(val,650)}')

          # Wider caller range maps where x1/x2/x3/x5 originate before cache/detail.
          dump(0xacc180,0xacc3e0,'token refresh + cache/detail caller',650)
          dump(0xacc934,0xaccb38,'cache/detail request helper',420)
          dump(0xacc3e0,0xacc880,'cache/detail response extractor',420)

          # These calls populate the freshly allocated stb request object. Dump their actual owners when known.
          print('\n===== REQUEST MODEL CONSTRUCTOR / FIELD WRITERS =====')
          for t in (0x3ea090,0x45b890,0x464410,0x4643b4):
              f=owner(t)
              if f:
                  st,en,fp,decl=f
                  print(f'\n--- target 0x{t:x}: {safe_text(fp.name+" :: "+decl,600)} ---')
                  dump(st,min(en,st+0x280),f'owner for 0x{t:x}',260)
              else:
                  dump(max(base,t-0x40),t+0x180,f'raw around 0x{t:x}',180)

          print('\n===== REQUEST TRANSPORT / SERIALIZER CALLS =====')
          for t in (0xaa1538,0xaa0250):
              f=owner(t)
              if f:
                  st,en,fp,decl=f
                  print(f'\n--- target 0x{t:x}: {safe_text(fp.name+" :: "+decl,600)} ---')
                  dump(st,min(en,st+0x340),f'owner for 0x{t:x}',320)
              else:
                  dump(max(base,t-0x40),t+0x260,f'raw around 0x{t:x}',260)

          # The official reader's post-cache/detail branch appears to replace/refresh image URLs here.
          dump(0xaccef0,0xacd400,'post-cache/detail URL replacement path',650)

          print('\n===== DIRECT CALLERS OF cache/detail HELPER =====')
          callers=[]
          for ins in md.disasm(blob,base):
              if ins.mnemonic=='bl' and ins.op_str.startswith('#'):
                  try: target=int(ins.op_str[1:],0)
                  except: continue
                  if target==0xacc934:
                      callers.append(ins.address)
          for c in callers:
              f=owner(c)
              print(f'caller=0x{c:x} owner='+(safe_text(f'{f[2].name} :: {f[3]}',500) if f else '<unmapped>'))
              dump(max(base,c-0x100),c+0x60,f'caller context 0x{c:x}',140)
          if not callers: print('<no direct BL callers found>')
          PY
      - name: Persist sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/qingman-cache-detail-result.txt
          if git diff --cached --quiet; then
            echo 'No probe result change'
            exit 0
          fi
          git commit -m 'chore(qingman): record deeper cache detail contract'
          git push
