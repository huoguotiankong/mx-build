name: Dump Qingman API Guard Request Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-guard-xref-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download current official AOT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          print('OFFICIAL_VERSION_CODE='+str(a.get('versionCode','')),file=sys.stderr)
          if (str(a.get('version','')),str(a.get('versionCode',''))) != ('4.4.5','445'):
              raise SystemExit('unexpected official version')
          PY
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 240 "$(cat /tmp/url)" -o /tmp/qm.apk
          unzip -p /tmp/qm.apk lib/arm64-v8a/libapp.so >/tmp/libapp.so
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null

      - name: Dump focused AOT windows
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'guard:0xaa0a80:0xaa1250' \
            'signinit:0xaa18a0:0xaa1f40' \
            'baseheaders:0xaacf80:0xaad200' \
            'readerroute:0xa8cce0:0xa8d020' \
            'readerfactory:0x7e2600:0x7e2a80'; do
            IFS=: read -r name start stop <<<"$spec"
            echo "=== $name $start $stop ==="
            aarch64-linux-gnu-objdump -d --start-address="$start" --stop-address="$stop" /tmp/libapp.so \
              | sed -n '1,700p'
          done
