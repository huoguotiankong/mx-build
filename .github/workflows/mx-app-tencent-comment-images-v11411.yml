name: Patch MX 1.14.11 Tencent comment images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-tencent-comment-images-v11411.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-app-tencent-comment-images-v11411
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check required secret
        shell: bash
        env:
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || { echo "::error::Missing MX_APP_PUBLISH_TOKEN"; exit 1; }

      - name: Checkout MX feature branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/tencent-comment-reader-theme-20260906
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Verify expected base
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          expected="25b6b8e8ea1aac8aa01f891668b16e172176e210"
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$expected" ]] || { echo "::error::Feature branch moved: $actual"; exit 1; }
          branch="$(git branch --show-current)"
          [[ "$branch" == "fix/tencent-comment-reader-theme-20260906" ]] || { echo "::error::Unexpected branch $branch"; exit 1; }

      - name: Patch Tencent comment image loading
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          screen = Path("app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt")
          text = screen.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "import androidx.compose.ui.layout.ContentScale\n",
              "import androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.platform.LocalContext\n",
              "LocalContext import",
          )
          replace_once(
              "import coil3.compose.AsyncImage\n",
              "import coil3.compose.AsyncImage\nimport coil3.network.NetworkHeaders\nimport coil3.network.httpHeaders\nimport coil3.request.ImageRequest\n",
              "Coil network imports",
          )

          old_render = '''                richContent.imageUrls.forEach { imageUrl ->
                    var imageLoadFailed by remember(imageUrl) { mutableStateOf(false) }
                    if (imageLoadFailed) {
                        Text(
                            text = imageUrl,
                            style = MaterialTheme.typography.bodySmall,
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                        )
                    } else {
                        AsyncImage(
                            model = imageUrl,
                            contentDescription = null,
                            modifier = Modifier
                                .fillMaxWidth()
                                .clip(MaterialTheme.shapes.medium),
                            contentScale = ContentScale.FillWidth,
                            onError = { imageLoadFailed = true },
                        )
                    }
                }
'''
          new_render = '''                richContent.imageUrls.forEach { imageUrl ->
                    CommentRichImage(imageUrl)
                }
'''
          replace_once(old_render, new_render, "comment image rendering block")

          marker = '''@Composable
private fun voteIconTint(selected: Boolean, enabled: Boolean) = when {
'''
          helper = '''@Composable
private fun CommentRichImage(imageUrl: String) {
    val context = LocalContext.current
    val candidates = remember(imageUrl) { commentImageLoadCandidates(imageUrl) }
    var candidateIndex by remember(imageUrl) { mutableStateOf(0) }
    val candidate = candidates.getOrNull(candidateIndex)

    if (candidate == null) {
        Text(
            text = imageUrl,
            style = MaterialTheme.typography.bodySmall,
            color = MaterialTheme.colorScheme.onSurfaceVariant,
        )
        return
    }

    val request = remember(context, candidate) {
        ImageRequest.Builder(context)
            .data(candidate)
            .apply {
                val headers = commentImageRequestHeaders(candidate)
                if (headers.isNotEmpty()) {
                    httpHeaders(
                        NetworkHeaders.Builder()
                            .apply {
                                headers.forEach { (name, value) -> set(name, value) }
                            }
                            .build(),
                    )
                }
            }
            .build()
    }

    AsyncImage(
        model = request,
        contentDescription = null,
        modifier = Modifier
            .fillMaxWidth()
            .clip(MaterialTheme.shapes.medium),
        contentScale = ContentScale.FillWidth,
        onError = { candidateIndex += 1 },
    )
}

@Composable
private fun voteIconTint(selected: Boolean, enabled: Boolean) = when {
'''
          replace_once(marker, helper, "CommentRichImage helper insertion")

          marker = '''private fun isCommentImageUrl(url: String): Boolean {
'''
          helpers = '''internal fun commentImageLoadCandidates(imageUrl: String): List<String> {
    val normalizedUrl = normalizeCommentUrl(imageUrl)
    val candidates = linkedSetOf(normalizedUrl)
    val uri = runCatching { URI(normalizedUrl) }.getOrNull() ?: return candidates.toList()
    val host = uri.host?.lowercase()?.trimEnd('.') ?: return candidates.toList()

    if (host == "acimg.cn" || host.endsWith(".acimg.cn")) {
        COMMENT_TENCENT_TRANSFORMED_IMAGE_REGEX.matchEntire(normalizedUrl)
            ?.groupValues
            ?.getOrNull(1)
            ?.takeIf(String::isNotBlank)
            ?.let(candidates::add)
    }

    return candidates.toList()
}

internal fun commentImageRequestHeaders(imageUrl: String): Map<String, String> {
    val normalizedUrl = normalizeCommentUrl(imageUrl)
    val uri = runCatching { URI(normalizedUrl) }.getOrNull() ?: return emptyMap()
    val host = uri.host?.lowercase()?.trimEnd('.') ?: return emptyMap()
    if (host != "acimg.cn" && !host.endsWith(".acimg.cn")) return emptyMap()

    return linkedMapOf(
        "Referer" to "https://ac.qq.com/",
        "User-Agent" to COMMENT_TENCENT_IMAGE_USER_AGENT,
    )
}

private fun isCommentImageUrl(url: String): Boolean {
'''
          replace_once(marker, helpers, "Tencent image helpers insertion")

          marker = '''private val COMMENT_ALWAYS_IMAGE_HOST_SUFFIXES = setOf(
'''
          regex = '''private val COMMENT_TENCENT_TRANSFORMED_IMAGE_REGEX = Regex(
    "^(https?://[^?#]+\\.(?:jpe?g|jfif|png|webp|gif|avif))/\\d+(?:\\?[^#]*)?(?:#.*)?$",
    RegexOption.IGNORE_CASE,
)
private const val COMMENT_TENCENT_IMAGE_USER_AGENT =
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36"

private val COMMENT_ALWAYS_IMAGE_HOST_SUFFIXES = setOf(
'''
          replace_once(marker, regex, "Tencent transformed URL regex insertion")

          screen.write_text(text, encoding="utf-8")

          tests = Path("app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt")
          test_text = tests.read_text(encoding="utf-8")
          marker = '''    @Test
    fun `known image cdn urls without extensions become rich images`() {
'''
          added = '''    @Test
    fun `tencent transformed acimg urls get canonical retry candidates`() {
        val cases = listOf(
            "https://manhua.acimg.cn/manhua/0/05_16_49_f1ebabbb7cddf4f34cb4805f1e02b306.jpg/0?tp=sharp" to
                "https://manhua.acimg.cn/manhua/0/05_16_49_f1ebabbb7cddf4f34cb4805f1e02b306.jpg",
            "https://manhua.acimg.cn/manhua/0/15_09_39_13170f3f334f7e005496d9311df42127.jpg/0?tp=sharp" to
                "https://manhua.acimg.cn/manhua/0/15_09_39_13170f3f334f7e005496d9311df42127.jpg",
        )

        cases.forEach { (transformed, canonical) ->
            assertEquals(listOf(transformed, canonical), commentImageLoadCandidates(transformed))
        }
    }

    @Test
    fun `tencent acimg image requests get browser referer headers`() {
        val headers = commentImageRequestHeaders(
            "https://manhua.acimg.cn/manhua/0/05_16_49_f1ebabbb7cddf4f34cb4805f1e02b306.jpg/0?tp=sharp",
        )
        assertEquals("https://ac.qq.com/", headers["Referer"])
        assertEquals(true, headers["User-Agent"]?.startsWith("Mozilla/5.0"))
    }

    @Test
    fun `non tencent comment images keep one candidate and no special headers`() {
        val url = "https://i0.hdslb.com/bfs/new_dyn/0123456789abcdef0123456789abcdef"
        assertEquals(listOf(url), commentImageLoadCandidates(url))
        assertEquals(emptyMap<String, String>(), commentImageRequestHeaders(url))
    }

    @Test
    fun `known image cdn urls without extensions become rich images`() {
'''
          count = test_text.count(marker)
          if count != 1:
              raise SystemExit(f"test insertion: expected 1 match, found {count}")
          tests.write_text(test_text.replace(marker, added, 1), encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          gradle_text = gradle.read_text(encoding="utf-8")
          if gradle_text.count('versionCode = 90') != 1 or gradle_text.count('versionName = "1.14.10"') != 1:
              raise SystemExit("unexpected MX version baseline")
          gradle_text = gradle_text.replace('versionCode = 90', 'versionCode = 91', 1)
          gradle_text = gradle_text.replace('versionName = "1.14.10"', 'versionName = "1.14.11"', 1)
          gradle.write_text(gradle_text, encoding="utf-8")

          docs = Path("docs/COMMENTS.md")
          docs_text = docs.read_text(encoding="utf-8")
          anchor = "This is a host-side rendering fix; it does not require changing the Tencent extension's comment API or attachment extraction."
          addition = '''This is a host-side rendering fix; it does not require changing the Tencent extension's comment API or attachment extraction.

Android device feedback on MX 1.14.10 confirmed a second failure mode: transformed `manhua.acimg.cn` attachments were recognized as media, but Coil could still fail the actual network/decode request and therefore fall back to showing the original URL. MX 1.14.11 adds Tencent-specific image request headers (`Referer: https://ac.qq.com/` plus the same browser-style User-Agent used by the extension) and, only after a transformed URL fails, retries the canonical image filename without the trailing `/0?tp=sharp` transform. The original URL remains the final readable fallback only if both image candidates fail. Regression tests cover the two exact transformed URL shapes reported from Android hardware.
'''
          if docs_text.count(anchor) != 1:
              raise SystemExit("docs anchor not found exactly once")
          docs.write_text(docs_text.replace(anchor, addition, 1), encoding="utf-8")
          PY

          git diff --check
          grep -F 'versionCode = 91' app/build.gradle.kts
          grep -F 'versionName = "1.14.11"' app/build.gradle.kts
          grep -F 'commentImageLoadCandidates' app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt
          grep -F 'Referer" to "https://ac.qq.com/' app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt
          grep -F '05_16_49_f1ebabbb7cddf4f34cb4805f1e02b306.jpg/0?tp=sharp' app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt
          grep -F '15_09_39_13170f3f334f7e005496d9311df42127.jpg/0?tp=sharp' app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply formatting
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Verify formatting
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Run release unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Build Debug APK
        working-directory: source
        run: ./gradlew assembleDebug -Pdisable-code-shrink --no-configuration-cache

      - name: Commit verified patch to feature branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt \
            app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt \
            docs/COMMENTS.md
          git commit -m "fix: retry Tencent comment images with CDN headers"
          git push origin HEAD:fix/tencent-comment-reader-theme-20260906
