name: Resolve Qingman Legacy Mirror Download Endpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-legacy-resolve-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect mirror download scripts and redirects
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/qmresolve
          urls=(
            'https://www.uzzf.com/static/js/download.js'
            'https://www.hackhome.com/inc/download.js'
            'https://img1.lcks.com.cn/resources/pc/js/download.js'
            'https://m.uzzf.com/u/801633'
            'https://www.lcks.com.cn/down/4462/2/1/'
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1)); f="/tmp/qmresolve/$i.body"; h="/tmp/qmresolve/$i.hdr"
            meta=$(curl -L --compressed -A 'Mozilla/5.0 (Linux; Android 16)' --connect-timeout 10 --max-time 30 -sS -D "$h" -o "$f" -w '%{http_code} %{url_effective} %{content_type} %{size_download}' "$u" 2>/tmp/qmerr || true)
            echo "FETCH[$i] $meta source=$u"
            echo "HEADERS[$i]"
            grep -Ei '^(HTTP/|location:|content-type:|content-disposition:|content-length:)' "$h" | tail -30 || true
          done

          echo '=== JS_DOWNLOAD_LOGIC ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          for i in (1,2,3):
              p=Path(f'/tmp/qmresolve/{i}.body')
              s=p.read_text('utf-8',errors='replace') if p.exists() else ''
              print(f'FILE={i} bytes={len(s)}')
              for line in s.splitlines():
                  if re.search(r'(?i)(ajax|url|address|softlink|softid|download|downurl|typeid|api|location|href)',line):
                      print(line[:1200])
          PY

          echo '=== ENDPOINT_PAGE_HINTS ==='
          python3 - <<'PY'
          from pathlib import Path
          import re,html
          for i in (4,5):
              p=Path(f'/tmp/qmresolve/{i}.body')
              b=p.read_bytes() if p.exists() else b''
              print(f'FILE={i} bytes={len(b)} zip={b[:4]==b"PK\\x03\\x04"}')
              if b[:4]==b'PK\x03\x04': continue
              s=b.decode('utf-8','replace')
              vals=[]
              for pat in [r'''(?:href|src|data-url|data-href|data-download|value)\s*=\s*["']([^"']+)["']''',r'''https?://[^\s"'<>]+''']:
                  for m in re.finditer(pat,s,re.I):
                      v=m.group(1) if m.lastindex else m.group(0)
                      v=html.unescape(v).strip()
                      if v not in vals: vals.append(v)
              for v in vals:
                  if any(k in v.lower() for k in ('.apk','download','down','qingman','pctvke','801633','4462')):
                      print('CAND '+v[:1000])
          PY
