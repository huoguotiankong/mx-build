name: Export MX Extension Staged Test Store

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-extension-staging-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout staged test store
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staged
          fetch-depth: 1
          persist-credentials: false

      - name: Verify CopyManga Plus staged payload
        shell: bash
        run: |
          set -euo pipefail
          test -f staged/test/index.json
          test -f staged/test/repo.json
          test -f staged/test/apk/tachiyomi-zh.copymangaplus-v1.6.1.apk
          test -f staged/test/icon/eu.kanade.tachiyomi.extension.zh.copymangaplus-v106001.png

      - name: Upload staged test store
        uses: actions/upload-artifact@v4
        with:
          name: mx-extension-staged-test-store
          path: staged/test
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
