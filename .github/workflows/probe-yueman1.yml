name: Probe Yueman1 Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-yueman1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect list item markup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          UA='Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36'
          for url, needle in [
            ('http://m.yueman1.cc/manhua/o/m_waprecent.html','47956.html'),
            ('http://m.yueman1.cc/manhua/o/m_waphit.html','4966.html'),
            ('http://m.yueman1.cc/mmm/1/','13071.html'),
          ]:
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'http://m.yueman1.cc/','Accept-Language':'zh-CN,zh;q=0.9'})
              with urllib.request.urlopen(req,timeout=12) as r:
                  b=r.read(500000)
                  try:t=b.decode('gb18030')
                  except:t=b.decode('utf-8','ignore')
              i=t.find(needle)
              print('\nURL',url,'INDEX',i)
              print(t[max(0,i-1200):i+1600].replace('\r','').replace('\n',' '))
              # Print likely pagination anchors near page tail.
              anchors=[]
              for h,x in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',t,re.I|re.S):
                  plain=re.sub(r'<[^>]+>',' ',x); plain=re.sub(r'\s+',' ',plain).strip()
                  if any(k in plain for k in ('下一','下页','末页','尾页')): anchors.append((h,plain))
              print('NEXT',anchors[:20])
          PY
