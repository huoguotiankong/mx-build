name: Probe Yueman1 Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-yueman1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Capture Manga Daquan official logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, urllib.request
          url='http://www.yueman1.cc/template/skin4_20110501/images/logo_wap.gif'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36','Referer':'http://m.yueman1.cc/'})
          with urllib.request.urlopen(req,timeout=15) as r:
              data=r.read()
              print('STATUS',r.status,'TYPE',r.headers.get('Content-Type'),'BYTES',len(data),'FINAL',r.geturl())
              print('LOGO_B64='+base64.b64encode(data).decode())
          PY
