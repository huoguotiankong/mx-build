name: Probe Yueman1 Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-yueman1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve mobile APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.error
          UA='Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36'
          def get(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'http://m.yueman1.cc/','Accept-Language':'zh-CN,zh;q=0.9'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      b=r.read(900000)
                      try:t=b.decode('gb18030')
                      except:t=b.decode('utf-8','ignore')
                      print('\nURL',url,'STATUS',r.status,'FINAL',r.geturl(),'BYTES',len(b))
                      print(t[:12000].replace('\r',''))
              except urllib.error.HTTPError as e:
                  print('\nHTTP',url,e.code,e.read(1000))
              except Exception as e: print('\nERR',url,repr(e))
          urls=[
            'http://www.yueman1.cc/template/skin4_20110501/images/m/html/?a=3&key=%u6597%u7F57%u5927%u9646',
            'http://www.yueman1.cc/template/skin4_20110501/images/m/js/m_classify.js',
            'http://m.yueman1.cc/mmm/1/',
            'http://m.yueman1.cc/mmm/9/',
            'http://m.yueman1.cc/manhua/47956.html',
          ]
          for u in urls:get(u)
          PY
