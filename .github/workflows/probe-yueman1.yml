name: Probe Yueman1 Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-yueman1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect categories and mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          from html import unescape
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'
          def load(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      b=r.read(700000); ct=r.headers.get('content-type','').lower(); enc='gb18030' if ('gb' in ct or 'yueman1' in url) else 'utf-8'
                      try:t=b.decode(enc)
                      except:t=b.decode('gb18030','ignore')
                      print('\nURL',url,'status',r.status,'final',r.geturl(),'title',re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)[:1])
                      anchors=[]
                      for h,txt in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',t,re.I|re.S):
                          plain=unescape(re.sub(r'<[^>]+>',' ',txt)); plain=re.sub(r'\s+',' ',plain).strip()
                          if plain: anchors.append((h,plain))
                      print('MMM',[(h,x) for h,x in anchors if '/mmm/' in h][:30])
                      print('ORDER',[(h,x) for h,x in anchors if '/manhua/o/' in h][:30])
                      print('MANHUA',[(h,x) for h,x in anchors if re.fullmatch(r'/manhua/\d+\.html',h)][:25])
                      print('ALL LINKS',anchors[:80])
              except Exception as e: print('ERR',url,repr(e))
          for u in ['http://www.yueman1.cc/','http://reman.cc/','https://m.gugu5.com/','https://www.gugu5.com/','http://m.yueman.cc/','http://www.yueman.cc/','http://m.yueman1.cc/']:
              load(u)
          PY
