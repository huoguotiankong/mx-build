name: Probe Yueman1 Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-yueman1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify Manga Daquan reader path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, re, urllib.request
          from html import unescape
          UA='Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36'
          BASE='http://m.yueman1.cc'
          def load(url, ref=None, limit=900000):
              headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9'}
              if ref: headers['Referer']=ref
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                  data=r.read(limit)
                  print('HTTP',r.status,url,'=>',r.geturl(),'bytes',len(data),'type',r.headers.get('content-type'))
                  return data
          def text(data):
              try:return data.decode('gb18030')
              except:return data.decode('utf-8','ignore')

          latest=text(load(BASE+'/manhua/o/m_waprecent.html',BASE+'/'))
          manga=re.search(r'<a[^>]+href=["\'](http://m\.yueman1\.cc/manhua/\d+\.html)["\'][^>]*class=["\']title["\'][^>]*>(.*?)</a>',latest,re.I|re.S)
          assert manga, 'latest manga link not found'
          manga_url=manga.group(1)
          manga_title=unescape(re.sub(r'<[^>]+>','',manga.group(2))).strip()
          print('LATEST',manga_title,manga_url)

          detail=text(load(manga_url,BASE+'/'))
          marker='initIntroData('
          start=detail.find('[', detail.find(marker)+len(marker))
          assert start >= 0, 'chapter JSON start not found'
          depth=0; quote=None; esc=False; end=-1
          for i,ch in enumerate(detail[start:],start):
              if quote:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch==quote: quote=None
                  continue
              if ch in "'\"": quote=ch
              elif ch=='[': depth+=1
              elif ch==']':
                  depth-=1
                  if depth==0: end=i+1; break
          assert end > start, 'chapter JSON end not found'
          block=detail[start:end]
          chapters=re.findall(r'"chapter_name"\s*:\s*"([^"]+)".*?"h"\s*:\s*"([^"]+/p/\d+/\d+\.html)"',block,re.S)
          assert chapters, 'chapters not found'
          print('CHAPTER_COUNT',len(chapters),'FIRST',chapters[0],'LAST',chapters[-1])

          chapter_url=chapters[0][1]
          chapter=text(load(chapter_url,manga_url))
          values=re.findall(r'qTcms_S_m_murl_e(?:2|3)?\s*=\s*["\']([^"\']*)["\']',chapter,re.I)
          encoded=next((v.strip() for v in values if v.strip()),None)
          assert encoded, 'reader payload missing'
          decoded=base64.b64decode(encoded).decode('utf-8','ignore')
          images=[u.strip() for u in decoded.split('$qingtiandy$') if u.strip()]
          assert images, 'reader images empty'
          print('IMAGE_COUNT',len(images),'FIRST_IMAGE',images[0])

          image=load(images[0],chapter_url,limit=262144)
          assert len(image) > 1024, 'image response too small'
          signatures=(image.startswith(b'\xff\xd8\xff'),image.startswith(b'\x89PNG'),image[:4]==b'RIFF')
          print('IMAGE_SIGNATURES jpeg/png/riff',signatures)
          assert any(signatures), 'first reader response is not a known image'
          print('MANGA_DAQUAN_READER_PROBE_OK')
          PY
