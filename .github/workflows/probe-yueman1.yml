name: Probe Yueman1 Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-yueman1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect mobile search and chapters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, urllib.error
          from html import unescape
          from http.cookiejar import CookieJar
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/131.0 Mobile Safari/537.36'
          jar=CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def req(url,data=None):
              h={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9','Referer':'http://m.yueman1.cc/'}
              try:
                  with op.open(urllib.request.Request(url,data=data,headers=h),timeout=12) as r:
                      b=r.read(900000)
                      try:t=b.decode('gb18030')
                      except:t=b.decode('utf-8','ignore')
                      print('\n',r.status,r.geturl(),re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)[:1],len(b))
                      return t
              except urllib.error.HTTPError as e:
                  print('HTTP',e.code,url,e.read(200)[:200]); return ''
              except Exception as e: print('ERR',repr(e)); return ''
          d=req('http://m.yueman1.cc/manhua/47956.html')
          print('CHAPTERS',[(h,re.sub('<[^>]+>',' ',x).strip()) for h,x in re.findall(r'<a[^>]+href=["\']([^"\']*/p/\d+/\d+\.html)["\'][^>]*>(.*?)</a>',d,re.I|re.S)][:100])
          print('PAGE LINKS',[(h,re.sub('<[^>]+>',' ',x).strip()) for h,x in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',d,re.I|re.S) if 'page' in h.lower() or '下一' in x][:30])
          s=req('http://m.yueman1.cc/manhua/o/m_wapss.html')
          print('SEARCH FORM',re.findall(r'<form[^>]*.*?</form>',s,re.I|re.S)[:3])
          print('SEARCH JS',[x[:1200] for x in re.findall(r'.{0,200}(?:search|wapss|keyword|key).{0,900}',s,re.I|re.S)[:10]])
          for keyname in ['key','keyword','searchword']:
              q=urllib.parse.urlencode({keyname:'斗罗大陆'}).encode()
              t=req('http://m.yueman1.cc/manhua/o/m_wapss.html',q)
              print('POST',keyname,'mangas',[(h,re.sub('<[^>]+>',' ',x).strip()) for h,x in re.findall(r'<a[^>]+href=["\']([^"\']*/manhua/\d+\.html)["\'][^>]*>(.*?)</a>',t,re.I|re.S)][:20])
          for q in ['?key='+urllib.parse.quote('斗罗大陆'),'?keyword='+urllib.parse.quote('斗罗大陆')]:
              t=req('http://m.yueman1.cc/manhua/o/m_wapss.html'+q)
              print('GET',q,'mangas',[(h,re.sub('<[^>]+>',' ',x).strip()) for h,x in re.findall(r'<a[^>]+href=["\']([^"\']*/manhua/\d+\.html)["\'][^>]*>(.*?)</a>',t,re.I|re.S)][:20])
          c=req('http://m.yueman1.cc/manhua/o/m_waplistindex.html')
          print('CLASSIFY SCRIPTS',re.findall(r'<script[^>]+src=["\']([^"\']+)',c,re.I)[:30])
          PY
