name: Probe MengXiGe image transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mengxige-image-transport.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          path: helper
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve one real image and test transports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p helper/probe-results
          python3 - <<'PY'
          import base64,hashlib,json,re,subprocess,time,urllib.request
          from pathlib import Path
          src=Path('source/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt').read_text('utf-8')
          def c(n):
              m=re.search(rf'private const val {n} = "([^"]*)"',src)
              if not m: raise SystemExit('missing '+n)
              return m.group(1)
          package,secret,version,channel,app_id=[c(x) for x in ('APP_PACKAGE','APP_SECRET','APP_VERSION','APP_CHANNEL','APP_ID')]
          def headers():
              now=str(int(time.time())); sign=hashlib.md5((package+'1'+now+secret).encode()).hexdigest()
              return {'User-Agent':'OPPO_R821T/1.0 Linux/3.4.5 Android/4.2.2 Release/03.26.2013 Browser/AppleWebKit534.30 Mobile Safari/534.30 MBBMS/2.2 System/Android 4.2.2_'+package,'Accept':'*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Referer':'https://book.folongteng.com/','pt':'1','version':version,'channel':channel,'uuid':'probe-image-00000000-0000-0000-0000-000000000001','xf-appid':app_id,'fc-session-id':'','package':package,'time':now,'stamp':'','sign':sign}
          def decode(raw):
              try: root=json.loads(raw)
              except Exception: return raw
              data=root.get('data') if isinstance(root,dict) else None
              if not isinstance(data,dict) or str(data.get('ver'))!='1' or not data.get('content'): return raw
              b=base64.b64decode(data['content'])
              if len(b)<32:return raw
              head,tail=b[:16],b[-16:]; key=hashlib.sha256(head).digest(); md5hex=hashlib.md5(tail).hexdigest().encode('ascii'); iv=bytes((~(md5hex[i]^tail[i]))&255 for i in range(16)); p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex()],input=b[16:-16],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              return p.stdout.decode('utf-8','replace') if p.returncode==0 else raw
          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers()),timeout=20) as r:
                  return json.loads(decode(r.read().decode('utf-8','replace')))
          def find_path_array(x):
              if isinstance(x,list):
                  if any(isinstance(v,dict) and v.get('path') for v in x): return x
                  for v in x:
                      r=find_path_array(v)
                      if r:return r
              elif isinstance(x,dict):
                  for v in x.values():
                      r=find_path_array(v)
                      if r:return r
              return None
          bid='5003998'; floor=int(bid)//1000
          detail=get_json(f'https://book.folongteng.com/comics/details/v4/{floor}/{bid}.html')
          def find_detail(x):
              if isinstance(x,dict):
                  if str(x.get('book_id') or x.get('id') or '')==bid and x.get('list_path'): return x
                  for v in x.values():
                      r=find_detail(v)
                      if r:return r
              elif isinstance(x,list):
                  for v in x:
                      r=find_detail(v)
                      if r:return r
              return None
          d=find_detail(detail)
          if not d: raise SystemExit('detail not found')
          lp=str(d['list_path']).lstrip('/')
          cat=get_json('https://c-catalog.folongteng.com/'+lp)
          chapters=find_path_array(cat)
          if not chapters: raise SystemExit('catalog rows not found')
          ch=next(v for v in chapters if isinstance(v,dict) and v.get('path'))
          pic='https://c-pic.folongteng.com/'+str(ch['path']).lstrip('/')
          if ch.get('updated_at'): pic += '?time='+str(ch['updated_at'])
          pages=get_json(pic)
          rows=find_path_array(pages)
          if not rows: raise SystemExit('page rows not found')
          image_path=str(next(v for v in rows if isinstance(v,dict) and v.get('path'))['path']).lstrip('/')
          out={'bookId':bid,'listPath':lp,'chapterPath':ch.get('path'),'imagePath':image_path,'tests':{}}
          Path('helper/probe-results/mengxige-image-target.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n','utf-8')
          Path('/tmp/image_path').write_text(image_path)
          PY
          image_path="$(cat /tmp/image_path)"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('helper/probe-results/mengxige-image-target.json'); out=json.loads(p.read_text('utf-8')); path=out['imagePath']
          tests={}
          hosts=['c-chapter.folongteng.com','chapter.folongteng.com','c-res.folongteng.com']
          modes=[('default',[]),('http1',['--http1.1']),('http2',['--http2'])]
          for host in hosts:
              for name,args in modes:
                  url='https://'+host+'/'+path
                  key=host+'|'+name
                  cmd=['curl','-L','-sS','--connect-timeout','8','--max-time','20','--range','0-4095','-o','/tmp/mxpart','-w','%{http_code} %{size_download} %{time_connect} %{time_starttransfer} %{time_total}']+args+[url]
                  r=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  tests[key]={'exit':r.returncode,'metrics':r.stdout.strip(),'stderr':r.stderr.strip()[-500:]}
          # repeat the actual host to detect intermittent close/reset behavior
          for i in range(1,6):
              url='https://c-chapter.folongteng.com/'+path
              r=subprocess.run(['curl','-L','-sS','--connect-timeout','8','--max-time','20','--range','0-65535','-o','/tmp/mxpart','-w','%{http_code} %{size_download} %{time_total}',url],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              tests[f'c-chapter-repeat-{i}']={'exit':r.returncode,'metrics':r.stdout.strip(),'stderr':r.stderr.strip()[-500:]}
          out['tests']=tests; p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY
      - name: Commit sanitized probe result
        working-directory: helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/mengxige-image-target.json
          if ! git diff --cached --quiet; then
            git commit -m 'probe: record MengXiGe image transport results'
            git push origin HEAD:main
          fi
