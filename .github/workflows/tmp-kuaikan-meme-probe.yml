name: Temporary Kuaikan Meme Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-kuaikan-meme-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Kuaikan meme catalog
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 10 \
            -H 'User-Agent: Kuaikan/5.75.0/575000(iPhone;Scale/3.00) (iPhone; CPU)' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'X-Device: 0' \
            'https://api.kkmh.com/v1/graph/meme/allList' -o /tmp/memes.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/memes.json',encoding='utf-8'))
          print('TOP', {k:data.get(k) for k in ('code','message','msg') if k in data})
          def walk(x,path='root',depth=0):
              if depth>8:return
              if isinstance(x,dict):
                  low={str(k).lower():v for k,v in x.items()}
                  text=' '.join(str(v) for v in x.values() if isinstance(v,(str,int,float,bool)))
                  if any(t in text for t in ('附议','嘴角上扬','老婆贴贴','破防了','不可涩涩','达咩','吸氧','笑不活了','秒懂','我不理解','给个姬会','emo','沙发','呜呜','妈咪饭饭')):
                      print('MATCH',path,json.dumps(x,ensure_ascii=False)[:3000])
                  if any(k in low for k in ('name','title','url','image_url','imageurl','meme_url','memeurl','hot_word','hotword')):
                      print('NODE',path,json.dumps(x,ensure_ascii=False)[:1500])
                  for k,v in x.items(): walk(v,f'{path}.{k}',depth+1)
              elif isinstance(x,list):
                  for i,v in enumerate(x[:500]): walk(v,f'{path}[{i}]',depth+1)
          walk(data)
          PY
