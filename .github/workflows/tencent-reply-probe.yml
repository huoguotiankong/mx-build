name: Tencent Reply API Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-reply-probe.yml"
      - ".github/tencent-reply-probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare topic comment pagination
        shell: bash
        run: |
          set -euo pipefail
          host='a.ac.qq.com'
          version='12.19.9'
          topic='49933575'
          comic='644371'
          secret='4jo2YHMm0d2VGt59tVYndX9P7eFcw8TvRv5lMqFP1TT'
          key='42e0d587d5bda41326c2000d'
          keyhex=$(printf '%s' "$key" | xxd -p -c 256)
          : > result.txt

          probe() {
            page="$1"
            listcnt="$2"
            tag="p${page}-c${listcnt}"
            path="/$version/Comment/getTopicCommentList/topic_id/$topic/target_type/3/page/$page/listcnt/$listcnt/comic_id/$comic"
            localtime=$(date +%s%3N)
            sc=$(printf '%s' "$path$host""0""$localtime$secret" | md5sum | awk '{print $1}')
            curl -sS -L --fail --connect-timeout 10 --max-time 30 \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'User-Agent: okhttp/4.10.0' \
              -H 'fakeduin: 0' \
              -H "localtime: $localtime" \
              -H "version: $version" \
              -H 'channel: dm306015002' \
              -H 'userstate: 1' \
              -H 'oversea: 1' \
              -H "sc: $sc" \
              -o "$tag.enc" "https://$host$path"
            tr -d '\r\n\t ' < "$tag.enc" | base64 -d > "$tag.bin"
            openssl enc -des-ede3 -d -K "$keyhex" -nosalt -in "$tag.bin" -out "$tag.json"
            TAG="$tag" PAGE="$page" LISTCNT="$listcnt" python3 - <<'PY' >> result.txt
          import json,os
          obj=json.load(open(os.environ["TAG"]+".json",encoding="utf-8"))
          data=obj.get("data") or {}
          items=data.get("list") or []
          ids=[str(x.get("comment_id",x.get("commentId",""))) for x in items if isinstance(x,dict)]
          print("tag="+os.environ["TAG"])
          print("page="+os.environ["PAGE"])
          print("listcnt="+os.environ["LISTCNT"])
          print("error_code="+str(obj.get("error_code",obj.get("errorCode"))))
          print("comment_count="+str(data.get("comment_count",data.get("commentCount"))))
          print("end_of_list="+str(data.get("end_of_list",data.get("endOfList"))))
          print("list_count="+str(len(items)))
          print("ids="+",".join(ids))
          print()
          PY
          }

          probe 1 0
          probe 1 9
          probe 1 20
          probe 2 0
          probe 2 9
          probe 2 20

          cat result.txt
          mkdir -p probe-results
          cp result.txt probe-results/tencent-reply-pagination.txt

      - name: Commit sanitized pagination result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-results/tencent-reply-pagination.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "probe: record Tencent reply pagination"
            git push
          fi
