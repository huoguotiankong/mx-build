name: Stage Tencent v31 and Kuaikan v27 chapter date tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage-chapter-dates-v31-v27-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-chapter-dates-v31-v27-test
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]
          [[ -n "$MANGA_SIGNING_BUNDLE" ]]

      - name: Checkout verified source snapshot
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: a18e1134467e909e3193658510c98fceee342b09
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify target source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 31' source/src/zh/tencentcomics/build.gradle.kts
          grep -F 'Comic/comicChapterList' source/src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F 'versionCode = 27' source/src/zh/kuaikanmanhua/build.gradle.kts
          grep -F 'publishedTime' source/src/zh/kuaikanmanhua/src/eu/kanade/tachiyomi/extension/zh/kuaikanmanhua/Kuaikanmanhua.kt
          python3 source/scripts/validate_sources.py
          git -C source diff --check

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay target modules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/tencentcomics upstream/src/zh/kuaikanmanhua
          cp -a source/src/zh/tencentcomics upstream/src/zh/tencentcomics
          cp -a source/src/zh/kuaikanmanhua upstream/src/zh/kuaikanmanhua

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and lint targets
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:tencentcomics:spotlessCheck :src:zh:kuaikanmanhua:spotlessCheck
          ./gradlew :src:zh:tencentcomics:assembleDebug :src:zh:kuaikanmanhua:assembleDebug
          ./gradlew :src:zh:tencentcomics:lintRelease :src:zh:kuaikanmanhua:lintRelease

      - name: Prepare stable signing key
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          required=('signingKey','alias','storePassword','keyPassword')
          missing=[k for k in required if not bundle.get(k)]
          if missing:
              raise SystemExit('Signing bundle missing: ' + ', '.join(missing))
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(bundle['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for env_name,key in (('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')):
                  value=str(bundle[key]); print(f'::add-mask::{value}')
                  f.write(f'{env_name}<<__MX_EOF__\n{value}\n__MX_EOF__\n')
          PY

      - name: Build and verify signed releases
        shell: bash
        run: |
          set -euo pipefail
          expected='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          actual="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" == "$expected" ]]
          echo "SIGNING_FINGERPRINT=$actual" >> "$GITHUB_ENV"
          (cd upstream && ./gradlew :src:zh:tencentcomics:assembleRelease :src:zh:kuaikanmanhua:assembleRelease)
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          for module in tencentcomics kuaikanmanhua; do
            apk="$(find "upstream/src/zh/$module" -path '*/build/outputs/apk/release/*.apk' -type f | sort | head -n1)"
            [[ -f "$apk" ]]
            "$apksigner" verify "$apk"
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$normalized" == *"$actual"* ]]
          done

      - name: Checkout extension staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Generate isolated two-source test store
        shell: bash
        run: |
          set -euo pipefail
          printf 'zh/tencentcomics\nzh/kuaikanmanhua\n' > "$RUNNER_TEMP/chapter-date-targets.txt"
          python3 source/scripts/publish_test_repo.py \
            --targets "$RUNNER_TEMP/chapter-date-targets.txt" \
            --upstream-root upstream \
            --source-root source \
            --repo-dir staging/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('staging/test/index.json').read_text('utf-8'))
          expected={
              'eu.kanade.tachiyomi.extension.zh.tencentcomics': ('1.4.31',104031),
              'eu.kanade.tachiyomi.extension.zh.kuaikanmanhua': ('1.6.27',106027),
          }
          items=data['extensionList']['extensions']
          for package, wanted in expected.items():
              matches=[x for x in items if x.get('packageName') == package]
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {package}, got {len(matches)}')
              actual=(matches[0].get('versionName'), matches[0].get('versionCode'))
              if actual != wanted:
                  raise SystemExit(f'{package}: expected {wanted}, got {actual}')
              print(package, actual)
          PY
          test -f staging/test/apk/tachiyomi-zh.tencentcomics-v1.4.31.apk
          test -f staging/test/apk/tachiyomi-zh.kuaikanmanhua-v1.6.27.apk

      - name: Commit staging snapshot
        working-directory: staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Chapter-date staging already current'
          else
            git commit -m 'Stage Tencent v31 and Kuaikan v27 chapter-date tests'
            git pull --rebase origin extension-staging
            git push origin HEAD:extension-staging
          fi

      - name: Verify staging online
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/huoguotiankong/mx-build/extension-staging/test'
          for f in index.json repo.json; do
            ok=0
            for n in 1 2 3 4 5 6; do
              code="$(curl -L -sS -o "/tmp/$f" -w '%{http_code}' "$base/$f?ts=$(date +%s%N)" || true)"
              if [[ "$code" == 200 ]]; then ok=1; break; fi
              sleep $((n*2))
            done
            [[ "$ok" -eq 1 ]]
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/index.json').read_text('utf-8'))
          expected={
              'eu.kanade.tachiyomi.extension.zh.tencentcomics': ('1.4.31',104031),
              'eu.kanade.tachiyomi.extension.zh.kuaikanmanhua': ('1.6.27',106027),
          }
          items=data['extensionList']['extensions']
          for package, wanted in expected.items():
              matches=[x for x in items if x.get('packageName') == package]
              if len(matches) != 1 or (matches[0].get('versionName'), matches[0].get('versionCode')) != wanted:
                  raise SystemExit(f'Online staging mismatch for {package}: {matches}')
          print('Online staging verified for Tencent v31 and Kuaikan v27')
          PY

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f upstream/signingkey.jks
