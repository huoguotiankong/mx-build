name: Fetch Tencent APK

on:
  push:
    paths:
      - ".github/workflows/fetch-tencent-apk.yml"
      - ".github/fetch-tencent-apk-trigger"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tencent Comics 12.19.9
        shell: bash
        run: |
          set -euo pipefail
          url='https://wap.pp.cn/app/dl/fs08/2026/07/31/6/110_1d0689776bd9df3cabc573c6ccee1db0.apk'
          curl -A 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'             -L --fail --retry 3 --connect-timeout 15 --max-time 240 -o tencent.apk "$url"
          file tencent.apk
          ls -lh tencent.apk
          sha256sum tencent.apk
          unzip -l tencent.apk | grep -E 'libcryptutils\.so|classes[0-9]*\.dex' | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: tencent-apk-12.19.9
          path: tencent.apk
          compression-level: 0
