name: Fetch Tencent APK

on:
  push:
    paths:
      - ".github/workflows/fetch-tencent-apk.yml"
      - ".github/fetch-tencent-apk-trigger"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tencent Comics 12.19.9
        shell: bash
        run: |
          set -euo pipefail
          url='https://s.shouji.qihucdn.com/260731/36dbf11bb96a01e475f1f53a9af8fcba/com.qq.ac.android_246.apk?en=curpage%3Dopenbox_wap_detail%26exp%3D1787182233%26from%3Dopenbox_mintf_getAppInfoByIds%26m2%3D%26ts%3D1786577433%26tok%3D269093e216b7fa5def9c9f9d84ecfd0b%26v%3D%26f%3Dz.apk'
          curl -L --fail --retry 3 --connect-timeout 15 --max-time 180 -o tencent.apk "$url"
          ls -lh tencent.apk
          sha256sum tencent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tencent-apk-12.19.9
          path: tencent.apk
          compression-level: 0
