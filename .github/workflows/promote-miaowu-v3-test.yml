name: Promote Miaowu v7 test only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-miaowu-v3-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-miaowu-v7-test-only
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check publish token
        shell: bash
        env:
          MX_REPO_TOKEN: ${{ secrets.MX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_REPO_TOKEN" ]] || { echo "::error::Missing MX_REPO_TOKEN"; exit 1; }

      - name: Checkout verified extension staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify staged Miaowu v7 payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.miaowumanhua'
          data = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == package)
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.7', 106007), item
          assert len(data['extensionList']['extensions']) >= 10
          assert Path('staging/test/apk/tachiyomi-zh.miaowumanhua-v1.6.7.apk').is_file()
          assert Path('staging/test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106007.png').is_file()
          print('Verified staged Miaowu v7 payload')
          PY

      - name: Checkout public repository
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          ref: repo
          token: ${{ secrets.MX_REPO_TOKEN }}
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Merge only Miaowu v7 into MX Test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.miaowumanhua'
          staged = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          public_index = Path('repo/test/index.json')
          public = json.loads(public_index.read_text('utf-8'))
          staged_item = next(x for x in staged['extensionList']['extensions'] if x.get('packageName') == package)
          assert (staged_item.get('versionName'), staged_item.get('versionCode')) == ('1.6.7', 106007)
          extensions = public['extensionList']['extensions']
          matches = [i for i, x in enumerate(extensions) if x.get('packageName') == package]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one public Miaowu entry, found {len(matches)}')
          extensions[matches[0]] = staged_item
          public_index.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          apk_src = Path('staging/test/apk/tachiyomi-zh.miaowumanhua-v1.6.7.apk')
          icon_src = Path('staging/test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106007.png')
          Path('repo/test/apk').mkdir(parents=True, exist_ok=True)
          Path('repo/test/icon').mkdir(parents=True, exist_ok=True)
          shutil.copy2(apk_src, Path('repo/test/apk') / apk_src.name)
          shutil.copy2(icon_src, Path('repo/test/icon') / icon_src.name)
          print('Merged Miaowu v7 only; other test entries preserved')
          PY

      - name: Verify targeted diff
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git add test/index.json \
            test/apk/tachiyomi-zh.miaowumanhua-v1.6.7.apk \
            test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106007.png
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              test/index.json|test/apk/tachiyomi-zh.miaowumanhua-v1.6.7.apk|test/icon/eu.kanade.tachiyomi.extension.zh.miaowumanhua-v106007.png) ;;
              *) echo "::error::Unexpected staged path: $path"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit public Miaowu v7 test
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Miaowu v1.6.7 web-runtime test'
            git push origin HEAD:repo
          fi

      - name: Verify public Miaowu v7 online
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo/test'
          ok=0
          for n in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/index.json -w '%{http_code}' "$base/index.json?ts=$(date +%s%N)" || true)"
            if [[ "$code" == '200' ]]; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/index.json').read_text('utf-8'))
          item = next(x for x in data['extensionList']['extensions'] if x.get('packageName') == 'eu.kanade.tachiyomi.extension.zh.miaowumanhua')
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.7', 106007), item
          assert len(data['extensionList']['extensions']) >= 10
          PY
              then ok=1; break; fi
            fi
            sleep $((n * 2))
          done
          [[ "$ok" -eq 1 ]] || { echo '::error::Public MX Test index did not converge to Miaowu v7'; exit 1; }
          curl -fL -sS "$base/apk/tachiyomi-zh.miaowumanhua-v1.6.7.apk?ts=$(date +%s%N)" -o /tmp/miaowu-v7.apk
          test -s /tmp/miaowu-v7.apk
          echo 'Public Miaowu v7 test verified online'

# trigger: 2026-09-09T23:50+08:00 promote v1.6.7 web runtime test
