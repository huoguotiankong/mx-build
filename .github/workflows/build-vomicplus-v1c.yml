name: Build Vomic Plus v1c

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-vomicplus-v1c.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vomicplus-v1c
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check secrets
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" ]]
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: 0ca8b46ec5229955a6a76b736de27642bca0808f
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and Vomic comment endpoints
        run: |
          set -euo pipefail
          python3 dev/scripts/validate_sources.py
          grep -q 'versionCode = 1' dev/src/zh/vomicplus/build.gradle.kts
          grep -q 'id = 8237640194557812301L' dev/src/zh/vomicplus/build.gradle.kts
          grep -q 'supportsMangaComments = true' dev/src/zh/vomicplus/src/eu/kanade/tachiyomi/extension/zh/vomicplus/VomicPlus.kt
          grep -q 'supportsChapterComments = true' dev/src/zh/vomicplus/src/eu/kanade/tachiyomi/extension/zh/vomicplus/VomicPlus.kt
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          base='http://43.143.245.32/pics/c/getCommentList_v1'
          h={'host':'43.143.245.32','name':'pics','platform':'android','showsuccess':'false','showtoast':'false','version':'1.0.10','User-Agent':'Mozilla/5.0'}
          for sort in ('hot','time'):
              for chapter in (None,10671):
                  p={'obj_id':12607,'page':1,'limit':30,'top_id':0,'score':0,'obj_type':'cartoon','sort':sort}
                  if chapter is not None: p['chapter_id']=chapter
                  req=urllib.request.Request(base+'?'+urllib.parse.urlencode(p),headers=h)
                  with urllib.request.urlopen(req,timeout=20) as r: data=json.loads(r.read())
                  assert isinstance(data.get('data'),dict),data
          print('Vomic book/chapter reviews hot/time verified')
          PY

      - name: Patch current Keiyoushi API compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dev/src/zh/vomicplus/src/eu/kanade/tachiyomi/extension/zh/vomicplus/VomicPlus.kt')
          s=p.read_text('utf-8')
          s=s.replace('import android.widget.Toast\n','')
          s=s.replace('import androidx.preference.Preference\n','')
          s=s.replace('.map(String::absoluteUrl)', '.map { it.absoluteUrl() }')
          s=s.replace('            setSingleLine(true)\n','            setOnBindEditTextListener { editText -> editText.isSingleLine = true }\n')
          s=s.replace('        lateinit var loginPreference: Preference\n','')
          s=s.replace('triggerLogin(identity, password) { status -> loginPreference.summary = status }','triggerLogin(identity, password) { _ -> }')
          a=s.find('        loginPreference = Preference(screen.context).apply {')
          b=s.find('        ListPreference(screen.context).apply {',a)
          if a < 0 or b < 0: raise SystemExit('login button blocks not found')
          s=s[:a]+s[b:]
          marker='        Preference(screen.context).apply {\n            title = "评论功能"'
          a=s.find(marker)
          if a >= 0:
              b=s.find('        }.also(screen::addPreference)',a)
              if b < 0: raise SystemExit('comment info block end not found')
              b += len('        }.also(screen::addPreference)\n')
              s=s[:a]+s[b:]
          s=s.replace('                Toast.makeText(context, status, Toast.LENGTH_SHORT).show()\n','')
          p.write_text(s,'utf-8')
          PY
          git -C dev diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Overlay source and official Vomic icon
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/vomicplus
          cp -a dev/src/zh/vomicplus upstream/src/zh/vomicplus
          rm -rf upstream/src/zh/vomicplus/res
          cp -a upstream/src/zh/vomic/res upstream/src/zh/vomicplus/res

      - name: Format build and lint
        working-directory: upstream
        run: |
          set -euo pipefail
          ./gradlew :src:zh:vomicplus:spotlessApply :src:zh:vomicplus:spotlessCheck
          ./gradlew :src:zh:vomicplus:assembleDebug :src:zh:vomicplus:lintRelease

      - name: Prepare signing
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for e,k in (('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')):
                  v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF_SIGN\n{v}\nEOF_SIGN\n')
          PY

      - name: Build signed release and verify MX ABI
        id: signing
        working-directory: upstream
        run: |
          set -euo pipefail
          ./gradlew :src:zh:vomicplus:assembleRelease
          fp="$(keytool -exportcert -alias "$ALIAS" -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          [[ "$fp" == '1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620' ]]
          apk="$(find src/zh/vomicplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          unzip -p "$apk" classes.dex >/tmp/vomicplus.dex
          grep -a -F -q 'Leu/kanade/tachiyomi/source/mx/CommentSource;' /tmp/vomicplus.dex
          grep -a -F -q 'Leu/kanade/tachiyomi/source/mx/CommentCapabilities;' /tmp/vomicplus.dex
          grep -a -F -q 'Leu/kanade/tachiyomi/source/mx/SortableCommentSource;' /tmp/vomicplus.dex
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Prepare validated source locally
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/vomicplus
          cp -a upstream/src/zh/vomicplus dev/src/zh/vomicplus
          rm -rf dev/src/zh/vomicplus/build
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check

      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Stage Vomic Plus test store
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/vomicplus' > targets.txt
          python3 dev/scripts/publish_test_repo.py \
            --targets targets.txt \
            --upstream-root upstream \
            --source-root dev \
            --repo-dir staging/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/apk/tachiyomi-zh.vomicplus-v1.6.1.apk
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('staging/test/index.json').read_text('utf-8'))
          p='eu.kanade.tachiyomi.extension.zh.vomicplus'
          items=[x for x in data['extensionList']['extensions'] if x.get('packageName')==p]
          assert len(items)==1,items
          item=items[0]
          assert (item.get('versionName'),item.get('versionCode'))==('1.6.1',106001),item
          assert item['sources'][0]['id']==8237640194557812301,item
          print('staged',item.get('versionName'),item.get('versionCode'),item['sources'][0]['id'])
          PY
          git -C staging config user.name 'github-actions[bot]'
          git -C staging config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C staging add test
          git -C staging diff --cached --check
          if ! git -C staging diff --cached --quiet; then
            git -C staging commit -m 'Stage Vomic Plus v1.6.1 test store'
            git -C staging push origin HEAD:extension-staging
          fi

      - name: Verify staging online
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/huoguotiankong/mx-build/extension-staging/test/apk/tachiyomi-zh.vomicplus-v1.6.1.apk'
          for i in 1 2 3 4 5 6; do
            code="$(curl -L -sS -o /tmp/vomicplus-online.apk -w '%{http_code}' "$url" || true)"
            if [[ "$code" == 200 ]] && [[ -s /tmp/vomicplus-online.apk ]]; then
              exit 0
            fi
            sleep 5
          done
          echo 'staging APK did not become available online' >&2
          exit 1

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vomicplus-v1.6.1-signed
          path: upstream/src/zh/vomicplus/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -f upstream/signingkey.jks
