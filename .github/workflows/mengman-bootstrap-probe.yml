name: Mengman Guest Search Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mengman-bootstrap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe guest registration and search
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,uuid,urllib.request,urllib.error
          base='https://api.yisix.cn/api/v1/'
          did=uuid.uuid4().hex
          android_id=uuid.uuid4().hex[:16]
          body={
            'device_id':did,
            'platform':'android',
            'android_id_md5':hashlib.md5(android_id.encode()).hexdigest(),
            'device_model':'Pixel 8',
            'os_version':'16',
            'app_version':'1.0.1',
            'oaid':'',
            'oaid_md5':'',
            'fresh_guest':True,
            'restore_device_account':True,
            'invite_code':'',
          }
          common={
            'User-Agent':'okhttp/4.12.0',
            'Accept':'application/json',
            'Content-Type':'application/json; charset=utf-8',
            'X-Package':'com.mengman.app',
            'X-App-VersionCode':'101',
            'X-Platform':'android',
            'X-Device-ID':did,
            'X-Device-Model':'Pixel 8',
            'X-OS-Version':'16',
          }
          def req(url,method='GET',data=None,headers=None):
            h=dict(common); h.update(headers or {})
            r=urllib.request.Request(url,data=(json.dumps(data,separators=(',',':')).encode() if data is not None else None),headers=h,method=method)
            try:
              with urllib.request.urlopen(r,timeout=30) as x:
                b=x.read(10000); print('STATUS',x.status,'URL',url); print(b.decode('utf-8','replace')); return x.status,b
            except urllib.error.HTTPError as e:
              b=e.read(10000); print('HTTP',e.code,'URL',url); print(b.decode('utf-8','replace')); return e.code,b
          print('BODY',json.dumps(body,ensure_ascii=False))
          st,b=req(base+'auth/guest','POST',body)
          token=''
          try:
            o=json.loads(b); d=o.get('data') or {}; token=d.get('token') or d.get('access_token') or ''
          except Exception: pass
          print('TOKEN?',bool(token),'LEN',len(token))
          hs={'Authorization':'Bearer '+token} if token else {}
          for kw in ['仙帝','仙帝归来','我偏要装']:
            from urllib.parse import urlencode
            url=base+'search?'+urlencode({'keyword':kw,'page':1,'page_size':20})
            req(url,headers=hs)
          PY
