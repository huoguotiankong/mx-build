name: Mengman Static Index Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mengman-bootstrap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe likely static index files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,time,urllib.request,urllib.error
          base='https://static.yisix.cn'; seed='94e890e3a45ba392c0c519ed45190a4c'
          paths=[
            '/static/comic/list.zip','/static/comic/all.zip','/static/comic/index.zip',
            '/static/search/index.zip','/static/search/comic.zip','/static/search/comics.zip','/static/search/all.zip',
            '/static/ranking/new.zip','/static/ranking/latest.zip','/static/ranking/recent.zip',
            '/static/ranking/favorite.zip','/static/ranking/hot.zip',
            '/static/column_index/1.zip','/static/column_index/2.zip','/static/column_index/3.zip',
          ]
          h={'User-Agent':'okhttp/4.12.0','Accept':'*/*'}
          for path in paths:
            ts=str(int(time.time()));sign=hashlib.md5((seed+path+ts).encode()).hexdigest();url=f'{base}{path}?ts={ts}&sign={sign}'
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=20) as r:
                b=r.read(64);print(path,'OK',r.status,'LEN',r.headers.get('content-length'),'HEAD',b.hex())
            except urllib.error.HTTPError as e: print(path,'HTTP',e.code)
            except Exception as e: print(path,'ERR',repr(e))
          PY
