name: Mengman Catalog Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mengman-bootstrap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch signed static catalog data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mengman-static
          python3 - <<'PY'
          import hashlib,time,urllib.request
          base='https://static.yisix.cn'
          seed='94e890e3a45ba392c0c519ed45190a4c'
          paths=[
            '/static/category/1/1.zip',
            '/static/category/1/2.zip',
            '/static/category/2/1.zip',
            '/static/comic/home.zip',
            '/static/recommend/comic.zip',
            '/static/comic/index/banner.zip',
            '/static/column_index/comic.zip',
            '/static/ranking/comic/reco.zip',
            '/static/ranking/comic.zip',
            '/static/ranking/hot.zip',
          ]
          for path in paths:
              ts=str(int(time.time()))
              sign=hashlib.md5((seed+path+ts).encode()).hexdigest()
              url=f'{base}{path}?ts={ts}&sign={sign}'
              name=path.strip('/').replace('/','__')
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'okhttp/4.12.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read()
                      print(path,'status',r.status,'len',len(data),'type',r.headers.get('content-type'),'head',data[:32].hex())
                      open('/tmp/mengman-static/'+name,'wb').write(data)
              except Exception as e:
                  print(path,'ERROR',repr(e))
          PY
          ls -lh /tmp/mengman-static
          sha256sum /tmp/mengman-static/* || true

      - name: Upload static data
        uses: actions/upload-artifact@v4
        with:
          name: mengman-catalog-data
          path: /tmp/mengman-static
          if-no-files-found: error
          retention-days: 1
