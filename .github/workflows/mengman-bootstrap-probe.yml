name: Mengman Search Shard Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mengman-bootstrap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe shard static ranking and search API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,time,urllib.request,urllib.error
          static='https://static.yisix.cn'
          seed='94e890e3a45ba392c0c519ed45190a4c'
          static_paths=[
            '/static/comic/45/2145.zip',
            '/static/comic/65/1565.zip',
            '/static/ranking/update.zip',
            '/static/ranking/view.zip',
            '/static/ranking/favorite.zip',
            '/static/ranking/comic/0/update.zip',
            '/static/ranking/comic/1/update.zip',
            '/static/ranking/comic/0/view.zip',
            '/static/ranking/comic/1/view.zip',
          ]
          headers={'User-Agent':'okhttp/4.12.0','Accept':'application/json,*/*'}
          for path in static_paths:
              ts=str(int(time.time())); sign=hashlib.md5((seed+path+ts).encode()).hexdigest()
              url=f'{static}{path}?ts={ts}&sign={sign}'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                      b=r.read(64); print('STATIC',path,'STATUS',r.status,'LEN',r.headers.get('content-length'),'HEAD',b.hex())
              except urllib.error.HTTPError as e:
                  print('STATIC',path,'HTTP',e.code,e.read(200).decode('utf-8','replace'))
              except Exception as e: print('STATIC',path,'ERR',repr(e))
          qs=['%E4%BB%99%E5%B8%9D','%E4%BB%99%E5%B8%9D%E5%BD%92%E6%9D%A5']
          api_urls=[]
          for q in qs:
              api_urls += [
                f'https://api.yisix.cn/api/v1/search?q={q}',
                f'https://api.yisix.cn/api/v1/search?keyword={q}&page=1&page_size=20',
                f'https://api.yisix.cn/search?q={q}',
                f'https://api.yisix.cn/search/suggest?keyword={q}',
              ]
          api_urls += ['https://api.yisix.cn/search/hot','https://api.yisix.cn/api/v1/search/hot']
          for url in api_urls:
              print('\nAPI',url)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                      b=r.read(5000); print('STATUS',r.status,'TYPE',r.headers.get('content-type')); print(b.decode('utf-8','replace'))
              except urllib.error.HTTPError as e:
                  print('HTTP',e.code,e.read(3000).decode('utf-8','replace'))
              except Exception as e: print('ERR',repr(e))
          PY
