name: Mengman API Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mengman-bootstrap-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe comic API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          urls=[
            'https://api.yisix.cn/api/v1/comics?page=1&size=20',
            'https://api.yisix.cn/api/v1/comics?page=1&size=20&keyword=%E4%BB%99%E5%B8%9D',
            'https://api.yisix.cn/api/v1/search?keyword=%E4%BB%99%E5%B8%9D&page=1&page_size=20',
            'https://api.yisix.cn/comics?page=1&size=20&keyword=%E4%BB%99%E5%B8%9D',
            'https://api.yisix.cn/api/v1/comics/2140',
            'https://api.yisix.cn/api/v1/comic-categories',
          ]
          headers={'User-Agent':'okhttp/4.12.0','Accept':'application/json'}
          for url in urls:
              print('\nURL',url)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(8000)
                      print('STATUS',r.status,'TYPE',r.headers.get('content-type'),'LEN-SAMPLE',len(b))
                      print(b.decode('utf-8','replace'))
              except urllib.error.HTTPError as e:
                  b=e.read(8000)
                  print('HTTP',e.code,'TYPE',e.headers.get('content-type'))
                  print(b.decode('utf-8','replace'))
              except Exception as e:
                  print('ERROR',repr(e))
          PY
