name: Format Dongman v1.6.5 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-dongman-v165-temp.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay and apply Spotless
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/dongmanmanhuaplus
          cp -a source/src/zh/dongmanmanhuaplus upstream/src/zh/dongmanmanhuaplus
          cd upstream
          ./gradlew :src:zh:dongmanmanhuaplus:spotlessApply
          cd ..
          cp upstream/src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt \
             source/src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt
          git -C source diff --check
          git -C source diff -- src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt

      - name: Commit formatting if token permits
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt
          if git diff --cached --quiet; then
            echo 'No formatting changes needed'
            exit 0
          fi
          git commit -m 'style(dongmanmanhuaplus): apply Spotless'
          git push origin HEAD:main
