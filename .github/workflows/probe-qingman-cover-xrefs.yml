name: Trace Qingman Cover URL Construction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-cover-xrefs.yml'

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace cover fields and URL helper callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qm.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qm.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)
          names={'verticalCover','horizontalCover','cover','freeLine','apiDomain'}
          offs={o:v for o,v in pp.items() if any(v==f'String: "{n}"' for n in names)}
          print('target_pp_entries='+str(len(offs)))
          for o,v in sorted(offs.items()): print(f'pp=0x{o:x} {v}')

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base)); idx={x.address:i for i,x in enumerate(ins)}
          def pro(x): return x.mnemonic=='stp' and x.op_str.replace(' ','').startswith('x29,x30,[x15,#-0x10]!')
          def bounds(addr):
              k=idx[addr]; s=k
              while s>0 and not pro(ins[s]): s-=1
              e=k+1
              while e<len(ins) and not pro(ins[e]): e+=1
              return ins[s].address, ins[e].address if e<len(ins) else ins[-1].address+4
          def callers(st):
              out=[]
              for x in ins:
                  if x.mnemonic!='bl': continue
                  m=re.fullmatch(r'#(0x[0-9a-f]+|\d+)',x.op_str.lower())
                  if m and int(m.group(1),0)==st: out.append(x.address)
              return out
          refs=[]; pending={}
          for x in ins:
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=x.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if x.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),32); continue
              if x.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in offs: refs.append((x.address,off))
          owners={}
          for a,o in refs:
              st,en=bounds(a); owners.setdefault(st,{'end':en,'refs':[]})['refs'].append((a,o))
          print('owner_count='+str(len(owners)))
          for st,meta in sorted(owners.items()):
              labels=sorted({offs[o] for _,o in meta['refs']})
              cs=callers(st)
              print(f'OWNER=0x{st:x}-0x{meta["end"]:x} labels={"|".join(labels)} callers={",".join(hex(c) for c in cs[:12])}')
              for ca in cs[:12]:
                  cst,cen=bounds(ca)
                  print(f'  CALLER=0x{cst:x}-0x{cen:x} site=0x{ca:x} parents={",".join(hex(p) for p in callers(cst)[:8])}')

          print('=== DECLARATIONS WITH COVER/FREELINE/API DOMAIN ===')
          needle=re.compile(r'(verticalCover|horizontalCover|freeLine|apiDomain)')
          shown=0
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              text=p.read_text('utf-8',errors='replace')
              if not needle.search(text): continue
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if not needle.search(line): continue
                  print(f'FILE={p.name} LINE={i+1}')
                  for z in lines[max(0,i-5):min(len(lines),i+12)]:
                      if len(z)>500: z=z[:500]
                      print(z)
                  shown+=1
                  if shown>=40: raise SystemExit(0)
          PY
