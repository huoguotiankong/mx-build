name: Probe Extension Release Secrets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-extension-release-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check extension release secrets
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_REPO_TOKEN: ${{ secrets.MX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" ]] || { echo "::error::MANGA_SIGNING_BUNDLE is not configured in mx-build"; exit 1; }
          [[ -n "$MX_REPO_TOKEN" ]] || { echo "::error::MX_REPO_TOKEN is not configured in mx-build"; exit 1; }
          echo "Extension release secrets are configured."
