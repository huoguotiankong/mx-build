name: Patch CopyManga Plus v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-copymangaplus-v5.yml"
      - "scripts/patch_copymangaplus_v5.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: test -n "$MX_PRIVATE_READ_TOKEN"

      - name: Checkout build helpers
        uses: actions/checkout@v5
        with:
          path: buildrepo
          persist-credentials: true

      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Apply v5 patch
        run: python3 buildrepo/scripts/patch_copymangaplus_v5.py

      - name: Probe restored Copy list headers
        shell: bash
        run: |
          set -euo pipefail
          good=0
          for host in api.copy2000.online api.copy-manga.com api.2026copy.com api.copy4000.com api.mangacopy.com api.copy3000.com mapi.copy20.com; do
            body="$(curl -L -sS --max-time 12 "https://$host/api/v3/comics?limit=2&offset=0&ordering=-popular&_update=true" \
              -H 'User-Agent: COPY/3.0.0' \
              -H 'Accept: application/json' \
              -H 'webp: 1' \
              -H 'region: 1' \
              -H 'platform: 3' \
              -H 'source: copyApp' \
              -H 'version: 3.0.9' \
              -H 'referer: com.copymanga.app-3.0.0' || true)"
            if BODY="$body" python3 -c 'import json,os; d=json.loads(os.environ["BODY"]); assert d.get("code")==200 and len((d.get("results") or {}).get("list") or [])>0' 2>/dev/null; then
              echo "$host OK"
              good=$((good+1))
            else
              echo "$host unavailable/empty"
            fi
          done
          test "$good" -gt 0
          echo "usable Copy nodes: $good"

      - name: Validate source layout
        working-directory: source
        run: python3 scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Overlay v5 module
        shell: bash
        run: |
          rm -rf upstream/src/zh/copymangaplus
          cp -a source/src/zh/copymangaplus upstream/src/zh/copymangaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format, build and lint v5
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:copymangaplus:spotlessApply
          ./gradlew :src:zh:copymangaplus:spotlessCheck :src:zh:copymangaplus:assembleDebug :src:zh:copymangaplus:lintRelease

      - name: Copy formatted module back
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude build/ upstream/src/zh/copymangaplus/ source/src/zh/copymangaplus/
          python3 source/scripts/validate_sources.py

      - name: Upload v5 handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: copymangaplus-v5-source
          path: |
            source/src/zh/copymangaplus
            source/docs/sources/copymangaplus.md
          if-no-files-found: error
          retention-days: 7

      - name: Publish validated v5 handoff to build repo
        shell: bash
        run: |
          set -euo pipefail
          handoff="buildrepo/.github/handoff/copymangaplus-v5"
          rm -rf "$handoff"
          mkdir -p "$handoff"
          cp source/src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt "$handoff/CopyMangaPlus.kt"
          cp source/src/zh/copymangaplus/build.gradle.kts "$handoff/build.gradle.kts"
          cp source/docs/sources/copymangaplus.md "$handoff/copymangaplus.md"
          cp source/src/zh/copymangaplus/res/mipmap-anydpi/ic_launcher.png "$handoff/ic_launcher.png"
          printf '%s\n' \
            'validated: CopyManga Plus v5 Spotless + assembleDebug + lintRelease' \
            'versionName: 1.6.5' \
            'androidVersionCode: 106005' \
            'fix: restore v3 Copy list headers; keep detail headers isolated; official blue-white icon' \
            > "$handoff/VALIDATED.txt"
          cd buildrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/handoff/copymangaplus-v5
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish validated CopyManga Plus v5 handoff'
            git push origin HEAD:main
          fi
