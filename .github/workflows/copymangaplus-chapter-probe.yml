name: CopyManga Plus Chapter Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/copymangaplus-chapter-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe official HotManga route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          host='api.2024manga.com'
          headers={
              'User-Agent':'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36 Edg/141.0.0.0',
              'X-Requested-With':'com.manga2020.app',
              'authorization':'Token',
              'platform':'3',
              'version':'2024.4.28',
              'webp':'1',
              'Accept':'application/json',
              'Accept-Encoding':'gzip',
          }

          def get(path):
              req=urllib.request.Request('https://'+host+path,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      status=r.status; body=r.read(); encoding=r.headers.get('Content-Encoding','')
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read(); encoding=e.headers.get('Content-Encoding','')
              if 'gzip' in encoding.lower(): body=gzip.decompress(body)
              text=body.decode('utf-8','replace')
              try: data=json.loads(text)
              except Exception: data={'raw':text[:300]}
              return {'http':status,'data':data}

          report={'host':host,'headers':{'version':headers['version'],'package':headers['X-Requested-With']}}
          listing=get('/api/v3/comics?limit=6&offset=0&ordering=-popular&platform=3')
          report['list_http']=listing['http']; report['list_code']=listing['data'].get('code') if isinstance(listing['data'],dict) else None
          items=((listing['data'].get('results') or {}).get('list') or []) if isinstance(listing['data'],dict) else []
          report['list_count']=len(items)
          chosen=None
          samples=[]
          for raw in items:
              item=raw.get('comic') if isinstance(raw,dict) and isinstance(raw.get('comic'),dict) else raw
              pw=item.get('path_word') if isinstance(item,dict) else None
              if not pw: continue
              detail=get('/api/v3/comic2/'+urllib.parse.quote(pw)+'?platform=3')
              row={'path_word':pw,'detail_http':detail['http'],'detail_code':detail['data'].get('code') if isinstance(detail['data'],dict) else None}
              results=(detail['data'].get('results') or {}) if isinstance(detail['data'],dict) else {}
              groups=results.get('groups') if isinstance(results,dict) else None
              row['groups']=groups
              candidates=[]
              if isinstance(groups,dict):
                  for key,val in groups.items():
                      candidates.append((val.get('path_word') if isinstance(val,dict) else None) or key)
              candidates=[x for x in candidates if x] or ['default']
              row['chapter_attempts']=[]
              for gw in candidates:
                  path=f'/api/v3/comic/{urllib.parse.quote(pw)}/group/{urllib.parse.quote(str(gw))}/chapters?limit=100&offset=0&platform=3'
                  cr=get(path)
                  box=(cr['data'].get('results') or {}) if isinstance(cr['data'],dict) else {}
                  arr=box.get('list') if isinstance(box,dict) else None
                  row['chapter_attempts'].append({'group':gw,'http':cr['http'],'code':cr['data'].get('code') if isinstance(cr['data'],dict) else None,'count':len(arr) if isinstance(arr,list) else None,'message':cr['data'].get('message') if isinstance(cr['data'],dict) else None})
                  if isinstance(arr,list) and arr:
                      chosen=(pw,arr[0].get('uuid'),gw,len(arr))
                      row['working']={'group':gw,'count':len(arr),'chapter_keys':sorted(arr[0].keys())}
                      break
              samples.append(row)
              if chosen: break
          report['samples']=samples
          if chosen:
              pw,cid,gw,count=chosen
              report['chosen']={'path_word':pw,'chapter_uuid':cid,'group':gw,'count':count}
              for suffix in ('chapter2','chapter'):
                  pr=get(f'/api/v3/comic/{urllib.parse.quote(pw)}/{suffix}/{urllib.parse.quote(cid)}?platform=3')
                  box=(pr['data'].get('results') or {}) if isinstance(pr['data'],dict) else {}
                  chapter=box.get('chapter') if isinstance(box,dict) else None
                  contents=chapter.get('contents') if isinstance(chapter,dict) else None
                  report.setdefault('page_attempts',[]).append({'suffix':suffix,'http':pr['http'],'code':pr['data'].get('code') if isinstance(pr['data'],dict) else None,'count':len(contents) if isinstance(contents,list) else None,'message':pr['data'].get('message') if isinstance(pr['data'],dict) else None})
                  if isinstance(contents,list) and contents:
                      report['pages_ok']=True
                      break
          Path('chapter-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not chosen: raise SystemExit('HotManga chapter list failed')
          if not report.get('pages_ok'): raise SystemExit('HotManga chapter pages failed')
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copymangaplus-chapter-probe
          path: chapter-probe.json
          if-no-files-found: warn
          retention-days: 7
