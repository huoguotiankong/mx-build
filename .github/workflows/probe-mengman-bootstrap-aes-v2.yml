name: Probe Mengman bootstrap AES v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mengman-bootstrap-aes-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Compare bootstrap SEED directions and static AES
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, struct, subprocess, tempfile, time, urllib.request

          STATIC='https://static.yisix.cn'
          CDN_SEED='94e890e3a45ba392c0c519ed45190a4c'
          paths=[
              '/static/category/list.zip',
              '/static/search/hot_comic.zip',
              '/static/ranking/new.zip',
          ]

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'okhttp/4.12.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read()
                  print('GET',url.split('?',1)[0],'status',r.status,'bytes',len(b),'sha256',hashlib.sha256(b).hexdigest()[:16])
                  return b

          def signed(path):
              ts=int(time.time())
              sign=hashlib.md5((CDN_SEED+path+str(ts)).encode()).hexdigest()
              return f'{STATIC}{path}?ts={ts}&sign={sign}'

          def text_chunks(png):
              if not png.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise RuntimeError('not PNG')
              p=8; out=[]
              while p+12<=len(png):
                  n=struct.unpack('>I',png[p:p+4])[0]
                  typ=png[p+4:p+8]
                  start=p+8; end=start+n
                  if end+4>len(png): raise RuntimeError('truncated PNG')
                  if typ==b'tEXt':
                      out.append(png[start:end])
                      if len(out)==2: return out
                  p=end+4
                  if typ==b'IEND': break
              raise RuntimeError(f'need 2 tEXt chunks, got {len(out)}')

          def ossl(cipher, data, key, decrypt, iv=None, nopad=True):
              with tempfile.TemporaryDirectory() as td:
                  src=os.path.join(td,'in'); dst=os.path.join(td,'out')
                  open(src,'wb').write(data)
                  cmd=['openssl','enc','-'+cipher, '-d' if decrypt else '-e',
                       '-provider','default','-provider','legacy','-K',key.hex(),'-in',src,'-out',dst]
                  if iv is not None: cmd += ['-iv',iv.hex()]
                  if nopad: cmd += ['-nopad']
                  p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if p.returncode:
                      return None, p.stderr.decode('utf-8','replace')[:200]
                  return open(dst,'rb').read(), None

          resources={path:fetch(signed(path)) for path in paths}
          print()
          for boot in ('a1','a2'):
              print('===',boot,'===')
              chunks=text_chunks(fetch(f'{STATIC}/bootstrap/{boot}.png'))
              key=chunks[0][83:99]
              print('tEXt lengths',list(map(len,chunks)),'bootstrap_key_sha256',hashlib.sha256(key).hexdigest()[:16])
              for decrypt in (True,False):
                  label='SEED-DEC' if decrypt else 'SEED-ENC'
                  plain,err=ossl('seed-ecb',chunks[1],key,decrypt=decrypt,nopad=True)
                  if err:
                      print(label,'FAILED',err); continue
                  print(label,'plain_len',len(plain),'plain_sha256',hashlib.sha256(plain).hexdigest()[:16])
                  if len(plain)<1226:
                      print(label,'too short for static offsets'); continue
                  sk=plain[1194:1210]; iv=plain[1210:1226]
                  print(label,'static_key_sha256',hashlib.sha256(sk).hexdigest()[:16],'iv_sha256',hashlib.sha256(iv).hexdigest()[:16])
                  any_zip=False
                  for path,ciphertext in resources.items():
                      out,aerr=ossl('aes-128-cbc',ciphertext,sk,decrypt=True,iv=iv,nopad=True)
                      if aerr:
                          print(' ',path,'AES error',aerr); continue
                      prefix=out[:16]
                      zip_magic=prefix.startswith(b'PK\x03\x04')
                      any_zip |= zip_magic
                      pad=out[-1] if out else -1
                      pad_ok=bool(out) and 1<=pad<=16 and out[-pad:]==bytes([pad])*pad
                      print(' ',path,'prefix',prefix.hex(),'zip_magic',zip_magic,'pkcs7',pad_ok)
                  print(label,'ANY_ZIP',any_zip)
              print()
          PY
