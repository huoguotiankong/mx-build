name: Probe Fengche Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fengche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect Fengche search challenge
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://www.fengchemh.com'; ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':ua,'Referer':base+'/'})
              with urllib.request.urlopen(req,timeout=20) as r:return r.read().decode('utf-8','ignore')
          def compact(x): return re.sub(r'\s+',' ',x).strip()
          q=urllib.parse.quote('仙武帝尊')
          page=get('/search?key='+q)
          print('CHALLENGE',compact(page)[:5200])
          for path in ['/template/pc/fengchemanhua/js/ewave-global.js','/template/pc/fengchemanhua/js/home.js']:
              text=get(path)
              print('\nFILE',path)
              for needle in ['Search={','Search =','Search.Init','search-dropdown','search-key','suggest','autocomplete']:
                  start=0
                  while True:
                      i=text.find(needle,start)
                      if i<0: break
                      print('SNIP',needle,compact(text[max(0,i-900):i+2200])[:3100])
                      start=i+len(needle)
          PY
