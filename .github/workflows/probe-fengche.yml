name: Probe Fengche Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fengche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Fengche search
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          base='https://www.fengchemh.com'
          ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9','Referer':base+'/'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.geturl(),r.read().decode('utf-8','ignore')
              except Exception as e: return 0,url,str(e)
          q=urllib.parse.quote('仙武帝尊')
          for path in [f'/search?key={q}',f'/search/{q}',f'/search/{q}/page/2',f'/index.php/search?key={q}']:
              st,url,text=fetch(base+path)
              print('PATH',path,'HTTP',st,'FINAL',url,'BYTES',len(text.encode()))
              print('TITLE',re.sub(r'\s+',' ',re.search(r'<title>(.*?)</title>',text,re.I|re.S).group(1)).strip() if re.search(r'<title>(.*?)</title>',text,re.I|re.S) else '')
              print('COMICS',re.findall(r'href=["\'](/comic/[^"\']+)["\']',text,re.I)[:8])
          for path in ['/packs/mccms/base.js','/template/pc/fengchemanhua/js/home.js','/template/pc/fengchemanhua/js/ewave-global.js']:
              st,url,text=fetch(base+path)
              print('\nJS',path,'HTTP',st,'BYTES',len(text.encode()))
              for pat in [r'/api/[^"\'\s]+',r'/search[^"\'\s]+',r'ajax[^"\'\s]{0,100}',r'search[^"\'\s]{0,120}']:
                  vals=[]
                  for x in re.findall(pat,text,re.I):
                      x=re.sub(r'\s+',' ',x)
                      if x not in vals: vals.append(x)
                  print('MATCH',pat,vals[:25])
          PY
