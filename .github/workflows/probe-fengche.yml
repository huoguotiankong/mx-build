name: Probe Fengche Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fengche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Benchmark Fengche reader image headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, re, subprocess, tempfile, time, urllib.error, urllib.parse, urllib.request

          base='https://www.fengchemh.com'
          chapter=base+'/chapter/XzwzKUa6g4.html'
          ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'

          def get(url, headers=None, timeout=25):
              h={'User-Agent':ua}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      data=r.read()
                      return r.status,r.geturl(),data,time.monotonic()-t
              except urllib.error.HTTPError as e:
                  return e.code,e.geturl(),e.read(),time.monotonic()-t

          status,_,html_raw,elapsed=get(chapter,{'Accept':'text/html,*/*;q=0.8','Referer':base+'/'})
          print('chapter',status,round(elapsed,3),len(html_raw))
          html=html_raw.decode('utf-8','ignore')
          m=re.search(r"params\s*=\s*['\"]([^'\"]+)",html)
          if not m:
              raise SystemExit('params missing')
          raw=base64.b64decode(m.group(1))
          iv=raw[:16]
          ct=raw[16:]
          key=b'9S8$vJnU2ANeSRoF'
          with tempfile.TemporaryDirectory() as td:
              inp=td+'/ct.bin'; out=td+'/plain.bin'
              open(inp,'wb').write(ct)
              subprocess.run([
                  'openssl','enc','-d','-aes-128-cbc',
                  '-K',key.hex(),'-iv',iv.hex(),'-in',inp,'-out',out,
              ],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              obj=json.loads(open(out,'rb').read().decode('utf-8'))

          images=obj.get('images') or []
          print('params host',obj.get('host'),'source_id',obj.get('source_id'),'images',len(images))
          resolved=[]
          reader_host=str(obj.get('host') or '').strip()
          if reader_host and not reader_host.startswith(('http://','https://')):
              reader_host='https://'+reader_host
          for raw_url in images[:5]:
              u=str(raw_url).strip()
              if u.startswith('http://'):
                  u='https://'+u[7:]
              elif u.startswith('//'):
                  u='https:'+u
              elif not u.startswith('https://'):
                  if obj.get('source_id') == 12:
                      u='https://img1.baipiaoguai.org/'+u.lstrip('/')
                  elif reader_host:
                      u=reader_host.rstrip('/')+'/'+u.lstrip('/')
                  else:
                      u=base+'/'+u.lstrip('/')
              resolved.append(u)

          for i,u in enumerate(resolved):
              print('url',i,urllib.parse.urlsplit(u).netloc,urllib.parse.urlsplit(u).path[:140])
              variants=[
                  ('clean',{}),
                  ('chapter-ref',{'Referer':chapter}),
                  ('chapter-ref-origin',{'Referer':chapter,'Origin':base}),
              ]
              for label,h in variants:
                  h={**h,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'}
                  st,final,data,sec=get(u,h,30)
                  print('bench',i,label,'status',st,'time',round(sec,3),'bytes',len(data),'host',urllib.parse.urlsplit(final).netloc,'sha',hashlib.sha256(data).hexdigest()[:12])
          PY
