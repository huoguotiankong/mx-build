name: Probe Fengche Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fengche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Fengche site
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
          base='https://www.fengchemh.com'
          mkdir -p /tmp/fengche
          for path in '/' '/custom/update' '/category/list/1' '/comic/2r0w81JrnN' '/chapter/XzwzKUa6g4.html'; do
            name="$(printf '%s' "$path" | sed 's#[^A-Za-z0-9]#_#g')"
            code="$(curl -L -sS --retry 2 -A "$ua" -o "/tmp/fengche/$name.html" -w '%{http_code}' "$base$path" || true)"
            echo "PATH $path HTTP $code bytes=$(wc -c < "/tmp/fengche/$name.html" 2>/dev/null || echo 0)"
            if [[ -s "/tmp/fengche/$name.html" ]]; then
              grep -Eo '<script[^>]+src=["'"'][^"'"']+' "/tmp/fengche/$name.html" | sed 's/^/SCRIPT /' | head -n 20 || true
              grep -Eo 'params[[:space:]]*=[[:space:]]*["'"'][^"'"']+' "/tmp/fengche/$name.html" | sed -E 's/(params[[:space:]]*=[[:space:]]*["'"']).*/\1<redacted>/' | head -n 5 || true
              grep -Eo 'href=["'"']/chapter/[^"'"']+' "/tmp/fengche/$name.html" | head -n 5 || true
              grep -Eo 'class=["'"'][^"'"']*(comic-item|detail-title|chapter-list|detail-info|img-box)[^"'"']*["'"']' "/tmp/fengche/$name.html" | sort -u | head -n 40 || true
            fi
          done
          chapter='/tmp/fengche/_chapter_XzwzKUa6g4_html.html'
          if [[ -s "$chapter" ]]; then
            python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path('/tmp/fengche/_chapter_XzwzKUa6g4_html.html').read_text('utf-8','ignore')
          m=re.search(r"params\s*=\s*['\"]([^'\"]+)",p)
          print('PARAMS_PRESENT', bool(m), 'LEN', len(m.group(1)) if m else 0)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',p,re.I)
          print('SCRIPTS', scripts)
          PY
            while IFS= read -r src; do
              [[ -z "$src" ]] && continue
              case "$src" in
                http*) url="$src" ;;
                //*) url="https:$src" ;;
                /*) url="$base$src" ;;
                *) url="$base/${src#./}" ;;
              esac
              js="/tmp/fengche/$(basename "${src%%\?*}")"
              code="$(curl -L -sS --retry 2 -A "$ua" -o "$js" -w '%{http_code}' "$url" || true)"
              echo "JS $url HTTP $code bytes=$(wc -c < "$js" 2>/dev/null || echo 0) sha256=$(sha256sum "$js" 2>/dev/null | awk '{print $1}')"
              grep -Eo 'source_id|AES|CBC|PKCS7|CryptoJS|img1\.[A-Za-z0-9.-]+|[A-Za-z0-9$]{16}' "$js" | sort -u | head -n 80 || true
            done < <(python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path('/tmp/fengche/_chapter_XzwzKUa6g4_html.html').read_text('utf-8','ignore')
          for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',p,re.I): print(s)
          PY
            )
          fi
