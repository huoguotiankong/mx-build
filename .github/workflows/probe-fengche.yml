name: Probe Fengche Manga

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-fengche.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Benchmark Fengche cover delivery
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.error, urllib.request
          base='https://www.fengchemh.com'
          ua='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36'
          path='/attachment/comic/2026/08/13/202608132300414275.webp'
          def fetch(url, referer=None):
              headers={'User-Agent':ua,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'}
              if referer: headers['Referer']=referer
              req=urllib.request.Request(url,headers=headers)
              t=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read()
                      return r.status,r.geturl(),len(data),time.monotonic()-t,hashlib.sha256(data).hexdigest()[:16]
              except urllib.error.HTTPError as e:
                  data=e.read()
                  return e.code,e.geturl(),len(data),time.monotonic()-t,hashlib.sha256(data).hexdigest()[:16]
              except Exception as e:
                  return 0,repr(e),0,time.monotonic()-t,''
          for url in ['https://www.fengchemh.com'+path,'http://www.fengchemh.com'+path,'https://fengchemh.com'+path]:
              for label,ref in [('clean',None),('home-ref',base+'/')]:
                  print(label,url,fetch(url,ref))
          PY
