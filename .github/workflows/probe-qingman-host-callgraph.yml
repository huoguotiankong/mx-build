name: Trace Qingman Host Getter Callgraph

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-host-callgraph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace host getter callers and selector
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re,bisect

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|p12|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          def safe(v): return '<redacted-sensitive>' if sensitive.search(v) else v[:520]

          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          funcs=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  m=re.search(r'\*\* addr: 0x([0-9a-fA-F]+), size: 0x([0-9a-fA-F]+)',s)
                  if not m: continue
                  st=int(m.group(1),16); sz=int(m.group(2),16)
                  decl=''
                  for j in range(i-1,max(-1,i-8),-1):
                      t=lines[j].strip()
                      if t and not t.startswith('//'):
                          decl=t; break
                  funcs.append((st,st+sz,p.name,decl,lines,i))
          funcs.sort(key=lambda x:x[0]); starts=[x[0] for x in funcs]
          def owner(addr):
              k=bisect.bisect_right(starts,addr)-1
              return funcs[k] if k>=0 and funcs[k][0]<=addr<funcs[k][1] else None

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base))

          targets={
              0x65893c:'legacy_pttower_getter',
              0x658998:'legacy_shcvv_getter',
              0x6589a4:'legacy_seed_getter',
              0x6589c4:'active_host_selector',
          }

          print('=== TARGET FUNCTION OWNERS ===')
          for a,n in targets.items():
              f=owner(a)
              if f: print(f'{n} 0x{a:x} owner=0x{f[0]:x}-0x{f[1]:x} file={f[2]} decl={safe(f[3])}')
              else: print(f'{n} 0x{a:x} owner=<unmapped>')

          print('\n=== DIRECT CALLS TO HOST GETTERS ===')
          calls=[]
          for it in ins:
              if it.mnemonic=='bl':
                  m=re.match(r'#0x([0-9a-fA-F]+)$',it.op_str.strip())
                  if m:
                      dst=int(m.group(1),16)
                      if dst in targets:
                          calls.append((it.address,dst))
          print('CALL_COUNT='+str(len(calls)))
          for src,dst in calls:
              f=owner(src)
              print(f'CALL 0x{src:x} -> 0x{dst:x} {targets[dst]}')
              if f:
                  print(f'  OWNER 0x{f[0]:x}-0x{f[1]:x} file={f[2]} decl={safe(f[3])}')
                  for s in f[4][max(0,f[5]-4):min(len(f[4]),f[5]+100)]:
                      if re.search(r'(?i)(PP\+0x|LoadStaticField|LoadField|StoreField|call 0x|bl\s+#0x|http|host|domain|api|base|fallback|backup|line|route|url)',s):
                          print('    '+safe(s))
              else:
                  print('  OWNER=<unmapped>')

          def annotate(start,end,title):
              print(f'\n=== {title} 0x{start:x}-0x{end:x} ===')
              pending={}
              for it in md.disasm(data[start-base:end-base],start):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=it.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if it.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),24)
                  elif it.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp: ann=' ; '+safe(f'PP+0x{off:x} {pp[off]}')
                  if ann or it.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'0x{it.address:x} {it.mnemonic:<7} {it.op_str}{ann}')

          annotate(0x6588f0,0x658a70,'HOST GETTERS AND ACTIVE SELECTOR')

          print('\n=== CALLERS OF ACTIVE SELECTOR CONTEXT ===')
          for src,dst in calls:
              if dst != 0x6589c4: continue
              st=max(base,src-0x80); en=min(base+len(data),src+0xa0)
              annotate(st,en,f'CALLSITE_{src:x}')
          PY
