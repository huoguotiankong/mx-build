name: Map Qingman mTLS Flow Function Identities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-mtls-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Patch analyzer to map known safe code addresses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/blutter/blutter/src/main.cpp')
          s=p.read_text()
          anchor='\t\tapp.EnterScope();\n#ifndef NO_CODE_ANALYSIS\n'
          block=(
              '\t\tapp.EnterScope();\n'
              '\t\t{\n'
              '\t\t\tstruct Probe { const char* label; uint64_t addr; };\n'
              '\t\t\tconst Probe probes[] = {\n'
              '\t\t\t\t{"mtls_parent", 0xaac870},\n'
              '\t\t\t\t{"pre_context_create", 0xaace94},\n'
              '\t\t\t\t{"pre_context_config_a", 0x3e0fb8},\n'
              '\t\t\t\t{"pre_context_config_b", 0x3e0d5c},\n'
              '\t\t\t\t{"after_ca_prepare", 0x3d04bc},\n'
              '\t\t\t\t{"credential_apply_a", 0xaacba4},\n'
              '\t\t\t\t{"credential_apply_b", 0xaacb14},\n'
              '\t\t\t\t{"credential_apply_c", 0xaaca84},\n'
              '\t\t\t\t{"client_build", 0x319738},\n'
              '\t\t\t\t{"qxnet_startup", 0xbb9e20},\n'
              '\t\t\t\t{"network_status_init", 0xbb9f0c},\n'
              '\t\t\t\t{"network_status_inner", 0xbb9fe0},\n'
              '\t\t\t\t{"adapter_config_call", 0xbba0c8},\n'
              '\t\t\t\t{"bridge_password", 0xaacc00},\n'
              '\t\t\t\t{"bridge_ca", 0xaacc80},\n'
              '\t\t\t\t{"bridge_p12", 0xaacd00},\n'
              '\t\t\t};\n'
              '\t\t\tstd::cout << "=== SAFE_FUNCTION_MAP ===\\n";\n'
              '\t\t\tfor (const auto& q : probes) {\n'
              '\t\t\t\tauto* fn = app.GetFunction(q.addr);\n'
              '\t\t\t\tstd::cout << q.label << " addr=0x" << std::hex << q.addr << std::dec;\n'
              '\t\t\t\tif (fn) std::cout << " name=" << fn->FullName() << " size=0x" << std::hex << fn->Size() << std::dec << " stub=" << fn->IsStub();\n'
              '\t\t\t\telse std::cout << " name=<unmapped>";\n'
              '\t\t\t\tstd::cout << "\\n";\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '#ifndef NO_CODE_ANALYSIS\n'
          )
          if anchor not in s: raise SystemExit('main.cpp anchor not found')
          p.write_text(s.replace(anchor,block,1))
          PY
          rm -f /tmp/blutter/bin/blutter_dartvm3.12.2_android_arm64

      - name: Run patched analyzer safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out | tee /tmp/blutter-run.log
          echo '=== extracted safe map ==='
          grep -E 'SAFE_FUNCTION_MAP|mtls_parent|pre_context_|after_ca_prepare|credential_apply_|client_build|qxnet_startup|network_status_|adapter_config_call|bridge_' /tmp/blutter-run.log || true
