name: Apply CopyManga Plus v7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-copymangaplus-v6-search-routes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-copymangaplus-v7
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: main
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MX development source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Apply v7 source patch
        run: |
          python3 helper/scripts/finalize_copymangaplus_v7.py dev
          grep -F 'versionCode = 7' dev/src/zh/copymangaplus/build.gradle.kts
          grep -F 'requestChapterListJson(pathWord, groupWord, offset)' dev/src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt
          grep -F 'api.copy202601.com' dev/src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt
          grep -F 'ROUTE_SCHEMA = 6' dev/src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay CopyManga Plus
        run: |
          rm -rf upstream/src/zh/copymangaplus
          cp -a dev/src/zh/copymangaplus upstream/src/zh/copymangaplus

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format build and lint
        working-directory: upstream
        run: |
          ./gradlew :src:zh:copymangaplus:spotlessApply
          ./gradlew :src:zh:copymangaplus:spotlessCheck
          ./gradlew :src:zh:copymangaplus:assembleDebug :src:zh:copymangaplus:lintRelease --stacktrace

      - name: Restore formatted module
        run: |
          rm -rf dev/src/zh/copymangaplus
          mkdir -p dev/src/zh/copymangaplus
          rsync -a --exclude build/ upstream/src/zh/copymangaplus/ dev/src/zh/copymangaplus/
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check

      - name: Commit validated v7 source
        working-directory: dev
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zh/copymangaplus docs/sources/copymangaplus.md
          if git diff --cached --quiet; then
            echo 'No v7 changes to commit.'
          else
            git commit -m 'fix(copymangaplus): repair v7 reading chain'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: copymangaplus-v7-reading-chain-debug
          path: upstream/src/zh/copymangaplus/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
