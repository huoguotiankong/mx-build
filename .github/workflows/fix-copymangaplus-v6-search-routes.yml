name: Fix CopyManga Plus v6 search and Copy routes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-copymangaplus-v6-search-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout mx-dev with publish token
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Apply CopyManga Plus v6 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('dev')
          source = root / 'src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt'
          gradle = root / 'src/zh/copymangaplus/build.gradle.kts'
          docs = root / 'docs/sources/copymangaplus.md'
          text = source.read_text('utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''        val offset = (page.coerceAtLeast(1) - 1) * PAGE_SIZE
          val root = requestJson(
              "/api/v3/search/comic?platform=3&q=${enc(cleanQuery)}&limit=$PAGE_SIZE&offset=$offset&_update=true",
          )
          return mangaPage(root.results(), page, PAGE_SIZE)
      }

      private fun listManga(''',
          '''        return searchManga(page, cleanQuery)
      }

      private fun searchManga(page: Int, query: String): MangasPage {
          val p = page.coerceAtLeast(1)
          val offset = (p - 1) * PAGE_SIZE
          val encoded = enc(query)
          val paths = listOf(
              "/api/v3/search/comic?platform=3&limit=$PAGE_SIZE&offset=$offset&q=$encoded&q_type=",
              "/api/kb/web/searchb/comics?platform=3&limit=$PAGE_SIZE&offset=$offset&q=$encoded&q_type=",
          )
          var firstEmpty: JsonObject? = null
          var last: Throwable? = null
          for (path in paths) {
              try {
                  val results = requestJson(path).results()
                  val list = results?.array("list")
                  if (!list.isNullOrEmpty()) return mangaPage(results, p, PAGE_SIZE)
                  if (firstEmpty == null && results != null) firstEmpty = results
              } catch (e: Throwable) {
                  last = e
              }
          }
          if (firstEmpty != null) return mangaPage(firstEmpty, p, PAGE_SIZE)
          throw IOException(last?.message ?: "搜索接口没有返回有效结果", last)
      }

      private fun listManga(''',
          'search fallback',
          )

          replace_once(
          '''    private fun requestDetailJson(pathWord: String): JsonObject {
          var last: Throwable? = null
          apiCandidates(includeLast = true).distinctBy { it.serialized }.forEach { route ->
              try {
                  val query = if (route.kind == RouteKind.COPY) {
                      "in_mainland=true&request_id=&platform=3"
                  } else {
                      "in_mainland=true&platform=3"
                  }
                  val request = Request.Builder()
                      .url("https://${route.host}/api/v3/comic2/${enc(pathWord)}?$query")
                      .headers(
                          if (route.kind == RouteKind.COPY) {
                              copyDetailHeaders(includeToken = true)
                          } else {
                              apiHeaders(RouteKind.HOT, includeToken = true)
                          },
                      )
                      .get()
                      .build()
                  client.newCall(request).execute().use { response ->
                      val root = parseResponse(response.code, response.body.string())
                      if (root.results()?.obj("comic") == null) {
                          throw IOException("当前节点没有返回漫画详情")
                      }
                      preferences.edit().putString(PREF_LAST_HOST, route.serialized).apply()
                      return root
                  }
              } catch (e: Throwable) {
                  last = e
              }
          }
          throw IOException(last?.message ?: "所有拷贝/热辣详情线路均不可用", last)
      }

      private fun copyDetailHeaders(includeToken: Boolean): Headers {
          val timestamp = (System.currentTimeMillis() / 1000L).toString()
          return Headers.Builder()
              .set("User-Agent", "COPY/$COPY_DETAIL_VERSION")
              .set("source", "copyApp")
              .set("deviceinfo", copyDeviceInfo())
              .set("dt", SimpleDateFormat("yyyy.MM.dd", Locale.US).format(Date()))
              .set("platform", "3")
              .set("referer", "com.copymanga.app-$COPY_DETAIL_VERSION")
              .set("version", COPY_DETAIL_VERSION)
              .set("device", copyDevice())
              .set("pseudoid", copyPseudoId())
              .set("Accept", "application/json")
              .set("region", "0")
              .set(
                  "Authorization",
                  if (includeToken && token().isNotBlank()) "Token ${token()}" else "Token",
              )
              .set("umstring", COPY_UMSTRING)
              .set("x-auth-timestamp", timestamp)
              .set("x-auth-signature", copySignature(timestamp))
              .build()
      }
''',
          '''    private fun requestDetailJson(pathWord: String): JsonObject {
          var last: Throwable? = null
          for (route in apiCandidates(includeLast = true).distinctBy { it.serialized }) {
              val query = if (route.kind == RouteKind.COPY) {
                  "in_mainland=true&request_id=&platform=3"
              } else {
                  "in_mainland=true&platform=3"
