name: Patch CopyManga Plus v6 search fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-copymangaplus-v6-search-empty-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout mx-dev with write token
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Keep searching when a Copy search endpoint returns an empty list
        shell: bash
        working-directory: dev
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt')
          s = p.read_text('utf-8')
          old = '''    private fun requestSearchJson(page: Int, query: String): JsonObject {
              val offset = (page.coerceAtLeast(1) - 1) * PAGE_SIZE
              val encodedQuery = enc(query)
              var last: Throwable? = null
              apiCandidates(includeLast = true).distinctBy { it.serialized }.forEach { route ->
                  val paths = if (route.kind == RouteKind.COPY) {
                      listOf(
                          "/api/v3/search/comic?limit=$PAGE_SIZE&offset=$offset&q=$encodedQuery&q_type=",
                          "$COPY_WEB_SEARCH_PATH?limit=$PAGE_SIZE&offset=$offset&q=$encodedQuery&q_type=",
                      )
                  } else {
                      listOf(
                          "/api/v3/search/comic?platform=3&q=$encodedQuery&limit=$PAGE_SIZE&offset=$offset&_update=true",
                      )
                  }
                  paths.forEach { path ->
                      try {
                          val request = Request.Builder()
                              .url("https://${route.host}$path")
                              .headers(apiHeaders(route.kind, includeToken = true))
                              .get()
                              .build()
                          client.newCall(request).execute().use { response ->
                              val root = parseResponse(response.code, response.body.string())
                              if (root.results()?.array("list") == null) {
                                  throw IOException("当前节点没有返回搜索列表")
                              }
                              preferences.edit().putString(PREF_LAST_HOST, route.serialized).apply()
                              return root
                          }
                      } catch (e: Throwable) {
                          last = e
                      }
                  }
              }
              throw IOException(last?.message ?: "所有搜索线路均不可用", last)
          }
'''
          new = '''    private fun requestSearchJson(page: Int, query: String): JsonObject {
              val offset = (page.coerceAtLeast(1) - 1) * PAGE_SIZE
              val encodedQuery = enc(query)
              var firstEmpty: JsonObject? = null
              var firstEmptyRoute: ApiRoute? = null
              var last: Throwable? = null
              apiCandidates(includeLast = true).distinctBy { it.serialized }.forEach { route ->
                  val paths = if (route.kind == RouteKind.COPY) {
                      listOf(
                          "/api/v3/search/comic?limit=$PAGE_SIZE&offset=$offset&q=$encodedQuery&q_type=",
                          "$COPY_WEB_SEARCH_PATH?limit=$PAGE_SIZE&offset=$offset&q=$encodedQuery&q_type=",
                      )
                  } else {
                      listOf(
                          "/api/v3/search/comic?platform=3&q=$encodedQuery&limit=$PAGE_SIZE&offset=$offset&_update=true",
                      )
                  }
                  paths.forEach { path ->
                      try {
                          val request = Request.Builder()
                              .url("https://${route.host}$path")
                              .headers(apiHeaders(route.kind, includeToken = true))
                              .get()
                              .build()
                          client.newCall(request).execute().use { response ->
                              val root = parseResponse(response.code, response.body.string())
                              val list = root.results()?.array("list")
                                  ?: throw IOException("当前节点没有返回搜索列表")
                              if (list.isNotEmpty()) {
                                  preferences.edit().putString(PREF_LAST_HOST, route.serialized).apply()
                                  return root
                              }
                              if (firstEmpty == null) {
                                  firstEmpty = root
                                  firstEmptyRoute = route
                              }
                          }
                      } catch (e: Throwable) {
                          last = e
                      }
                  }
              }
              firstEmpty?.let {
                  firstEmptyRoute?.let { route ->
                      preferences.edit().putString(PREF_LAST_HOST, route.serialized).apply()
                  }
                  return it
              }
              throw IOException(last?.message ?: "所有搜索线路均不可用", last)
          }
'''
          if old not in s:
              raise SystemExit('requestSearchJson block did not match current source')
          p.write_text(s.replace(old, new, 1), 'utf-8')
          PY
          python3 scripts/validate_sources.py
          git diff --check

      - name: Commit v6 search fallback
        working-directory: dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(copymangaplus): continue search fallback on empty results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
