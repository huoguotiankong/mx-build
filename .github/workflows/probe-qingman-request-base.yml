name: Trace Qingman AppConfig Request Base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-request-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Inspect AppConfig request construction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          deny=re.compile(r'(?i)(password|token|authorization|bearer|cookie|secret|private|clientp12|certificate|keystore|proof|signature|sign/key|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          asm=Path('/tmp/blutter-out/asm')

          def emit(title,p,lines,i,before,after):
              print(f'=== {title} FILE={p.name} LINE={i+1} ===')
              for z in lines[max(0,i-before):min(len(lines),i+after)]:
                  if not deny.search(z): print(z[:900])

          # AppConfig fetch is known to allocate txb in the 0xb028dc..0xb02b5f function.
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              hits=[i for i,z in enumerate(lines) if re.search(r'0xb0290[0-9a-f]:',z,re.I) or re.search(r'0xb028dc\b',z,re.I)]
              for h in hits[:4]: emit('APPCONFIG FETCH EXACT',p,lines,h,120,320)

          # Locate the nearest declared AOT functions around common initializer 0x3ea090.
          funcs=[]
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,z in enumerate(lines):
                  m=re.search(r'\*\* addr:\s*0x([0-9a-fA-F]+)',z)
                  if m: funcs.append((int(m.group(1),16),p,i))
          funcs.sort(key=lambda x:x[0])
          target=0x3ea090
          near=[x for x in funcs if target-0x1200 <= x[0] <= target+0x1200]
          print('=== FUNCTIONS NEAR 0x3ea090 ===')
          for addr,p,i in near:
              lines=p.read_text('utf-8',errors='replace').splitlines()
              header=' | '.join(z.strip() for z in lines[max(0,i-3):i+2] if z.strip())
              if not deny.search(header): print(f'addr=0x{addr:x} file={p.name} line={i+1} {header[:800]}')
          below=[x for x in funcs if x[0] <= target]
          above=[x for x in funcs if x[0] > target]
          if below:
              addr,p,i=below[-1]; emit(f'NEAREST BELOW 0x{addr:x}',p,p.read_text('utf-8',errors='replace').splitlines(),i,12,260)
          if above:
              addr,p,i=above[0]; emit(f'NEAREST ABOVE 0x{addr:x}',p,p.read_text('utf-8',errors='replace').splitlines(),i,12,120)

          # Raw call sites to 0x3ea090, compact, so argument setup before the call is visible.
          print('=== 0x3ea090 CALL SITES ===')
          count=0
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,z in enumerate(lines):
                  if re.search(r'bl\s+#0x3ea090\b',z,re.I):
                      count+=1
                      print(f'--- caller {count} {p.name}:{i+1} ---')
                      for q in lines[max(0,i-28):min(len(lines),i+18)]:
                          if not deny.search(q): print(q[:900])
                      if count>=12: break
              if count>=12: break
          print('shown_callers='+str(count))
          PY
