name: Trace Qingman AppConfig Request Base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-request-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Decode raw route dispatch selector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone >/dev/null
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/q.apk
          rm -rf /tmp/x && mkdir -p /tmp/x
          unzip -q /tmp/q.apk 'lib/arm64-v8a/libapp.so' -d /tmp/x
          python3 - <<'PY'
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re
          path='/tmp/x/lib/arm64-v8a/libapp.so'
          with open(path,'rb') as f:
              elf=ELFFile(f); text=elf.get_section_by_name('.text'); base=int(text['sh_addr']); data=text.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.detail=True
          def dis(start,end,title):
              print(f'=== {title} 0x{start:x}-0x{end:x} ===')
              for i in md.disasm(data[start-base:end-base],start):
                  print(f'0x{i.address:x}: {i.mnemonic:<7} {i.op_str}')
          # The generic requester asks the request descriptor for its route in this window.
          dis(0xaa08d0,0xaa09d0,'GENERIC ROUTE DISPATCH')
          # Known tiny route getters, useful as calibration points for the same selector.
          for a,n in ((0x7e25d0,'interstitial'),(0x7e280c,'homeList'),(0x7e2f78,'getAdConfig'),(0x7e3010,'version')):
              dis(a,a+0x14,'KNOWN ROUTE GETTER '+n)
          # AppConfig request allocation + call to generic requester.
          dis(0xb028dc,0xb02a20,'APPCONFIG FETCH PREFIX')

          print('=== GDT CALL SHAPES IN GENERIC ROUTE WINDOW ===')
          ins=list(md.disasm(data[0xaa08d0-base:0xaa09d0-base],0xaa08d0))
          for idx,i in enumerate(ins):
              if i.mnemonic=='blr':
                  print(f'blr_at=0x{i.address:x} target={i.op_str}')
                  for q in ins[max(0,idx-12):idx+2]: print(f'  0x{q.address:x}: {q.mnemonic} {q.op_str}')
          PY
