name: Trace Qingman AppConfig Request Base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-request-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace selector metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/q.apk
          rm -rf /tmp/lib /tmp/out /tmp/x && mkdir -p /tmp/lib /tmp/out /tmp/x
          unzip -q /tmp/q.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/x
          cp /tmp/x/lib/arm64-v8a/libapp.so /tmp/x/lib/arm64-v8a/libflutter.so /tmp/lib/
          cd /tmp/blutter && python3 blutter.py /tmp/lib /tmp/out >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/out')
          pats=(re.compile(r'(?i)0x(?:beba|ceba)\b'),re.compile(r'\b(?:48826|52922)\b'))
          print('=== SELECTOR METADATA HITS ===')
          count=0
          for p in [root/'objs.txt',root/'pp.txt']+list((root/'asm').glob('*.dart')):
              try: lines=p.read_text('utf-8',errors='replace').splitlines()
              except Exception: continue
              for i,z in enumerate(lines):
                  if any(q.search(z) for q in pats):
                      count+=1
                      print(f'FILE={p.name} LINE={i+1}')
                      for x in lines[max(0,i-12):min(len(lines),i+28)]: print(x[:900])
                      if count>=40: break
              if count>=40: break
          print('hit_count='+str(count))

          print('=== ALL fPa SUBCLASSES CIDS ===')
          rows=[]
          for p in (root/'asm').glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,z in enumerate(lines):
                  m=re.match(r'class\s+([A-Za-z0-9_$]+)\s+extends\s+fPa\b',z.strip())
                  if not m: continue
                  cid='?'
                  for j in range(max(0,i-5),i):
                      cm=re.search(r'class id:\s*(\d+)',lines[j])
                      if cm: cid=cm.group(1)
                  rows.append((int(cid) if cid.isdigit() else 999999,m.group(1),p.name,i+1))
          for cid,name,file,line in sorted(rows): print(f'cid={cid} class={name} file={file} line={line}')
          PY
