name: Trace Qingman AppConfig Request Base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-request-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Enumerate route candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/q.apk
          rm -rf /tmp/lib /tmp/out /tmp/x && mkdir -p /tmp/lib /tmp/out /tmp/x
          unzip -q /tmp/q.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/x
          cp /tmp/x/lib/arm64-v8a/libapp.so /tmp/x/lib/arm64-v8a/libflutter.so /tmp/lib/
          cd /tmp/blutter && python3 blutter.py /tmp/lib /tmp/out >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          pp=Path('/tmp/out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          rows=[]
          for line in pp:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\].*String: "([^"]+)"',line)
              if not m: continue
              s=m.group(2)
              if s.startswith('api/') or s.startswith('/api/'):
                  rows.append((int(m.group(1),16),s))
          print('route_count='+str(len(rows)))
          for off,s in rows:
              print(f'0x{off:x} {s}')
          print('=== APPCONFIG-LIKE NON-API STRINGS ===')
          needles=('config','domain','line','route','server','baseurl','baseurl','image','imgurl','freeurl','officialurl','customerurl','promotionurl')
          for line in pp:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\].*String: "([^"]+)"',line)
              if not m: continue
              s=m.group(2); low=s.lower()
              if any(n in low for n in needles) and len(s)<220:
                  if not any(x in low for x in ('token','password','authorization','certificate','private','secret')):
                      print(f'0x{int(m.group(1),16):x} {s}')
          PY
