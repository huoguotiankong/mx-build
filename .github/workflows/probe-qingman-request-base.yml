name: Trace Qingman AppConfig Request Base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-request-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Isolate fPa and txb request behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          deny=re.compile(r'(?i)(password|token|authorization|bearer|cookie|secret|private|clientp12|certificate|keystore|proof|signature|sign/key|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          asm=Path('/tmp/blutter-out/asm')
          pp=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()

          def safe(line): return not deny.search(line)
          def emit_block(p, lines, i, before=20, after=260, title=''):
              print(f'=== {title} FILE={p.name} LINE={i+1} ===')
              for z in lines[max(0,i-before):min(len(lines),i+after)]:
                  if safe(z): print(z[:900])

          # Exact base class definition, including abstract classes.
          found=False
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if re.match(r'(?:abstract\s+)?class\s+fPa\b',line.strip()):
                      found=True; emit_block(p,lines,i,30,420,'FPA BASE'); break
          print('fpa_found='+str(found).lower())

          # Exact function whose start address is 0x3ea090, rather than every caller.
          found=False
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if re.search(r'\*\* addr:\s*0x3ea090\b',line):
                      found=True; emit_block(p,lines,i,15,260,'FPA INIT OWNER')
          print('fpa_init_owner_found='+str(found).lower())

          # Exact txb/uxb models and any method/class-table metadata nearby.
          for target in ('txb','uxb'):
              for p in asm.glob('*.dart'):
                  lines=p.read_text('utf-8',errors='replace').splitlines()
                  for i,line in enumerate(lines):
                      if re.match(r'(?:abstract\s+)?class\s+'+target+r'\b',line.strip()):
                          emit_block(p,lines,i,20,180,target.upper()+' CLASS')

          # Find every exact class-id 992 mention in objs/pp/asm metadata, excluding unrelated address substrings.
          print('=== CID 992 METADATA ===')
          pats=(re.compile(r'(?i)class id:\s*992\b'),re.compile(r'(?i)cid[=: ]+992\b'),re.compile(r'(?i)class.?id[=: ]+992\b'))
          for p in [Path('/tmp/blutter-out/objs.txt'),Path('/tmp/blutter-out/pp.txt')]+list(asm.glob('*.dart')):
              try: lines=p.read_text('utf-8',errors='replace').splitlines()
              except Exception: continue
              hits=[i for i,z in enumerate(lines) if any(q.search(z) for q in pats)]
              for h in hits[:8]:
                  print(f'FILE={p.name} LINE={h+1}')
                  for z in lines[max(0,h-8):min(len(lines),h+24)]:
                      if safe(z): print(z[:900])

          # Locate AppConfig fetch function exactly by allocation of txb, then surface only PP-backed literals/calls nearby.
          print('=== TXB ALLOCATION CALLERS ===')
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              hits=[i for i,z in enumerate(lines) if 'AllocatetxbStub' in z]
              for h in hits[:8]: emit_block(p,lines,h,140,260,'TXB CALLER')

          # Public route strings with offsets, to compare against route-return functions discovered above.
          print('=== PUBLIC ROUTE OFFSETS ===')
          for line in pp:
              if not safe(line): continue
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\].*String: "([^"]+)"',line)
              if m and m.group(2).startswith('api/'):
                  s=m.group(2)
                  if any(x in s.lower() for x in ('config','home','comic')):
                      print(f'0x{m.group(1)} {s}')
          PY
