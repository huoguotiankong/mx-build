name: Inspect Tencent v30 formatted diff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-tencent-v30-formatted-diff.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check private source token
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout private Tencent branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: fix/tencentcomics-filter-v30
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Apply guarded v30 patch
        working-directory: dev
        run: python3 scripts/patch_tencent_v30_classify.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Format Tencent module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/tencentcomics
          cp -a dev/src/zh/tencentcomics upstream/src/zh/tencentcomics
          cd upstream
          ./gradlew :src:zh:tencentcomics:spotlessApply
          cd ..
          rm -rf dev/src/zh/tencentcomics
          cp -a upstream/src/zh/tencentcomics dev/src/zh/tencentcomics
          rm -rf dev/src/zh/tencentcomics/build

      - name: Print exact formatted patch
        working-directory: dev
        shell: bash
        run: |
          set -euo pipefail
          git diff -- src/zh/tencentcomics/build.gradle.kts \
            src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt \
            src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentClassifyApi.kt \
            docs/sources/tencentcomics.md
