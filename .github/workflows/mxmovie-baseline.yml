name: MXMovie Baseline
run-name: MXMovie baseline · ${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - .github/mxmovie-build-request
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mxmovie-baseline
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'huoguotiankong/mx-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build control
        uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false

      - name: Resolve immutable source revision
        id: source
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.MXMOVIE_SOURCE_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.MXMOVIE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          revision="$(cat control/.github/mxmovie-build-request)"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Source revision must be a full commit SHA'; exit 1; }
          api="https://api.github.com/repos/huoguotiankong/MXMovie/contents/app/build.gradle.kts?ref=$revision"
          credential=''
          if [[ -n "$SOURCE_TOKEN" ]] && curl --fail --silent --output /dev/null -H "Authorization: Bearer $SOURCE_TOKEN" "$api"; then
            credential=source
          elif [[ -n "$PRIVATE_TOKEN" ]] && curl --fail --silent --output /dev/null -H "Authorization: Bearer $PRIVATE_TOKEN" "$api"; then
            credential=read
          elif [[ -n "$PUBLISH_TOKEN" ]] && curl --fail --silent --output /dev/null -H "Authorization: Bearer $PUBLISH_TOKEN" "$api"; then
            credential=publish
          else
            echo '::error::Credentials cannot read MXMovie. Add MXMOVIE_SOURCE_TOKEN with Contents read permission for MXMovie.'
            exit 1
          fi
          echo "credential=$credential" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: huoguotiankong/MXMovie
          ref: ${{ steps.source.outputs.revision }}
          token: ${{ steps.source.outputs.credential == 'source' && secrets.MXMOVIE_SOURCE_TOKEN || steps.source.outputs.credential == 'publish' && secrets.MXMOVIE_PUBLISH_TOKEN || secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up Gradle without public build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Install Android platform and NDK from source catalog
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          read -r API NDK < <(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('gradle/libs.versions.toml').read_text()
          values = [re.search(r'^' + key + r'\s*=\s*"([0-9.]+)"', text, re.M).group(1) for key in ('compileSdk', 'ndk')]
          print(*values)
          PY
          )
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          yes | "$sdk_manager" --licenses >/dev/null 2>&1 || true
          ALL="$("$sdk_manager" --list 2>/dev/null)" || true
          PLATFORM="$(echo "$ALL" | grep -oE "platforms;android-$API(\\.[0-9]+)?" | sort -V | tail -n1 || true)"
          NDK_PACKAGE="$(echo "$ALL" | grep -oE "ndk;$NDK" | sort -V | tail -n1 || true)"
          BUILD_TOOLS="$(echo "$ALL" | grep -oE 'build-tools;3[0-9]+\\.[0-9]+\\.[0-9]+' | sort -V | tail -n1 || true)"
          echo "Resolved SDK packages: PLATFORM=$PLATFORM NDK=$NDK_PACKAGE BUILD_TOOLS=$BUILD_TOOLS"
          test -n "$PLATFORM" || { echo "::error::No SDK platform matching android-$API is available"; exit 1; }
          test -n "$NDK_PACKAGE" || { echo "::error::No NDK package matching $NDK is available"; exit 1; }
          yes 2>/dev/null | "$sdk_manager" --licenses >/dev/null 2>&1 || true
          ARGS=("$PLATFORM" "$NDK_PACKAGE")
          [[ -z "$BUILD_TOOLS" ]] || ARGS+=("$BUILD_TOOLS")
          "$sdk_manager" "${ARGS[@]}"
          test -d "$sdk_root/platforms/${PLATFORM#platforms;}" || { echo "::error::$PLATFORM was not installed"; exit 1; }
          test -d "$sdk_root/ndk/${NDK_PACKAGE#ndk;}" || { echo "::error::$NDK_PACKAGE was not installed"; exit 1; }

      - name: Assemble debug APK and run unit tests
        id: build
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mxmovie-result"
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain > "$RUNNER_TEMP/mxmovie-result/build.log" 2>&1
          result=$?
          set -e
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "$result" > "$RUNNER_TEMP/mxmovie-result/build-exit-code.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/mxmovie-result/source-commit.txt"
          if [[ "$result" == 0 ]]; then
            echo 'Assembly and unit tests completed; verifying APK before encrypted handoff.'
          else
            echo 'Assembly or unit tests failed; detailed logs will be encrypted for review.'
          fi

      - name: Verify APK identity and collect private results
        if: steps.build.outputs.result == '0'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/mxmovie-result"
          read -r version_code version_name < <(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('gradle/libs.versions.toml').read_text()
          print(*(re.search(r'^' + key + r'\s*=\s*"([^"]+)"', text, re.M).group(1) for key in ('appVersionCode', 'appVersionName')))
          PY
          )
          apk="app/build/outputs/apk/debug/MXMovie_${version_name}_debug.apk"
          test -f "$apk"
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          aapt_bin="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n1)"
          apksigner_bin="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          zipalign_bin="$(find "$sdk_root/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          "$aapt_bin" dump badging "$apk" > "$result_dir/apk-identity.txt"
          grep -Fq "package: name='com.mxvideo.app' versionCode='$version_code' versionName='$version_name'" "$result_dir/apk-identity.txt"
          grep -q "application-label:'MX影视'" "$result_dir/apk-identity.txt"
          "$apksigner_bin" verify --print-certs "$apk" > "$result_dir/apk-signature.txt" 2>&1
          expected="$(keytool -exportcert -keystore .key/mx-debug.jks -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f1)"
          grep -qi "$expected" "$result_dir/apk-signature.txt"
          "$zipalign_bin" -c -P 16 -v 4 "$apk" > "$result_dir/zipalign-16kb.txt"
          native_dir="$RUNNER_TEMP/mxmovie-native"
          rm -rf "$native_dir"
          mkdir -p "$native_dir"
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$native_dir"
          NATIVE_DIR="$native_dir" RESULT_DIR="$result_dir" python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          native_dir = Path(os.environ['NATIVE_DIR']) / 'lib' / 'arm64-v8a'
          result_dir = Path(os.environ['RESULT_DIR'])
          required = (
              'libijkffmpeg.so', 'libijksdl.so', 'libijkplayer.so',
              'libmpv.so', 'libplayer.so',
              'libp2p.so', 'libxl_stat.so', 'libxl_thunder_sdk.so',
          )
          report = []
          for name in required:
              path = native_dir / name
              assert path.is_file(), f'Missing required native library: {name}'
              output = subprocess.check_output(['readelf', '-lW', str(path)], text=True)
              aligns = [
                  int(line.split()[-1], 0)
                  for line in output.splitlines()
                  if line.lstrip().startswith('LOAD ')
              ]
              assert aligns, f'No LOAD segments found: {name}'
              minimum = min(aligns)
              assert minimum >= 0x4000, f'{name} LOAD alignment {minimum:#x} is below 16KB'
              report.append(f'{name}: min LOAD alignment={minimum:#x}')
          (result_dir / 'native-16kb.txt').write_text('\n'.join(report) + '\n')
          PY
          rm -rf "$native_dir"
          cp "$apk" "$result_dir/"
          test -d app/build/test-results/testDebugUnitTest
          cp -r app/build/test-results/testDebugUnitTest "$result_dir/unit-tests"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder = Path(os.environ['RUNNER_TEMP']) / 'mxmovie-result'
          files = list((folder / 'unit-tests').glob('TEST-*.xml'))
          assert files, 'No unit test XML results'
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for path in files:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, '0'))
          assert totals['tests'] > 0 and totals['failures'] == totals['errors'] == 0, totals
          (folder / 'test-summary.txt').write_text(str(totals) + '\n')
          PY

      - name: Publish verified APK to private MXMovie Release
        if: steps.build.outputs.result == '0'
        working-directory: source
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.MXMOVIE_SOURCE_TOKEN }}
          PRIVATE_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.MXMOVIE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          base = 'https://api.github.com/repos/huoguotiankong/MXMovie'
          folder = Path(os.environ['RUNNER_TEMP']) / 'mxmovie-result'
          revision = (folder / 'source-commit.txt').read_text().strip()
          catalog = Path('gradle/libs.versions.toml').read_text()
          version = re.search(r'^appVersionName\s*=\s*"([^"]+)"', catalog, re.M).group(1)
          apk = next(folder.glob('MXMovie_*_debug.apk'))
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (folder / 'apk-sha256.txt').write_text(digest + '\n')
          tag = 'v' + version + '-debug-' + revision[:8]
          def request(url, token, method='GET', data=None, content_type='application/json'):
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': content_type}
              req = urllib.request.Request(url, headers=headers, method=method, data=data)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)
          published = False
          for name in ('PUBLISH_TOKEN',):
              token = os.environ.get(name, '')
              if not token:
                  continue
              try:
                  repo = request(base, token)
                  if repo.get('private') is not True:
                      raise RuntimeError('Destination must be private')
                  try:
                      release = request(base + '/releases/tags/' + tag, token)
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      body = {'tag_name': tag, 'target_commitish': revision, 'name': 'MX影视 ' + version + ' Debug',
                              'prerelease': True, 'body': 'MX影视测试版；待实机回归。\n\n源码：' + revision +
                              '\n单测：' + (folder / 'test-summary.txt').read_text().strip() + '\nAPK SHA-256：' + digest}
                      release = request(base + '/releases', token, 'POST', json.dumps(body).encode())
                  existing = next((asset for asset in release.get('assets', []) if asset['name'] == apk.name), None)
                  if existing:
                      raise RuntimeError('Asset already exists; refuse to replace or assume verified')
                  upload = release['upload_url'].split('{')[0] + '?name=' + apk.name
                  asset = request(upload, token, 'POST', apk.read_bytes(), 'application/vnd.android.package-archive')
                  (folder / 'private-download-url.txt').write_text(asset['browser_download_url'] + '\n')
                  print('Verified APK published to private MXMovie Release.')
                  published = True
                  break
              except urllib.error.HTTPError as error:
                  print('Private publishing credential attempt returned HTTP ' + str(error.code))
              except Exception as error:
                  print('Private publishing attempt failed: ' + type(error).__name__)
          if not published:
              (folder / 'publish-status.txt').write_text('BLOCKED: no successful private release upload\n')
              print('::warning::Build verified; private APK publishing blocked. Add MXMOVIE_PUBLISH_TOKEN with MXMovie Contents write. No plaintext public artifact uploaded.')
          PY

      - name: Encrypt results for private delivery
        if: always() && steps.build.outputs.result != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p encrypted
          tar -czf "$RUNNER_TEMP/mxmovie-results.tar.gz" -C "$RUNNER_TEMP/mxmovie-result" .
          openssl rand -hex 32 > "$RUNNER_TEMP/mxmovie-transfer-pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/mxmovie-results.tar.gz" -out encrypted/results.tar.gz.enc \
            -pass file:"$RUNNER_TEMP/mxmovie-transfer-pass"
          openssl pkeyutl -encrypt -pubin -inkey control/.github/mxmovie-handoff-public.pem \
            -in "$RUNNER_TEMP/mxmovie-transfer-pass" -out encrypted/key.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          sha256sum encrypted/results.tar.gz.enc > encrypted/SHA256SUMS
          rm -f "$RUNNER_TEMP/mxmovie-transfer-pass" "$RUNNER_TEMP/mxmovie-results.tar.gz"

      - name: Upload encrypted results only
        if: always() && steps.build.outputs.result != ''
        uses: actions/upload-artifact@v7
        with:
          name: mxmovie-encrypted-results-${{ github.run_number }}
          path: encrypted/*
          if-no-files-found: error
          retention-days: 2

      - name: Report build failure
        if: steps.build.outputs.result != '' && steps.build.outputs.result != '0'
        run: |
          echo '::error::Assembly or unit tests failed. Detailed logs are in the encrypted artifact.'
          exit 1

      - name: Clean private checkout and results
        if: always()
        shell: bash
        run: |
          rm -rf source "$RUNNER_TEMP/mxmovie-result"
          rm -f "$RUNNER_TEMP/mxmovie-transfer-pass" "$RUNNER_TEMP/mxmovie-results.tar.gz"
