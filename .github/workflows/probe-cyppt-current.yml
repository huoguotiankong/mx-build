name: Probe Cyppt Current

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cyppt-current.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect Cyppt routes, selectors and reader transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q beautifulsoup4
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'
          BASE='https://www.cyppt.com'
          mkdir -p /tmp/cyppt
          fetch() {
            local name="$1" url="$2"
            local out="/tmp/cyppt/$name.html"
            code=$(curl -L --compressed --connect-timeout 10 --max-time 30 -A "$UA" -sS -o "$out" -w '%{http_code}' "$url" || true)
            echo "FETCH $name http=$code bytes=$(wc -c < "$out" 2>/dev/null || echo 0)"
          }
          fetch latest "$BASE/latest/"
          fetch latest2 "$BASE/latest/index_2.html"
          fetch release "$BASE/release/"
          fetch completed "$BASE/completed/"
          fetch guoman "$BASE/guoman/"
          fetch guoman2 "$BASE/guoman/index_2.html"
          fetch hanman "$BASE/hanman/"
          fetch riman "$BASE/riman/"
          fetch oumei "$BASE/oumei/"
          fetch gangtai "$BASE/gangtai/"
          fetch search "$BASE/e/search/index.php?keyboard=%E5%A4%A9%E9%BB%91&show=title%2Cwriter%2Cbyr&searchget=1"
          fetch detail "$BASE/novel30137/"
          fetch detail2 "$BASE/novel30137/index_2.html"
          fetch reader "$BASE/novel30197/chapter0.html"

          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re
          def S(name): return BeautifulSoup(Path(f'/tmp/cyppt/{name}.html').read_text('utf-8',errors='ignore'),'html.parser')
          def T(e): return ' '.join(e.stripped_strings) if e else ''

          print('===== LIST SELECTORS =====')
          for name in ['latest','latest2','release','completed','guoman','guoman2','hanman','riman','oumei','gangtai','search']:
              s=S(name)
              print('\n--',name,'-- title=',T(s.title))
              cards=s.select('.each_truyen')
              print('cards=',len(cards))
              for c in cards[:3]:
                  novel=c.select_one('a[href*="/novel"]')
                  title=c.select_one('.caption a[href*="/novel"], .caption h3, h3 a[href*="/novel"]')
                  img=c.select_one('img')
                  status=c.select_one('.tt-status, .chi-tiet')
                  print('CARD class=',c.get('class'),'href=',novel.get('href') if novel else None,'title=',T(title),'img=',img.get('src') if img else None,'data=',img.get('data-src') if img else None,'original=',img.get('data-original') if img else None,'alt=',img.get('alt') if img else None,'status=',T(status))
              pager=[(T(a),a.get('href')) for a in s.select('a[href]') if T(a) in ['Next','Last','Prev','First','下一页','上一页'] or re.fullmatch(r'\d+',T(a))]
              print('pager=',pager[:20])

          print('\n===== DETAIL FIELDS =====')
          d=S('detail')
          for e in d.select('.info > *, .info li, .info p, .info span, .info a'):
              t=T(e)
              if t: print('INFOCHILD',e.name,e.get('class'),t[:200],e.get('href'))
          for e in d.select('.single-content, .entry-content, .description, .intro, .summary, .story-detail-info'):
              print('DESCNODE',e.name,e.get('class'),T(e)[:1000])
          for img in d.select('img'):
              if 'wp-post-image' in (img.get('class') or []) or 'titlepic' in (img.get('src') or ''):
                  print('COVER',img.get('src'),img.get('data-src'),img.get('alt'),img.get('class'))
          ch=[]
          for a in d.select('ul.list-chapter a[href*="chapter"]'):
              if T(a): ch.append((a.get('href'),T(a)))
          print('detail_chapters=',len(ch),'first=',ch[:5],'last=',ch[-5:])
          dp=[(T(a),a.get('href')) for a in d.select('a[href]') if T(a) in ['First','Prev','Next','Last'] or re.fullmatch(r'\d+',T(a))]
          print('detail_pager=',dp)
          d2=S('detail2')
          ch2=[(a.get('href'),T(a)) for a in d2.select('ul.list-chapter a[href*="chapter"]') if T(a)]
          print('detail2_chapters=',len(ch2),'first=',ch2[:5],'last=',ch2[-5:])

          print('\n===== READER SELECTORS =====')
          r=S('reader')
          imgs=[]
          for img in r.select('img.comic_img.lazy[data-original], img.comic_img[data-original]'):
              u=img.get('data-original')
              if u and u not in imgs: imgs.append(u)
          print('reader_count=',len(imgs),'first=',imgs[:2],'last=',imgs[-2:])
          Path('/tmp/cyppt/reader_urls.txt').write_text('\n'.join(imgs))
          print('nav=',[(T(a),a.get('href')) for a in r.select('a.btn[href]') if T(a) in ['上一话','下一话']])
          PY

          echo '===== READER HTTPS / REFERER TEST ====='
          mapfile -t imgs < /tmp/cyppt/reader_urls.txt
          count=${#imgs[@]}
          for i in 0 $((count/2)) $((count-1)); do
            u="${imgs[$i]}"
            hs="${u/http:\/\//https://}"
            for mode in http https; do
              testu="$u"; [[ "$mode" == https ]] && testu="$hs"
              c0=$(curl -L --compressed --connect-timeout 10 --max-time 25 -A "$UA" -sS -o "/tmp/cyppt/${mode}-${i}-0" -w '%{http_code}' "$testu" || true)
              c1=$(curl -L --compressed --connect-timeout 10 --max-time 25 -A "$UA" -e "$BASE/novel30197/chapter0.html" -sS -o "/tmp/cyppt/${mode}-${i}-1" -w '%{http_code}' "$testu" || true)
              echo "$mode page=$i no-ref=$c0 bytes=$(wc -c < /tmp/cyppt/${mode}-${i}-0 2>/dev/null || echo 0) ref=$c1 bytes=$(wc -c < /tmp/cyppt/${mode}-${i}-1 2>/dev/null || echo 0) url=$testu"
            done
          done
