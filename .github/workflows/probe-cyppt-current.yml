name: Probe Cyppt Current

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cyppt-current.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Export Cyppt brand assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error --max-time 30 https://www.cyppt.com/novel/images/readnovel-logo.png -o /tmp/cyppt-logo.png
          curl -L --fail --silent --show-error --max-time 30 https://www.cyppt.com/favicon.ico -o /tmp/cyppt-favicon.ico
          file /tmp/cyppt-logo.png /tmp/cyppt-favicon.ico
          sha256sum /tmp/cyppt-logo.png /tmp/cyppt-favicon.ico
          echo "LOGO_BASE64_BEGIN"
          base64 -w 0 /tmp/cyppt-logo.png
          echo
          echo "LOGO_BASE64_END"
          echo "FAVICON_BASE64_BEGIN"
          base64 -w 0 /tmp/cyppt-favicon.ico
          echo
          echo "FAVICON_BASE64_END"
