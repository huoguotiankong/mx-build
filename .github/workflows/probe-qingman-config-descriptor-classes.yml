name: Inspect Qingman Request Descriptor Metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Inspect class/function metadata without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re
          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          def clean(s):
              if sensitive.search(s): return '<redacted-sensitive-line>'
              return s[:1000]

          for fname in ('objs.txt','pp.txt'):
              p=Path('/tmp/blutter-out')/fname
              lines=p.read_text('utf-8',errors='replace').splitlines()
              print(f'=== {fname} target metadata ===')
              terms=('txb','Asb','class id: 992','class id: 1114','fPa')
              hits=[]
              for i,s in enumerate(lines):
                  if any(t.lower() in s.lower() for t in terms): hits.append(i)
              print('hit_count='+str(len(hits)))
              shown=set()
              for i in hits[:120]:
                  for n in range(max(0,i-35),min(len(lines),i+90)):
                      if n in shown: continue
                      shown.add(n)
                      print(f'{fname}:{n+1}: {clean(lines[n])}')

          print('=== ASM methods returning route-like strings ===')
          asm=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: asm.append((p,p.read_text('utf-8',errors='replace').splitlines()))
              except Exception: pass
          route_words=('api/comic/','api/radio/','api/appapi/')
          count=0
          for p,lines in asm:
              for i,line in enumerate(lines):
                  if not any(w in line for w in route_words): continue
                  print(f'ROUTE_LINE {p.name}:{i+1}: {clean(line)}')
                  for n in range(max(0,i-18),min(len(lines),i+35)):
                      print(clean(lines[n]))
                  count+=1
                  if count>=120: break
              if count>=120: break
          print('ROUTE_FUNCTION_HITS='+str(count))
          PY
