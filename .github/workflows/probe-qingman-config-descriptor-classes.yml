name: Trace Qingman Shared API Host Field Writers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Run analyzer and trace shared field writers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          def clean(s):
              if sensitive.search(s):
                  return re.sub(r'"[^"]*"','"<redacted>"',s)[:900]
              return s[:900]

          print('=== EXACT STATIC FIELD METADATA ===')
          for fname in ('pp.txt','objs.txt'):
              lines=(Path('/tmp/blutter-out')/fname).read_text('utf-8',errors='replace').splitlines()
              hits=[(i,s) for i,s in enumerate(lines) if '(offset: 0x24f8)' in s.lower() or '(offset: 0x2500)' in s.lower()]
              print(f'{fname} exact_hits={len(hits)}')
              for i,s in hits:
                  print(f'{fname}:{i+1}: {clean(s)}')
                  for n in range(max(0,i-4),min(len(lines),i+5)):
                      if n != i: print(f'{fname}:{n+1}: {clean(lines[n])}')

          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f)
              sec=elf.get_section_by_name('.text')
              base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base))

          def pp_ann(window):
              out={}
              pending={}
              for idx in window:
                  it=ins[idx]; op=it.op_str.lower()
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if it.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),16)
                  elif it.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              out[idx]=f' ; PP+0x{off:x}={clean(pp[off])}'
              return out

          print('=== RAW SHARED FIELD OFFSET REFERENCES ===')
          hits=[]
          for i,it in enumerate(ins):
              op=it.op_str.lower().replace(' ', '')
              if '#0x24f8]' in op or '#9464]' in op or '#0x2500]' in op or '#9472]' in op:
                  hits.append(i)
          print('raw_hits='+str(len(hits)))
          emitted=set()
          for i in hits[:80]:
              start=max(0,i-70); end=min(len(ins),i+100)
              key=(start,end)
              if key in emitted: continue
              emitted.add(key)
              anns=pp_ann(range(start,end))
              it=ins[i]
              print(f'--- HIT addr=0x{it.address:x} {it.mnemonic} {it.op_str} ---')
              for j in range(start,end):
                  x=ins[j]
                  mark='>>' if j==i else '  '
                  print(f'{mark} 0x{x.address:x} {x.mnemonic:<8} {x.op_str}{anns.get(j,"")}')

          print('=== THR SHARED FIELD TABLE CHAINS ===')
          chains=0
          for i,it in enumerate(ins):
              if it.mnemonic!='ldr': continue
              m=re.match(r'(x\d+),\s*\[x26,\s*#0x78\]$',it.op_str.lower())
              if not m: continue
              r=m.group(1)
              for j in range(i+1,min(len(ins),i+12)):
                  op=ins[j].op_str.lower().replace(' ','')
                  if f'[{r},#0x24f8]' in op or f'[{r},#0x2500]' in op:
                      print(f'chain thr=0x{it.address:x} field=0x{ins[j].address:x} op={ins[j].mnemonic} {ins[j].op_str}')
                      chains+=1
          print('chains='+str(chains))

          print('=== SAFE API-DOMAIN CONTROL STRINGS ===')
          terms=('apidomain','api domain','api 域名','bootstrap: apidomain','api 域名未就绪','api 域名已就绪','api 域名连续')
          for off,val in sorted(pp.items()):
              low=val.lower()
              if any(t.lower() in low for t in terms) and not sensitive.search(val):
                  print(f'PP+0x{off:x}: {val[:900]}')
          PY
