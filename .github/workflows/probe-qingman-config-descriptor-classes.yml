name: Identify Qingman Config Request Descriptor Classes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Calibrate allocator tags and resolve target classes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          def clean(s):
              if sensitive.search(s):
                  s=re.sub(r'"[^"]*"','"<redacted>"',s)
              return s[:700]

          print('=== KNOWN CLASS METADATA ===')
          for root in ('/tmp/blutter-out/objs.txt','/tmp/blutter-out/asm/VRl.dart'):
              p=Path(root)
              if not p.exists(): continue
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for name in ('nub','evb'):
                  hits=[i for i,s in enumerate(lines) if re.search(r'\bclass\s+'+name+r'\b',s)]
                  print(f'{p.name} class={name} hits={len(hits)}')
                  for i in hits[:4]:
                      for n in range(max(0,i-4),min(len(lines),i+35)):
                          print(clean(lines[n]))

          print('=== ALLOCATOR STUB DISASSEMBLY ===')
          stubs={
              'known_nub':'0xae2a38',
              'known_evb':'0xae1f48',
              'target_app':'0xb02b90',
              'target_chaping':'0xb028d0',
          }
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f)
              sec=elf.get_section_by_name('.text')
              base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          for label,addr_s in stubs.items():
              addr=int(addr_s,16)
              print(f'STUB {label} {addr_s}')
              for ins in md.disasm(data[addr-base:addr-base+32],addr):
                  print(f'  {ins.address:#x} {ins.mnemonic:<8} {ins.op_str}')

          print('=== ALL ASM REFERENCES TO KNOWN/TARGET STUBS ===')
          needles={k:v.lower() for k,v in stubs.items()}
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: lines=p.read_text('utf-8',errors='replace').splitlines()
              except Exception: continue
              for i,line in enumerate(lines):
                  low=line.lower()
                  labels=[k for k,v in needles.items() if v in low]
                  if labels:
                      print(f'REF labels={labels} file={p.name} line={i+1}: {clean(line)}')

          print('=== NEARBY CLASS HEADERS IN VRL ===')
          p=Path('/tmp/blutter-out/asm/VRl.dart')
          if p.exists():
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if re.match(r'\s*class\s+(nub|evb)\b',line):
                      for n in range(max(0,i-8),min(len(lines),i+30)):
                          print(clean(lines[n]))
          PY
