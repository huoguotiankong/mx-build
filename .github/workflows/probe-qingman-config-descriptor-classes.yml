name: Identify Qingman Config Request Descriptor Classes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Locate descriptor class IDs and methods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          def clean(s):
              if sensitive.search(s):
                  s=re.sub(r'"[^"]*"','"<redacted>"',s)
              return s[:700]

          ids={
              992:'target_app',
              1114:'target_chaping',
              1054:'known_evb',
              1073:'known_nub',
          }
          names={}
          print('=== CLASS ID SEARCH ACROSS ASM ===')
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: lines=p.read_text('utf-8',errors='replace').splitlines()
              except Exception: continue
              for i,line in enumerate(lines):
                  m=re.search(r'class id:\s*(\d+)',line,re.I)
                  if not m: continue
                  cid=int(m.group(1))
                  if cid not in ids: continue
                  print(f'MATCH label={ids[cid]} cid={cid} file={p.name} line={i+1}: {clean(line)}')
                  for n in range(i,min(len(lines),i+260)):
                      z=lines[n]
                      print(clean(z))
                      cm=re.match(r'\s*class\s+([A-Za-z0-9_$]+)\b',z)
                      if cm and cid not in names:
                          names[cid]=cm.group(1)

          print('RESOLVED_NAMES='+','.join(f'{cid}:{ids[cid]}:{names.get(cid,"?")}' for cid in ids))

          print('=== CLASS NAME REFERENCES ===')
          for cid,name in names.items():
              needle=re.compile(r'\b'+re.escape(name)+r'\b')
              count=0
              for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
                  try: lines=p.read_text('utf-8',errors='replace').splitlines()
                  except Exception: continue
                  for i,line in enumerate(lines):
                      if not needle.search(line): continue
                      print(f'REF cid={cid} label={ids[cid]} class={name} file={p.name} line={i+1}: {clean(line)}')
                      count+=1
                      if count>=80: break
                  if count>=80: break

          print('=== OBJS CLASS ID SEARCH ===')
          p=Path('/tmp/blutter-out/objs.txt')
          if p.exists():
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if any(re.search(r'class id:\s*'+str(cid)+r'\b',line,re.I) for cid in ids):
                      print(f'OBJS line={i+1}: {clean(line)}')
                      for n in range(i,min(len(lines),i+80)):
                          print(clean(lines[n]))
          PY
