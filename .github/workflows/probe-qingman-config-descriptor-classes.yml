name: Identify Qingman Config Request Descriptor Classes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace config descriptor base class and network dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          def clean(s):
              if sensitive.search(s):
                  s=re.sub(r'"[^"]*"','"<redacted>"',s)
              return s[:800]

          print('=== PP NEIGHBORHOODS ===')
          pp=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          for needle in ('Type: txb','Type: Asb','txb','Asb','fPa'):
              hits=[i for i,s in enumerate(pp) if needle.lower() in s.lower()]
              print(f'PP needle={needle} hits={len(hits)}')
              shown=set()
              for i in hits[:20]:
                  for n in range(max(0,i-60),min(len(pp),i+100)):
                      if n in shown: continue
                      shown.add(n)
                      print(f'PP:{n+1}: {clean(pp[n])}')

          print('=== BASE CLASS fPa DEFINITIONS ===')
          asm_files=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: asm_files.append((p,p.read_text('utf-8',errors='replace').splitlines()))
              except Exception: pass
          for p,lines in asm_files:
              for i,line in enumerate(lines):
                  if re.match(r'\s*class\s+fPa\b',line):
                      print(f'FPA file={p.name} line={i+1}')
                      for n in range(max(0,i-15),min(len(lines),i+700)):
                          print(clean(lines[n]))

          print('=== TARGET SUBCLASS FILES ===')
          for target in ('txb','Asb'):
              for p,lines in asm_files:
                  for i,line in enumerate(lines):
                      if re.match(r'\s*class\s+'+target+r'\b',line):
                          print(f'SUBCLASS {target} file={p.name} line={i+1}')
                          for n in range(max(0,i-25),min(len(lines),i+180)):
                              print(clean(lines[n]))

          print('=== NETWORK DISPATCH ADDRESS 0xaa0250 ===')
          needle='0xaa0250'
          emitted=set(); total=0
          for p,lines in asm_files:
              for i,line in enumerate(lines):
                  if needle not in line.lower(): continue
                  print(f'HIT file={p.name} line={i+1}: {clean(line)}')
                  s=i
                  while s>0 and '** addr:' not in lines[s]: s-=1
                  if '** addr:' not in lines[s]: s=max(0,i-100)
                  e=len(lines)
                  for j in range(s+1,len(lines)):
                      if '** addr:' in lines[j]: e=j; break
                  key=(str(p),s,e)
                  if key in emitted: continue
                  emitted.add(key)
                  print(f'CALLER_FUNCTION file={p.name} lines={s+1}-{e}')
                  for n in range(s,min(e,s+500)):
                      print(clean(lines[n])); total+=1
                      if total>=3200: break
                  if total>=3200: break
              if total>=3200: break

          print('=== FUNCTION DEFINITION STARTING AT 0xaa0250 ===')
          for p,lines in asm_files:
              for i,line in enumerate(lines):
                  if '** addr: 0xaa0250' in line.lower():
                      print(f'DEF file={p.name} line={i+1}')
                      for n in range(i,min(len(lines),i+1000)):
                          print(clean(lines[n]))
          PY
