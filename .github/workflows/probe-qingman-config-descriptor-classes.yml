name: Resolve Qingman Request Host GDT Targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Patch analyzer for safe host-slot resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/blutter/blutter/src/main.cpp')
          s=p.read_text()
          s=s.replace('#include "args.hxx"\n', '#include "args.hxx"\n#include "vm/thread.h"\n')
          anchor='\t\tapp.EnterScope();\n#ifndef NO_CODE_ANALYSIS\n'
          block=(
              '\t\tapp.EnterScope();\n'
              '\t\t{\n'
              '\t\t\tauto* gdt = dart::Thread::Current()->dispatch_table_array();\n'
              '\t\t\tstruct Probe { const char* label; intptr_t cid; intptr_t offset; };\n'
              '\t\t\tconst Probe probes[] = {\n'
              '\t\t\t\t{"app_path", 992, 0xbeba},\n'
              '\t\t\t\t{"app_query_flag", 992, 0xd997},\n'
              '\t\t\t\t{"app_host", 992, 0xda56},\n'
              '\t\t\t\t{"app_method", 992, 0xdc93},\n'
              '\t\t\t\t{"chaping_path", 1114, 0xbeba},\n'
              '\t\t\t\t{"chaping_query_flag", 1114, 0xd997},\n'
              '\t\t\t\t{"chaping_host", 1114, 0xda56},\n'
              '\t\t\t\t{"chaping_method", 1114, 0xdc93},\n'
              '\t\t\t};\n'
              '\t\t\tstd::cout << "=== SAFE_GDT_HOST_TARGETS ===\\n";\n'
              '\t\t\tfor (const auto& q : probes) {\n'
              '\t\t\t\tconst intptr_t index = q.cid + q.offset;\n'
              '\t\t\t\tconst uintptr_t entry = static_cast<uintptr_t>(gdt[index]);\n'
              '\t\t\t\tstd::cout << q.label << " cid=" << q.cid << " slot=0x" << std::hex << q.offset << std::dec;\n'
              '\t\t\t\tif (entry == 0) { std::cout << " entry=null\\n"; continue; }\n'
              '\t\t\t\tif (entry >= static_cast<uintptr_t>(app.base())) {\n'
              '\t\t\t\t\tconst uint64_t rel = entry - static_cast<uintptr_t>(app.base());\n'
              '\t\t\t\t\tstd::cout << " entry_rel=0x" << std::hex << rel << std::dec;\n'
              '\t\t\t\t\tauto* fn = app.GetFunction(rel);\n'
              '\t\t\t\t\tif (fn != nullptr) std::cout << " fn=" << fn->FullName(); else std::cout << " fn=<unmapped>";\n'
              '\t\t\t\t} else { std::cout << " entry=<outside-libapp>"; }\n'
              '\t\t\t\tstd::cout << "\\n";\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '#ifndef NO_CODE_ANALYSIS\n'
          )
          if anchor not in s: raise SystemExit('main.cpp anchor not found')
          p.write_text(s.replace(anchor,block,1))
          PY
          rm -f /tmp/blutter/bin/blutter_dartvm3.12.2_android_arm64

      - name: Run patched analyzer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out | tee /tmp/blutter-run.log
          echo '=== extracted host target lines ==='
          grep -E 'SAFE_GDT_HOST_TARGETS|app_(path|query_flag|host|method)|chaping_(path|query_flag|host|method)' /tmp/blutter-run.log || true
