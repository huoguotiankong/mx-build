name: Trace Qingman Shared API Host Field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Run analyzer and trace field-table host state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          def clean(s):
              if sensitive.search(s):
                  return re.sub(r'"[^"]*"','"<redacted>"',s)[:900]
              return s[:900]

          print('=== FIELD METADATA 0x24f8 / 0x2500 ===')
          for fname in ('pp.txt','objs.txt'):
              p=Path('/tmp/blutter-out')/fname
              lines=p.read_text('utf-8',errors='replace').splitlines()
              hits=[i for i,s in enumerate(lines) if '0x24f8' in s.lower() or '0x2500' in s.lower()]
              print(f'{fname} hits={len(hits)}')
              shown=set()
              for i in hits[:80]:
                  for n in range(max(0,i-20),min(len(lines),i+35)):
                      if n in shown: continue
                      shown.add(n)
                      print(f'{fname}:{n+1}: {clean(lines[n])}')

          print('=== ASM FIELD TABLE ACCESS WINDOWS ===')
          total=0; emitted=set()
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: lines=p.read_text('utf-8',errors='replace').splitlines()
              except Exception: continue
              hits=[]
              for i,s in enumerate(lines):
                  low=s.lower()
                  if '#0x24f8]' in low or '#0x2500]' in low:
                      hits.append(i)
              for i in hits:
                  start=i
                  while start>0 and '** addr:' not in lines[start]: start-=1
                  if '** addr:' not in lines[start]: start=max(0,i-60)
                  end=len(lines)
                  for j in range(start+1,len(lines)):
                      if '** addr:' in lines[j]: end=j; break
                  key=(str(p),start,end)
                  if key in emitted: continue
                  emitted.add(key)
                  print(f'FUNCTION file={p.name} lines={start+1}-{end} hit={i+1}: {clean(lines[i])}')
                  for n in range(start,min(end,start+700)):
                      print(clean(lines[n])); total+=1
                      if total>=4200: break
                  if total>=4200: break
              if total>=4200: break
          print('PRINTED_LINES='+str(total))

          print('=== SAFE DOMAIN/HOST STRINGS AROUND API CONFIG ===')
          pp=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          terms=('apidomain','api domain','api 域名','qingman.mom','zermh.com','mhxiaomidi.com','getAdConfig','homepage/interstitial')
          for i,s in enumerate(pp):
              if any(t.lower() in s.lower() for t in terms):
                  if sensitive.search(s): continue
                  print(f'PP:{i+1}: {s[:900]}')
          PY
