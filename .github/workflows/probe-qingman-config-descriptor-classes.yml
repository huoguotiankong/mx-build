name: Map Qingman Request Route Getters

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Find route getter functions and GDT slot clues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          def clean(s):
              if sensitive.search(s): return '<redacted-sensitive-line>'
              return s[:800]

          pp_lines=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          pp={}
          for line in pp_lines:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          routes=[
              'api/comic/comics/v1/homeList',
              'api/radio/api/config/getAdConfig',
              'api/radio/api/config/homepage/interstitial',
              'api/appapi/user/deregistration/cancel',
              'api/radio/api/config/version',
          ]
          route_offsets={}
          print('=== ROUTE PP OFFSETS ===')
          for route in routes:
              offs=[off for off,val in pp.items() if route in val]
              route_offsets[route]=offs
              print(route, [hex(x) for x in offs])

          asm=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: asm.append((p,p.read_text('utf-8',errors='replace').splitlines()))
              except Exception: pass

          def bounds(lines,i):
              s=i
              while s>0 and '** addr:' not in lines[s]: s-=1
              if '** addr:' not in lines[s]: s=max(0,i-60)
              e=len(lines)
              for j in range(s+1,len(lines)):
                  if '** addr:' in lines[j]: e=j; break
              return s,e

          print('=== ROUTE REFERENCE FUNCTIONS ===')
          emitted=set(); total=0
          for route,offs in route_offsets.items():
              for off in offs:
                  patterns=(f'[pp+0x{off:x}]'.lower(), f'#0x{off:x}'.lower())
                  hits=[]
                  for p,lines in asm:
                      for i,line in enumerate(lines):
                          low=line.lower()
                          if patterns[0] in low:
                              hits.append((p,lines,i))
                  print(f'ROUTE {route} PP+0x{off:x} asm_hits={len(hits)}')
                  for p,lines,i in hits[:16]:
                      print(f'HIT {p.name}:{i+1}: {clean(lines[i])}')
                      s,e=bounds(lines,i); key=(str(p),s,e)
                      if key in emitted: continue
                      emitted.add(key)
                      print(f'FUNCTION {p.name}:{s+1}-{e}')
                      for n in range(s,min(e,s+360)):
                          print(clean(lines[n])); total+=1
                          if total>=2800: break
                      if total>=2800: break
                  if total>=2800: break
              if total>=2800: break

          print('=== GDT SLOT REFERENCES IN ASM ===')
          for slot in ('0xbeba','0xdb15','0xdc93'):
              hits=[]
              for p,lines in asm:
                  for i,line in enumerate(lines):
                      if slot in line.lower(): hits.append((p,i,line))
              print(f'SLOT {slot} hits={len(hits)}')
              for p,i,line in hits[:120]: print(f'{p.name}:{i+1}: {clean(line)}')

          print('=== TARGET REQUEST CLASS HEADERS ===')
          for target in ('txb','Asb'):
              for p,lines in asm:
                  for i,line in enumerate(lines):
                      if re.match(r'\s*class\s+'+target+r'\b',line):
                          print(f'{target} {p.name}:{i+1}')
                          for n in range(max(0,i-10),min(len(lines),i+70)): print(clean(lines[n]))
          PY
