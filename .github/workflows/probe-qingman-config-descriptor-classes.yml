name: Resolve Qingman Request GDT Targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-config-descriptor-classes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Patch Blutter to print safe GDT target metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/blutter/blutter/src/main.cpp')
          s=p.read_text()
          s=s.replace('#include "args.hxx"\n', '#include "args.hxx"\n#include "vm/thread.h"\n')
          anchor='\t\tapp.EnterScope();\n#ifndef NO_CODE_ANALYSIS\n'
          block=r'''		app.EnterScope();
		{
			auto* thread = dart::Thread::Current();
			auto* gdt = thread->dispatch_table_array();
			struct Probe { const char* label; intptr_t cid; intptr_t offset; };
			const Probe probes[] = {
				{"app_beba", 992, 0xbeba},
				{"app_db15", 992, 0xdb15},
				{"app_dc93", 992, 0xdc93},
				{"chaping_beba", 1114, 0xbeba},
				{"chaping_db15", 1114, 0xdb15},
				{"chaping_dc93", 1114, 0xdc93},
			};
			std::cout << "=== SAFE_GDT_TARGETS ===\n";
			for (const auto& q : probes) {
				const intptr_t index = q.cid + q.offset;
				const uintptr_t entry = static_cast<uintptr_t>(gdt[index]);
				std::cout << q.label << " cid=" << q.cid << " offset=0x" << std::hex << q.offset
				          << " index=0x" << index << std::dec;
				if (entry == 0) {
					std::cout << " entry=null\n";
					continue;
				}
				std::cout << " entry_rel=";
				if (entry >= static_cast<uintptr_t>(app.base())) {
					const uint64_t rel = entry - static_cast<uintptr_t>(app.base());
					std::cout << "0x" << std::hex << rel << std::dec;
					auto* fn = app.GetFunction(rel);
					if (fn != nullptr) std::cout << " fn=" << fn->FullName();
					else std::cout << " fn=<unmapped>";
				} else {
					std::cout << "<outside-libapp>";
				}
				std::cout << "\n";
			}
		}
#ifndef NO_CODE_ANALYSIS
'''
          if anchor not in s:
              raise SystemExit('main.cpp anchor not found')
          s=s.replace(anchor,block,1)
          p.write_text(s)
          PY
          rm -f /tmp/blutter/bin/blutter_dartvm3.12.2_android_arm64

      - name: Resolve current APK and run patched analyzer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out | tee /tmp/blutter-run.log
          echo '=== extracted target lines ==='
          grep -E 'SAFE_GDT_TARGETS|app_(beba|db15|dc93)|chaping_(beba|db15|dc93)' /tmp/blutter-run.log || true
