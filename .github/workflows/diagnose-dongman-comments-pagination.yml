name: Diagnose Dongman comments pagination and avatars

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-dongman-comments-pagination.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe live comment API
        shell: bash
        run: |
          set -euo pipefail
          api='https://apis.dongmanmanhua.cn'
          ua='Dongman/Android'
          for page in 1 2 3 4 5 6 7; do
            curl -fsSL --compressed -H 'Accept: application/json' -H 'Accept-Language: zh-CN,zh;q=0.9' -H "User-Agent: $ua" \
              "$api/v2/comment?titleNo=2795&episodeNo=1&pageNo=$page&pageSize=20" \
              -o "/tmp/v2-$page.json"
          done
          curl -fsSL --compressed -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' \
            'https://m.dongmanmanhua.cn/' -o /tmp/home.html
          python3 - <<'PY'
          import collections, json, re, subprocess

          all_regular=[]
          all_best=[]
          for page in range(1,8):
              d=json.load(open(f'/tmp/v2-{page}.json',encoding='utf-8'))
              data=d.get('data') or {}
              best=data.get('bestList') or []
              regular=data.get('commentList') or []
              all_best += best
              all_regular += regular
              print('page',page,'best',len(best),'regular',len(regular),
                    'count',data.get('count'),'showTotalCount',data.get('showTotalCount'),
                    'reply_sum_page',sum(int(x.get('replyCount') or 0) for x in best+regular if isinstance(x,dict)))
          all_items={x.get('_id'):x for x in all_best+all_regular if isinstance(x,dict) and x.get('_id')}
          print('unique_top_level',len(all_items),'reply_sum_unique',sum(int(x.get('replyCount') or 0) for x in all_items.values()))
          print('imageNo_distribution_2795',collections.Counter(str(x.get('imageNo')) for x in all_items.values()).most_common(20))

          home=open('/tmp/home.html',encoding='utf-8',errors='replace').read()
          title_nos=[]
          for m in re.finditer(r'title_no=(\d+)',home):
              if m.group(1) not in title_nos: title_nos.append(m.group(1))
              if len(title_nos)>=24: break
          if '2795' not in title_nos: title_nos.insert(0,'2795')
          seen=collections.Counter()
          nondefault=[]
          scanned=[]
          for title in title_nos:
              out=f'/tmp/scan-{title}.json'
              url=f'https://apis.dongmanmanhua.cn/v2/comment?titleNo={title}&episodeNo=1&pageNo=1&pageSize=20'
              p=subprocess.run(['curl','-fsSL','--compressed','-H','Accept: application/json','-H','User-Agent: Dongman/Android',url,'-o',out])
              if p.returncode: continue
              try: d=json.load(open(out,encoding='utf-8'))
              except Exception: continue
              data=d.get('data') or {}
              items=(data.get('bestList') or [])+(data.get('commentList') or [])
              if not items: continue
              scanned.append((title,len(items),data.get('count'),data.get('showTotalCount')))
              for c in items:
                  if not isinstance(c,dict): continue
                  val=str(c.get('imageNo'))
                  seen[val]+=1
                  if val not in ('None','','*'):
                      nondefault.append((title,c.get('_id'),val,{k:c.get(k) for k in c if any(t in k.lower() for t in ('image','profile','avatar','user','neo'))}))
          print('scanned_titles',scanned)
          print('cross_title_imageNo_distribution',seen.most_common(30))
          print('cross_title_nondefault',nondefault[:20])

          sample=next(iter(all_items.values()))
          print('sample_keys',sorted(sample.keys()))
          print('profile_like_fields',{k:sample.get(k) for k in sample if any(t in k.lower() for t in ('avatar','profile','image','photo','picture','icon','thumb'))})
          PY
