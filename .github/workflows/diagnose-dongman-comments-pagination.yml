name: Diagnose Dongman comments pagination and avatars

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-dongman-comments-pagination.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe live comment API
        shell: bash
        run: |
          set -euo pipefail
          api='https://apis.dongmanmanhua.cn'
          ua='Dongman/Android'
          for page in 1 2 3 4 5 6 7; do
            curl -fsSL --compressed -H 'Accept: application/json' -H 'Accept-Language: zh-CN,zh;q=0.9' -H "User-Agent: $ua" \
              "$api/v2/comment?titleNo=2795&episodeNo=1&pageNo=$page&pageSize=20" \
              -o "/tmp/v2-$page.json"
          done
          for ver in v1 v2; do
            code="$(curl -sSL --compressed -o "/tmp/${ver}-probe.json" -w '%{http_code}' -H 'Accept: application/json' -H "User-Agent: $ua" \
              "$api/$ver/comment?titleNo=2795&episodeNo=1&pageNo=1&pageSize=20")"
            echo "$ver HTTP $code"
          done
          python3 - <<'PY'
          import collections, json, re

          all_regular=[]
          all_best=[]
          for page in range(1,8):
              d=json.load(open(f'/tmp/v2-{page}.json',encoding='utf-8'))
              data=d.get('data') or {}
              best=data.get('bestList') or []
              regular=data.get('commentList') or []
              all_best += best
              all_regular += regular
              print('page',page,'best',len(best),'regular',len(regular),
                    'count',data.get('count'),'showTotalCount',data.get('showTotalCount'),
                    'ids',[x.get('_id') for x in regular[:1]], [x.get('_id') for x in regular[-1:]])
          ids=[x.get('_id') for x in all_regular if isinstance(x,dict)]
          print('regular_total_rows',len(ids),'unique',len(set(filter(None,ids))))

          image_values=[]
          profile_keys=collections.Counter()
          url_paths=collections.Counter()
          samples=[]
          for c in all_best+all_regular:
              if not isinstance(c,dict): continue
              if 'imageNo' in c: image_values.append(str(c.get('imageNo')))
              for k,v in c.items():
                  kl=k.lower()
                  if any(t in kl for t in ('avatar','profile','image','photo','picture','icon','thumb')):
                      profile_keys[(k,repr(v)[:160])] += 1
                  if isinstance(v,str) and (v.startswith('http://') or v.startswith('https://')):
                      url_paths[(k,v)] += 1
              if len(samples)<3 and c.get('imageNo') not in (None,'','*'):
                  samples.append(c)
          print('imageNo_distribution',collections.Counter(image_values).most_common(20))
          print('profile_like_fields')
          for kv,n in profile_keys.most_common(30): print(' ',n,kv)
          print('url_fields')
          for kv,n in url_paths.most_common(20): print(' ',n,kv)
          for i,c in enumerate(samples,1):
              print('nondefault_image_sample',i,{k:c.get(k) for k in c if any(t in k.lower() for t in ('image','profile','avatar','neo','user'))})

          for ver in ('v1','v2'):
              try:
                  d=json.load(open(f'/tmp/{ver}-probe.json',encoding='utf-8'))
              except Exception as e:
                  print(ver,'non-json',e); continue
              print(ver,'top_keys',list(d) if isinstance(d,dict) else type(d).__name__)
              data=d.get('data') if isinstance(d,dict) else None
              if isinstance(data,dict):
                  print(ver,'data_keys',list(data.keys()))
                  items=(data.get('bestList') or [])+(data.get('commentList') or [])
                  if items and isinstance(items[0],dict):
                      print(ver,'comment_keys',sorted(items[0].keys()))
          PY
