name: Map Qingman Config Request Factories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-request-factories.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Map factory functions and network singleton initializer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re
          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          needles=('0xb02b90','0xb028d0','0xb02b3c','0xb02828','0x3ea090','0xaa0250','class xjb','[mum] xjb','<ueb._ngd','uEb _nGd','AllocateuEbStub','uEb()')
          print('=== EXACT ASM ADDRESS / TYPE CONTEXTS ===')
          total=0
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: lines=p.read_text('utf-8',errors='replace').splitlines()
              except Exception: continue
              idxs=[i for i,s in enumerate(lines) if any(n.lower() in s.lower() for n in needles)]
              if not idxs: continue
              print('FILE',p.name)
              shown=set()
              for i in idxs:
                  start=i
                  while start>0 and '** addr:' not in lines[start]: start-=1
                  if '** addr:' not in lines[start]: start=max(0,i-40)
                  end=min(len(lines),i+100)
                  for j in range(start+1,len(lines)):
                      if '** addr:' in lines[j]: end=min(end,j); break
                  key=(start,end)
                  if key in shown: continue
                  shown.add(key)
                  print(f'FUNCTION_WINDOW lines={start+1}-{end} hit={i+1}')
                  for n in range(start,end):
                      s=lines[n]
                      if sensitive.search(s): s=re.sub(r'"[^"]*"','"<redacted>"',s)
                      if len(s)>500: s=s[:500]+'...'
                      print(s)
                      total+=1
                      if total>=2500: break
                  if total>=2500: break
              if total>=2500: break
          print('PRINTED_LINES='+str(total))

          print('=== OBJECT/POOL NETWORK METADATA ===')
          for root in ('/tmp/blutter-out/objs.txt','/tmp/blutter-out/pp.txt'):
              lines=Path(root).read_text('utf-8',errors='replace').splitlines()
              idxs=[i for i,s in enumerate(lines) if ('ueb._ngd' in s.lower() or 'class ueb' in s.lower() or '[mum] xjb' in s.lower() or 'class xjb' in s.lower())]
              shown=set()
              for i in idxs[:80]:
                  for n in range(max(0,i-15),min(len(lines),i+50)):
                      if n in shown: continue
                      shown.add(n)
                      s=lines[n]
                      if sensitive.search(s): s='<redacted-sensitive-line>'
                      print(f'{Path(root).name}:{n+1}: {s[:650]}')
          PY
