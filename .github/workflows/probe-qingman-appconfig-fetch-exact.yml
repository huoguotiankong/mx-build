name: Resolve Qingman AppConfig Network Adapter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-appconfig-fetch-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace exact AppConfig builder and callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          if ! python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1; then
            echo 'blutter_failed=true'
            tail -120 /tmp/blutter.log | grep -Eiv 'token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|seed' || true
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          deny=re.compile(r'(?i)(password|token|authorization|bearer|cookie|secret|private|clientp12|certificate|keystore|proof|signature|sign/key|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          root=Path('/tmp/blutter-out')
          asm=root/'asm'
          pp=(root/'pp.txt').read_text('utf-8',errors='replace').splitlines()

          print('=== APPCONFIG MODEL MARKERS ===')
          for line in pp:
              if any(x in line for x in ('baseImgUrl','freeUrl','customerUrl','officialUrl','promotionUrl','Get app config failed','TypeArguments: <uxb?>')) and not deny.search(line):
                  print(line[:500])

          print('=== EXACT BUILDER/CALLER SOURCE ===')
          needles=('0x4cfcfc','0xb02b78','0xb02b60','0xb02900')
          total=0
          for p in asm.rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if not any(n in line.lower() for n in needles): continue
                  total+=1
                  print(f'--- FILE {p.name} LINE {i+1} ---')
                  for z in lines[max(0,i-220):min(len(lines),i+360)]:
                      if not deny.search(z): print(z[:700])
          print('xref_blocks='+str(total))

          print('=== FUNCTIONS AROUND APPCONFIG ERROR/MODEL ===')
          for p in asm.rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              hits=[]
              for i,line in enumerate(lines):
                  if ('1ec38' in line.lower() or '1eba0' in line.lower() or 'uxb' in line.lower()): hits.append(i)
              for i in hits[:20]:
                  block=lines[max(0,i-100):min(len(lines),i+220)]
                  txt='\n'.join(block)
                  if not any(x.lower() in txt.lower() for x in ('get app config','baseimgurl','typearguments: <uxb')): continue
                  print(f'--- MODEL FILE {p.name} LINE {i+1} ---')
                  for z in block:
                      if not deny.search(z): print(z[:700])

          print('=== NON-SENSITIVE CONFIG ROUTES ===')
          seen=[]
          for line in pp:
              if deny.search(line): continue
              for s in re.findall(r'api/[A-Za-z0-9_./{}-]+',line):
                  if 'config' in s.lower() and s not in seen: seen.append(s)
          for s in seen: print('route='+s)
          PY

