name: Check PicACG Extension

on:
  push:
    branches: [main]
    paths:
      - ".github/picacomic-check-trigger"
      - ".github/workflows/check-picacomic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source layout
        working-directory: source
        run: python3 scripts/validate_sources.py
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Overlay PicACG module
        run: |
          rm -rf upstream/src/zh/picacomic
          cp -a source/src/zh/picacomic upstream/src/zh/picacomic
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build PicACG Debug
        working-directory: upstream
        run: ./gradlew :src:zh:picacomic:assembleDebug
