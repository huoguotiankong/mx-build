name: Format NoyAcg Plus Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-noyacgplus-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-noyacgplus-source
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check private source token
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MX private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Overlay and format source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/noyacgplus
          cp -a dev/src/zh/noyacgplus upstream/src/zh/noyacgplus
          cd upstream
          ./gradlew :src:zh:noyacgplus:spotlessApply
          ./gradlew :src:zh:noyacgplus:spotlessCheck

      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Stage formatted module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf staging/formatted/noyacgplus
          mkdir -p staging/formatted
          cp -a upstream/src/zh/noyacgplus staging/formatted/noyacgplus
          git -C staging config user.name 'github-actions[bot]'
          git -C staging config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C staging add formatted/noyacgplus
          if git -C staging diff --cached --quiet; then
            echo 'No formatted-source changes'
          else
            git -C staging commit -m 'Stage formatted NoyAcg Plus source'
            git -C staging push origin HEAD:extension-staging
          fi
