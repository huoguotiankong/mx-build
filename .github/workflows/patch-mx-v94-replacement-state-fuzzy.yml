name: Patch MX 1.14.14 replacement state and fuzzy matching

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-mx-v94-replacement-state-fuzzy.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout public build scripts
        uses: actions/checkout@v5
        with:
          path: build-control
          persist-credentials: false

      - name: Checkout private MX App replacement hotfix branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: hotfix/v93-replacement-state-fuzzy-v94
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply replacement-state and fuzzy-title patch
        shell: bash
        run: |
          set -euo pipefail
          cp build-control/scripts/patch_mx_v94_replacement_state_fuzzy.py source/.mx-v94-patch.py
          cd source
          python3 .mx-v94-patch.py
          rm .mx-v94-patch.py

      - name: Format and run unit verification
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew spotlessApply
          ./gradlew spotlessCheck testReleaseUnitTest

      - name: Commit verified patch to private branch
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReplacementMangaMatcher.kt \
            app/src/test/java/eu/kanade/tachiyomi/ui/reader/ReplacementMangaMatcherTest.kt \
            docs/CHAPTER_CONTENT.md
          git diff --cached --quiet && { echo "No patch changes to commit" >&2; exit 1; }
          git commit -m "fix: sync replacement markers and relax edition matching"
          git push origin HEAD:hotfix/v93-replacement-state-fuzzy-v94
