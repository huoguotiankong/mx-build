name: Trace Qingman Reader Route Callers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-reader-route-callers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace reader route and referer helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          print(json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re,bisect
          root=Path('/tmp/blutter-out')
          pp={}
          for line in root.joinpath('pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)
          route='api/comic/chapter/ie84hfh8/detail'
          route_offsets=[off for off,val in pp.items() if route in val]
          print('route_pp='+','.join(hex(x) for x in route_offsets))
          sensitive=re.compile(r'(?i)(password|passwd|pwd|cookie|private|clientp12|certificate|p12|seed)')

          funcs=[]
          for p in root.joinpath('asm').rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  m=re.search(r'\*\* addr: 0x([0-9a-fA-F]+), size: (?:0x([0-9a-fA-F]+)|-0x1)',s)
                  if not m: continue
                  st=int(m.group(1),16); sz=int(m.group(2),16) if m.group(2) else 0
                  if sz<=0: continue
                  decl=''
                  for j in range(i-1,max(-1,i-10),-1):
                      z=lines[j].strip()
                      if z and not z.startswith('//'): decl=z; break
                  funcs.append((st,st+sz,p.name,decl,lines,i))
          funcs.sort(); starts=[f[0] for f in funcs]
          def owner(addr):
              k=bisect.bisect_right(starts,addr)-1
              return funcs[k] if k>=0 and funcs[k][0]<=addr<funcs[k][1] else None

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          pending={}; refs=[]; calls=[]
          for ins in md.disasm(data,base):
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=ins.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),32); continue
              if ins.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if m:
                      br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                      off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                      if off in route_offsets: refs.append((ins.address,off))
          print('=== ROUTE XREFS ===')
          for addr,off in refs:
              f=owner(addr)
              print(f'0x{addr:x} owner='+(f'{f[2]} 0x{f[0]:x}-0x{f[1]:x} {f[3]}' if f else '<unmapped>'))
          # Show any asm source lines containing the route literal/comment and neighboring method declaration.
          print('=== ASM TEXT HITS ===')
          for p in root.joinpath('asm').rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  if route not in s: continue
                  print(f'--- {p.name}:{i+1} ---')
                  for z in lines[max(0,i-70):min(len(lines),i+180)]:
                      if not sensitive.search(z): print(z[:1200])
          print('=== REFERER VALUE HELPER 0x3a6718 ===')
          start,end=0x3a66c0,0x3a6900; pending={}
          for ins in md.disasm(data[start-base:end-base],start):
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=ins.op_str.lower(); ann=''
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m: pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),32)
              elif ins.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if m:
                      br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                      off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                      if off in pp and not sensitive.search(pp[off]): ann=' ; PP+0x%x %s'%(off,pp[off][:700])
              if ann or ins.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz','str','stur','stp'):
                  print(f'0x{ins.address:x} {ins.mnemonic:<7} {ins.op_str}{ann}')
          PY
