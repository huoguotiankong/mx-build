name: MX Tencent Rich Media EHentai Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-tencent-rich-media-ehentai-integration.yml"
      - "scripts/patch_mx_app_tencent_rich_media_ehentai.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-tencent-rich-media-ehentai-integration
  cancel-in-progress: false

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        shell: bash
        env:
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || { echo "::error::Missing MX_APP_PUBLISH_TOKEN"; exit 1; }
          [[ -n "$MX_APP_SIGNING_BUNDLE" ]] || { echo "::error::Missing MX_APP_SIGNING_BUNDLE"; exit 1; }

      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: main
          path: helper
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout latest EHentai integration branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: integration/mx-final-ehentai-comment-rich-20260905-v2
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Tencent comment rich media
        shell: bash
        run: |
          set -euo pipefail
          python3 helper/scripts/patch_mx_app_tencent_rich_media_ehentai.py source
          git -C source diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format and run unit tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew spotlessApply
          git diff --check
          ./gradlew testReleaseUnitTest

      - name: Prepare stable signing key
        shell: bash
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ['MX_APP_SIGNING_BUNDLE'])
          required = ('signingKey', 'alias', 'storePassword')
          missing = [key for key in required if not bundle.get(key)]
          if missing:
              raise SystemExit('Signing bundle missing required fields')
          path = Path(os.environ['RUNNER_TEMP']) / 'mx-app.jks'
          path.write_bytes(base64.b64decode(bundle['signingKey']))
          values = {
              'MX_KEYSTORE_PATH': str(path),
              'MX_KEY_ALIAS': str(bundle['alias']),
              'MX_KEYSTORE_PASSWORD': str(bundle['storePassword']),
              'MX_KEY_PASSWORD': str(bundle['storePassword']),
          }
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for name, value in values.items():
                  print(f'::add-mask::{value}')
                  f.write(f'{name}<<__MX_SIGNING_EOF__\n{value}\n__MX_SIGNING_EOF__\n')
          PY

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::MX signing certificate mismatch"; exit 1; }

      - name: Build signed integration Preview APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assemblePreview \
            -Pdisable-code-shrink \
            --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"

      - name: Normalize and verify Preview APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            signed="${apk%.apk}.mx-signed.apk"
            "$apksigner" sign \
              --ks "$MX_KEYSTORE_PATH" \
              --ks-key-alias "$MX_KEY_ALIAS" \
              --ks-pass env:MX_KEYSTORE_PASSWORD \
              --key-pass env:MX_KEY_PASSWORD \
              --out "$signed" "$apk"
            mv "$signed" "$apk"
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$normalized" == *"$expected"* ]] || { echo "::error::APK signing certificate mismatch"; exit 1; }
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]] || { echo "::error::No Preview APK found"; exit 1; }

      - name: Commit verified integration changes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt \
            app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt \
            docs/COMMENTS.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "fix: expand Tencent comment rich-media recognition"
            git push origin HEAD:integration/mx-final-ehentai-comment-rich-20260905-v2
          fi

      - name: Upload integration Preview APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-tencent-rich-media-ehentai-integration
          path: source/app/build/outputs/apk/preview/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
