name: Map Qingman Reader Header Pool Values

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-reader-pp-neighborhood.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Print safe PP neighborhoods
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))
          a=o['data']['datas']['android']
          if (str(a.get('version','')),str(a.get('versionCode',''))) != ('4.4.5','445'):
              raise SystemExit('unexpected official version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          deny=re.compile(r'(?i)(password|passwd|pwd|cookie|authorization|bearer|clientp12|privatekey|certificate|keystore|secret|token)')
          entries=[]
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: entries.append((int(m.group(1),16),m.group(2)))
          ranges=[
            ('headers',0x6200,0x6320),
            ('reader_log',0x24f80,0x25120),
            ('line_state',0x2a420,0x2a560),
            ('claimed_model',0x38e80,0x38f80),
            ('reader_request',0x7b80,0x7c20),
          ]
          for name,lo,hi in ranges:
              print(f'=== {name} 0x{lo:x}-0x{hi:x} ===')
              for off,val in entries:
                  if lo<=off<=hi:
                      print(f'PP+0x{off:x} '+('<redacted>' if deny.search(val) else val[:320]))
          print('=== exact nearby known terms ===')
          terms=('Referer','User-Agent','Origin','Accept','claimedImageUrl','imageUrl','freeLine','ComicReadSelectedImageLine','decryptImage','decryptCacheImage','useWebView')
          for off,val in entries:
              if deny.search(val): continue
              if any(t.lower() in val.lower() for t in terms):
                  print(f'PP+0x{off:x} {val[:320]}')
          PY
