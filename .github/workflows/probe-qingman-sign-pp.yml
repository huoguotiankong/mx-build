name: Map Qingman Signing Pool Neighborhood

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-sign-pp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download current official AOT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          print('OFFICIAL_VERSION_CODE='+str(a.get('versionCode','')),file=sys.stderr)
          if (str(a.get('version','')),str(a.get('versionCode',''))) != ('4.4.5','445'):
              raise SystemExit('unexpected official version')
          PY
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 240 "$(cat /tmp/url)" -o /tmp/qm.apk
          rm -rf /tmp/qm-lib /tmp/qm-aot && mkdir -p /tmp/qm-lib /tmp/qm-aot
          unzip -p /tmp/qm.apk lib/arm64-v8a/libapp.so >/tmp/qm-lib/libapp.so
          unzip -p /tmp/qm.apk lib/arm64-v8a/libflutter.so >/tmp/qm-lib/libflutter.so

      - name: Run Blutter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev python3-pyelftools python3-capstone >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
          cd /tmp/blutter
          python3 blutter.py /tmp/qm-lib /tmp/qm-aot >/tmp/blutter.log 2>&1
          tail -20 /tmp/blutter.log

      - name: Print signing PP neighborhood safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/qm-aot/pp.txt').read_text('utf-8',errors='replace').splitlines()
          entries=[]
          for line in lines:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: entries.append((int(m.group(1),16),m.group(2)))
          deny=re.compile(r'(?i)(password|authorization|bearer|cookie|clientp12|privatekey|certificate|pem|p12|keystore)')
          for off,val in entries:
              if 0x8d80 <= off <= 0x9120:
                  if deny.search(val):
                      val='<redacted-sensitive-entry>'
                  print(f'PP 0x{off:04x} {val[:300]}')
          PY
