name: MXMusic Android
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mxmusic-android.yml'
      - 'triggers/mxmusic.txt'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'main or exact 40-character private source commit SHA'
        required: true
        default: main
        type: string
      build_mode:
        description: Preview (two tokens) or persistent release signing
        type: choice
        options: [preview, signed]
        default: preview
permissions:
  contents: read
concurrency:
  group: mxmusic-android
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check required token configuration
        env:
          SOURCE_TOKEN: ${{ secrets.MXMUSIC_SOURCE_TOKEN }}
          DELIVERY_TOKEN: ${{ secrets.MXMUSIC_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo 'MXMUSIC_SOURCE_TOKEN is missing'; exit 1; }
          test -n "$DELIVERY_TOKEN" || { echo 'MXMUSIC_PUBLISH_TOKEN is missing'; exit 1; }
      - name: Read private source
        id: source
        env:
          SOURCE_TOKEN: ${{ secrets.MXMUSIC_SOURCE_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo 'MXMUSIC_SOURCE_TOKEN is missing'; exit 1; }
          [[ "$SOURCE_REF" == main || "$SOURCE_REF" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'Invalid source ref'; exit 1; }
          mkdir -p "$RUNNER_TEMP/mx-source"
          cd "$RUNNER_TEMP/mx-source"
          git init -q
          AUTH="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          if ! git -c "http.extraHeader=Authorization: Basic $AUTH" fetch --no-tags --depth=1 https://github.com/huoguotiankong/MXMusic.git "$SOURCE_REF" >"$RUNNER_TEMP/source.log" 2>&1; then
            echo 'Private source checkout failed'; exit 1
          fi
          git -c advice.detachedHead=false checkout --detach -q FETCH_HEAD >"$RUNNER_TEMP/checkout.log" 2>&1
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -f app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install locked npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mx-source/app"
          if ! npm ci >"$RUNNER_TEMP/npm.log" 2>&1; then echo 'Dependency installation failed'; exit 1; fi
      - name: Verify and install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # SDK setup is independent of the private source. Its diagnostic output is safe to expose.
          cd "$RUNNER_TEMP"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -x "$SDKMANAGER" || { echo 'Android command-line tools missing'; exit 1; }
          "$SDKMANAGER" --version
          # yes may exit with SIGPIPE once sdkmanager has consumed all answers.
          set +o pipefail
          if ! yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses; then
            echo 'Android SDK license acceptance failed'; exit 1
          fi
          set -o pipefail
          packages=()
          [ -f "$SDK_ROOT/platforms/android-35/android.jar" ] || packages+=('platforms;android-35')
          [ -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ] && [ -x "$SDK_ROOT/build-tools/35.0.0/aapt" ] || packages+=('build-tools;35.0.0')
          [ -f "$SDK_ROOT/ndk/26.1.10909125/source.properties" ] || packages+=('ndk;26.1.10909125')
          if [ "${#packages[@]}" -gt 0 ]; then
            for attempt in 1 2 3; do
              if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "${packages[@]}"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 15
            done
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -f "$SDK_ROOT/ndk/26.1.10909125/source.properties"
          echo 'Android SDK and NDK ready.'
      - name: Isolate preview identity
        if: github.event_name == 'push' || inputs.build_mode == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mx-source/app"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          assert 'applicationId "com.mx.music"' in s
          p.write_text(s.replace('applicationId "com.mx.music"', 'applicationId "com.mx.music.preview"'))
          for base in (Path("android/app/src"), Path("src")):
              for p in base.rglob("*"):
                  if not p.is_file() or p.suffix not in {".java", ".kt", ".xml", ".ts", ".tsx", ".js", ".jsx"}:
                      continue
                  s = p.read_text(encoding="utf-8")
                  new = s
                  for prefix in ("provider", "action.", "widget."):
                      new = new.replace("com.mx.music." + prefix, "com.mx.music.preview." + prefix)
                  if p.name == "strings.xml":
                      new = new.replace('>MX音乐<', '>MX音乐 测试版<')
                  if new != s:
                      p.write_text(new, encoding="utf-8")
          PY
      - name: Build Android APK
        env:
          DISABLE_SVG: 1
          BUILD_MODE: ${{ inputs.build_mode || 'preview' }}
          KEYSTORE_B64: ${{ secrets.MXMUSIC_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MXMUSIC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MXMUSIC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MXMUSIC_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEYFILE="$RUNNER_TEMP/mxmusic.jks"
          trap 'rm -f "$KEYFILE"' EXIT
          cd "$RUNNER_TEMP/mx-source/app/android"
          if [ "$BUILD_MODE" = preview ]; then
            cp app/debug.keystore "$KEYFILE"
            STORE_PASS=android
            KEY_PASS=android
            KEY_ALIAS=androiddebugkey
            echo 'Preview APK: public test signing key, isolated package, not for sensitive data.'
          else
            for k in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
              test -n "${!k}" || { echo "Missing signing configuration: $k"; exit 1; }
            done
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYFILE"
          fi
          chmod +x gradlew
          if ! ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PMYAPP_UPLOAD_STORE_FILE="$KEYFILE" -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASS" -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASS" --no-daemon >"$RUNNER_TEMP/gradle.log" 2>&1; then
            echo 'Android build failed (private diagnostic log not printed)'; exit 1
          fi
      - name: Verify package identity, signature and hash
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'preview' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mx-dist"
          cd "$RUNNER_TEMP/mx-source/app"
          VERSION="$(node -p 'require("./package.json").version')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          APK="android/app/build/outputs/apk/release/mxmusic-v${VERSION}-arm64-v8a.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify "$APK" >"$RUNNER_TEMP/verify.log" 2>&1
          "$TOOLS/aapt" dump badging "$APK" >"$RUNNER_TEMP/badging.log"
          EXPECTED_ID=com.mx.music
          if [ "$BUILD_MODE" = preview ]; then EXPECTED_ID=com.mx.music.preview; fi
          grep -qF "package: name='$EXPECTED_ID'" "$RUNNER_TEMP/badging.log"
          grep -qF "versionName='$VERSION'" "$RUNNER_TEMP/badging.log"
          grep -q "native-code:.*'arm64-v8a'" "$RUNNER_TEMP/badging.log"
          if [ "$BUILD_MODE" = preview ]; then
            cp "$APK" "$RUNNER_TEMP/mx-dist/mxmusic-v${VERSION}-preview-arm64-v8a.apk"
          else
            cp "$APK" "$RUNNER_TEMP/mx-dist/"
          fi
          cp LICENSE "$RUNNER_TEMP/mx-dist/UPSTREAM-LICENSE.txt"
          cp MX_MODIFICATIONS.md "$RUNNER_TEMP/mx-dist/"
          if [ -f NOTICE ]; then cp NOTICE "$RUNNER_TEMP/mx-dist/UPSTREAM-NOTICE.txt"; fi
          cd "$RUNNER_TEMP/mx-dist"
          sha256sum *.apk > SHA256SUMS.txt
      - name: Deliver verified APK to private Releases
        env:
          GH_TOKEN: ${{ secrets.MXMUSIC_PUBLISH_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_MODE: ${{ inputs.build_mode || 'preview' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'MXMUSIC_PUBLISH_TOKEN is missing'; exit 1; }
          cd "$RUNNER_TEMP/mx-source/app"
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}-${BUILD_MODE}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          cd "$RUNNER_TEMP/mx-dist"
          if ! gh release create "$TAG" ./* --repo huoguotiankong/MXMusic --target "$SOURCE_SHA" --prerelease --latest=false --title "MX Music $TAG" --notes "Build mode: $BUILD_MODE. Preview uses an isolated package and a public test signing key; do not store sensitive data. Verify on device before daily use." >"$RUNNER_TEMP/delivery.log" 2>&1; then
            echo 'Private release delivery failed'; exit 1
          fi
          echo 'Private release delivery succeeded.'
      - name: Remove private source, diagnostics and build output
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/mx-source" "$RUNNER_TEMP/mx-dist"
          rm -f "$RUNNER_TEMP"/{source,checkout,npm,sdk,gradle,verify,badging,delivery}.log "$RUNNER_TEMP/mxmusic.jks"
