name: Resolve Qingman Exact AppConfig Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-appconfig-route-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace AppConfig request route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          if ! python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1; then
            echo 'blutter_failed=true'
            tail -120 /tmp/blutter.log | grep -Eiv 'token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|seed' || true
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          deny=re.compile(r'(?i)(password|token|authorization|bearer|cookie|secret|private|clientp12|certificate|keystore|proof|signature|sign/key|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          asm=Path('/tmp/blutter-out/asm')
          pp=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()

          print('=== EXACT PP MARKERS ===')
          for line in pp:
              if any(m in line for m in ('baseImgUrl','freeUrl','customerUrl','officialUrl','promotionUrl','Get app config failed')) and not deny.search(line):
                  print(line[:500])

          # Find the exact request-builder function reached by the AppConfig allocation stub.
          needles=('0x4cfcfc','0xb02b60','0xb02b78')
          print('=== REQUEST BUILDER XREFS ===')
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              hits=[i for i,l in enumerate(lines) if any(n in l.lower() for n in needles)]
              for h in hits:
                  print(f'--- FILE {p.name} HIT {h+1} ---')
                  for z in lines[max(0,h-180):min(len(lines),h+260)]:
                      if deny.search(z): continue
                      # Keep all AOT pseudo-source/disassembly around this very small set of hits.
                      print(z[:600])

          print('=== APPCONFIG TYPE XREFS ===')
          for p in asm.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              hits=[i for i,l in enumerate(lines) if 'uxb' in l.lower()]
              if not hits: continue
              for h in hits[:12]:
                  block='\n'.join(lines[max(0,h-30):min(len(lines),h+80)])
                  if 'app config' not in block.lower() and '1ec38' not in block.lower() and '1eba0' not in block.lower():
                      continue
                  print(f'--- TYPE FILE {p.name} HIT {h+1} ---')
                  for z in block.splitlines():
                      if not deny.search(z): print(z[:600])

          print('=== ALL NON-SENSITIVE CONFIG ROUTE LITERALS ===')
          seen=[]
          route_re=re.compile(r'api/[A-Za-z0-9_./{}-]+')
          for line in pp:
              if deny.search(line): continue
              for s in route_re.findall(line):
                  if 'config' in s.lower() and s not in seen:
                      seen.append(s)
          for s in seen: print('route='+s)
          PY
