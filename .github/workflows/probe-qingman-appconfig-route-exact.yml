name: Resolve Qingman Exact AppConfig Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-appconfig-route-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Resolve request descriptor classes and constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          deny=re.compile(r'(?i)(password|token|authorization|bearer|cookie|secret|private|clientp12|certificate|keystore|proof|signature|sign/key|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          root=Path('/tmp/blutter-out/asm')
          targets={992:'AppConfig request descriptor',1114:'Chaping request descriptor'}
          names={}
          for p in root.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  m=re.search(r'// class id: (\d+), size: (0x[0-9a-fA-F]+)',line)
                  if not m or int(m.group(1)) not in targets: continue
                  cid=int(m.group(1)); block=lines[i:min(len(lines),i+140)]
                  print(f'=== CID {cid} {targets[cid]} FILE={p.name} LINE={i+1} ===')
                  for z in block:
                      if not deny.search(z): print(z[:700])
                  for z in block[:16]:
                      cm=re.match(r'class\s+([A-Za-z0-9_$]+)',z.strip())
                      if cm: names[cid]=cm.group(1)
          print('resolved_names='+','.join(f'{k}:{v}' for k,v in sorted(names.items())))
          needles=set(names.values())|{'0x3ea090','0xb02b90','0xb028d0'}
          print('=== CLASS/CALLER XREFS ===')
          for p in root.glob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              hits=[i for i,z in enumerate(lines) if any(n.lower() in z.lower() for n in needles)]
              if not hits: continue
              for h in hits[:30]:
                  print(f'--- FILE={p.name} HIT={h+1} ---')
                  for z in lines[max(0,h-90):min(len(lines),h+180)]:
                      if not deny.search(z): print(z[:700])
          pp=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          routes=[]
          for line in pp:
              if deny.search(line): continue
              m=re.search(r'String: "([^"]+)"',line)
              if not m: continue
              s=m.group(1)
              if s.startswith('api/') and s not in routes: routes.append(s)
          print('=== PUBLIC API ROUTES WITH CONFIG/APP TERMS ===')
          for s in routes:
              if any(k in s.lower() for k in ('config','appapi','radio')): print(s)
          PY
