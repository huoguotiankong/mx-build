name: Probe Manwang structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-manwang-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect compatible reader markup
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          curl -fsSL --compressed -A "$ua" 'https://mh5.app/chapter/r01nZfQE2w.html' -o /tmp/reader.html
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          raw=Path('/tmp/reader.html').read_text('utf-8',errors='replace')
          mt=re.search(r'<title>(.*?)</title>',raw,re.I|re.S)
          print('TITLE',html.unescape(mt.group(1)).strip() if mt else '')
          print('===== IMAGES =====')
          for m in re.finditer(r'<img\b[^>]*>',raw,re.I):
              print(re.sub(r'\s+',' ',html.unescape(m.group(0))).strip()[:2400])
          print('===== CONTAINERS =====')
          for m in re.finditer(r'<(?:div|main|section|article|ul|ol)\b[^>]*>',raw,re.I):
              s=re.sub(r'\s+',' ',html.unescape(m.group(0))).strip(); low=s.lower()
              if any(x in low for x in ('reader','chapter','comic','page','content','image','img')):
                  print(s[:1800])
          print('===== SCRIPTS =====')
          for i,b in enumerate(re.findall(r'<script\b[^>]*>(.*?)</script>',raw,re.I|re.S)):
              if re.search(r'(image|img|chapter|page|comic|photos|pics|data-src)',b,re.I):
                  print('SCRIPT',i,re.sub(r'\s+',' ',html.unescape(b)).strip()[:9000])
          PY
