name: Probe Manwang structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-manwang-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect reader decoder
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          base='https://mh5.app'
          curl -fsSL --compressed -A "$ua" "$base/template/pc/24/js/pic-v2.js" -o /tmp/pic.js
          curl -fsSL --compressed -A "$ua" "$base/template/pc/24/js/read.js" -o /tmp/read.js
          curl -fsSL --compressed -A "$ua" "$base/chapter/r01nZfQE2w.html" -o /tmp/reader.html
          echo '===== PIC-V2.JS ====='
          cat /tmp/pic.js
          echo '===== RELEVANT READ.JS ====='
          grep -nE 'parr|params|pic|img-box|decrypt|CryptoJS|AES' /tmp/read.js || true
          echo '===== INLINE READER AROUND PARAMS ====='
          python3 - <<'PY'
          import re
          from pathlib import Path
          raw=Path('/tmp/reader.html').read_text('utf-8',errors='replace')
          for m in re.finditer(r'params\s*=\s*["\'][^"\']+', raw):
              start=max(0,m.start()-1200); end=min(len(raw),m.end()+2500)
              print(raw[start:end])
          PY
