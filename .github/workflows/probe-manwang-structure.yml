name: Probe Manwang structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-manwang-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dump compatible engine links and forms
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          base='https://mh5.app'
          mkdir -p /tmp/mw
          for pair in 'home /' 'category /category' 'update /custom/update'; do
            set -- $pair
            curl -fsSL --compressed -A "$ua" "$base$2" -o "/tmp/mw/$1.html"
          done
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          for name in ('home','category','update'):
              raw=Path(f'/tmp/mw/{name}.html').read_text('utf-8',errors='replace')
              print(f'\n===== {name.upper()} FORMS =====')
              for m in re.finditer(r'<(?:form|input)\b[^>]*>',raw,re.I):
                  print(re.sub(r'\s+',' ',html.unescape(m.group(0))).strip()[:1600])
              print(f'\n===== {name.upper()} LINKS =====')
              count=0
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',raw,re.I|re.S):
                  attrs=re.sub(r'\s+',' ',html.unescape(m.group(1))).strip()
                  text=re.sub(r'<[^>]+>',' ',m.group(2))
                  text=re.sub(r'\s+',' ',html.unescape(text)).strip()
                  href=re.search(r'href\s*=\s*["\']([^"\']*)',attrs,re.I)
                  if href:
                      print('A',href.group(1)[:800],'|',text[:180],'|',attrs[:600])
                      count+=1
                      if count>=320: break
              print(f'\n===== {name.upper()} IMAGES =====')
              for i,m in enumerate(re.finditer(r'<img\b[^>]*>',raw,re.I)):
                  print(re.sub(r'\s+',' ',html.unescape(m.group(0))).strip()[:1600])
                  if i>=180: break
          PY
