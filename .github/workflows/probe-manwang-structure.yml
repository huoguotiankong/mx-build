name: Probe Manwang structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-manwang-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trace reader crypto
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          base='https://mh5.app'
          curl -fsSL --compressed -A "$ua" "$base/template/pc/24/js/pic-v2.js" -o /tmp/pic.js
          curl -fsSL --compressed -A "$ua" "$base/packs/js/crypto-js.min.js" -o /tmp/crypto.js
          curl -fsSL --compressed -A "$ua" "$base/chapter/r01nZfQE2w.html" -o /tmp/reader.html
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          raw=Path('/tmp/reader.html').read_text('utf-8',errors='replace')
          m=re.search(r"params\s*=\s*'([^']+)'",raw)
          Path('/tmp/encrypted.json').write_text(json.dumps(m.group(1)))
          js=Path('/tmp/pic.js').read_text('utf-8',errors='replace')
          needle='params=decryptParams(params);'
          js=js.replace(needle, needle+"console.log('DECRYPTED_TYPE='+typeof params);process.exit(0);",1)
          Path('/tmp/pic-run.js').write_text(js)
          PY
          cat >/tmp/run.js <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const enc=JSON.parse(fs.readFileSync('/tmp/encrypted.json','utf8'));
          global.window={location:{hostname:'mh5.app'},innerHeight:1000};
          global.document={documentElement:{clientHeight:1000}};
          const dummy={eq(){return this},offset(){return {top:0}},scroll(){return this},append(){return this},add(){return this},length:0};
          global.$=function(x){ if(typeof x==='function'){x(); return dummy;} return dummy; };
          vm.runInThisContext(fs.readFileSync('/tmp/crypto.js','utf8'));
          const hex=x=>x&&x.toString?x.toString(CryptoJS.enc.Hex):String(x);
          const u8=CryptoJS.enc.Utf8.parse.bind(CryptoJS.enc.Utf8);
          CryptoJS.enc.Utf8.parse=function(s){ console.log('UTF8_PARSE='+s); return u8(s); };
          const b64=CryptoJS.enc.Base64.parse.bind(CryptoJS.enc.Base64);
          CryptoJS.enc.Base64.parse=function(s){ const x=b64(s); console.log('BASE64_PARSE bytes='+x.sigBytes+' head='+hex(x).slice(0,96)); return x; };
          const hparse=CryptoJS.enc.Hex.parse.bind(CryptoJS.enc.Hex);
          CryptoJS.enc.Hex.parse=function(s){ console.log('HEX_PARSE len='+s.length+' head='+s.slice(0,96)); return hparse(s); };
          const adec=CryptoJS.AES.decrypt.bind(CryptoJS.AES);
          CryptoJS.AES.decrypt=function(ct,key,cfg){
            const raw=ct&&ct.ciphertext?ct.ciphertext:ct;
            console.log('AES_DECRYPT keyBytes='+(key&&key.sigBytes)+' key='+hex(key)+' ivBytes='+(cfg&&cfg.iv&&cfg.iv.sigBytes)+' iv='+hex(cfg&&cfg.iv)+' ctBytes='+(raw&&raw.sigBytes)+' ctHead='+hex(raw).slice(0,96));
            return adec(ct,key,cfg);
          };
          global.params=enc;
          vm.runInThisContext(fs.readFileSync('/tmp/pic-run.js','utf8'));
          NODE
          node /tmp/run.js
