name: Probe Manwang structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-manwang-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture reader decoder inputs
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          base='https://mh5.app'
          mkdir -p /tmp/manwang-probe
          curl -fsSL --compressed -A "$ua" "$base/template/pc/24/js/pic-v2.js" -o /tmp/manwang-probe/pic-v2.js
          curl -fsSL --compressed -A "$ua" "$base/template/pc/24/js/read.js" -o /tmp/manwang-probe/read.js
          curl -fsSL --compressed -A "$ua" "$base/packs/js/crypto-js.min.js" -o /tmp/manwang-probe/crypto-js.min.js
          curl -fsSL --compressed -A "$ua" "$base/chapter/r01nZfQE2w.html" -o /tmp/manwang-probe/reader.html
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          raw=Path('/tmp/manwang-probe/reader.html').read_text('utf-8',errors='replace')
          m=re.search(r"params\s*=\s*'([^']+)'",raw)
          if not m: raise SystemExit('params missing')
          Path('/tmp/manwang-probe/params.txt').write_text(m.group(1))
          Path('/tmp/manwang-probe/meta.json').write_text(json.dumps({
              'params_length': len(m.group(1)),
              'pic_js_size': Path('/tmp/manwang-probe/pic-v2.js').stat().st_size,
              'read_js_size': Path('/tmp/manwang-probe/read.js').stat().st_size,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload decoder probe
        uses: actions/upload-artifact@v4
        with:
          name: manwang-reader-decoder
          path: /tmp/manwang-probe/
          if-no-files-found: error
