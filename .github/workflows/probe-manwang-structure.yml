name: Probe Manwang structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-manwang-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe live hosts
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          for host in manwang.net www.manwang.net mh5.app; do
            for path in / /category /custom/update /custom/top /book/501947 /chapter/547458-162854; do
              echo "===== https://$host$path ====="
              curl -L --compressed -A "$ua" -H 'Accept-Language: zh-CN,zh;q=0.9' -sS -o /tmp/body -D /tmp/headers -w 'http=%{http_code} final=%{url_effective} bytes=%{size_download} type=%{content_type}\n' "https://$host$path" || true
              grep -iE '^(server|cf-mitigated|location|content-type):' /tmp/headers | tail -n 8 || true
              grep -oE '<title>[^<]+' /tmp/body | head -n 1 || true
            done
          done
