name: Probe Manwang structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-manwang-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture Manwang HTML and reader decoder
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          base='https://mh5.app'
          out=/tmp/manwang-probe
          mkdir -p "$out"
          curl -fsSL --compressed -A "$ua" "$base/" -o "$out/home.html"
          curl -fsSL --compressed -A "$ua" "$base/category" -o "$out/category.html"
          curl -fsSL --compressed -A "$ua" "$base/custom/update" -o "$out/update.html"
          curl -fsSL --compressed -A "$ua" "$base/custom/hot" -o "$out/hot.html"
          curl -fsSL --compressed -A "$ua" "$base/index.php/search?key=%E5%A6%96%E7%A5%9E%E8%AE%B0" -o "$out/search.html"
          curl -fsSL --compressed -A "$ua" "$base/r0xMpQZOWy" -o "$out/detail.html"
          curl -fsSL --compressed -A "$ua" "$base/chapter/r01nZfQE2w.html" -o "$out/reader.html"
          curl -fsSL --compressed -A "$ua" "$base/template/pc/24/js/pic-v2.js" -o "$out/pic-v2.js"
          curl -fsSL --compressed -A "$ua" "$base/template/pc/24/js/read.js" -o "$out/read.js"
          curl -fsSL --compressed -A "$ua" "$base/packs/js/crypto-js.min.js" -o "$out/crypto-js.min.js"
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          out=Path('/tmp/manwang-probe')
          raw=(out/'reader.html').read_text('utf-8',errors='replace')
          m=re.search(r"params\s*=\s*'([^']+)'",raw)
          if not m: raise SystemExit('params missing')
          (out/'params.txt').write_text(m.group(1))
          meta={p.name:p.stat().st_size for p in out.iterdir() if p.is_file()}
          (out/'meta.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2))
          PY
      - name: Upload Manwang probe
        uses: actions/upload-artifact@v4
        with:
          name: manwang-site-probe
          path: /tmp/manwang-probe/
          if-no-files-found: error
