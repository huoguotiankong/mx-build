name: Probe Qingman Domain Candidates

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-domain-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Enumerate public certificate hosts and probe API path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,ssl,socket
          from concurrent.futures import ThreadPoolExecutor,as_completed

          q='https://crt.sh/?q=%25.qingman.mom&output=json'
          req=urllib.request.Request(q,headers={'User-Agent':'Mozilla/5.0'})
          try:
              rows=json.load(urllib.request.urlopen(req,timeout=30))
          except Exception as e:
              print('crt_error=',type(e).__name__,str(e)[:160]); rows=[]
          hosts=set()
          for row in rows:
              for field in ('name_value','common_name'):
                  v=str(row.get(field,'') or '')
                  for h in v.splitlines():
                      h=h.strip().lower().lstrip('*.')
                      if h.endswith('.qingman.mom') and '*' not in h and len(h)<120:
                          hosts.add(h)
          hosts.update(['sf85sdq66h.qingman.mom'])
          print('candidate_count=',len(hosts))
          print('candidates=',','.join(sorted(hosts)[:120]))

          ctx=ssl.create_default_context()
          def probe(h):
              url=f'https://{h}/api/comic/categories/list'
              req=urllib.request.Request(url,headers={
                  'Accept':'application/json, text/plain, */*',
                  'User-Agent':'qingman/4.4.5 (Android)',
                  'appVersion':'4.4.5','platform':'android',
              })
              try:
                  with urllib.request.urlopen(req,timeout=6,context=ctx) as r:
                      b=r.read(320).decode('utf-8','replace').replace('\n',' ')
                      return h,r.status,b
              except urllib.error.HTTPError as e:
                  b=e.read(320).decode('utf-8','replace').replace('\n',' ')
                  return h,e.code,b
              except Exception as e:
                  return h,'ERR',type(e).__name__+':'+str(e)[:120]
          interesting=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              fs=[ex.submit(probe,h) for h in sorted(hosts)[:120]]
              for f in as_completed(fs):
                  h,code,b=f.result()
                  # Only report potentially useful hosts plus old baseline; keep log compact.
                  if code not in (404,'ERR') or h=='sf85sdq66h.qingman.mom':
                      interesting.append((h,code,b))
          print('=== interesting ===')
          for h,code,b in sorted(interesting):
              print(h,'http=',code,'body=',b[:260])
          PY
