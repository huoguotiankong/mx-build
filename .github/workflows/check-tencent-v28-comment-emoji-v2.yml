name: Check Tencent v28 comment emoji v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-tencent-v28-comment-emoji-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout Tencent v28 branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: fix/tencent-v28-comment-emoji-tokens
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Apply v28 emoji patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('dev/src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt')
          build = Path('dev/src/zh/tencentcomics/build.gradle.kts')
          text = source.read_text('utf-8')

          start_marker = '    private fun decodeCommentText(value: String): String {'
          end_marker = '\n\n    private fun imageUrlFromElement'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_decode = '''    private fun decodeCommentText(value: String): String {
              val text = Jsoup.parse(value).text().trim()
              return TENCENT_EMOJI_TOKEN.replace(text) { match ->
                  val token = match.groupValues[1]
                  val numericCode = token.toIntOrNull()
                  if (numericCode != null) {
                      TENCENT_EMOJI_TEXT[numericCode] ?: "[表情$token]"
                  } else {
                      val label = TENCENT_EMOJI_NAMED_PREFIX.matchEntire(token)
                          ?.groupValues
                          ?.getOrNull(1)
                          ?.takeIf(String::isNotBlank)
                          ?: token
                      TENCENT_NAMED_EMOJI_TEXT[label] ?: "[$label]"
                  }
              }
          }'''
          # Normalize indentation from this embedded Python literal.
          new_decode = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_decode.splitlines())
          text = text[:start] + new_decode + text[end:]

          old_regex = '        val TENCENT_EMOJI_CODE = Regex("\\\\[:(\\\\d{1,3}):]")'
          new_regex = (
              '        val TENCENT_EMOJI_TOKEN = Regex("\\\\[:([^:\\\\r\\\\n]{1,32}):]")\n'
              '        val TENCENT_EMOJI_NAMED_PREFIX = Regex("^(?:aadb|bjqgx|xxsy|zcy|sw|[abglqs])(.+)$")'
          )
          if text.count(old_regex) != 1:
              raise SystemExit(f'emoji regex baseline count={text.count(old_regex)}')
          text = text.replace(old_regex, new_regex, 1)

          anchor = '            61 to "👍",\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'numeric emoji anchor count={text.count(anchor)}')
          numeric = {
              62:'🍚', 63:'🌞', 64:'🌹', 65:'🎂', 66:'💩', 67:'🥺', 68:'😁',
              69:'🌙', 70:'✊', 71:'🤝', 72:'🍉', 73:'😵', 74:'🗡️', 75:'☝️',
              76:'💔', 77:'🤫', 78:'🤔', 79:'🧍', 80:'🍧', 81:'⚽', 82:'🤞',
              83:'❤️', 84:'💣', 85:'😭', 86:'💞', 87:'🐷', 88:'😚', 89:'😏',
          }
          extra = ''.join(f'            {code} to "{emoji}",\n' for code, emoji in numeric.items())
          text = text.replace(anchor, anchor + extra, 1)

          named = {
              'OK':'👌', 'Yeah':'✌️', '鼓掌':'👏', '点赞':'👍', '称赞':'👍', '太赞了':'👍', '顶起':'👍',
              '笑哭':'😂', '大哭':'😭', '我哭':'😭', '哭泣':'😭', '好伤心':'😭', '伤心':'😢',
              '害羞':'😊', '生气':'😡', '发怒':'😡', '暴怒':'😡', '吃瓜':'🍉', '喝茶':'🍵',
              '睡觉':'😴', '可怜':'🥺', '可怜眼':'🥺', '喜欢':'❤️', '爱你':'❤️', '表白':'❤️',
              '狗头':'🐶', '鬼脸':'😜', '奸笑':'😏', '惊':'😱', '吓到':'😱', '吓死了':'😱',
              '吓死宝宝了':'😱', '惊呆了':'😱', '晕':'😵', '晕倒':'😵', '醉了':'😵',
              '疑问':'❓', '怀疑':'🤨', '什么鬼':'❓', '无奈':'😑', '无语':'😑', '嫌弃':'🙄',
              '不屑':'🙄', '鄙视':'🙄', '呵呵':'😏', '开心':'😄', '快乐':'😄', '好嗨':'😄',
              '大笑':'😄', '思考':'🤔', '冥想':'🤔', '抱抱':'🤗', '安慰':'🤗', '盯着':'👀',
              '强力围观':'👀', '看书':'📖', '自信':'😎', '耍酷':'😎', '就是这么吊':'😎',
              '催更':'📣', '快更新':'📣', '还不更新吗':'📣', '可爱':'🥰', '卡哇伊':'🥰',
              '呆滞':'😶', '愣住':'😶', '石化':'😶', '咦！':'😯', '嘿嘿':'😏', '威胁':'😈',
              '诅咒作者':'😈', '安详':'😌', '慈爱':'😊', '滑稽':'😏', '苦笑':'😅', '酸了':'🍋',
              '马赛克':'🫣', '麻了':'😵‍💫', '黑线':'😓', '保证':'🤝', '头疼':'🤕', '熬夜':'🌙',
              '吐舌':'😛', '发脾气':'😤', '我要玩':'🎮', '辛苦了':'🙏', '弹幕护体':'🛡️',
              '捉急':'😰', '左亲亲':'😘', '右亲亲':'😘', 'kiss':'😘', '感动':'🥹', '核善':'🙂',
              '馋你':'🤤', 'emm':'😐', '吃手':'🤭', '猫猫':'🐱', '鼻血':'🩸', '掌刮':'👋',
              '挖鼻':'👃', '闭嘴':'🤐', '吐':'🤮', '星星眼':'🤩', '不是吧':'😮', '哼':'😤',
              '路人转粉':'💖', '长知识了':'💡', '元气波':'💥', '又涨新姿势':'💡',
          }
          map_lines = ['        val TENCENT_NAMED_EMOJI_TEXT = mapOf(']
          map_lines += [f'            "{name}" to "{emoji}",' for name, emoji in named.items()]
          map_lines += ['        )', '']
          named_map = '\n'.join(map_lines)
          json_anchor = '        val JSON = Json {\n'
          if text.count(json_anchor) != 1:
              raise SystemExit(f'JSON anchor count={text.count(json_anchor)}')
          text = text.replace(json_anchor, named_map + json_anchor, 1)
          source.write_text(text, 'utf-8')

          build_text = build.read_text('utf-8')
          if build_text.count('versionCode = 27') != 1:
              raise SystemExit('versionCode 27 baseline missing')
          build.write_text(build_text.replace('versionCode = 27', 'versionCode = 28', 1), 'utf-8')
          PY

          cd dev
          python3 scripts/validate_sources.py
          git diff --check
          grep -F 'versionCode = 28' src/zh/tencentcomics/build.gradle.kts
          grep -F 'TENCENT_EMOJI_TOKEN' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F '68 to "😁"' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F '"鼓掌" to "👏"' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F 'removeAllQueryParameters("tp")' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay patched Tencent module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/tencentcomics
          cp -a dev/src/zh/tencentcomics upstream/src/zh/tencentcomics

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format and verify Spotless
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:tencentcomics:spotlessApply
          ./gradlew :src:zh:tencentcomics:spotlessCheck

      - name: Build debug and release
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:tencentcomics:assembleDebug :src:zh:tencentcomics:assembleRelease

      - name: Lint release
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:tencentcomics:lintRelease

      - name: Package formatted validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf handoff
          mkdir -p handoff
          cp -a upstream/src/zh/tencentcomics handoff/tencentcomics
          printf '%s\n' 'Tencent Comics v28 emoji patch validated against current Keiyoushi' > handoff/VALIDATED.txt
          grep -F 'versionCode = 28' handoff/tencentcomics/build.gradle.kts
          grep -F '68 to "😁"' handoff/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F '"鼓掌" to "👏"' handoff/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: tencent-v28-comment-emoji-source-v2
          path: handoff
          if-no-files-found: error
          retention-days: 7
