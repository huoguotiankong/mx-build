name: Build And Stage Lizi Manhua v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-lizimanhua-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lizimanhua-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" ]]
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Lizi development branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: source/lizimanhua-v2
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve Lizi version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('dev/src/zh/lizimanhua/build.gradle.kts')
          text = p.read_text('utf-8')
          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          lib = re.search(r'libVersion\s*=\s*"([0-9]+\.[0-9]+)"', text)
          if not code or not lib:
              raise SystemExit('Unable to resolve Lizi version')
          source_code = int(code.group(1))
          version_name = f'{lib.group(1)}.{source_code}'
          if version_name != '1.6.2':
              raise SystemExit(f'Unexpected Lizi v2 version: {version_name}')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as f:
              f.write(f'source_code={source_code}\nversion_name={version_name}\n')
          print(f'Lizi source versionCode={source_code}, versionName={version_name}')
          PY

      - name: Overlay Lizi Manhua
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/lizimanhua
          cp -a dev/src/zh/lizimanhua upstream/src/zh/lizimanhua
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "dev/src/zh/lizimanhua/res/mipmap-$d/ic_launcher.webp"
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format and static validation
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:lizimanhua:spotlessApply :src:zh:lizimanhua:spotlessCheck

      - name: Prepare stable signing key
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          required = ('signingKey', 'alias', 'storePassword', 'keyPassword')
          missing = [k for k in required if not bundle.get(k)]
          if missing:
              raise SystemExit('Signing bundle missing: ' + ', '.join(missing))
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(bundle['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for env_name, key in (('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')):
                  value = str(bundle[key])
                  print(f'::add-mask::{value}')
                  f.write(f'{env_name}<<EOF_SIGN\n{value}\nEOF_SIGN\n')
          PY

      - name: Build signed debug and release APKs
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:lizimanhua:assembleDebug :src:zh:lizimanhua:assembleRelease

      - name: Verify stable signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          expected="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          designated='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          [[ "$expected" == "$designated" ]] || { echo "::error::Unexpected signing identity"; exit 1; }
          apk="$(find upstream/src/zh/lizimanhua -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          echo "fingerprint=$expected" >> "$GITHUB_OUTPUT"

      - name: Verify optimized image route
        shell: bash
        run: |
          set -euo pipefail
          api='http://crm.weichu.asia'
          home="$(curl -L --max-time 15 -sS -H 'User-Agent: Dart/3.5 (dart:io)' "$api/app/api/home/data")"
          cover="$(python3 - <<'PY' <<<"$home"
          import json, sys
          root=json.load(sys.stdin)
          for section in (root.get('data') or {}).get('home_content_list') or []:
              for comic in section.get('comic_list') or []:
                  p=comic.get('picY') or comic.get('picX')
                  if p:
                      print(p)
                      raise SystemExit
          raise SystemExit('No cover path')
          PY
          )"
          url="https://p.imgo.buzz/${cover#/}"
          code="$(curl -L --max-time 15 --connect-timeout 5 -sS -o /dev/null -w '%{http_code}' "$url")"
          [[ "$code" == '200' ]] || { echo "::error::Optimized image route HTTP $code"; exit 1; }
          echo "Optimized image route verified: $url"

      - name: Checkout extension staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Generate isolated Lizi test store
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/lizimanhua' > targets.txt
          python3 dev/scripts/publish_test_repo.py \
            --targets targets.txt \
            --upstream-root upstream \
            --source-root dev \
            --repo-dir staging/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/index.json
          test -f staging/test/repo.json
          test -f "staging/test/apk/tachiyomi-zh.lizimanhua-v${EXPECTED_VERSION}.apk"
          grep -q 'eu.kanade.tachiyomi.extension.zh.lizimanhua' staging/test/index.json

      - name: Commit validated test store snapshot
        working-directory: staging
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          if git diff --cached --quiet; then
            echo 'No staging changes'
          else
            git commit -m "Stage Lizi Manhua v${EXPECTED_VERSION} test store"
            git push origin HEAD:extension-staging
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lizimanhua-v${{ steps.version.outputs.source_code }}-signed-apk
          path: upstream/src/zh/lizimanhua/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
