name: Build JMComic Plus v9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-jmcomicplus-v9.yml"
      - "scripts/patch_jmcomicplus_v9.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-jmcomicplus-v9
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" ]]
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout helpers
        uses: actions/checkout@v5
        with:
          path: buildrepo
          fetch-depth: 0

      - name: Checkout validated v8 source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: handoff/jmcomicplus-v8-source
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Apply v9 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 buildrepo/scripts/patch_jmcomicplus_v9.py
          grep -q 'versionCode = 9' source/src/zh/jmcomicplus/build.gradle.kts
          ! grep -q '__jm_author__' source/src/zh/jmcomicplus/src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay and format
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus
          cd upstream
          ./gradlew :src:zh:jmcomicplus:spotlessApply :src:zh:jmcomicplus:spotlessCheck
          cd ..
          rsync -a --delete --exclude build/ upstream/src/zh/jmcomicplus/ source/src/zh/jmcomicplus/

      - name: Upload v9 source
        uses: actions/upload-artifact@v4
        with:
          name: jmcomicplus-v9-source-candidate
          path: |
            source/src/zh/jmcomicplus
            source/docs/sources/jmcomicplus.md
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare signing key
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for e,k in (('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')):
                  v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF_SIGN\n{v}\nEOF_SIGN\n')
          PY

      - name: Build release and lint
        working-directory: upstream
        shell: bash
        run: ./gradlew :src:zh:jmcomicplus:assembleRelease :src:zh:jmcomicplus:lintRelease

      - name: Verify signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          expected="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          designated="1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620"
          [[ "$expected" == "$designated" ]]
          echo "fingerprint=$expected" >> "$GITHUB_OUTPUT"
          apk="$(find upstream/src/zh/jmcomicplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"

      - name: Upload signed v9 APK
        uses: actions/upload-artifact@v4
        with:
          name: jmcomicplus-v9-signed-test-apk
          path: upstream/src/zh/jmcomicplus/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Checkout dev publish helper
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Generate v9 test store
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/jmcomicplus' > targets.txt
          python3 dev/scripts/publish_test_repo.py --targets targets.txt --upstream-root upstream --source-root source --repo-dir teststore --owner huoguotiankong --repository mx-repo --signing-key "$SIGNING_FINGERPRINT"
          test -f teststore/apk/tachiyomi-zh.jmcomicplus-v1.6.9.apk
          test -f teststore/icon/eu.kanade.tachiyomi.extension.zh.jmcomicplus-v106009.png
          grep -Eq '1\.6\.9|106009|versionCode[^0-9]*9' teststore/index.json teststore/repo.json

      - name: Upload v9 test store
        uses: actions/upload-artifact@v4
        with:
          name: jmcomicplus-v9-test-store
          path: teststore
          if-no-files-found: error
          retention-days: 14

      - name: Stage source handoff
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v9-source && mkdir -p /tmp/v9-source/docs/sources
          cp -a source/src /tmp/v9-source/
          cp source/docs/sources/jmcomicplus.md /tmp/v9-source/docs/sources/
          cd /tmp/v9-source
          git init && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b handoff/jmcomicplus-v9-source
          git add -A && git commit -m "Handoff validated JMComic Plus v9 source"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/huoguotiankong/mx-build.git"
          git push --force origin HEAD:refs/heads/handoff/jmcomicplus-v9-source

      - name: Stage test-store handoff
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v9-store && cp -a teststore /tmp/v9-store
          cd /tmp/v9-store
          git init && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b handoff/jmcomicplus-v9
          git add -A && git commit -m "Handoff JMComic Plus v9 test store"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/huoguotiankong/mx-build.git"
          git push --force origin HEAD:refs/heads/handoff/jmcomicplus-v9

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
