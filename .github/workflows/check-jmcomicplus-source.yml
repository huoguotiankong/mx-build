name: Check JMComic Plus Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-jmcomicplus-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout private JM source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: d2770d3c617bb3b19ec83d2b7aa79bf13e4e5f59
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate private source layout
        working-directory: source
        run: |
          python3 scripts/validate_sources.py
          test -f src/zh/jmcomicplus/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay JMComic Plus
        shell: bash
        run: |
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: upstream

      - name: Spotless check
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:spotlessCheck

      - name: Build Debug extension
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:assembleDebug
