name: Check JMComic Plus Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-jmcomicplus-source.yml"
  workflow_dispatch:

permissions:
  contents: read

# Triggered for jmcomicplus v4 validation from mx-dev b7c7333; rerun after private runner failure.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout private JM source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: b7c7333599a2e9dda3f5e07fdbc9e101063a651b
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate private source layout
        working-directory: source
        run: |
          python3 scripts/validate_sources.py
          test -f src/zh/jmcomicplus/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay JMComic Plus
        shell: bash
        run: |
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Spotless to temporary overlay
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:spotlessApply

      - name: Spotless check
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:spotlessCheck

      - name: Build and lint extension
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:assembleDebug :src:zh:jmcomicplus:lintRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jmcomicplus-v4-debug-apk
          path: upstream/src/zh/jmcomicplus/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
