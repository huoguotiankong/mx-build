name: Probe Qingman Signed Bootstrap

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-bootstrap-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Derive transient native signature and probe bootstrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools >/dev/null
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libqx_security.so' -d /tmp/qm
          python3 - <<'PY'
          import hashlib,json,secrets,time,urllib.request,urllib.error,uuid
          from itertools import permutations
          from pathlib import Path
          from elftools.elf.elffile import ELFFile

          so=Path('/tmp/qm/lib/arm64-v8a/libqx_security.so')
          raw=so.read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          expected='0b187ca2fb5d98d8dc604b53bf01c44669f25c95f568e859c1498f3dfc078148'
          print('native_sha256=',digest)
          if digest != expected:
              raise SystemExit('native security library changed; refuse fixed-layout extraction')

          # The verified native build constructs bootstrapSign from a 33-byte
          # internal prefix at this virtual address. Keep the bytes transient:
          # never print or persist them.
          prefix_va=0x17d1f
          with so.open('rb') as f:
              elf=ELFFile(f)
              prefix=None
              for sec in elf.iter_sections():
                  sva=int(sec['sh_addr']); ssize=int(sec['sh_size'])
                  if sva <= prefix_va and prefix_va+33 <= sva+ssize:
                      d=sec.data(); prefix=d[prefix_va-sva:prefix_va-sva+33]; break
          if prefix is None or len(prefix)!=33:
              raise SystemExit('signature prefix bytes not found')
          print('native_layout_verified=true prefix_len=33')

          endpoint='https://mu8xm4cx.zermh.com/bootstrap/domain'
          ts=str(int(time.time()*1000))
          nonce=secrets.token_hex(16)
          device=uuid.uuid4().hex
          values={'timestamp':ts,'nonce':nonce,'deviceId':device}
          headers={
              'Content-Type':'application/json',
              'Accept':'application/json, text/plain, */*',
              'User-Agent':'qingman/4.4.5 (Android)',
              'appVersion':'4.4.5','platform':'android',
          }
          def summarize(body):
              try: o=json.loads(body)
              except Exception: return 'non_json len='+str(len(body)),None
              if not isinstance(o,dict): return 'json_type='+type(o).__name__,None
              code=o.get('code'); msg=str(o.get('msg',''))[:100]; data=o.get('data')
              if isinstance(data,str): ds=f'str_len={len(data)}'
              elif isinstance(data,dict): ds='dict_keys='+','.join(sorted(map(str,data.keys()))[:20])
              elif data is None: ds='none'
              else: ds='type='+type(data).__name__
              return f'code={code!r} msg={msg!r} data={ds}',o

          accepted=None
          for order in permutations(('timestamp','nonce','deviceId')):
              sig=hashlib.sha256(prefix+b''.join(values[k].encode() for k in order)).hexdigest()
              payload={'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':device}
              req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      status=r.status; body=r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  status=e.code; body=e.read().decode('utf-8','replace')
              except Exception as e:
                  print('order='+','.join(order),'error='+type(e).__name__+':'+str(e)[:120]); continue
              summary,o=summarize(body)
              print('order='+','.join(order),f'http={status}',summary)
              if isinstance(o,dict) and o.get('data') and str(o.get('msg','')).lower() not in ('参数错误','parameter error'):
                  accepted=order
                  print('accepted_order='+','.join(order))
                  break
          print('accepted=',bool(accepted))
          PY
