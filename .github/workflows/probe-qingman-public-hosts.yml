name: Probe Qingman Known Public Hosts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-public-hosts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe known read-only host candidates
        shell: bash
        run: |
          set -u
          cat > /tmp/hosts <<'EOF'
          bass8ycl.zermh.com
          mu8xm4cx.zermh.com
          sf85sdq66h.qingman.mom
          www.qingman.app
          vkh30hp8.mhxiaomidi.com
          EOF
          echo '=== READ_ONLY_ROUTE_RESULTS ==='
          while IFS= read -r host; do
            [ -n "$host" ] || continue
            for route in api/comic/categories/list api/comic/comics/v1/homeList api/comic/comics/homerecentUpdates api/radio/api/config/getAdConfig; do
              err=/tmp/err; body=/tmp/body
              : > "$err"; : > "$body"
              code=$(curl -sS -L --connect-timeout 8 --max-time 15 -o "$body" -w '%{http_code}' "https://${host}/${route}" 2>"$err" || true)
              bytes=$(wc -c < "$body" | tr -d ' ')
              if grep -Eqi 'certificate required|tls.*alert|alert.*certificate' "$err"; then
                result='tls-client-certificate-required'
              elif [ "$code" = '000' ]; then
                result='connection-failed'
              else
                result="http-${code}"
              fi
              printf 'host=%s route=%s result=%s bytes=%s\n' "$host" "$route" "$result" "$bytes"
            done
          done < /tmp/hosts
