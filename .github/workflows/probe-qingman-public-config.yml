name: Inspect Qingman Public Config

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-public-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print safe public config structure and hosts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request
          u='https://bass8ycl.zermh.com/api/radio/api/config/version'
          o=json.load(urllib.request.urlopen(u,timeout=20))
          sensitive=re.compile(r'(token|secret|password|cookie|sign|proof|key)',re.I)
          def walk(x,path='$'):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=f'{path}.{k}'
                      if sensitive.search(str(k)):
                          print(p,'=<redacted>')
                      elif isinstance(v,(dict,list)):
                          print(p, type(v).__name__)
                          walk(v,p)
                      elif isinstance(v,str):
                          hosts=re.findall(r'https?://[^\s"<>]+',v)
                          if hosts:
                              print(p,'=', ';'.join(hosts))
                          elif len(v) <= 120:
                              print(p,'=',v)
                      elif isinstance(v,(int,float,bool)) or v is None:
                          print(p,'=',v)
              elif isinstance(x,list):
                  for i,v in enumerate(x[:40]): walk(v,f'{path}[{i}]')
          walk(o)
          PY
