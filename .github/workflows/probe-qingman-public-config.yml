name: Inspect Qingman Public Config

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-public-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe safe public config candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.error,urllib.request,urllib.parse

          base='https://bass8ycl.zermh.com/'
          paths=[
              'api/radio/api/config/version',
              'api/radio/api/config/getAdConfig',
              'api/radio/api/config/homepage/interstitial',
          ]
          sensitive=re.compile(r'(token|secret|password|cookie|sign|proof|key|certificate|private)',re.I)

          def redact(x,depth=0):
              if depth>6: return '<depth-limit>'
              if isinstance(x,dict):
                  out={}
                  for k,v in list(x.items())[:100]:
                      out[k]='<redacted>' if sensitive.search(str(k)) else redact(v,depth+1)
                  return out
              if isinstance(x,list): return [redact(v,depth+1) for v in x[:30]]
              if isinstance(x,str):
                  if len(x)>300: return x[:300]+'...'
                  return x
              return x

          for path in paths:
              url=urllib.parse.urljoin(base,path)
              req=urllib.request.Request(url,headers={
                  'Accept':'application/json, text/plain, */*',
                  'User-Agent':'qingman/4.4.5 (Android)',
                  'appVersion':'4.4.5',
                  'platform':'android',
              })
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      status=r.status; ctype=r.headers.get('content-type',''); raw=r.read(65536)
              except urllib.error.HTTPError as e:
                  status=e.code; ctype=e.headers.get('content-type',''); raw=e.read(65536)
              except Exception as e:
                  print(f'ENDPOINT {path} error={type(e).__name__}:{e}')
                  continue
              text=raw.decode('utf-8','replace')
              print(f'ENDPOINT {path} http={status} ctype={ctype[:100]} bytes={len(raw)}')
              try:
                  obj=json.loads(text)
                  print(json.dumps(redact(obj),ensure_ascii=False,separators=(',',':'))[:8000])
              except Exception:
                  print(re.sub(r'(?i)(token|secret|password|cookie|sign|proof|key)[=:][^\s&]+',r'\1=<redacted>',text[:3000]))
          PY
