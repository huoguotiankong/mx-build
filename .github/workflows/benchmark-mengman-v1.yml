name: Benchmark Mengman v1 APIs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-mengman-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Mengman endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, time, urllib.request, urllib.error, zipfile, io

          common={
              'User-Agent':'okhttp/4.12.0',
              'Accept':'application/json, text/plain, */*',
              'X-Package':'com.mengman.app',
              'X-App-VersionCode':'101',
          }
          urls=[
              'https://static.yisix.cn/static/config/domain.json',
              'https://api.yisix.cn/api/v1/config/features?_ts='+str(int(time.time()*1000)),
              'https://api.yisix.cn/api/v1/comic-categories',
              'https://api.yisix.cn/api/v1/comics?page=1&size=20',
              'https://api.yisix.cn/api/v1/home/data',
              'https://api.yisix.cn/api/v1/home/banners',
              'https://api.yisix.cn/api/v1/search/hot?content_type=2',
              'https://static.yisix.cn/static/category/list.zip',
              'https://static.yisix.cn/static/search/hot_comic.zip',
          ]
          for url in urls:
              print('\n===',url)
              req=urllib.request.Request(url,headers=common)
              try:
                  t=time.perf_counter()
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read(); dt=time.perf_counter()-t
                      print('status',r.status,'type',r.headers.get('content-type'),'len',len(body),'time',round(dt,3))
                      print('headers',dict(r.headers))
                      if body[:2]==b'PK':
                          print('zip entries',zipfile.ZipFile(io.BytesIO(body)).namelist()[:20])
                          for n in zipfile.ZipFile(io.BytesIO(body)).namelist()[:3]:
                              b=zipfile.ZipFile(io.BytesIO(body)).read(n)
                              print('entry',n,'len',len(b),'head',b[:500])
                      else:
                          print('body',body[:2500].decode('utf-8','replace'))
              except urllib.error.HTTPError as e:
                  b=e.read()
                  print('HTTPError',e.code,'headers',dict(e.headers),'body',b[:2500].decode('utf-8','replace'))
              except Exception as e:
                  print('ERROR',repr(e))
          PY
