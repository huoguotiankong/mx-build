name: Probe Qingman Runtime Domain

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-runtime-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve current official APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('version='+str(a.get('version','')))
          print('versionCode='+str(a.get('versionCode','')))
          PY
          head -1 /tmp/apk_url > /tmp/url
          tail -2 /tmp/apk_url
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/url)" -o /tmp/qingman.apk
          echo "apk_sha256=$(sha256sum /tmp/qingman.apk | cut -d' ' -f1)"
          echo '=== packaged native ABIs ==='
          unzip -Z1 /tmp/qingman.apk | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u
      - name: Run official app and capture safe bootstrap status
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -eu
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb install -r /tmp/qingman.apk
            PKG="$(adb shell pm list packages -3 | sed -n 's/^package://p' | tr -d '\r' | head -1)"
            echo "package=$PKG"
            test -n "$PKG"
            adb logcat -c
            adb shell am force-stop "$PKG" || true
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/tmp/monkey.log 2>&1 || true
            tail -30 /tmp/monkey.log || true
            sleep 50
            echo '=== safe bootstrap runtime lines ==='
            adb logcat -d -v brief \
              | grep -E 'bootstrap: (code=|apiDomain 已应用|apiDomain 解析失败|下发失败|原生签名失败|proof 生成失败|解密失败|命中风控|未下发 appAccessToken|appAccessToken 已应用)' \
              | sed -E 's/(token|access|proof|signature|sign)[=:][^ ]+/\1=<redacted>/Ig' \
              | tail -160 || true
            echo '=== app process state ==='
            adb shell pidof "$PKG" || true
