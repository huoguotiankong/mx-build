name: MX Extension Trusted Format

run-name: MX Extension Trusted Format · trusted-trigger

on:
  push:
    branches: [main]
    paths:
      - ".github/mx-extension-format-trigger"

permissions:
  contents: read

concurrency:
  group: mx-extension-trusted-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout build infrastructure
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve trusted target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          source_name="$(sed -n 's/^source=//p' .github/mx-extension-format-trigger | head -n 1)"
          source_ref="$(sed -n 's/^ref=//p' .github/mx-extension-format-trigger | head -n 1)"
          [[ "$source_name" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo "::error::Invalid source module name"; exit 1; }
          [[ "$source_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid source ref"; exit 1; }
          echo "source=$source_name" >> "$GITHUB_OUTPUT"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout private extension source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: ${{ steps.target.outputs.ref }}
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Verify selected module
        shell: bash
        run: |
          set -euo pipefail
          source_name="${{ steps.target.outputs.source }}"
          test -f "source/src/zh/$source_name/build.gradle.kts"
          test -d "source/src/zh/$source_name/src"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay selected private module
        shell: bash
        run: |
          set -euo pipefail
          source_name="${{ steps.target.outputs.source }}"
          rm -rf "upstream/src/zh/$source_name"
          mkdir -p "upstream/src/zh"
          cp -a "source/src/zh/$source_name" "upstream/src/zh/$source_name"

      - name: Apply current Keiyoushi formatting
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          source_name="${{ steps.target.outputs.source }}"
          ./gradlew ":src:zh:$source_name:spotlessApply"

      - name: Verify formatted extension build
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          source_name="${{ steps.target.outputs.source }}"
          ./gradlew \
            ":src:zh:$source_name:assembleDebug" \
            ":src:zh:$source_name:assembleRelease" \
            ":src:zh:$source_name:lintRelease"

      - name: Export whitespace-only formatting plan
        shell: bash
        run: |
          set -euo pipefail
          source_name="${{ steps.target.outputs.source }}"
          python3 - "$source_name" <<'PY'
          import base64
          import gzip
          import json
          import pathlib
          import sys

          source_name = sys.argv[1]
          before_root = pathlib.Path("source/src/zh") / source_name
          after_root = pathlib.Path("upstream/src/zh") / source_name

          for after_path in sorted(after_root.rglob("*.kt")):
              rel = after_path.relative_to(after_root)
              before_path = before_root / rel
              if not before_path.exists():
                  continue

              before = before_path.read_text(encoding="utf-8")
              after = after_path.read_text(encoding="utf-8")
              before_skeleton = "".join(ch for ch in before if not ch.isspace())
              after_skeleton = "".join(ch for ch in after if not ch.isspace())
              match = before_skeleton == after_skeleton
              print(f"FORMAT_MATCH::{rel.as_posix()}::{str(match).lower()}")
              if not match:
                  continue

              runs = []
              whitespace = []
              for ch in after:
                  if ch.isspace():
                      whitespace.append(ch)
                  else:
                      runs.append("".join(whitespace))
                      whitespace.clear()
              runs.append("".join(whitespace))
              raw = json.dumps(runs, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              payload = base64.b64encode(gzip.compress(raw, compresslevel=9)).decode("ascii")
              print(f"FORMAT_PLAN::{rel.as_posix()}::{payload}")
          PY
