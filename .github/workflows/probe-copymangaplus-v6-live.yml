name: Probe CopyManga Plus v6 live APIs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-copymangaplus-v6-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe current Copy list and search APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import random
          import string
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime

          hosts = [
              'api.copy2000.online',
              'api.copy-manga.com',
              'api.2026copy.com',
              'api.copy4000.com',
              'api.mangacopy.com',
              'api.copy3000.com',
              'mapi.copy20.com',
          ]
          secret = b'3af08590311032efe0660550a0563a53'
          pseudo = ''.join(random.choice(string.ascii_letters + string.digits) for _ in range(16))
          device = 'AB1C.123456.789'
          deviceinfo = '1234567V-1234'

          def headers():
              ts = str(int(time.time()))
              signature = hmac.new(secret, ts.encode(), hashlib.sha256).hexdigest()
              return {
                  'User-Agent': 'COPY/3.0.6',
                  'source': 'copyApp',
                  'deviceinfo': deviceinfo,
                  'dt': datetime.now().strftime('%Y.%m.%d'),
                  'platform': '3',
                  'referer': 'com.copymanga.app-3.0.6',
                  'version': '3.0.6',
                  'device': device,
                  'pseudoid': pseudo,
                  'Accept': 'application/json',
                  'region': '0',
                  'Authorization': 'Token',
                  'umstring': 'b4c89ca4104ea9a97750314d791520ac',
                  'x-auth-timestamp': ts,
                  'x-auth-signature': signature,
              }

          def get(host, path):
              request = urllib.request.Request('https://' + host + path, headers=headers())
              with urllib.request.urlopen(request, timeout=12) as response:
                  status = response.status
                  body = response.read().decode('utf-8', 'replace')
              root = json.loads(body)
              if status < 200 or status >= 300:
                  raise RuntimeError(f'HTTP {status}')
              if root.get('code') not in (None, 200):
                  raise RuntimeError(f"code={root.get('code')} message={root.get('message')}")
              return root

          rows = []
          list_hosts = []
          search_hits = []
          for host in hosts:
              try:
                  root = get(host, '/api/v3/comics?limit=5&offset=0&ordering=-popular&_update=true')
                  items = ((root.get('results') or {}).get('list') or [])
                  if not items:
                      rows.append({'host': host, 'list': 'empty'})
                      continue
                  first = items[0].get('comic') or items[0]
                  title = str(first.get('name') or '').strip()
                  path_word = str(first.get('path_word') or '').strip()
                  list_hosts.append(host)
                  counts = []
                  errors = []
                  if title:
                      q = urllib.parse.quote(title)
                      paths = [
                          f'/api/v3/search/comic?limit=30&offset=0&q={q}&q_type=',
                          f'/api/kb/web/searchb/comics?limit=30&offset=0&q={q}&q_type=',
                      ]
                      for path in paths:
                          try:
                              search_root = get(host, path)
                              results = search_root.get('results') or {}
                              search_list = results.get('list')
                              counts.append(None if search_list is None else len(search_list))
                              errors.append(None)
                          except Exception as exc:
                              counts.append(None)
                              errors.append(f'{type(exc).__name__}: {exc}'[:180])
                  row = {
                      'host': host,
                      'list_count': len(items),
                      'sample_title': title,
                      'sample_path_word': path_word,
                      'search_counts': counts,
                      'search_errors': errors,
                  }
                  rows.append(row)
                  if any(isinstance(count, int) and count > 0 for count in counts):
                      search_hits.append(row)
              except Exception as exc:
                  rows.append({'host': host, 'list_error': f'{type(exc).__name__}: {exc}'[:220]})

          print(json.dumps(rows, ensure_ascii=False, indent=2))
          print('LIST_WORKING_HOSTS=' + ','.join(list_hosts))
          print('SEARCH_WORKING_HOSTS=' + ','.join(row['host'] for row in search_hits))
          if not list_hosts:
              raise SystemExit('No Copy host returned a non-empty comic list with the v3.0.6 signed contract')
          if not search_hits:
              raise SystemExit('No Copy host returned non-empty search results for its own sample title')
          PY
