name: Probe CopyManga Plus current live APIs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-copymangaplus-v6-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe current Copy end-to-end APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import random
          import string
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime

          hosts = [
              'api.copy2000.online',
              'api.copy-manga.com',
              'api.2026copy.com',
              'api.copy4000.com',
              'api.mangacopy.com',
              'api.copy3000.com',
              'mapi.copy20.com',
          ]
          secret = b'3af08590311032efe0660550a0563a53'
          pseudo = ''.join(random.choice(string.ascii_letters + string.digits) for _ in range(16))
          device = 'AB1C.123456.789'
          deviceinfo = '1234567V-1234'

          def headers(region='0'):
              ts = str(int(time.time()))
              signature = hmac.new(secret, ts.encode(), hashlib.sha256).hexdigest()
              return {
                  'User-Agent': 'COPY/3.0.6',
                  'source': 'copyApp',
                  'deviceinfo': deviceinfo,
                  'dt': datetime.now().strftime('%Y.%m.%d'),
                  'platform': '3',
                  'referer': 'com.copymanga.app-3.0.6',
                  'version': '3.0.6',
                  'device': device,
                  'pseudoid': pseudo,
                  'Accept': 'application/json',
                  'region': region,
                  'Authorization': 'Token',
                  'umstring': 'b4c89ca4104ea9a97750314d791520ac',
                  'x-auth-timestamp': ts,
                  'x-auth-signature': signature,
              }

          def get(host, path, region='0'):
              request = urllib.request.Request('https://' + host + path, headers=headers(region))
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      status = response.status
                      body = response.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read().decode('utf-8', 'replace')
              root = json.loads(body)
              if status < 200 or status >= 300:
                  raise RuntimeError(f'HTTP {status}; code={root.get("code")}; message={root.get("message")}')
              if root.get('code') not in (None, 200):
                  raise RuntimeError(f"code={root.get('code')} message={root.get('message')}")
              return root

          def q(value):
              return urllib.parse.quote(str(value), safe='')

          try:
              discovery = get('api.copy-manga.com', '/api/v3/system/network2?platform=3')
              print('DISCOVERY=' + json.dumps(discovery.get('results'), ensure_ascii=False)[:1800])
          except Exception as exc:
              print('DISCOVERY_ERROR=' + f'{type(exc).__name__}: {exc}'[:300])

          rows = []
          list_hosts = []
          search_hosts = []
          detail_hosts = []
          chapter_hosts = []
          page_hosts = []

          known_paths = ['modujingbingdenuli', 'duoshuqian', 'hougongkaizailihunshi']

          for host in hosts:
              row = {'host': host}
              try:
                  root = get(host, '/api/v3/comics?limit=5&offset=0&ordering=-popular&_update=true')
                  items = ((root.get('results') or {}).get('list') or [])
                  row['list_count'] = len(items)
                  if not items:
                      raise RuntimeError('empty comic list')
                  list_hosts.append(host)

                  first = items[0].get('comic') or items[0]
                  title = str(first.get('name') or '').strip()
                  row['sample_title'] = title
                  search = get(host, f'/api/v3/search/comic?limit=30&offset=0&q={q(title)}&q_type=')
                  search_list = ((search.get('results') or {}).get('list') or [])
                  row['search_count'] = len(search_list)
                  if search_list:
                      search_hosts.append(host)

                  candidate_paths = []
                  for item in items:
                      comic = item.get('comic') or item
                      path = str(comic.get('path_word') or '').strip()
                      if path and path not in candidate_paths:
                          candidate_paths.append(path)
                  for path in known_paths:
                      if path not in candidate_paths:
                          candidate_paths.append(path)

                  chain_errors = []
                  for path_word in candidate_paths[:8]:
                      try:
                          detail = get(
                              host,
                              f'/api/v3/comic2/{q(path_word)}?in_mainland=true&request_id=&platform=3',
                          )
                          results = detail.get('results') or {}
                          comic = results.get('comic') or {}
                          if not comic:
                              raise RuntimeError('detail missing results.comic')
                          if host not in detail_hosts:
                              detail_hosts.append(host)

                          groups = results.get('groups') or {}
                          if not isinstance(groups, dict) or not groups:
                              chain_errors.append(
                                  f'{path_word}: empty groups; result_keys={list(results.keys())[:20]}'
                              )
                              continue

                          group_key = next(iter(groups))
                          group_value = groups.get(group_key) or {}
                          group_word = str(group_value.get('path_word') or group_key).strip()
                          if not group_word:
                              chain_errors.append(f'{path_word}: empty group path')
                              continue

                          chapters = get(
                              host,
                              f'/api/v3/comic/{q(path_word)}/group/{q(group_word)}/chapters?limit=100&offset=0&in_mainland=true&request_id=',
                          )
                          chapter_list = ((chapters.get('results') or {}).get('list') or [])
                          if not chapter_list:
                              chain_errors.append(f'{path_word}/{group_word}: empty chapter list')
                              continue
                          if host not in chapter_hosts:
                              chapter_hosts.append(host)

                          page_count = 0
                          page_error = None
                          for chapter in chapter_list[:5]:
                              chapter_id = str(chapter.get('uuid') or '').strip()
                              if not chapter_id:
                                  continue
                              try:
                                  page_root = get(
                                      host,
                                      f'/api/v3/comic/{q(path_word)}/chapter2/{q(chapter_id)}?in_mainland=true&request_id=',
                                  )
                                  chapter_box = ((page_root.get('results') or {}).get('chapter') or {})
                                  contents = chapter_box.get('contents') or []
                                  if contents:
                                      page_count = len(contents)
                                      break
                              except Exception as exc:
                                  page_error = f'{type(exc).__name__}: {exc}'[:180]

                          if not page_count:
                              chain_errors.append(f'{path_word}/{group_word}: no page contents; {page_error}')
                              continue

                          row.update(
                              detail_path=path_word,
                              detail_name=str(comic.get('name') or ''),
                              group_key=str(group_key),
                              group_word=group_word,
                              chapter_count=len(chapter_list),
                              page_count=page_count,
                              page_endpoint='chapter2',
                          )
                          if host not in page_hosts:
                              page_hosts.append(host)
                          break
                      except Exception as exc:
                          chain_errors.append(f'{path_word}: {type(exc).__name__}: {exc}'[:260])
                  if chain_errors:
                      row['chain_errors'] = chain_errors[:8]
              except Exception as exc:
                  row['error'] = f'{type(exc).__name__}: {exc}'[:300]
              rows.append(row)

          print(json.dumps(rows, ensure_ascii=False, indent=2))
          print('LIST_WORKING_HOSTS=' + ','.join(list_hosts))
          print('SEARCH_WORKING_HOSTS=' + ','.join(search_hosts))
          print('DETAIL_WORKING_HOSTS=' + ','.join(detail_hosts))
          print('CHAPTER_WORKING_HOSTS=' + ','.join(chapter_hosts))
          print('PAGE_WORKING_HOSTS=' + ','.join(page_hosts))

          if not list_hosts:
              raise SystemExit('No Copy host returned a non-empty comic list')
          if not search_hosts:
              raise SystemExit('No Copy host returned non-empty search results')
          if not detail_hosts:
              raise SystemExit('No Copy host returned comic detail')
          if not chapter_hosts:
              raise SystemExit('No Copy host returned chapter list with the current Venera query contract')
          if not page_hosts:
              raise SystemExit('No Copy host returned reader page contents with chapter2 current contract')
          PY
