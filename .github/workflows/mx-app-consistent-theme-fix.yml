name: Dispatch MX Detail Page Enhancement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-consistent-theme-fix.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch detail page validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mx-app-detail-page-source-actions.yml --repo huoguotiankong/mx-build --ref main
