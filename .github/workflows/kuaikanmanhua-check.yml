name: Kuaikan Manhua Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kuaikanmanhua-check.yml"
      - ".github/kuaikanmanhua-check-trigger"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: test -n "$MX_PRIVATE_READ_TOKEN"
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          persist-credentials: false
      - name: Overlay private Kuaikan module
        run: |
          rm -rf upstream/src/zh/kuaikanmanhua
          cp -a source/src/zh/kuaikanmanhua upstream/src/zh/kuaikanmanhua
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: upstream
      - name: Build Debug
        working-directory: upstream
        run: ./gradlew :src:zh:kuaikanmanhua:assembleDebug
