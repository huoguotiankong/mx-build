name: CopyManga Plus v3 Route Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/copymangaplus-v3-route-probe-trigger"
      - ".github/workflows/copymangaplus-v3-route-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Probe content and mobile capabilities separately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          CONTENT_HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36 Edg/141.0.0.0',
              'x-requested-with': 'com.manga2020.app',
              'dnts': '3',
              'platform': '3',
              'version': '2024.4.28',
              'webp': '1',
              'accept': 'application/json',
              'referer': 'https://www.mangacopy.com/',
          }
          MOBILE_FALLBACK = '3.0.9'
          BASE_HOSTS = [
              'api.2024manga.com',
              'api.2026copy.com',
              'api.copy4000.com',
              'api.mangacopy.com',
              'api.copy3000.com',
              'mapi.copy20.com',
              'api.copy-manga.com',
              'api.copy2000.online',
              'mapi.hotmangasg.com',
              'mapi.hotmangasd.com',
              'mapi.hotmangasf.com',
          ]
          TEST_CHAPTER = '27a0e0f4-b413-11e9-aea4-00163e0ca5bd'
          TEST_COMIC = 'andayudaocunnew'

          def req(host, path, headers, timeout=12):
              r = urllib.request.Request(f'https://{host}{path}', headers=headers)
              try:
                  with urllib.request.urlopen(r, timeout=timeout) as resp:
                      status = resp.status
                      raw = resp.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  status = e.code
                  raw = e.read().decode('utf-8', 'replace')
              try:
                  data = json.loads(raw)
              except Exception:
                  data = {'raw': raw[:240]}
              return status, data

          def normalize(v):
              v = str(v or '').strip()
              for p in ('https://', 'http://'):
                  if v.startswith(p): v = v[len(p):]
              return v.strip('/')

          app_version = MOBILE_FALLBACK
          version_probe = {}
          try:
              status, data = req('api.mangacopy.com', '/api/v3/system/appVersion/last', {
                  'User-Agent': 'COPY/3.0.0', 'version': MOBILE_FALLBACK,
                  'source': 'copyApp', 'referer': 'com.copymanga.app-3.0.0',
                  'webp': '1', 'region': '1', 'accept': 'application/json',
              })
              version_probe = {'http': status, 'code': data.get('code'), 'message': data.get('message')}
              v = (((data.get('results') or {}).get('android') or {}).get('version')) if isinstance(data, dict) else None
              if isinstance(v, str) and v.strip(): app_version = v.strip()
          except Exception as e:
              version_probe = {'error': str(e)}

          MOBILE_HEADERS = {
              'webp': '1', 'region': '1', 'User-Agent': 'COPY/3.0.0',
              'version': app_version, 'source': 'copyApp',
              'referer': 'com.copymanga.app-3.0.0', 'accept': 'application/json',
          }

          discovered = []
          network_errors = {}
          for bootstrap in ('api.2024manga.com', 'api.copy-manga.com', 'api.2026copy.com'):
              try:
                  status, data = req(bootstrap, '/api/v3/system/network2?platform=3', CONTENT_HEADERS)
                  if status == 200 and isinstance(data, dict) and data.get('code') in (None, 200):
                      results = data.get('results') or {}
                      for key in ('api', 'share'):
                          for node in results.get(key) or []:
                              if isinstance(node, list): discovered += [normalize(x) for x in node]
                              elif isinstance(node, str): discovered.append(normalize(node))
                  else:
                      network_errors[bootstrap] = {'http': status, 'code': data.get('code'), 'message': data.get('message')}
              except Exception as e:
                  network_errors[bootstrap] = {'error': str(e)}

          hosts = []
          for h in BASE_HOSTS + discovered:
              h = normalize(h)
              if h and h not in hosts: hosts.append(h)

          report = {
              'app_version': app_version,
              'version_probe': version_probe,
              'discovered': discovered,
              'network_errors': network_errors,
              'hosts': {},
              'content_working': [],
              'mobile_working': [],
          }

          for host in hosts:
              row = {}
              try:
                  status, data = req(host, '/api/v3/comics?limit=2&offset=0&ordering=-popular&platform=3', CONTENT_HEADERS)
                  items = (((data.get('results') or {}).get('list')) or []) if isinstance(data, dict) else []
                  row['content'] = {'http': status, 'code': data.get('code') if isinstance(data, dict) else None, 'message': data.get('message') if isinstance(data, dict) else None, 'count': len(items) if isinstance(items, list) else None}
                  if status == 200 and isinstance(data, dict) and data.get('code') in (None, 200) and isinstance(items, list) and items:
                      report['content_working'].append(host)
              except Exception as e:
                  row['content'] = {'error': str(e)}

              try:
                  status, data = req(host, f'/api/v3/roasts?chapter_id={TEST_CHAPTER}&limit=5&offset=0&_update=true', MOBILE_HEADERS)
                  results = data.get('results') if isinstance(data, dict) else None
                  items = results.get('list') if isinstance(results, dict) else None
                  row['mobile_roasts'] = {'http': status, 'code': data.get('code') if isinstance(data, dict) else None, 'message': data.get('message') if isinstance(data, dict) else None, 'count': len(items) if isinstance(items, list) else None}
                  if status == 200 and isinstance(data, dict) and data.get('code') in (None, 200) and isinstance(items, list):
                      report['mobile_working'].append(host)
              except Exception as e:
                  row['mobile_roasts'] = {'error': str(e)}

              try:
                  status, data = req(host, f'/api/v3/comic/{TEST_COMIC}/chapter/{TEST_CHAPTER}?platform=3', CONTENT_HEADERS)
                  chapter = ((data.get('results') or {}).get('chapter') or {}) if isinstance(data, dict) else {}
                  pages = chapter.get('contents') if isinstance(chapter, dict) else None
                  row['content_pages'] = {'http': status, 'code': data.get('code') if isinstance(data, dict) else None, 'message': data.get('message') if isinstance(data, dict) else None, 'count': len(pages) if isinstance(pages, list) else None}
              except Exception as e:
                  row['content_pages'] = {'error': str(e)}
              report['hosts'][host] = row

          p = Path('probe-results/copymangaplus-v3-route-probe.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(report, ensure_ascii=False, indent=2), 'utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Commit sanitized probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/copymangaplus-v3-route-probe.json
          if git diff --cached --quiet; then
            echo "No probe result changes"
          else
            git commit -m "probe: record CopyManga v3 route capabilities"
            git push origin HEAD:main
          fi
