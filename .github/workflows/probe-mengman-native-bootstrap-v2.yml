name: Probe Mengman native bootstrap v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mengman-native-bootstrap-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify bootstrap SEED and static AES pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import os
          import struct
          import subprocess
          import tempfile
          import time
          import urllib.request
          import zipfile

          STATIC = 'https://static.yisix.cn'
          CDN_SEED = '94e890e3a45ba392c0c519ed45190a4c'

          def fetch(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {'User-Agent': 'okhttp/4.12.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  print('GET', urllib.request.urlparse(url).path if hasattr(urllib.request, 'urlparse') else url.split('?', 1)[0], 'status', r.status, 'bytes', len(body))
                  return body

          def raw_text_chunks(png):
              sig = b'\x89PNG\r\n\x1a\n'
              if not png.startswith(sig):
                  raise RuntimeError('bootstrap response is not PNG')
              out = []
              p = 8
              while p + 12 <= len(png):
                  n = struct.unpack('>I', png[p:p+4])[0]
                  typ = png[p+4:p+8]
                  start = p + 8
                  end = start + n
                  if end + 4 > len(png):
                      raise RuntimeError('truncated PNG chunk')
                  if typ == b'tEXt':
                      out.append(png[start:end])
                      if len(out) == 2:
                          return out
                  p = end + 4
                  if typ == b'IEND':
                      break
              raise RuntimeError(f'expected >=2 tEXt chunks, got {len(out)}')

          def openssl_decrypt(cipher_name, data, key, iv=None, nopad=False):
              with tempfile.TemporaryDirectory() as td:
                  src = os.path.join(td, 'in.bin')
                  dst = os.path.join(td, 'out.bin')
                  open(src, 'wb').write(data)
                  cmd = [
                      'openssl', 'enc', '-' + cipher_name, '-d',
                      '-provider', 'default', '-provider', 'legacy',
                      '-K', key.hex(), '-in', src, '-out', dst,
                  ]
                  if iv is not None:
                      cmd += ['-iv', iv.hex()]
                  if nopad:
                      cmd += ['-nopad']
                  proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  if proc.returncode != 0:
                      raise RuntimeError('openssl decrypt failed: ' + proc.stderr.strip()[:500])
                  return open(dst, 'rb').read()

          def signed_static(path):
              ts = int(time.time())
              sign = hashlib.md5((CDN_SEED + path + str(ts)).encode()).hexdigest()
              return f'{STATIC}{path}?ts={ts}&sign={sign}'

          ranking_path = '/static/ranking/new.zip'
          encrypted_ranking = fetch(signed_static(ranking_path))
          print('ranking cipher prefix', encrypted_ranking[:8].hex(), 'block_aligned', len(encrypted_ranking) % 16 == 0)

          successes = 0
          for name in ('a1', 'a2'):
              print('\n=== bootstrap', name, '===')
              try:
                  png = fetch(f'{STATIC}/bootstrap/{name}.png')
                  chunks = raw_text_chunks(png)
                  print('raw tEXt lengths', [len(x) for x in chunks])
                  if len(chunks[0]) < 99:
                      raise RuntimeError('chunk1 shorter than native minimum')
                  if not chunks[1] or len(chunks[1]) % 16:
                      raise RuntimeError('chunk2 not SEED block aligned')

                  bootstrap_key = chunks[0][83:99]
                  plain = openssl_decrypt('seed-ecb', chunks[1], bootstrap_key, nopad=True)
                  print('SEED plaintext bytes', len(plain))
                  if len(plain) < 1226:
                      raise RuntimeError('SEED plaintext shorter than native static-key offsets')

                  static_key = plain[1194:1210]
                  static_iv = plain[1210:1226]
                  decoded = openssl_decrypt('aes-128-cbc', encrypted_ranking, static_key, static_iv)
                  print('static AES plaintext bytes', len(decoded), 'zip_magic', decoded.startswith(b'PK\x03\x04'))
                  if not decoded.startswith(b'PK\x03\x04'):
                      raise RuntimeError('static AES output is not ZIP')

                  with zipfile.ZipFile(io.BytesIO(decoded)) as zf:
                      names = zf.namelist()
                      bad = zf.testzip()
                      print('ZIP entries', names[:20])
                      print('ZIP integrity', 'ok' if bad is None else f'bad:{bad}')
                      if bad is not None:
                          raise RuntimeError('ZIP integrity failure')
                      for entry in names[:5]:
                          if entry.lower().endswith('.json'):
                              import json
                              obj = json.loads(zf.read(entry).decode('utf-8'))
                              if isinstance(obj, dict):
                                  print('JSON schema', entry, sorted(obj.keys())[:40])
                              elif isinstance(obj, list):
                                  print('JSON schema', entry, 'list_len', len(obj), 'item_type', type(obj[0]).__name__ if obj else 'empty')
                  successes += 1
                  print('bootstrap', name, 'END-TO-END OK')
              except Exception as e:
                  print('bootstrap', name, 'FAILED:', type(e).__name__, str(e)[:500])

          if successes < 1:
              raise SystemExit('No bootstrap candidate completed the native SEED -> static AES pipeline')
          print('\nVerified bootstrap candidates:', successes)
          PY
