name: Trace Qingman Legacy Static API Hosts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-static-api-host-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev dnsutils openssl >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace static host selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|p12|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          def safe(v): return '<redacted-sensitive>' if sensitive.search(v) else v[:480]
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True

          def annotate_region(start,end,title):
              print(f'=== {title} 0x{start:x}-0x{end:x} ===')
              pending={}
              for ins in md.disasm(data[start-base:end-base],start):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=ins.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if ins.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),24)
                  elif ins.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp: ann=' ; '+safe(f'PP+0x{off:x} {pp[off]}')
                  if ann or ins.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'0x{ins.address:x} {ins.mnemonic:<7} {ins.op_str}{ann}')

          annotate_region(0x658780,0x658b20,'LEGACY HOST REFERENCES')
          annotate_region(0x701b80,0x701df0,'DMZJ DOMAIN REFERENCES')

          print('\n=== BLUTTER DECLARATIONS NEAR TARGET ADDRESSES ===')
          targets=(0x65893c,0x658998,0x701ca0,0x701cc0)
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  m=re.search(r'\*\* addr: 0x([0-9a-fA-F]+), size: 0x([0-9a-fA-F]+)',s)
                  if not m: continue
                  st=int(m.group(1),16); sz=int(m.group(2),16)
                  if any(st <= t < st+sz for t in targets) or any(abs(st-t)<0x200 for t in targets):
                      print(f'FILE={p.name} {safe(s.strip())}')
                      for j in range(max(0,i-6),min(len(lines),i+30)): print(safe(lines[j]))
          PY

          echo '=== LOW-VOLUME LEGACY HOST PROBES ==='
          for h in sf85sdq66h.qingman.mom pmlkjkrdumcozpjy.pttower.com obsolete-unedited.shcvv.com; do
            echo "HOST=$h"
            dig +short A "$h" | head -5 | sed 's/^/  A=/' || true
            for scheme in https http; do
              for path in / /bootstrap/domain /api/comic/categories/list; do
                out=$(mktemp); hdr=$(mktemp)
                code=$(curl -sS --connect-timeout 5 --max-time 8 -D "$hdr" -o "$out" -w '%{http_code}' "$scheme://$h$path" || true)
                bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
                ctype=$(grep -i '^content-type:' "$hdr" | tail -1 | tr -d '\r' | cut -d: -f2- | xargs || true)
                printf '  %s %s code=%s bytes=%s ctype=%s\n' "$scheme" "$path" "$code" "$bytes" "$ctype"
                rm -f "$out" "$hdr"
              done
            done
          done
