name: Validate MX comment rich images

on:
  push:
    branches: [main]
    paths:
      - ".github/mx-app-format-trigger"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout private MX App feature
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/comment-rich-images-after-paid-only
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Apply Spotless
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Commit formatting
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt \
              app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt \
              i18n-kmk/src/commonMain/moko-resources/base/strings.xml
            git commit -m "style: format comment rich image rendering"
            git push origin HEAD:fix/comment-rich-images-after-paid-only
          fi

      - name: Spotless check
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Comment rich content tests
        working-directory: source
        run: ./gradlew :app:testReleaseUnitTest --tests eu.kanade.presentation.manga.comments.CommentRichContentTest

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Build Preview APK
        working-directory: source
        run: ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache
