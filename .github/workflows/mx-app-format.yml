name: Validate MX paid-only whole-manga replacement

on:
  push:
    branches: [main]
    paths:
      - ".github/mx-app-format-trigger"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout private MX App feature
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/paid-only-whole-manga-replacement
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply paid-only whole-manga replacement patch
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          reader = "app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt"
          replace_once(
              reader,
              '''        val targetChapter = findReplacementChapter(
              currentName = currentChapter.chapter.name,
              currentNumber = currentChapter.chapter.chapter_number,
              candidates = selection.chapters,
              offset = chapterOffset,
          ) ?: error(
              Injekt.get<Application>().stringResource(
                  KMR.strings.reader_replace_content_chapter_not_found,
                  currentChapter.chapter.name,
              ),
          )

          val currentPage = state.value.currentPage.coerceAtLeast(0)
          loader?.loadReplacementChapter(
              chapter = currentChapter,
              replacementSource = selection.source,
              replacementChapter = targetChapter,
              page = currentPage,
          ) ?: error(Injekt.get<Application>().stringResource(KMR.strings.reader_replace_content_loader_unavailable))

          saveChapterContentBinding(manga, selection, chapterOffset)
          val binding = getChapterContentBinding(manga)
          mutableState.update {
              it.copy(
                  dialog = null,
                  chapterContentLoadingSourceId = null,
                  chapterContentError = null,
                  chapterContentRestoring = false,
                  activeChapterContentSourceId = selection.source.id,
                  activeChapterContentSourceName = selection.source.name,
                  chapterContentBindingSourceId = binding?.sourceId,
                  chapterContentBindingSourceName = binding?.sourceId
                      ?.let { id -> sourceManager.get(id)?.name },
                  chapterContentBindingOffset = binding?.chapterOffset ?: 0,
                  chapterContentTargetSourceName = null,
                  chapterContentTargetMangaTitle = null,
                  chapterContentTargetMangas = emptyList(),
                  chapterContentTargetChapters = emptyList(),
              )
          }
          eventChannel.send(Event.ReloadViewerChapters)
          ''',
              '''        val replaceCurrentChapter = isWholeMangaReplacementEligible(currentChapter.chapter.name)
          if (replaceCurrentChapter) {
              val targetChapter = findReplacementChapter(
                  currentName = currentChapter.chapter.name,
                  currentNumber = currentChapter.chapter.chapter_number,
                  candidates = selection.chapters,
                  offset = chapterOffset,
              ) ?: error(
                  Injekt.get<Application>().stringResource(
                      KMR.strings.reader_replace_content_chapter_not_found,
                      currentChapter.chapter.name,
                  ),
              )

              val currentPage = state.value.currentPage.coerceAtLeast(0)
              loader?.loadReplacementChapter(
                  chapter = currentChapter,
                  replacementSource = selection.source,
                  replacementChapter = targetChapter,
                  page = currentPage,
              ) ?: error(Injekt.get<Application>().stringResource(KMR.strings.reader_replace_content_loader_unavailable))
          }

          saveChapterContentBinding(manga, selection, chapterOffset)
          val binding = getChapterContentBinding(manga)
          mutableState.update {
              it.copy(
                  dialog = null,
                  chapterContentLoadingSourceId = null,
                  chapterContentError = null,
                  chapterContentRestoring = false,
                  activeChapterContentSourceId = selection.source.id.takeIf { replaceCurrentChapter },
                  activeChapterContentSourceName = selection.source.name.takeIf { replaceCurrentChapter },
                  chapterContentBindingSourceId = binding?.sourceId,
                  chapterContentBindingSourceName = binding?.sourceId
                      ?.let { id -> sourceManager.get(id)?.name },
                  chapterContentBindingOffset = binding?.chapterOffset ?: 0,
                  chapterContentTargetSourceName = null,
                  chapterContentTargetMangaTitle = null,
                  chapterContentTargetMangas = emptyList(),
                  chapterContentTargetChapters = emptyList(),
              )
          }
          eventChannel.send(Event.ReloadViewerChapters)
          ''',
          )
          replace_once(
              reader,
              '''        val binding = manga?.let(::getChapterContentBinding)
          if (binding == null) {
              loader.loadChapter(chapter, page)
              return ChapterContentLoadResult()
          }
          ''',
              '''        val binding = manga?.let(::getChapterContentBinding)
          if (binding == null || !isWholeMangaReplacementEligible(chapter.chapter.name)) {
              loader.loadChapter(chapter, page)
              return ChapterContentLoadResult()
          }
          ''',
          )

          matcher = "app/src/main/java/eu/kanade/tachiyomi/ui/reader/ChapterContentMatcher.kt"
          matcher_file = Path(matcher)
          matcher_text = matcher_file.read_text()
          marker = '''private fun normalizeChapterMainTitle(value: String): String {
          '''
          helper = '''/**
           * Whole-manga replacement is entitlement-aware: it may only substitute chapters that the
           * original source explicitly marks as still requiring purchase. Free chapters and chapters
           * already unlocked by the current account stay on the original source. A persisted
           * single-chapter replacement is handled separately and may override any chapter.
           */
          internal fun isWholeMangaReplacementEligible(chapterName: String): Boolean {
              return chapterName.trimStart().startsWith("🔒")
          }

          private fun normalizeChapterMainTitle(value: String): String {
          '''
          if matcher_text.count(marker) != 1:
              raise SystemExit("ChapterContentMatcher.kt: normalize marker mismatch")
          matcher_file.write_text(matcher_text.replace(marker, helper, 1))

          manga_screen = "app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt"
          replace_once(
              manga_screen,
              '''import eu.kanade.tachiyomi.ui.reader.findBestReplacementChapter
          import eu.kanade.tachiyomi.ui.reader.setting.ReaderPreferences
          ''',
              '''import eu.kanade.tachiyomi.ui.reader.findBestReplacementChapter
          import eu.kanade.tachiyomi.ui.reader.isWholeMangaReplacementEligible
          import eu.kanade.tachiyomi.ui.reader.setting.ReaderPreferences
          ''',
          )
          replace_once(
              manga_screen,
              '''            isChapterContentReplaced = { chapter ->
                  hasWholeMangaContentBinding || chapter.id.toString() in replacedChapterIds
              },
          ''',
              '''            isChapterContentReplaced = { chapter ->
                  val directReplacement = chapter.id.toString() in replacedChapterIds
                  val wholeMangaReplacement = hasWholeMangaContentBinding &&
                      isWholeMangaReplacementEligible(chapter.name)
                  directReplacement || wholeMangaReplacement
              },
          ''',
          )

          item = "app/src/main/java/eu/kanade/presentation/manga/components/MangaChapterListItem.kt"
          replace_once(
              item,
              '''                    Text(
                          text = when {
                              contentReplaced && title.trimStart().startsWith("🔒") -> title.replaceFirst("🔒", "🔁")
                              contentReplaced -> "🔁 $title"
                              else -> title
                          },
          ''',
              '''                    Text(
                          text = chapterContentDisplayTitle(title, contentReplaced),
          ''',
          )
          item_file = Path(item)
          item_text = item_file.read_text()
          marker = '''internal fun getSwipeAction(
          '''
          helper = '''internal fun chapterContentDisplayTitle(title: String, contentReplaced: Boolean): String {
              if (!contentReplaced) return title

              val leadingWhitespace = title.takeWhile(Char::isWhitespace)
              val body = title.drop(leadingWhitespace.length)
              val content = CHAPTER_CONTENT_ACCESS_PREFIXES
                  .firstOrNull(body::startsWith)
                  ?.let { prefix -> body.removePrefix(prefix).trimStart() }
                  ?: body

              return buildString {
                  append(leadingWhitespace)
                  append("🔁")
                  if (content.isNotBlank()) {
                      append(' ')
                      append(content)
                  }
              }
          }

          private val CHAPTER_CONTENT_ACCESS_PREFIXES = listOf("🔒", "✅", "🔓", "🆓")

          internal fun getSwipeAction(
          '''
          if item_text.count(marker) != 1:
              raise SystemExit("MangaChapterListItem.kt: swipe marker mismatch")
          item_file.write_text(item_text.replace(marker, helper, 1))

          test = "app/src/test/java/eu/kanade/tachiyomi/ui/reader/ChapterContentMatcherTest.kt"
          test_file = Path(test)
          test_text = test_file.read_text()
          replace_once(
              test,
              '''import org.junit.jupiter.api.Assertions.assertEquals
          import org.junit.jupiter.api.Test
          ''',
              '''import org.junit.jupiter.api.Assertions.assertEquals
          import org.junit.jupiter.api.Assertions.assertFalse
          import org.junit.jupiter.api.Assertions.assertTrue
          import org.junit.jupiter.api.Test
          ''',
          )
          test_text = Path(test).read_text()
          marker = '''    private fun chapter(name: String, number: Float): SChapter = SChapter.create().apply {
          '''
          tests = '''    @Test
              fun `whole manga replacement only applies to chapters that still require purchase`() {
                  assertTrue(isWholeMangaReplacementEligible("🔒 第10话"))
                  assertFalse(isWholeMangaReplacementEligible("✅ 第10话"))
                  assertFalse(isWholeMangaReplacementEligible("🔓 第10话"))
                  assertFalse(isWholeMangaReplacementEligible("第10话"))
              }

              private fun chapter(name: String, number: Float): SChapter = SChapter.create().apply {
          '''
          if test_text.count(marker) != 1:
              raise SystemExit("ChapterContentMatcherTest.kt: chapter helper marker mismatch")
          test_file.write_text(test_text.replace(marker, tests, 1))

          display_test = Path("app/src/test/java/eu/kanade/presentation/manga/components/MangaChapterListItemTest.kt")
          display_test.parent.mkdir(parents=True, exist_ok=True)
          display_test.write_text('''package eu.kanade.presentation.manga.components

          import org.junit.jupiter.api.Assertions.assertEquals
          import org.junit.jupiter.api.Test

          class MangaChapterListItemTest {

              @Test
              fun `replacement marker replaces existing access marker`() {
                  assertEquals("🔁 第10话", chapterContentDisplayTitle("🔒 第10话", true))
                  assertEquals("🔁 第10话", chapterContentDisplayTitle("✅ 第10话", true))
                  assertEquals("🔁 第10话", chapterContentDisplayTitle("🔓 第10话", true))
              }

              @Test
              fun `replacement marker is added to free chapter only for explicit replacement`() {
                  assertEquals("🔁 第10话", chapterContentDisplayTitle("第10话", true))
                  assertEquals("第10话", chapterContentDisplayTitle("第10话", false))
              }
          }
          ''')

          docs = "docs/CHAPTER_CONTENT.md"
          replace_once(
              docs,
              '''- The manga chapter list now treats an active whole-manga content binding as replaced content, so the existing `🔁` marker and highlighted replacement action are visible instead of only marking manually mapped single chapters.
          ''',
              '''- The manga chapter list now marks only chapters that are actually replaced. Under a whole-manga binding, only original chapters marked `🔒` are shown as `🔁`; free and already-unlocked chapters keep their original status.
          ''',
          )
          docs_file = Path(docs)
          docs_text = docs_file.read_text()
          docs_text += '''

          ## Whole-manga entitlement policy

          Whole-manga replacement is deliberately narrower than single-chapter replacement:

          - `🔒` on the **original source chapter** means the current account still needs to buy/unlock that chapter. An active whole-manga binding may replace it automatically and the chapter list shows `🔁` instead of `🔒`.
          - `✅` / `🔓` means the current account already has reading permission. Whole-manga binding must keep using the original source and must not replace it.
          - a chapter with no paid-access marker is treated as free/original content and whole-manga binding must keep using the original source.
          - an explicit persisted **single-chapter replacement** remains the only way to force replacement of a free or already-unlocked chapter; it has priority over the whole-manga rule.
          - if an original source cannot expose a reliable `🔒` state, MX takes the safe path and does not auto-replace that chapter through a whole-manga binding.
          - chapter-list replacement markers reflect the chapter that will actually be loaded, not merely the existence of a whole-manga binding.

          This policy is host-side and does not bypass source entitlement checks. The original extension remains responsible for accurately marking free, unlocked, and still-paywalled chapters after account state is refreshed.
          '''
          docs_file.write_text(docs_text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Spotless
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Spotless check
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Build Preview APK
        working-directory: source
        run: ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache

      - name: Commit validated fix
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/kanade/tachiyomi/ui/reader/ReaderViewModel.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/reader/ChapterContentMatcher.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt \
            app/src/main/java/eu/kanade/presentation/manga/components/MangaChapterListItem.kt \
            app/src/test/java/eu/kanade/tachiyomi/ui/reader/ChapterContentMatcherTest.kt \
            app/src/test/java/eu/kanade/presentation/manga/components/MangaChapterListItemTest.kt \
            docs/CHAPTER_CONTENT.md
          git commit -m "fix: limit whole-manga replacement to locked chapters"
          git push origin HEAD:fix/paid-only-whole-manga-replacement
