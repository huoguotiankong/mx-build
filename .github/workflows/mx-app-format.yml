name: Format MX App replacement and details

on:
  push:
    branches: [main]
    paths:
      - ".github/mx-app-format-trigger"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout private MX App feature
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/relaxed-chapter-content-matching
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Apply Spotless
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Commit formatting
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: format relaxed chapter replacement"
            git push origin HEAD:fix/relaxed-chapter-content-matching
          fi

      - name: Spotless check
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Build Preview APK
        working-directory: source
        run: ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache
