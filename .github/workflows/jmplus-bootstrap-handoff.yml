name: JMComic Plus Full Handoff Build

on:
  push:
    branches: [main]
    paths:
      - ".github/jmplus-bootstrap-handoff-trigger"
      - ".github/workflows/jmplus-bootstrap-handoff.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full JMComic Plus handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: handoff
          fetch-depth: 0
          persist-credentials: true

      - name: Verify requested feature contract
        shell: bash
        run: |
          set -euo pipefail
          SRC="handoff/jmplus-handoff/src/zh/jmcomicplus/src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt"
          test -f handoff/jmplus-handoff/src/zh/jmcomicplus/build.gradle.kts
          test -f "$SRC"
          grep -q 'supportsMangaComments = true' "$SRC"
          grep -q 'supportsChapterComments = true' "$SRC"
          grep -q 'getChapterCommentTarget' "$SRC"
          if grep -Eqi 'paragraph(comment|review)|segment(comment|review)|段评' "$SRC"; then
            echo "::error::Unexpected paragraph-comment implementation found"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay full JMComic Plus module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/jmcomicplus
          cp -a handoff/jmplus-handoff/src/zh/jmcomicplus upstream/src/zh/jmcomicplus

      - name: Apply current Keiyoushi compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("upstream/src/zh/jmcomicplus")
          src = root / "src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt"
          text = src.read_text(encoding="utf-8")

          pref_pattern = re.compile(r"(?m)^(\s*)Preference\(screen\.context\)")
          matches = pref_pattern.findall(text)
          if len(matches) != 6:
              raise SystemExit(f"expected 6 standalone Preference(context) calls, found {len(matches)}")
          text = pref_pattern.sub(r"\1Preference()", text)

          old_account = "override suspend fun getSourceAccount(): SourceAccount? {"
          if text.count(old_account) != 1:
              raise SystemExit("getSourceAccount signature not found exactly once")
          text = text.replace(
              old_account,
              "override suspend fun getSourceAccount(): SourceAccount? = getSourceAccountNow()\n\n    private fun getSourceAccountNow(): SourceAccount? {",
              1,
          )

          old_status = "runCatching { getSourceAccount() }"
          if text.count(old_status) != 1:
              raise SystemExit("login status getSourceAccount call not found exactly once")
          text = text.replace(old_status, "runCatching { getSourceAccountNow() }", 1)
          src.write_text(text, encoding="utf-8")

          gradle = root / "build.gradle.kts"
          g = gradle.read_text(encoding="utf-8")
          if "versionCode = 1" not in g:
              raise SystemExit("expected versionCode = 1 in handoff")
          gradle.write_text(g.replace("versionCode = 1", "versionCode = 2", 1), encoding="utf-8")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless apply and check
        working-directory: upstream
        run: |
          ./gradlew :src:zh:jmcomicplus:spotlessApply
          ./gradlew :src:zh:jmcomicplus:spotlessCheck

      - name: Build Debug extension
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:assembleDebug --stacktrace

      - name: Persist corrected full source to handoff branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf handoff/jmplus-handoff/src/zh/jmcomicplus
          cp -a upstream/src/zh/jmcomicplus handoff/jmplus-handoff/src/zh/jmcomicplus
          cd handoff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jmplus-handoff/src/zh/jmcomicplus
          if git diff --cached --quiet; then
            echo "No corrected handoff changes"
          else
            git commit -m "fix(jmcomicplus): align full handoff with current Keiyoushi"
            git push origin HEAD:extension-staging
          fi
