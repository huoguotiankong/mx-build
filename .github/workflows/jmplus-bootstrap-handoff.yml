name: JMComic Plus Full Handoff Build

on:
  push:
    branches: [main]
    paths:
      - ".github/jmplus-bootstrap-handoff-trigger"
      - ".github/workflows/jmplus-bootstrap-handoff.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full JMComic Plus handoff
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: handoff
          fetch-depth: 1
          persist-credentials: false

      - name: Verify requested feature contract
        shell: bash
        run: |
          set -euo pipefail
          SRC="handoff/jmplus-handoff/src/zh/jmcomicplus/src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt"
          test -f handoff/jmplus-handoff/src/zh/jmcomicplus/build.gradle.kts
          test -f "$SRC"
          grep -q 'supportsMangaComments = true' "$SRC"
          grep -q 'supportsChapterComments = true' "$SRC"
          grep -q 'getChapterCommentTarget' "$SRC"
          if grep -Eqi 'paragraph(comment|review)|segment(comment|review)|段评' "$SRC"; then
            echo "::error::Unexpected paragraph-comment implementation found"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay full JMComic Plus module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/jmcomicplus
          cp -a handoff/jmplus-handoff/src/zh/jmcomicplus upstream/src/zh/jmcomicplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: upstream

      - name: Spotless apply and check
        working-directory: upstream
        run: |
          ./gradlew :src:zh:jmcomicplus:spotlessApply
          ./gradlew :src:zh:jmcomicplus:spotlessCheck

      - name: Build Debug extension
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:assembleDebug --stacktrace
