name: JMComic Plus Build Check

on:
  push:
    branches: [main]
    paths:
      - ".github/jmplus-bootstrap-handoff-trigger"
      - ".github/workflows/jmplus-bootstrap-handoff.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout private mx-dev
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify JMComic Plus contract
        shell: bash
        run: |
          set -euo pipefail
          test -f source/src/zh/jmcomicplus/build.gradle.kts
          test -f source/src/zh/jmcomicplus/src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt
          grep -q 'supportsChapterComments = true' source/src/zh/jmcomicplus/src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt
          if grep -Eqi 'paragraph(comment|review)|segment(comment|review)|段评' source/src/zh/jmcomicplus/src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt; then
            echo "::error::Unexpected paragraph-comment implementation found"
            exit 1
          fi
          git -C source rev-parse HEAD

      - name: Validate source repository layout
        working-directory: source
        run: python3 scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay JMComic Plus module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: upstream

      - name: Spotless check
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:spotlessCheck

      - name: Build Debug extension
        working-directory: upstream
        run: ./gradlew :src:zh:jmcomicplus:assembleDebug
