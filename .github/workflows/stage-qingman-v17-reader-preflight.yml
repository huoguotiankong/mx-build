name: Stage Qingman v17 Reader Preflight Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-qingman-v17-reader-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-qingman-v17-reader-preflight
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check required secrets
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" ]]
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Qingman v16 source read-only
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: fix/qingman-v3-runtime-clean
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Apply compile-validated v17 reader preflight overlay
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('dev/src/zh/qingman/build.gradle.kts')
          g=gradle.read_text('utf-8')
          if 'versionCode = 16' not in g: raise SystemExit('Expected Qingman source versionCode 16')
          gradle.write_text(g.replace('versionCode = 16','versionCode = 17',1),'utf-8')

          p=Path('dev/src/zh/qingman/src/eu/kanade/tachiyomi/extension/zh/qingman/Qingman.kt')
          s=p.read_text('utf-8')
          if 'import keiyoushi.network.get\n' not in s:
              s=s.replace('import keiyoushi.annotation.Source\n','import keiyoushi.annotation.Source\nimport keiyoushi.network.get\n',1)
          if 'import java.util.concurrent.ConcurrentHashMap\n' not in s:
              s=s.replace('import java.io.IOException\n','import java.io.IOException\nimport java.util.concurrent.ConcurrentHashMap\n',1)

          old='''    @Volatile\n    private var cachedMediaBaseUrl: String? = null\n'''
          new='''    @Volatile\n    private var cachedMediaBaseUrl: String? = null\n\n    private val readerImageProfiles = ConcurrentHashMap<String, ReaderImageProfile>()\n'''
          if old not in s: raise SystemExit('cachedMediaBaseUrl marker missing')
          s=s.replace(old,new,1)

          old='''            if (resolvedUrls.isNotEmpty()) {\n                return resolvedUrls.mapIndexed { index, imageUrl ->\n                    Page(index, url = referer, imageUrl = imageUrl)\n                }\n            }\n'''
          new='''            if (resolvedUrls.isNotEmpty()) {\n                val profile = selectReaderImageProfile(resolvedUrls.first(), referer)\n                resolvedUrls.forEach { imageUrl -> readerImageProfiles[imageUrl] = profile }\n                return resolvedUrls.mapIndexed { index, imageUrl ->\n                    Page(index, url = referer, imageUrl = imageUrl)\n                }\n            }\n'''
          if old not in s: raise SystemExit('page return marker missing')
          s=s.replace(old,new,1)

          old='''    override fun imageRequest(page: Page): Request {\n        // The official image downloader builds a dedicated request option/header map.\n        // Do not leak API-only appVersion/platform headers to the signed image CDN.\n        val imageHeaders = Headers.Builder()\n            .set("Accept", "image/*,*/*;q=0.8")\n            .apply {\n                page.url.takeIf(String::isNotBlank)?.let { set("Referer", it) }\n            }\n            .build()\n        return GET(page.imageUrl!!, imageHeaders)\n    }\n\n'''
          new='''    override fun imageRequest(page: Page): Request {\n        val imageUrl = page.imageUrl ?: throw IOException("青漫正文图片地址为空")\n        val profile = readerImageProfiles[imageUrl]\n            ?: ReaderImageProfile.UA_REFERER\n        return GET(\n            imageUrl,\n            readerImageHeaders(\n                profile = profile,\n                referer = page.url,\n                probe = false,\n            ),\n        )\n    }\n\n    private suspend fun selectReaderImageProfile(imageUrl: String, referer: String): ReaderImageProfile {\n        val results = mutableListOf<String>()\n        val profiles = listOf(\n            ReaderImageProfile.UA_REFERER,\n            ReaderImageProfile.UA_REFERER_RANGE,\n            ReaderImageProfile.UA_ONLY,\n            ReaderImageProfile.REFERER_ONLY,\n            ReaderImageProfile.UA_REFERER_ORIGIN,\n            ReaderImageProfile.APP_REFERER,\n            ReaderImageProfile.BARE,\n        ).filterNot { it.includeReferer && referer.isBlank() }\n\n        for (profile in profiles) {\n            val headers = readerImageHeaders(profile, referer, probe = true)\n            val probeResult = runCatching {\n                client.get(imageUrl, headers, ensureSuccess = false).use { response ->\n                    val status = response.code\n                    val contentType = response.header("Content-Type")\n                        .orEmpty()\n                        .substringBefore(';')\n                        .trim()\n                        .ifBlank { "?" }\n                    val accepted = status in 200..299 &&\n                        !contentType.startsWith("text/", ignoreCase = true) &&\n                        !contentType.contains("json", ignoreCase = true)\n                    Triple(status, contentType, accepted)\n                }\n            }.getOrElse { error ->\n                results += "${profile.label}=ERR(${error::class.java.simpleName})"\n                continue\n            }\n\n            val (status, contentType, accepted) = probeResult\n            results += "${profile.label}=$status/$contentType"\n            if (accepted) return profile\n        }\n\n        throw IOException(\n            buildString {\n                append("青漫正文图片预检失败；")\n                append(readerImageTargetDiagnostic(imageUrl))\n                append("；referer=")\n                append(readerRefererDiagnostic(referer))\n                append("；")\n                append(results.joinToString(","))\n            },\n        )\n    }\n\n    private fun readerImageHeaders(\n        profile: ReaderImageProfile,\n        referer: String,\n        probe: Boolean,\n    ): Headers = Headers.Builder()\n        .set("Accept", "image/avif,image/webp,image/*,*/*;q=0.8")\n        .apply {\n            if (profile.includeUserAgent) set("User-Agent", "qingman/4.4.5 (Android)")\n            if (profile.includeReferer && referer.isNotBlank()) set("Referer", referer)\n            if (profile.includeRange) set("Range", if (probe) "bytes=0-1" else "bytes=0-")\n            if (profile.includeOrigin) set("Origin", "https://www.qingman.app")\n            if (profile.includeAppHeaders) {\n                set("appVersion", "4.4.5")\n                set("platform", "android")\n            }\n        }\n        .build()\n\n    private fun readerImageTargetDiagnostic(value: String): String {\n        val parsed = value.toHttpUrlOrNull()\n            ?: return "url=unparsed,len=${value.length}"\n        val path = parsed.encodedPath.take(96).ifBlank { "/" }\n        val queryKeys = parsed.queryParameterNames.sorted().joinToString("|").ifBlank { "无" }\n        return "url=${parsed.scheme}://${parsed.host}$path,queryKeys=$queryKeys"\n    }\n\n    private fun readerRefererDiagnostic(value: String): String {\n        if (value.isBlank()) return "无"\n        val parsed = value.toHttpUrlOrNull() ?: return "非URL(len=${value.length})"\n        return "${parsed.scheme}://${parsed.host}"\n    }\n\n'''
          if old not in s: raise SystemExit('imageRequest marker missing')
          s=s.replace(old,new,1)

          marker='''    private data class CategoryOption(\n        val name: String,\n        val id: String,\n    ) {\n'''
          insert='''    private enum class ReaderImageProfile(\n        val label: String,\n        val includeUserAgent: Boolean,\n        val includeReferer: Boolean,\n        val includeRange: Boolean = false,\n        val includeOrigin: Boolean = false,\n        val includeAppHeaders: Boolean = false,\n    ) {\n        UA_REFERER("ua+referer", includeUserAgent = true, includeReferer = true),\n        UA_REFERER_RANGE("ua+referer+range", includeUserAgent = true, includeReferer = true, includeRange = true),\n        UA_ONLY("ua", includeUserAgent = true, includeReferer = false),\n        REFERER_ONLY("referer", includeUserAgent = false, includeReferer = true),\n        UA_REFERER_ORIGIN("ua+referer+origin", includeUserAgent = true, includeReferer = true, includeOrigin = true),\n        APP_REFERER("app+referer", includeUserAgent = true, includeReferer = true, includeAppHeaders = true),\n        BARE("bare", includeUserAgent = false, includeReferer = false),\n    }\n\n'''+marker
          if marker not in s: raise SystemExit('CategoryOption marker missing')
          s=s.replace(marker,insert,1)
          p.write_text(s,'utf-8')
          PY

          python3 dev/scripts/validate_sources.py
          git -C dev diff --check
          grep -q 'versionCode = 17' dev/src/zh/qingman/build.gradle.kts
          grep -q 'selectReaderImageProfile' dev/src/zh/qingman/src/eu/kanade/tachiyomi/extension/zh/qingman/Qingman.kt
          if sed -n '/override suspend fun getPageList/,/override fun imageRequest/p' dev/src/zh/qingman/src/eu/kanade/tachiyomi/extension/zh/qingman/Qingman.kt | grep -q 'fetchReaderCacheRoot'; then
            echo '::error::Online reader regressed to cache/detail'
            exit 1
          fi
          rm -rf upstream/src/zh/qingman
          cp -a dev/src/zh/qingman upstream/src/zh/qingman
          echo 'version_name=1.6.17' >> "$GITHUB_OUTPUT"

      - name: Prepare verified official bootstrap material
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyelftools >/dev/null
          python3 dev/scripts/prepare_qingman_bootstrap.py --module upstream/src/zh/qingman
          material='upstream/src/zh/qingman/src/eu/kanade/tachiyomi/extension/zh/qingman/QingmanBootstrapMaterial.kt'
          ! grep -q 'val seed: ByteArray = byteArrayOf()' "$material"
          ! grep -q 'val signCipher: ByteArray = byteArrayOf()' "$material"
          ! grep -q 'val aesCipher: ByteArray = byteArrayOf()' "$material"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate formatting
        working-directory: upstream
        run: ./gradlew :src:zh:qingman:spotlessCheck

      - name: Prepare stable signing key
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          required=('signingKey','alias','storePassword','keyPassword')
          missing=[k for k in required if not b.get(k)]
          if missing: raise SystemExit('Signing bundle missing: '+', '.join(missing))
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for e,k in (('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')):
                  v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF_SIGN\n{v}\nEOF_SIGN\n')
          PY

      - name: Build signed release and lint
        working-directory: upstream
        run: ./gradlew :src:zh:qingman:assembleRelease :src:zh:qingman:lintRelease

      - name: Verify APK version and signing identity
        id: signing
        run: |
          set -euo pipefail
          actual="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          designated='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          [[ "$actual" == "$designated" ]]
          apk="$(find upstream/src/zh/qingman -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          badging="$("$aapt" dump badging "$apk")"
          android_code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          [[ "$android_code" == '106017' ]]
          [[ "$version_name" == '1.6.17' ]]
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"

      - name: Checkout extension staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Generate isolated v17 test store snapshot
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/qingman' > targets.txt
          python3 dev/scripts/publish_test_repo.py --targets targets.txt --upstream-root upstream --source-root dev --repo-dir staging/test --owner huoguotiankong --repository mx-repo --signing-key "$SIGNING_FINGERPRINT"
          test -f 'staging/test/apk/tachiyomi-zh.qingman-v1.6.17.apk'
          test -f 'staging/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v106017.png'
          python3 - <<'PY'
          import json
          from pathlib import Path
          package='eu.kanade.tachiyomi.extension.zh.qingman'
          data=json.loads(Path('staging/test/index.json').read_text('utf-8'))
          items=[x for x in data['extensionList']['extensions'] if x.get('packageName')==package]
          if len(items)!=1: raise SystemExit(f'Expected one Qingman entry, got {len(items)}')
          actual=(items[0].get('versionName'),items[0].get('versionCode'))
          if actual != ('1.6.17',106017): raise SystemExit(f'Unexpected staged Qingman version: {actual}')
          print('Staged Qingman v17 verified:',actual)
          PY

      - name: Commit staged test store
        working-directory: staging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          git diff --cached --check
          git commit -m 'Stage Qingman v1.6.17 reader preflight test' || exit 0
          git push origin HEAD:extension-staging

      - uses: actions/upload-artifact@v4
        with:
          name: qingman-v17-reader-preflight-signed-apk
          path: upstream/src/zh/qingman/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
