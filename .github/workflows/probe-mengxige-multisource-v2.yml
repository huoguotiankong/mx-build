name: Probe MengXiGe multi-source API v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mengxige-multisource-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Probe and save sanitized result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-results
          python3 - <<'PY'
          import base64, hashlib, json, re, subprocess, time, urllib.parse, urllib.request
          from pathlib import Path
          src=Path('source/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt').read_text('utf-8')
          def c(name):
              m=re.search(rf'private const val {name} = "([^"]*)"',src)
              if not m: raise SystemExit('missing '+name)
              return m.group(1)
          package,secret,version,channel,app_id=[c(x) for x in ('APP_PACKAGE','APP_SECRET','APP_VERSION','APP_CHANNEL','APP_ID')]
          def headers():
              now=str(int(time.time()))
              return {'User-Agent':'OPPO_R821T/1.0 Linux/3.4.5 Android/4.2.2 Release/03.26.2013 Browser/AppleWebKit534.30 Mobile Safari/534.30 MBBMS/2.2 System/Android 4.2.2_'+package,'Accept':'*/*','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7','Referer':'https://book.folongteng.com/','pt':'1','version':version,'channel':channel,'uuid':'probe-00000000-0000-0000-0000-000000000001','xf-appid':app_id,'fc-session-id':'','package':package,'time':now,'stamp':'','sign':hashlib.md5((package+'1'+now+secret).encode()).hexdigest()}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers()),timeout=20) as r: return r.status,r.read().decode('utf-8','replace')
          def decode(raw):
              try: root=json.loads(raw)
              except Exception: return raw
              data=root.get('data') if isinstance(root,dict) else None
              if not isinstance(data,dict) or str(data.get('ver'))!='1' or not data.get('content'): return raw
              allb=base64.b64decode(data['content'])
              if len(allb)<32:return raw
              headb,tailb=allb[:16],allb[-16:]
              key=hashlib.sha256(headb).digest(); md5hex=hashlib.md5(tailb).hexdigest().encode('ascii')
              iv=bytes((~(md5hex[i]^tailb[i]))&0xff for i in range(16))
              p=subprocess.run(['openssl','enc','-d','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex()],input=allb[16:-16],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              return p.stdout.decode('utf-8','replace') if p.returncode==0 else raw
          def parse(url):
              status,raw=fetch(url); body=decode(raw)
              try: return {'status':status,'json':json.loads(body)}
              except Exception:return {'status':status,'bodyPrefix':body[:4000]}
          def walk_ids(x):
              out=[]
              if isinstance(x,dict):
                  bid=x.get('book_id') or x.get('id'); title=x.get('name') or x.get('book_name') or x.get('title')
                  if bid and title: out.append((str(bid),str(title)))
                  for v in x.values(): out+=walk_ids(v)
              elif isinstance(x,list):
                  for v in x: out+=walk_ids(v)
              return out
          result={'apkSourceIds':['dmzj','hhkm','yyq','dmw','webtoon','mh57','yyls','dmzj_v2','dmmh','bnmh','ccmh','thmh','gfmh','kbmh','mh160','mhdb','mht','pfmh','bkmh','qmw','wmk','qmmh','cxmh','wyqmh','mhd']}
          search=parse('https://s.folongteng.com/v4/1/lists.api?keyword='+urllib.parse.quote('咒术回战')+'&form=3')
          result['search']=search
          ids=[]; seen=set()
          for bid,title in walk_ids(search.get('json')):
              if bid not in seen: seen.add(bid); ids.append((bid,title))
          result['matches']=ids[:20]
          if ids:
              bid=ids[0][0]; floor=int(bid)//1000
              result['selected']={'bookId':bid,'title':ids[0][1]}
              for key,url in {
                  'detail':f'https://book.folongteng.com/comics/details/v4/{floor}/{bid}.html',
                  'sourceNoHtml':f'https://book.folongteng.com/book/source/v4/{floor}/{bid}',
                  'sourceHtml':f'https://book.folongteng.com/book/source/v4/{floor}/{bid}.html',
              }.items():
                  try: result[key]=parse(url)
                  except Exception as e: result[key]={'error':type(e).__name__+': '+str(e)}
          Path('probe-results/mengxige-multisource.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/mengxige-multisource.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'probe: record MengXiGe multi-source response'
          git push origin HEAD:main
