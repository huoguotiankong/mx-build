name: Probe Qingman Cover Delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-cover-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve current APK and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY' >/tmp/qm_version
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445':
              raise SystemExit('Unexpected Qingman official version; offsets require re-verification')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/qm_version)" -o /tmp/qingman.apk
          rm -rf /tmp/qm-native && mkdir -p /tmp/qm-native
          unzip -q -j /tmp/qingman.apk 'lib/arm64-v8a/libqx_security.so' -d /tmp/qm-native
          python3 - <<'PY'
          import base64,hashlib,json,time,urllib.request,uuid,os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile
          so='/tmp/qm-native/libqx_security.so'
          with open(so,'rb') as f:
              elf=ELFFile(f)
              def rv(va,n):
                  for seg in elf.iter_segments():
                      if seg['p_type']!='PT_LOAD': continue
                      s=int(seg['p_vaddr']); e=s+int(seg['p_filesz'])
                      if s<=va and va+n<=e:
                          f.seek(int(seg['p_offset'])+va-s); return f.read(n)
                  raise RuntimeError('VA not backed')
              seed=rv(0x14a40,16)+rv(0x14af0,16); sc=rv(0x17d1f,33); ac=rv(0x17d40,32)
          base=hashlib.sha256(seed).digest()
          def deob(c,k):
              stream=b''; i=0
              while len(stream)<len(c):
                  stream+=hashlib.sha256(base+bytes([k])+i.to_bytes(4,'big')).digest(); i+=1
              return bytes(a^b for a,b in zip(c,stream))
          sm=deob(sc,1); aes=deob(ac,2); ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sm).hexdigest()
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          req=urllib.request.Request('https://mu8xm4cx.zermh.com/bootstrap/domain',data=body,headers={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':'qingman/4.4.5 (Android)','appVersion':'4.4.5','platform':'android','X-Device-Id':did},method='POST')
          resp=json.load(urllib.request.urlopen(req,timeout=20)); enc=resp['data']; payload=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4)); obj=json.loads(AESGCM(aes).decrypt(payload[:12],payload[12:],(ts+'|'+nonce).encode()))
          from urllib.parse import urlsplit
          host=urlsplit(obj['apiDomain']).hostname; access=obj['appAccessToken']
          open('/tmp/qm_dynamic_host','w').write(host); open('/tmp/qm_app_access','w').write(access); open('/tmp/qm_device_id','w').write(did)
          os.chmod('/tmp/qm_app_access',0o600); os.chmod('/tmp/qm_device_id',0o600)
          print('bootstrap_ok=true'); print('dynamic_api_host='+host); print('sensitive_fields_logged=false')
          PY

      - name: Inspect cover URL shape and delivery
        shell: bash
        run: |
          set -euo pipefail
          host=$(cat /tmp/qm_dynamic_host); access=$(cat /tmp/qm_app_access); did=$(cat /tmp/qm_device_id)
          common=(-H 'Accept: application/json, text/plain, */*' -H 'User-Agent: qingman/4.4.5 (Android)' -H 'appVersion: 4.4.5' -H 'platform: android' -H "X-Device-Id: $did" -H "X-QM-App-Access: $access")
          curl -fsS --connect-timeout 10 --max-time 30 -X POST "${common[@]}" -H 'Content-Type: application/json' --data '{}' \
            "http://$host/api/comic/comics/v1/homeList?page=1&pageNum=1&pageSize=20" -o /tmp/home.json
          curl -fsS --connect-timeout 10 --max-time 30 "${common[@]}" \
            "http://$host/api/radio/api/config/getAdConfig" -o /tmp/config.json || true

          python3 - <<'PY'
          import json,urllib.parse,os
          root=json.load(open('/tmp/home.json'))
          candidates=[]
          def walk(x):
              if isinstance(x,dict):
                  title=x.get('comicTitle') or x.get('comicName') or x.get('title') or x.get('name')
                  for k in ('comicCoverUrl','coverUrl','comicCover','cover','verticalCover'):
                      v=x.get(k)
                      if isinstance(v,str) and v.strip(): candidates.append((str(title or ''),k,v.strip()))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(root)
          seen=[]
          for item in candidates:
              if item[2] not in [x[2] for x in seen]: seen.append(item)
          print('home_code='+str(root.get('code')),'cover_candidates='+str(len(seen)))
          for i,(title,key,value) in enumerate(seen[:5],1):
              p=urllib.parse.urlsplit(value)
              safe_path=p.path[:120]
              print(f'cover_{i}: key={key} title={title[:40]} absolute={bool(p.scheme and p.netloc)} scheme={p.scheme or "<relative>"} host={p.hostname or "<none>"} path={safe_path}')
          if seen: open('/tmp/qm_cover_url','w').write(seen[0][2])

          if os.path.exists('/tmp/config.json'):
              try: cfg=json.load(open('/tmp/config.json'))
              except Exception: cfg={}
              found=[]
              def wc(x):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          if isinstance(v,str) and ('url' in k.lower() or 'domain' in k.lower() or 'host' in k.lower()):
                              p=urllib.parse.urlsplit(v)
                              found.append((k,bool(p.scheme and p.netloc),p.scheme,p.hostname,p.path[:80]))
                          wc(v)
                  elif isinstance(x,list):
                      for v in x: wc(v)
              wc(cfg)
              print('config_code='+str(cfg.get('code')),'url_fields='+str(len(found)))
              for k,absolute,scheme,host,path in found[:20]:
                  print(f'config_url_field key={k} absolute={absolute} scheme={scheme or "<relative>"} host={host or "<none>"} path={path}')
          PY

          if [[ -s /tmp/qm_cover_url ]]; then
            cover=$(cat /tmp/qm_cover_url)
            echo '=== COVER DELIVERY MATRIX ==='
            for mode in bare app official_referer; do
              hdr=$(mktemp); body=$(mktemp); err=$(mktemp)
              args=(-L --max-redirs 3 -sS --connect-timeout 8 --max-time 25 -D "$hdr" -o "$body" -w '%{http_code}')
              if [[ "$mode" == app ]]; then args+=("${common[@]}"); fi
              if [[ "$mode" == official_referer ]]; then args+=("${common[@]}" -H 'Referer: https://www.qingman.app/'); fi
              code=$(curl "${args[@]}" "$cover" 2>"$err" || true)
              ctype=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{v=$0}END{sub(/^content-type:[ ]*/,"",v);gsub("\r", "", v);print v}' "$hdr")
              printf 'cover_mode=%s http=%s bytes=%s ctype=%s\n' "$mode" "$code" "$(wc -c < "$body" | tr -d ' ')" "$ctype"
              rm -f "$hdr" "$body" "$err"
            done
          fi
          rm -f /tmp/qm_app_access /tmp/qm_device_id /tmp/qm_cover_url
