name: Probe Qingman Bootstrap Live

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-bootstrap-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect current bootstrap signer layout
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone >/dev/null
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          unzip -p /tmp/qingman.apk lib/arm64-v8a/libqx_security.so > /tmp/libqx_security.so
          python3 - <<'PY'
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM

          p='/tmp/libqx_security.so'
          blob=open(p,'rb').read()
          with open(p,'rb') as f:
              e=ELFFile(f)
              loads=[s for s in e.iter_segments() if s['p_type']=='PT_LOAD']
              def vb(va,n):
                  for s in loads:
                      a=int(s['p_vaddr']); z=a+int(s['p_filesz'])
                      if a<=va and va+n<=z:
                          o=int(s['p_offset'])+va-a
                          return blob[o:o+n]
                  raise ValueError
              def cs(va):
                  return vb(va,256).split(b'\0',1)[0].decode('utf-8','replace')
              rel=[]
              for r in e.get_section_by_name('.rela.dyn').iter_relocations():
                  if r['r_info_type']==1027:
                      rel.append((int(r['r_offset']),int(r['r_addend'])))
              by=dict(rel); fn=None
              for off,add in rel:
                  try: name=cs(add)
                  except: continue
                  if name=='bootstrapSign':
                      fn=by.get(off+16)
                      print('registration',name,cs(by[off+8]),'fn',hex(fn or 0))
                      break
              if fn is None: raise SystemExit('no bootstrapSign registration')
              md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.detail=True
              ins=list(md.disasm(vb(fn,0x900),fn))
              print('instruction_count',len(ins))
              for i,x in enumerate(ins[:260]):
                  print(f'{i:03d} {x.address:#x} {x.mnemonic:<8} {x.op_str}')
              print('immediate_candidates')
              for i,x in enumerate(ins[:400]):
                  op=x.op_str.lower()
                  if any(k in op for k in ('#0x20','#0x21','#0x40','#0x41','#0x1f','#0x42')) or x.mnemonic in ('adr','adrp'):
                      print(f'{i:03d} {x.address:#x} {x.mnemonic:<8} {x.op_str}')
          PY
