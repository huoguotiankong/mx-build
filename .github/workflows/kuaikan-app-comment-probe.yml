name: Kuaikan APP Comment Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kuaikan-app-comment-probe.yml"
      - ".github/kuaikan-app-comment-probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Probe Kuaikan comment image payload schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BASE = "https://api.kkmh.com"
          UA = "Kuaikan/8.22.0/822000(Android;Scale/3.00)"
          COMIC_IDS = (3192, 1750, 2020, 375133)

          def get(path, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "application/json, text/plain, */*",
                  "X-Device": "0",
                  "Referer": "https://www.kuaikanmanhua.com/",
              })
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw = r.read()
                      try:
                          data = json.loads(raw.decode("utf-8"))
                      except Exception:
                          data = None
                      return r.status, len(raw), data
              except Exception as exc:
                  return None, 0, {"_error": type(exc).__name__ + ":" + str(exc)}

          def keys(v):
              return ",".join(sorted(v.keys())) if isinstance(v, dict) else ""

          def find_array(v, names, depth=0):
              if depth > 8:
                  return None
              if isinstance(v, dict):
                  for k in names:
                      if isinstance(v.get(k), list):
                          return v[k]
                  for x in v.values():
                      if isinstance(x, (dict, list)):
                          found = find_array(x, names, depth + 1)
                          if found is not None:
                              return found
              elif isinstance(v, list):
                  for x in v[:30]:
                      found = find_array(x, names, depth + 1)
                      if found is not None:
                          return found
              return None

          def url_fields(v, path="", depth=0):
              if depth > 10:
                  return []
              out = []
              if isinstance(v, dict):
                  for k, x in v.items():
                      p = f"{path}.{k}" if path else k
                      if isinstance(x, str) and (x.startswith("http://") or x.startswith("https://") or x.startswith("//")):
                          parsed = urllib.parse.urlparse("https:" + x if x.startswith("//") else x)
                          out.append((p, parsed.netloc + parsed.path))
                      elif isinstance(x, (dict, list)):
                          out.extend(url_fields(x, p, depth + 1))
              elif isinstance(v, list):
                  for i, x in enumerate(v[:20]):
                      out.extend(url_fields(x, f"{path}[{i}]", depth + 1))
              return out

          def shape(v, depth=0):
              if depth > 3:
                  return "..."
              if isinstance(v, dict):
                  return {k: shape(x, depth + 1) for k, x in v.items()}
              if isinstance(v, list):
                  return [shape(v[0], depth + 1)] if v else []
              return type(v).__name__

          lines = []
          for cid in COMIC_IDS:
              for order in ("score", "time", "HOTEST", "NEWEST"):
                  tag = f"floor.{cid}.{order}"
                  status, n, root = get("/v2/comments/cruel/floor_list", {
                      "target_type": "comic",
                      "target_id": cid,
                      "order": order,
                      "offset": 0,
                      "limit": 20,
                      "total": "true",
                      "source": 0,
                  })
                  lines += [f"{tag}.http={status}", f"{tag}.bytes={n}", f"{tag}.root_keys={keys(root)}"]
                  data = root.get("data") if isinstance(root, dict) and isinstance(root.get("data"), dict) else None
                  lines.append(f"{tag}.data_keys={keys(data)}")
                  floors = data.get("comment_floors") if isinstance(data, dict) and isinstance(data.get("comment_floors"), list) else None
                  lines.append(f"{tag}.floor_count={len(floors) if floors is not None else -1}")
                  if floors:
                      floor = floors[0]
                      lines.append(f"{tag}.floor_keys={keys(floor)}")
                      comment = floor.get("root") if isinstance(floor, dict) and isinstance(floor.get("root"), dict) else floor
                      lines.append(f"{tag}.comment_keys={keys(comment)}")
                      for arr_name in ("contents", "content_info", "content"):
                          arr = comment.get(arr_name) if isinstance(comment, dict) else None
                          if isinstance(arr, list):
                              lines.append(f"{tag}.{arr_name}.count={len(arr)}")
                              if arr:
                                  lines.append(f"{tag}.{arr_name}.first_shape=" + json.dumps(shape(arr[0]), ensure_ascii=False, sort_keys=True))
                      urls = url_fields(comment)
                      if urls:
                          lines.append(f"{tag}.url_fields=" + " | ".join(f"{p}={u}" for p, u in urls[:30]))
                      break

              status, n, root = get(f"/v1/comics/{cid}/comments/0", {"order": "score"})
              tag = f"legacy.{cid}.score"
              lines += [f"{tag}.http={status}", f"{tag}.bytes={n}", f"{tag}.root_keys={keys(root)}"]
              arr = find_array(root, {"comments", "comment_floors", "floors", "list"})
              lines.append(f"{tag}.item_count={len(arr) if isinstance(arr, list) else -1}")
              if isinstance(arr, list) and arr and isinstance(arr[0], dict):
                  lines.append(f"{tag}.first_keys={keys(arr[0])}")
                  urls = url_fields(arr[0])
                  if urls:
                      lines.append(f"{tag}.url_fields=" + " | ".join(f"{p}={u}" for p, u in urls[:30]))

          out = "\n".join(lines) + "\n"
          print(out)
          Path("probe-results").mkdir(exist_ok=True)
          Path("probe-results/kuaikan-comment-image-schema.txt").write_text(out, encoding="utf-8")
          PY

      - name: Commit sanitized probe summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-results/kuaikan-comment-image-schema.txt
          if git diff --cached --quiet; then
            echo "Probe summary unchanged"
            exit 0
          fi
          git commit -m "probe: record Kuaikan comment image schema"
          git pull --rebase origin main
          git push
