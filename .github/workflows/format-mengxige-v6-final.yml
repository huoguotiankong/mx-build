name: Format final MengXiGe v6 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-mengxige-v6-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay module and correct reload metadata routing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/mengxige
          cp -a source/src/zh/mengxige upstream/src/zh/mengxige
          python3 - <<'PY'
          from pathlib import Path
          p = Path('upstream/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt')
          s = p.read_text('utf-8')
          old = '''        listOf("list_path", "list_reload_path").forEach { key ->\n            detail?.string(key)\n                ?.let(::catalogUrl)\n                ?.let { add(it) }\n        }\n'''
          new = '''        detail?.string("list_path")\n            ?.let(::catalogUrl)\n            ?.let { add(it) }\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'detail?.string("list_path")' not in s:
              raise SystemExit('catalog candidate block not found')
          p.write_text(s, 'utf-8')
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Spotless apply and check
        working-directory: upstream
        run: ./gradlew :src:zh:mengxige:spotlessApply :src:zh:mengxige:spotlessCheck --stacktrace

      - name: Upload final formatted source
        uses: actions/upload-artifact@v4
        with:
          name: mengxige-v6-final-source
          path: |
            upstream/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt
            upstream/src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGeImageDecoderInterceptor.kt
          if-no-files-found: error
          retention-days: 3
