name: Patch Fengche Manhua v1.6.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-fengchemanhua-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply focused v1.6.3 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          kt = Path('source/src/zh/fengchemanhua/src/eu/kanade/tachiyomi/extension/zh/fengchemanhua/FengcheManhua.kt')
          text = kt.read_text('utf-8')
          changes = [
              ('.removeAll("Origin")\n            .set("Referer", chapterUrl)', '.set("Referer", chapterUrl)\n            .set("Origin", baseUrl)'),
              ('.removeHeader("READER_CHAPTER_HEADER")', '.removeHeader("READER_CHAPTER_HEADER")'),
              ('.removeHeader("Origin")\n            .header("Referer", chapterUrl)', '.header("Referer", chapterUrl)\n            .header("Origin", baseUrl)'),
              ('val cleanRequest = primaryRequest.newBuilder()\n            .removeHeader("Referer")\n            .removeHeader("Origin")\n            .build()\n        response = chain.proceed(cleanRequest)', 'val refererOnlyRequest = primaryRequest.newBuilder()\n            .removeHeader("Origin")\n            .build()\n        response = chain.proceed(refererOnlyRequest)'),
              ('primaryRequest.newBuilder()\n                .header("Origin", baseUrl)\n                .build()', 'refererOnlyRequest.newBuilder()\n                .removeHeader("Referer")\n                .build()'),
          ]
          for old, new in changes:
              if old == new:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)} for {old!r}')
              text = text.replace(old, new, 1)
          kt.write_text(text, 'utf-8')
          gradle = Path('source/src/zh/fengchemanhua/build.gradle.kts')
          g = gradle.read_text('utf-8')
          if g.count('versionCode = 2') != 1:
              raise SystemExit('expected versionCode 2 exactly once')
          gradle.write_text(g.replace('versionCode = 2', 'versionCode = 3', 1), 'utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 source/scripts/validate_sources.py
          git -C source diff --check
          grep -q 'versionCode = 3' source/src/zh/fengchemanhua/build.gradle.kts
          grep -q 'set("Origin", baseUrl)' source/src/zh/fengchemanhua/src/eu/kanade/tachiyomi/extension/zh/fengchemanhua/FengcheManhua.kt
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "source/src/zh/fengchemanhua/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - name: Commit private source
        shell: bash
        run: |
          set -euo pipefail
          git -C source config user.name "github-actions[bot]"
          git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C source add src/zh/fengchemanhua
          git -C source commit -m 'perf(fengchemanhua): prefer origin-backed reader requests'
          git -C source pull --rebase origin main
          git -C source push origin HEAD:main
