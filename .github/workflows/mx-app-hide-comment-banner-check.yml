name: Check MX App comment banner fix

on:
  push:
    branches: [main]
    paths:
      - ".github/mx-app-hide-comment-banner-check-trigger"
      - ".github/workflows/mx-app-hide-comment-banner-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout private MX App feature branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: fix/hide-comment-login-banner
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Spotless apply
        working-directory: source
        run: ./gradlew spotlessApply

      - name: Ensure Spotless made no uncommitted fixes
        working-directory: source
        run: git diff --exit-code

      - name: Spotless check
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Assemble debug
        working-directory: source
        run: ./gradlew assembleDebug
