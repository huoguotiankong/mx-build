name: Tencent v22 Regex Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/tencent-v22-regex-fix-trigger"

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout build infrastructure
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0

      - name: Fix Tencent Kotlin regex escaping and write back
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt")
          text = path.read_text("utf-8")
          lines = text.splitlines()
          matched = 0
          for i, line in enumerate(lines):
              if "val PC_COMMENT_TIME = Regex(" in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[i] = indent + r'val PC_COMMENT_TIME = Regex("\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}")'
                  matched += 1
          if matched != 1:
              raise SystemExit(f"Expected exactly one PC_COMMENT_TIME line, found {matched}")
          path.write_text("\n".join(lines) + "\n", "utf-8")

          build = Path("src/zh/tencentcomics/build.gradle.kts").read_text("utf-8")
          if "versionCode = 22" not in build:
              raise SystemExit("Tencent v22 versionCode not found")
          PY
          grep -Fq 'val PC_COMMENT_TIME = Regex("\\d{4}-\\d{2}-\\d{2}\\s+\\d{2}:\\d{2}")' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          if git diff --cached --quiet; then
            echo "No regex fix needed"
          else
            git commit -m "fix(tencentcomics): restore comment time regex escaping"
            git push origin HEAD:main
          fi
