name: Test Qingman Cover App Headers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-cover-app-headers.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bootstrap and test relative cover with app context
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64,hashlib,json,os,tempfile,time,urllib.parse,urllib.request,uuid,zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile
          vr=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(vr.get('version'))!='4.4.5' or str(vr.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          with tempfile.TemporaryDirectory() as td:
              apk=os.path.join(td,'q.apk'); so=os.path.join(td,'s.so')
              with urllib.request.urlopen(urllib.request.Request(vr['downloadUrl'],headers={'User-Agent':'mx-qingman-probe/1.0'}),timeout=60) as r, open(apk,'wb') as f:
                  while True:
                      b=r.read(1<<20)
                      if not b: break
                      f.write(b)
              with zipfile.ZipFile(apk) as z, z.open('lib/arm64-v8a/libqx_security.so') as src, open(so,'wb') as dst: dst.write(src.read())
              with open(so,'rb') as f:
                  elf=ELFFile(f)
                  def rv(va,n):
                      for seg in elf.iter_segments():
                          if seg['p_type']!='PT_LOAD': continue
                          s=int(seg['p_vaddr']); e=s+int(seg['p_filesz'])
                          if s<=va and va+n<=e:
                              f.seek(int(seg['p_offset'])+va-s); return f.read(n)
                      raise RuntimeError('VA')
                  seed=rv(0x14a40,16)+rv(0x14af0,16); sc=rv(0x17d1f,33); ac=rv(0x17d40,32)
          base=hashlib.sha256(seed).digest()
          def deob(c,k):
              out=b''; i=0
              while len(out)<len(c): out+=hashlib.sha256(base+bytes([k])+i.to_bytes(4,'big')).digest(); i+=1
              return bytes(a^b for a,b in zip(c,out))
          sm=deob(sc,1); aes=deob(ac,2); ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sm).hexdigest()
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          bh={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':'qingman/4.4.5 (Android)','appVersion':'4.4.5','platform':'android','X-Device-Id':did}
          br=json.load(urllib.request.urlopen(urllib.request.Request('https://mu8xm4cx.zermh.com/bootstrap/domain',data=body,headers=bh,method='POST'),timeout=20))
          enc=br['data']; blob=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4)); cfg=json.loads(AESGCM(aes).decrypt(blob[:12],blob[12:],(ts+'|'+nonce).encode()))
          host=urllib.parse.urlsplit(cfg['apiDomain']).hostname; access=cfg['appAccessToken']
          h=dict(bh); h['X-QM-App-Access']=access
          home=json.load(urllib.request.urlopen(urllib.request.Request(f'http://{host}/api/comic/comics/v1/homeList?page=1&pageNum=1&pageSize=20',data=b'{}',headers=h,method='POST'),timeout=25))
          cover=None
          def walk(x):
              global cover
              if cover:return
              if isinstance(x,dict):
                  for k in ('verticalCover','cover','horizontalCover'):
                      v=x.get(k)
                      if isinstance(v,str) and v.startswith('/'):
                          cover=v; return
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(home)
          if not cover: raise SystemExit('No relative cover')
          open('/tmp/qm_host','w').write(host); open('/tmp/qm_access','w').write(access); open('/tmp/qm_did','w').write(did); open('/tmp/qm_cover','w').write(cover)
          os.chmod('/tmp/qm_access',0o600); os.chmod('/tmp/qm_did',0o600)
          print('bootstrap_ok=true cover_relative=true')
          PY
          host=$(cat /tmp/qm_host); access=$(cat /tmp/qm_access); did=$(cat /tmp/qm_did); rel=$(cat /tmp/qm_cover)
          for target in dynamic_http official_https; do
            if [[ "$target" == dynamic_http ]]; then base="http://$host"; else base='https://www.qingman.app'; fi
            for mode in app app_referer browser_app; do
              args=(-H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -H 'User-Agent: qingman/4.4.5 (Android)' -H 'appVersion: 4.4.5' -H 'platform: android' -H "X-Device-Id: $did" -H "X-QM-App-Access: $access")
              [[ "$mode" == app_referer ]] && args+=(-H 'Referer: https://www.qingman.app/')
              [[ "$mode" == browser_app ]] && args=(-H 'User-Agent: Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140.0 Mobile Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -H 'Referer: https://www.qingman.app/' -H "X-Device-Id: $did" -H "X-QM-App-Access: $access")
              hdr=$(mktemp); data=$(mktemp); err=$(mktemp)
              code=$(curl -sS -L --connect-timeout 8 --max-time 25 -D "$hdr" -o "$data" -w '%{http_code}' "${args[@]}" "$base$rel" 2>"$err" || true)
              ctype=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{v=$0}END{sub(/^content-type:[ ]*/,"",v);gsub("\r", "", v);print v}' "$hdr")
              magic=$(xxd -p -l 12 "$data" | tr -d '\n')
              printf 'target=%s mode=%s http=%s bytes=%s ctype=%s magic=%s err=%s\n' "$target" "$mode" "$code" "$(wc -c < "$data" | tr -d ' ')" "$ctype" "$magic" "$(tr '\n' ' ' < "$err" | cut -c1-120)"
              rm -f "$hdr" "$data" "$err"
            done
          done
          rm -f /tmp/qm_host /tmp/qm_access /tmp/qm_did /tmp/qm_cover
