name: Probe TSXZT site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-tsxzt-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe TSXZT tag cover attributes
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          base='http://www.tsxzt.com'
          out=/tmp/tsxzt-probe
          mkdir -p "$out"
          declare -A urls=(
            [home]="$base/"
            [tag_korea]="$base/chis/hanguo/1.html"
            [tag_korea2]="$base/chis/hanguo/2.html"
            [tag_xiuren]="$base/chis/xiurentaotu/1.html"
            [category]="$base/tese/sezhentum/2_1.html"
          )
          for key in "${!urls[@]}"; do
            url="${urls[$key]}"
            echo "=== $key $url ==="
            curl -L --compressed -A "$ua" -e "$base/" -m 20 -sS -D "$out/${key}.headers" -o "$out/${key}.bin" -w 'code=%{http_code} final=%{url_effective} size=%{size_download}\n' "$url" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          out=Path('/tmp/tsxzt-probe')
          for p in sorted(out.glob('*.bin')):
              raw=p.read_bytes()
              text=raw.decode('gb18030',errors='replace')
              (out/(p.stem+'.utf8.txt')).write_text(text,encoding='utf-8')
              print('\n###',p.stem,'bytes',len(raw))
              title=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              if title:
                  print('TITLE:',re.sub(r'\s+',' ',html.unescape(title.group(1))).strip())
              tags=[]
              for m in re.finditer(r'<img\b[^>]*>',text,re.I|re.S):
                  tag=re.sub(r'\s+',' ',m.group(0)).strip()
                  if tag not in tags:
                      tags.append(tag)
              print('IMG_TAGS',len(tags))
              for tag in tags[:60]:
                  print('IMG_TAG',tag[:1000])
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: tsxzt-tag-cover-probe
          path: /tmp/tsxzt-probe/
          if-no-files-found: error
