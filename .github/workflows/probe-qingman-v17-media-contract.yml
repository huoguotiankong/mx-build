name: Probe Qingman v17 Live Media Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-v17-media-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Probe current official media contract
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          mkdir -p reports
          python3 - <<'PY'
          import base64,hashlib,json,os,tempfile,time,urllib.error,urllib.parse,urllib.request,uuid,zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile

          REPORT='reports/qingman-v17-media-contract.txt'
          UA='qingman/4.4.5 (Android)'
          VERSION='https://bass8ycl.zermh.com/api/radio/api/config/version'
          BOOTSTRAP='https://mu8xm4cx.zermh.com/bootstrap/domain'
          lines=[]
          def log(s):
              s=str(s); print(s); lines.append(s)
          def shape_url(label,value):
              if not isinstance(value,str) or not value.strip():
                  log(f'{label}=missing'); return
              p=urllib.parse.urlsplit(value.strip())
              log(f'{label}: absolute={bool(p.scheme and p.netloc)} scheme={p.scheme or "<relative>"} host={p.hostname or "<none>"} path_prefix={p.path[:100]}')

          vr=json.load(urllib.request.urlopen(urllib.request.Request(VERSION,headers={'User-Agent':'mx-qingman-probe/1.0'}),timeout=20))['data']['datas']['android']
          log('official_version='+str(vr.get('version'))+'/'+str(vr.get('versionCode')))
          if str(vr.get('version'))!='4.4.5' or str(vr.get('versionCode'))!='445': raise SystemExit('Unexpected Qingman version')
          download_url=vr['downloadUrl']; shape_url('apk_download_url',download_url)
          download_origin=urllib.parse.urlsplit(download_url)
          download_base=f'{download_origin.scheme}://{download_origin.netloc}'

          with tempfile.TemporaryDirectory() as td:
              apk=os.path.join(td,'q.apk'); so=os.path.join(td,'libqx_security.so')
              with urllib.request.urlopen(urllib.request.Request(download_url,headers={'User-Agent':'mx-qingman-probe/1.0'}),timeout=90) as r, open(apk,'wb') as f:
                  while True:
                      b=r.read(1<<20)
                      if not b: break
                      f.write(b)
              with zipfile.ZipFile(apk) as z, z.open('lib/arm64-v8a/libqx_security.so') as src, open(so,'wb') as dst:
                  dst.write(src.read())
              with open(so,'rb') as f:
                  elf=ELFFile(f)
                  def rv(va,n):
                      for seg in elf.iter_segments():
                          if seg['p_type']!='PT_LOAD': continue
                          s=int(seg['p_vaddr']); e=s+int(seg['p_filesz'])
                          if s<=va and va+n<=e:
                              f.seek(int(seg['p_offset'])+va-s); return f.read(n)
                      raise RuntimeError('VA not backed')
                  seed=rv(0x14a40,16)+rv(0x14af0,16); sc=rv(0x17d1f,33); ac=rv(0x17d40,32)

          base=hashlib.sha256(seed).digest()
          def deob(c,k):
              stream=b''; i=0
              while len(stream)<len(c):
                  stream+=hashlib.sha256(base+bytes([k])+i.to_bytes(4,'big')).digest(); i+=1
              return bytes(a^b for a,b in zip(c,stream))
          sm=deob(sc,1); aes=deob(ac,2); ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sm).hexdigest()
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          bh={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':UA,'appVersion':'4.4.5','platform':'android','X-Device-Id':did}
          br=json.load(urllib.request.urlopen(urllib.request.Request(BOOTSTRAP,data=body,headers=bh,method='POST'),timeout=20))
          enc=br['data']; blob=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4))
          cfg=json.loads(AESGCM(aes).decrypt(blob[:12],blob[12:],(ts+'|'+nonce).encode()))
          api=urllib.parse.urlsplit(cfg['apiDomain']); api_host=api.hostname; access=cfg['appAccessToken']
          log('bootstrap_ok=true')
          log('bootstrap_keys='+','.join(sorted(k for k in cfg.keys() if 'token' not in k.lower())))
          shape_url('bootstrap_apiDomain',cfg.get('apiDomain'))
          for k in ('baseImgUrl','freeUrl','customerUrl','officialUrl','promotionUrl'):
              shape_url('bootstrap_'+k,cfg.get(k))

          common={'Accept':'application/json, text/plain, */*','Content-Type':'application/json','User-Agent':UA,'appVersion':'4.4.5','platform':'android','X-Device-Id':did,'X-QM-App-Access':access}
          def api_req(method,path):
              u='http://'+api_host+'/'+path
              data=b'{}' if method=='POST' else None
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=common,data=data,method=method),timeout=20) as r:
                      raw=r.read(2*1024*1024).decode('utf-8','replace'); status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(256*1024).decode('utf-8','replace'); status=e.code
              except Exception as e:
                  log(f'route={path} method={method} transport_error={type(e).__name__}'); return None
              try: obj=json.loads(raw)
              except Exception:
                  log(f'route={path} method={method} http={status} nonjson=true'); return None
              code=obj.get('code') if isinstance(obj,dict) else None
              log(f'route={path} method={method} http={status} code={code}')
              return obj
          def find(x,key):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if str(k).lower()==key.lower(): return v
                      z=find(v,key)
                      if z is not None:return z
              elif isinstance(x,list):
                  for v in x:
                      z=find(v,key)
                      if z is not None:return z
              return None
          def find_relative_cover(x):
              if isinstance(x,dict):
                  for k in ('verticalCover','comicCoverUrl','coverUrl','comicCover','cover','horizontalCover'):
                      v=x.get(k)
                      if isinstance(v,str) and v.strip() and not v.startswith(('http://','https://','//')): return v.strip()
                  for v in x.values():
                      z=find_relative_cover(v)
                      if z:return z
              elif isinstance(x,list):
                  for v in x:
                      z=find_relative_cover(v)
                      if z:return z
              return None

          home=api_req('POST','api/comic/comics/v1/homeList?page=1&pageNum=1&pageSize=20')
          cover=find_relative_cover(home)
          if cover:
              p=urllib.parse.urlsplit(cover); log(f'relative_cover=true path_prefix={p.path[:120]} query_present={bool(p.query)}')
          else:
              log('relative_cover=false')

          app_base=None
          candidates=[
              'api/appapi/theme/appconfig','api/appapi/theme/appConfig','api/appapi/theme/config',
              'api/appapi/theme/getappconfig','api/appapi/theme/getAppConfig',
          ]
          for path in candidates:
              for method in ('GET','POST'):
                  obj=api_req(method,path)
                  if obj is None: continue
                  b=find(obj,'baseImgUrl')
                  if isinstance(b,str) and b.strip():
                      app_base=b.strip(); shape_url('FOUND_AppConfig_baseImgUrl',app_base); break
              if app_base: break

          bases=[]
          if isinstance(cfg.get('baseImgUrl'),str) and cfg.get('baseImgUrl').strip(): bases.append(('bootstrap_baseImgUrl',cfg['baseImgUrl'].strip()))
          if app_base: bases.append(('appconfig_baseImgUrl',app_base))
          bases += [('api_http','http://'+api_host),('api_https','https://'+api_host),('apk_download_origin',download_base),('official_https','https://www.qingman.app')]

          def probe(label,url,mode):
              headers={'Accept':'image/avif,image/webp,image/*,*/*;q=0.8'}
              if mode in ('ua','referer'): headers['User-Agent']=UA
              if mode=='referer': headers['Referer']='https://www.qingman.app/'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                      data=r.read(32); ctype=r.headers.get('Content-Type',''); final=urllib.parse.urlsplit(r.geturl())
                      log(f'delivery base={label} mode={mode} http={r.status} bytes32={len(data)} ctype={ctype.split(";")[0]} final_host={final.hostname or ""}')
              except urllib.error.HTTPError as e:
                  log(f'delivery base={label} mode={mode} http={e.code} ctype={e.headers.get("Content-Type","").split(";")[0]}')
              except Exception as e:
                  log(f'delivery base={label} mode={mode} error={type(e).__name__}')

          if cover:
              for label,b in bases:
                  url=b.rstrip('/')+'/'+cover.lstrip('/')
                  for mode in ('bare','ua','referer'):
                      probe(label,url,mode)

          log('sensitive_values_logged=false')
          open(REPORT,'w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY

      - name: Commit redacted probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/qingman-v17-media-contract.txt
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'probe(qingman): record v17 live media contract'
            git push origin HEAD:main
          fi
