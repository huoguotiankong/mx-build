name: Promote Qingman v4 test store

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-qingman-v4-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-qingman-v4-test
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check repository token
        shell: bash
        env:
          MX_REPO_TOKEN: ${{ secrets.MX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_REPO_TOKEN" ]] || { echo "::error::Missing MX_REPO_TOKEN"; exit 1; }

      - name: Checkout control branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout staged test store
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify audited staged Qingman v4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.qingman'
          expected = ('1.6.4', 106004)

          audit = json.loads(Path('control/.github/qingman-security-audit-result.json').read_text('utf-8'))
          if audit.get('result') != 'passed':
              raise SystemExit(f'Qingman audit is not passed: {audit.get("result")}')
          if (audit.get('versionName'), audit.get('androidVersionCode')) != expected:
              raise SystemExit('Qingman audit version does not match v4')
          if audit.get('packageName') != package:
              raise SystemExit('Qingman audit package mismatch')

          data = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          if len(items) != 1:
              raise SystemExit(f'Expected one staged {package}, got {len(items)}')
          item = items[0]
          actual = (item.get('versionName'), item.get('versionCode'))
          if actual != expected:
              raise SystemExit(f'{package}: expected {expected}, got {actual}')

          apk = Path('staging/test/apk/tachiyomi-zh.qingman-v1.6.4.apk')
          icon = Path('staging/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v106004.png')
          if not apk.is_file() or not icon.is_file():
              raise SystemExit('Staged Qingman v4 APK/icon missing')
          actual_sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          if actual_sha != audit.get('apkSha256'):
              raise SystemExit(f'Audited APK SHA mismatch: {actual_sha}')
          print(f'Audited staged Qingman v4 verified: {actual}, sha256={actual_sha}')
          PY

      - name: Checkout public repository
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          ref: repo
          token: ${{ secrets.MX_REPO_TOKEN }}
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Promote only Qingman v4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.qingman'
          public_path = Path('repo/test/index.json')
          staged_path = Path('staging/test/index.json')
          public = json.loads(public_path.read_text('utf-8'))
          staged = json.loads(staged_path.read_text('utf-8'))

          staged_items = [x for x in staged['extensionList']['extensions'] if x.get('packageName') == package]
          if len(staged_items) != 1:
              raise SystemExit('Expected exactly one staged Qingman entry')
          public_items = public['extensionList']['extensions']
          positions = [i for i, x in enumerate(public_items) if x.get('packageName') == package]
          if len(positions) != 1:
              raise SystemExit(f'Expected exactly one public Qingman entry, got {len(positions)}')
          public_items[positions[0]] = staged_items[0]
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          PY

          rm -f repo/test/apk/tachiyomi-zh.qingman-v*.apk
          rm -f repo/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v*.png
          cp staging/test/apk/tachiyomi-zh.qingman-v1.6.4.apk repo/test/apk/
          cp staging/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v106004.png repo/test/icon/
          git -C repo status --short

      - name: Commit public Qingman v4 test
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/index.json test/apk test/icon
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Qingman test-store changes to promote"
          else
            git commit -m "Publish Qingman v1.6.4 test"
            git push origin HEAD:repo
          fi

      - name: Verify promoted Qingman v4 locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          package = 'eu.kanade.tachiyomi.extension.zh.qingman'
          data = json.loads(Path('repo/test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          assert len(items) == 1
          item = items[0]
          assert (item.get('versionName'), item.get('versionCode')) == ('1.6.4', 106004)
          audit = json.loads(Path('control/.github/qingman-security-audit-result.json').read_text('utf-8'))
          apk = Path('repo/test/apk/tachiyomi-zh.qingman-v1.6.4.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == audit['apkSha256']
          assert Path('repo/test/icon/eu.kanade.tachiyomi.extension.zh.qingman-v106004.png').is_file()
          print('Promoted Qingman v4 index/APK/icon verified')
          PY
