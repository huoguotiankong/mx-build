name: Validate MengXiGe v5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-mengxige-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mengxige-v5
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::MX_PRIVATE_READ_TOKEN missing"; exit 1; }

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MX extension source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: 8f05b43f116f18bee4f4f230ae15bd5d1bffc3b0
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Validate private source layout
        working-directory: dev
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_sources.py
          test -f src/zh/mengxige/build.gradle.kts
          test -f src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGe.kt
          test -f src/zh/mengxige/src/eu/kanade/tachiyomi/extension/zh/mengxige/MengXiGeImageDecoderInterceptor.kt
          grep -q 'versionCode = 5' src/zh/mengxige/build.gradle.kts

      - name: Overlay MengXiGe module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/mengxige
          cp -a dev/src/zh/mengxige upstream/src/zh/mengxige

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:mengxige:spotlessCheck --stacktrace

      - name: Build debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:mengxige:assembleDebug --stacktrace

      - name: Record result
        shell: bash
        run: |
          {
            echo "### MengXiGe v5 validation"
            echo
            echo "- mx-dev commit: 8f05b43f116f18bee4f4f230ae15bd5d1bffc3b0"
            echo "- Private source layout: passed"
            echo "- Keiyoushi formatting: passed"
            echo "- Debug APK compilation: passed"
            echo "- Android device functionality remains a separate validation step"
          } >> "$GITHUB_STEP_SUMMARY"
