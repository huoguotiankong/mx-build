name: Map Qingman AppConfig Model Fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-appconfig-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Map model and field access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          print(o['data']['datas']['android']['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          objs=Path('/tmp/blutter-out/objs.txt').read_text('utf-8',errors='replace').splitlines()
          pp=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          print('=== UXB MODEL METADATA ===')
          for source_name,lines in [('objs',objs),('pp',pp)]:
              hits=[]
              for i,line in enumerate(lines):
                  low=line.lower()
                  if 'uxb' in low or 'appconfig' in low:
                      hits.append(i)
              shown=set()
              for i in hits[:80]:
                  for n in range(max(0,i-12),min(len(lines),i+35)):
                      if n in shown: continue
                      shown.add(n)
                      line=lines[n]
                      if sensitive.search(line): line='<redacted-sensitive-line>'
                      print(f'{source_name}:{n+1}: {line[:600]}')

          ppmap={}
          for line in pp:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: ppmap[int(m.group(1),16)]=m.group(2)
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          start,end=0x4cff5c,0x4d06c0
          print('=== PARSER FULL SAFE DISASM ===')
          pending={}
          for ins in md.disasm(data[start-base:end-base],start):
              pending={r:(b,t-1) for r,(b,t) in pending.items() if t>1}
              op=ins.op_str.lower(); ann=''
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),12)
              elif ins.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if m:
                      br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                      off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                      if off is not None and off in ppmap:
                          val=ppmap[off]
                          ann=f' ; PP+0x{off:x}=' + ('<redacted>' if sensitive.search(val) else val[:180])
              if ins.mnemonic in ('ldr','ldur','str','stur','ldrsw','bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                  print(f'{ins.address:#x} {ins.mnemonic:<7} {ins.op_str}{ann}')
          PY
