name: Probe Qingman Live Search Contract v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-live-search-contract-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve bootstrap material and probe search variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64,hashlib,json,os,tempfile,time,urllib.error,urllib.parse,urllib.request,uuid,zipfile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile

          UA='qingman/4.4.5 (Android)'
          keyword='一人之下'
          vr=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(vr.get('version'))!='4.4.5' or int(vr.get('versionCode',0))!=445: raise SystemExit('Unexpected official version')
          with tempfile.TemporaryDirectory() as td:
              apk=os.path.join(td,'q.apk'); so=os.path.join(td,'s.so')
              with urllib.request.urlopen(urllib.request.Request(vr['downloadUrl'],headers={'User-Agent':'mx-qingman-probe/1.0'}),timeout=60) as r, open(apk,'wb') as f:
                  while True:
                      b=r.read(1<<20)
                      if not b: break
                      f.write(b)
              with zipfile.ZipFile(apk) as z, z.open('lib/arm64-v8a/libqx_security.so') as src, open(so,'wb') as dst: dst.write(src.read())
              with open(so,'rb') as f:
                  elf=ELFFile(f)
                  def rv(va,n):
                      for seg in elf.iter_segments():
                          if seg['p_type']!='PT_LOAD': continue
                          s=int(seg['p_vaddr']); e=s+int(seg['p_filesz'])
                          if s<=va and va+n<=e:
                              f.seek(int(seg['p_offset'])+va-s); return f.read(n)
                      raise RuntimeError('VA not backed')
                  seed=rv(0x14a40,16)+rv(0x14af0,16); sc=rv(0x17d1f,33); ac=rv(0x17d40,32)
          base=hashlib.sha256(seed).digest()
          def deob(c,k):
              out=b''; i=0
              while len(out)<len(c): out+=hashlib.sha256(base+bytes([k])+i.to_bytes(4,'big')).digest(); i+=1
              return bytes(a^b for a,b in zip(c,out))
          sm=deob(sc,1); aes=deob(ac,2); ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sm).hexdigest()
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          bh={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','User-Agent':UA,'appVersion':'4.4.5','platform':'android','X-Device-Id':did}
          br=json.load(urllib.request.urlopen(urllib.request.Request('https://mu8xm4cx.zermh.com/bootstrap/domain',data=body,headers=bh,method='POST'),timeout=20))
          enc=br['data']; blob=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4)); cfg=json.loads(AESGCM(aes).decrypt(blob[:12],blob[12:],(ts+'|'+nonce).encode()))
          host=urllib.parse.urlsplit(cfg['apiDomain']).hostname; access=cfg['appAccessToken']
          headers={'Accept':'application/json, text/plain, */*','User-Agent':UA,'appVersion':'4.4.5','platform':'android','X-Device-Id':did,'X-QM-App-Access':access,'Content-Type':'application/json'}

          def titles(x):
              out=[]
              def w(v):
                  if isinstance(v,dict):
                      title=v.get('comicTitle') or v.get('comicName') or v.get('title') or v.get('name')
                      cid=v.get('comicId') or v.get('id')
                      if title and cid:
                          pair=(str(cid),str(title))
                          if pair not in out: out.append(pair)
                      for z in v.values(): w(z)
                  elif isinstance(v,list):
                      for z in v:w(z)
              w(x); return out
          def call(label,method,path,query=None,payload=None):
              qs=('?'+urllib.parse.urlencode(query)) if query else ''
              data=None if method=='GET' else json.dumps(payload if payload is not None else {},ensure_ascii=False,separators=(',',':')).encode()
              req=urllib.request.Request('http://'+host+'/'+path+qs,headers=headers,method=method,data=data)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read(1<<20); status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read(1<<20); status=e.code
              try: obj=json.loads(raw)
              except Exception:
                  print(label,'http='+str(status),'non_json='+raw[:100].decode('utf-8','replace')); return
              tt=titles(obj)
              print(label,'http='+str(status),'code='+str(obj.get('code')),'msg='+str(obj.get('msg') or obj.get('message') or '')[:80],'matches='+str(sum(keyword in t for _,t in tt)),'count='+str(len(tt)))
              for _,t in tt[:12]: print('  title='+t)

          q={'keyword':keyword,'page':'1','pageNum':'1','pageSize':'20','size':'20'}
          call('history_search_post_query','POST','api/comic/history/fu893u94/search',q,{})
          call('history_search_post_body','POST','api/comic/history/fu893u94/search',None,{'keyword':keyword,'page':1,'pageNum':1,'pageSize':20,'size':20})
          call('history_search_get_query','GET','api/comic/history/fu893u94/search',q,None)
          call('category_search_post_query','POST','api/comic/categories/comicList',q,{})
          call('category_search_post_body','POST','api/comic/categories/comicList',None,{'keyword':keyword,'page':1,'pageNum':1,'pageSize':20,'size':20})
          PY
