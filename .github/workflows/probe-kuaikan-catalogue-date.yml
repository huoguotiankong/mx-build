name: Probe Kuaikan catalogue publication dates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-kuaikan-catalogue-date.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe official catalogue APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from collections import deque

          base = "https://api.kkmh.com/v2/topic/topic_catalogue/list"
          candidates = [
              {"topic_id": "12602"},
              {"topic_id": "12602", "sort": "0"},
              {"topic_id": "12602", "sort": "1"},
              {"topic_id": "12602", "order": "1"},
              {"topic_id": "12602", "since": "0", "limit": "20"},
              {"topic_id": "12602", "page": "1", "size": "20"},
          ]
          headers = {
              "User-Agent": "okhttp/4.10.0",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "zh-CN,zh;q=0.9",
          }

          interesting = {
              "id", "comic_id", "comicId", "title", "name",
              "created_at", "createdAt", "create_time", "createTime",
              "updated_at", "updatedAt", "update_time", "updateTime",
              "publishedTime", "published_time", "publishTime", "publish_time",
              "releaseTime", "release_time", "onlineTime", "online_time",
              "displayTime", "display_time", "time", "date",
          }

          def summarize(obj):
              out = []
              q = deque([(obj, "$", 0)])
              seen = 0
              while q and seen < 4000:
                  node, path, depth = q.popleft()
                  seen += 1
                  if depth > 8:
                      continue
                  if isinstance(node, dict):
                      hit = {k: node[k] for k in node.keys() if k in interesting}
                      if hit:
                          out.append((path, hit))
                          if len(out) >= 12:
                              break
                      for k, v in node.items():
                          if isinstance(v, (dict, list)):
                              q.append((v, f"{path}.{k}", depth + 1))
                  elif isinstance(node, list):
                      for i, v in enumerate(node[:30]):
                          if isinstance(v, (dict, list)):
                              q.append((v, f"{path}[{i}]", depth + 1))
              return out

          for params in candidates:
              url = base + "?" + urllib.parse.urlencode(params)
              print("===", url)
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read()
                      print("status", r.status, "bytes", len(raw), "content-type", r.headers.get("content-type"))
              except Exception as e:
                  print("error", repr(e))
                  continue
              try:
                  data = json.loads(raw)
              except Exception:
                  print("non-json", raw[:300])
                  continue
              if isinstance(data, dict):
                  print("top_keys", sorted(data.keys()))
              else:
                  print("root_type", type(data).__name__)
              for path, hit in summarize(data):
                  print(path, json.dumps(hit, ensure_ascii=False, sort_keys=True))
          PY
