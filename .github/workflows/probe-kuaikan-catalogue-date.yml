name: Probe Kuaikan catalogue publication dates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-kuaikan-catalogue-date.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe official catalogue APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from collections import deque

          endpoints = [
              ("https://api.kkmh.com/v1/topics/12602", {}),
              ("https://api.kkmh.com/v2/topic/topic_catalogue/list", {"topic_id": "12602"}),
              ("https://api.kkmh.com/v2/topic/topic_catalogue/list", {"topic_id": "12602", "sort": "0"}),
              ("https://api.kkmh.com/v2/topic/topic_catalogue/list", {"topic_id": "12602", "sort": "1"}),
              ("https://api.kkmh.com/v2/topic/topic_catalogue/list", {"topic_id": "12602", "order": "1"}),
              ("https://api.kkmh.com/v2/topic/topic_catalogue/list", {"topic_id": "12602", "since": "0", "limit": "20"}),
              ("https://api.kkmh.com/v2/topic/topic_catalogue/list", {"topic_id": "12602", "page": "1", "size": "20"}),
              ("https://api.kkmh.com/v2/topic/download/comic_list", {"topic_id": "12602"}),
              ("https://api.kkmh.com/v2/topic/download/comic_list", {"topic_id": "12602", "since": "0", "limit": "20"}),
          ]
          headers = {
              "User-Agent": "Kuaikan/5.75.0/575000(iPhone;Scale/3.00) (iPhone; CPU)",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "zh-CN,zh;q=0.9",
              "X-Device": "0",
          }

          interesting = {
              "id", "comic_id", "comicId", "topic_id", "topicId", "title", "name",
              "created_at", "createdAt", "create_time", "createTime",
              "updated_at", "updatedAt", "update_time", "updateTime",
              "publishedTime", "published_time", "publishTime", "publish_time",
              "publishedAt", "published_at", "releaseTime", "release_time",
              "onlineTime", "online_time", "displayTime", "display_time", "time", "date",
              "since", "offset", "total", "code", "message",
          }

          def summarize(obj):
              out = []
              q = deque([(obj, "$", 0)])
              seen = 0
              while q and seen < 8000:
                  node, path, depth = q.popleft()
                  seen += 1
                  if depth > 10:
                      continue
                  if isinstance(node, dict):
                      hit = {k: node[k] for k in node.keys() if k in interesting}
                      if hit:
                          out.append((path, hit))
                          if len(out) >= 25:
                              break
                      for k, v in node.items():
                          if isinstance(v, (dict, list)):
                              q.append((v, f"{path}.{k}", depth + 1))
                  elif isinstance(node, list):
                      for i, v in enumerate(node[:50]):
                          if isinstance(v, (dict, list)):
                              q.append((v, f"{path}[{i}]", depth + 1))
              return out

          for base, params in endpoints:
              url = base + (("?" + urllib.parse.urlencode(params)) if params else "")
              print("===", url)
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      raw = r.read()
                      print("status", r.status, "bytes", len(raw), "content-type", r.headers.get("content-type"))
              except Exception as e:
                  print("error", repr(e))
                  continue
              try:
                  data = json.loads(raw)
              except Exception:
                  print("non-json", raw[:300])
                  continue
              if isinstance(data, dict):
                  print("top_keys", sorted(data.keys()))
                  print("code", data.get("code"), "message", data.get("message"))
              else:
                  print("root_type", type(data).__name__)
              for path, hit in summarize(data):
                  print(path, json.dumps(hit, ensure_ascii=False, sort_keys=True))
          PY
