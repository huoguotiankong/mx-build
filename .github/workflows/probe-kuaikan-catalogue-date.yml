name: Probe Kuaikan catalogue publication dates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-kuaikan-catalogue-date.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect public topic payload and search API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request

          desktop_headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9",
          }
          api_headers = {
              "User-Agent": "Kuaikan/5.75.0/575000(iPhone;Scale/3.00) (iPhone; CPU)",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "zh-CN,zh;q=0.9",
              "X-Device": "0",
          }

          topic_url = "https://www.kuaikanmanhua.com/web/topic/12602/"
          req = urllib.request.Request(topic_url, headers=desktop_headers)
          with urllib.request.urlopen(req, timeout=20) as r:
              html = r.read().decode("utf-8", "replace")
          print("TOPIC_HTML_BYTES", len(html))
          for needle in ("33932", "engine1", "publishedTime", "created_at", "updated_at", "comicList", "__NUXT__"):
              print("RAW_NEEDLE", needle, html.find(needle))
          for pattern in (r'.{0,100}33932.{0,100}', r'.{0,100}engine1.{0,100}'):
              m = re.search(pattern, html, re.I | re.S)
              if m:
                  print("RAW_CONTEXT", re.sub(r"\s+", " ", m.group(0))[:500])

          # Extract and evaluate the same window.__NUXT__ payload used by the extension.
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.I | re.S)
          nuxt_script = next((s for s in scripts if "window.__NUXT__" in s), None)
          if nuxt_script is None:
              raise SystemExit("window.__NUXT__ script not found")
          open("/tmp/nuxt.js", "w", encoding="utf-8").write("global.window={};\n" + nuxt_script + "\nrequire('fs').writeFileSync('/tmp/nuxt.json', JSON.stringify(window.__NUXT__));\n")
          PY
          node /tmp/nuxt.js
          python3 - <<'PY'
          import json
          from collections import deque
          data = json.load(open('/tmp/nuxt.json', encoding='utf-8'))
          q = deque([(data, '$', 0)])
          chapterish=[]
          while q and len(chapterish) < 30:
              node,path,depth=q.popleft()
              if depth>12: continue
              if isinstance(node,dict):
                  keys=set(node)
                  if 'id' in keys and ('title' in keys or 'comic_id' in keys) and any(k in keys for k in ('cover_image_url','is_free','pay_info','serial_no','comic_type','image_count')):
                      chapterish.append((path,node))
                  for k,v in node.items():
                      if isinstance(v,(dict,list)): q.append((v,f'{path}.{k}',depth+1))
              elif isinstance(node,list):
                  for i,v in enumerate(node[:500]):
                      if isinstance(v,(dict,list)): q.append((v,f'{path}[{i}]',depth+1))
          print('CHAPTERISH_COUNT',len(chapterish))
          for path,obj in chapterish[:12]:
              print('CHAPTER',path,'KEYS',sorted(obj.keys()))
              keep={k:v for k,v in obj.items() if isinstance(v,(str,int,float,bool)) or v is None}
              print(json.dumps(keep,ensure_ascii=False,sort_keys=True)[:4000])
          PY

          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          q='我！天命大反派'
          url='https://api.kkmh.com/v1/search/topic?' + urllib.parse.urlencode({'q':q})
          headers={
              'User-Agent':'Kuaikan/5.75.0/575000(iPhone;Scale/3.00) (iPhone; CPU)',
              'Accept':'application/json, text/plain, */*',
              'X-Device':'0',
          }
          print('SEARCH_URL',url)
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                  raw=r.read(); print('SEARCH_BYTES',len(raw)); data=json.loads(raw)
              print('SEARCH_TOP',json.dumps(data,ensure_ascii=False)[:12000])
          except Exception as e:
              print('SEARCH_ERROR',repr(e))
          PY
