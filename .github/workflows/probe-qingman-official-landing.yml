name: Probe Qingman Official Landing Host

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-official-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve and inspect current landing host
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'
          curl -L --compressed --connect-timeout 10 --max-time 30 -A "$UA" -sS https://www.qingman.app/ -o /tmp/gateway.html
          LANDING=$(python3 - <<'PY'
          import re
          s=open('/tmp/gateway.html','r',encoding='utf-8',errors='replace').read()
          m=re.search(r'const\s+C_DOMAINS\s*=\s*\[\s*["\'](https?://[^"\']+)',s,re.I)
          if not m: raise SystemExit('landing host not found')
          print(m.group(1).rstrip('/'))
          PY
          )
          echo "LANDING=$LANDING"
          mkdir -p /tmp/qml
          declare -A PATHS=(
            [root]='/'
            [home]='/comic/home'
            [update]='/comic/update'
            [category]='/comic/category'
            [ranking]='/comic/ranking'
            [search]='/comic/search'
            [detail]='/comic/detail?id=1'
            [detail2]='/comic/detail?comicId=1'
            [read]='/comic/read?id=1'
            [robots]='/robots.txt'
            [sitemap]='/sitemap.xml'
          )
          for name in root home update category ranking search detail detail2 read robots sitemap; do
            url="$LANDING${PATHS[$name]}"
            out="/tmp/qml/$name"
            meta=$(curl -L --compressed --connect-timeout 10 --max-time 30 -A "$UA" -sS -o "$out" -w '%{http_code}\t%{url_effective}\t%{content_type}' "$url" || true)
            echo "ROUTE $name $meta bytes=$(wc -c < "$out" 2>/dev/null || echo 0)"
          done

          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import html,re,os
          base=os.environ.get('LANDING','') or open('/dev/null','w').name
          # LANDING is re-derived from gateway to avoid env propagation assumptions.
          g=Path('/tmp/gateway.html').read_text('utf-8',errors='replace')
          m=re.search(r'const\s+C_DOMAINS\s*=\s*\[\s*["\'](https?://[^"\']+)',g,re.I)
          base=m.group(1).rstrip('/')+'/'
          sensitive=re.compile(r'(?i)(token|secret|password|cookie|auth|bearer|private|cert|p12)')
          for p in sorted(Path('/tmp/qml').iterdir()):
              if not p.is_file(): continue
              s=p.read_text('utf-8',errors='replace')
              print('\n===',p.name,'===')
              mt=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
              print('TITLE',re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',html.unescape(mt.group(1)))).strip() if mt else '')
              urls=[]
              for pat in [r'https?://[^\s"\'<>]+',r'(?:href|src)=["\']([^"\']+)["\']']:
                  for x in re.findall(pat,s,re.I):
                      u=html.unescape(x)
                      if u.startswith(('javascript:','#','data:')): continue
                      u=urljoin(base,u)
                      if sensitive.search(u): continue
                      if u not in urls: urls.append(u)
              for u in urls[:160]: print('URL',u[:700])
              for needle in ('api/','comic','fetch(','axios','baseurl','domain','host','json','__next','vite','nuxt','flutter','app'):
                  idx=s.lower().find(needle.lower())
                  if idx>=0:
                      snip=re.sub(r'\s+',' ',s[max(0,idx-500):idx+1800])
                      if len(snip)>2300: snip=snip[:2300]
                      print('SNIP',needle,snip)
          PY
