name: Diagnose Dongman web detail and genre

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-dongman-web-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

# Probe refresh: detail metadata, episodes and genre filters.
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe current web pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          urls=(
            'https://m.dongmanmanhua.cn/LOVE/buguoshilimingshifen/list?title_no=2738'
            'https://www.dongmanmanhua.cn/LOVE/buguoshilimingshifen/list?title_no=2738'
            'https://m.dongmanmanhua.cn/genre'
            'https://www.dongmanmanhua.cn/genre'
            'https://m.dongmanmanhua.cn/search?keyword=%E4%B8%8D%E8%BF%87%E6%98%AF%E9%BB%8E%E6%98%8E%E6%97%B6%E5%88%86'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            echo "=== probe $i: $url ==="
            code=$(curl -L --compressed -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' -H 'Accept-Language: zh-CN,zh;q=0.9' -H 'Referer: https://m.dongmanmanhua.cn/' -sS -o "out/$i.html" -w '%{http_code}' "$url" || true)
            echo "http=$code bytes=$(wc -c < "out/$i.html")"
          done

      - name: Inspect document structure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4 >/dev/null
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          selectors = [
              'h1','h2','h3',
              '.detail_header','.detail_body','.info','.summary','.author','.author_area','.genre','.day_info',
              '#_asideDetail','#_listUl','ul#_listUl li','.episode_lst li','.episode_list li',
              '[class*=episode]','[class*=detail]','[class*=summary]','[class*=author]','[class*=genre]',
              'a[href*="title_no="]','a[href*="episode_no="]','a[href*="episodeNo="]',
              'a[href*="genre"]','a[href*="webtoonGenre"]','a[href*="complete"]','a[href*="sortOrder"]',
          ]
          for p in sorted(Path('out').glob('*.html')):
              text=p.read_text('utf-8', errors='replace')
              soup=BeautifulSoup(text,'html.parser')
              print(f'=== {p.name} title={soup.title.get_text(" ", strip=True) if soup.title else ""!r} ===')
              for sel in selectors:
                  nodes=soup.select(sel)
                  if nodes:
                      sample=' | '.join(' '.join(n.stripped_strings)[:180] for n in nodes[:3])
                      print(f'{sel}: {len(nodes)} :: {sample}')
              print('--- ids/classes with detail/list/episode/author/genre/summary/info ---')
              seen=[]
              for tag in soup.find_all(True):
                  tid=tag.get('id')
                  cls=' '.join(tag.get('class', []))
                  key=(tid or '')+' '+cls
                  if any(k in key.lower() for k in ['detail','list','episode','author','genre','summary','info','webtoon','comic']):
                      item=(tag.name, tid, cls, ' '.join(tag.stripped_strings)[:160])
                      if item not in seen:
                          seen.append(item)
              for item in seen[:120]: print(item)
              print('--- relevant links ---')
              for a in soup.select('a[href]'):
                  href=a.get('href','')
                  label=' '.join(a.stripped_strings)
                  if any(k in href for k in ['title_no','episode_no','episodeNo','genre','complete','sortOrder']):
                      print(href, '::', label[:120])
              print('--- meta ---')
              for m in soup.select('meta[name],meta[property]'):
                  k=m.get('name') or m.get('property')
                  if k and any(x in k.lower() for x in ['title','description','author','image']):
                      print(k, '=>', m.get('content','')[:200])
          PY

      - name: Upload probe HTML
        uses: actions/upload-artifact@v4
        with:
          name: dongman-detail-genre-probe
          path: out
          if-no-files-found: error
