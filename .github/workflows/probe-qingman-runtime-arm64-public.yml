name: Probe Qingman Runtime Public Hosts x86_64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-runtime-arm64-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Resolve current official APK
        shell: bash
        run: |
          set -euo pipefail
          echo "HOST_ARCH=$(uname -m)"
          python3 - <<'PY' > /tmp/apk_url
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('version='+str(a.get('version','')), file=__import__('sys').stderr)
          print('versionCode='+str(a.get('versionCode','')), file=__import__('sys').stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          AAPT="$(find "${ANDROID_HOME}"/build-tools -type f -name aapt | sort -V | tail -1)"
          QM_PKG="$("$AAPT" dump badging /tmp/qingman.apk | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)"
          test -n "$QM_PKG"
          echo "QM_PKG=$QM_PKG" >> "$GITHUB_ENV"
          echo '=== APK ABIs ==='
          unzip -Z1 /tmp/qingman.apk | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u
          unzip -Z1 /tmp/qingman.apk | grep -q '^lib/x86_64/'

      - name: Run official app and capture only public host/config clues
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            set -u
            echo "runtime_host_arch=$(uname -m)"
            adb wait-for-device
            echo "device_abi=$(adb shell getprop ro.product.cpu.abi)"
            adb install -r /tmp/qingman.apk
            adb logcat -c
            rm -f /tmp/qm_dns.log
            sudo tcpdump -i any -nn -l '(udp port 53 or tcp port 53)' > /tmp/qm_dns.log 2>&1 &
            TCPPID=$!
            adb shell am force-stop "$QM_PKG" || true
            adb shell monkey -p "$QM_PKG" -c android.intent.category.LAUNCHER 1 >/tmp/monkey.log 2>&1 || true
            echo '=== MONKEY ==='
            tail -40 /tmp/monkey.log || true
            sleep 55
            sudo kill "$TCPPID" >/dev/null 2>&1 || true
            sleep 2
            echo '=== APP PROCESS ==='
            adb shell pidof "$QM_PKG" || true
            echo '=== SAFE RUNTIME DOMAIN LOGS ==='
            adb logcat -d -v brief \
              | grep -Ei 'bootstrap:|apiDomain|baseImgUrl|freeUrl|customerUrl|officialUrl|promotionUrl|comic.*(host|domain|url)|image.*(host|domain|url)' \
              | sed -E 's/(token|access|proof|signature|sign|password|cookie|authorization)[=:][^ ]+/\1=<redacted>/Ig' \
              | grep -Eiv 'clientp12|privatekey|certificate|keystore' \
              | tail -300 || true
            echo '=== DNS HOSTNAMES ==='
            python3 - <<'PY'
            import re
            try:s=open('/tmp/qm_dns.log','r',encoding='utf-8',errors='replace').read()
            except:s=''
            names=set()
            for x in re.findall(r'(?i)\b(?:[a-z0-9-]+\.)+[a-z]{2,}\b',s):
                x=x.rstrip('.').lower()
                if any(k in x for k in ('qingman','zermh','mhxiaomidi','dmzj','pwpni','urlg','f37','comic','manhua','img','cdn')):
                    names.add(x)
            for x in sorted(names): print(x)
            PY
            echo '=== LOGCAT HOSTNAMES ==='
            adb logcat -d -v brief | grep -Eio '([a-z0-9-]+\.)+[a-z]{2,}' | grep -Ei 'qingman|zermh|mhxiaomidi|dmzj|pwpni|urlg|f37|comic|manhua|img|cdn' | sort -u | head -300 || true
            echo '=== SAFE PERSISTED APPCONFIG CLUES ==='
            adb root >/dev/null 2>&1 || true
            sleep 2
            adb wait-for-device
            rm -rf /tmp/qmdata && mkdir -p /tmp/qmdata
            adb pull "/data/user/0/$QM_PKG" /tmp/qmdata >/dev/null 2>&1 || true
            python3 - <<'PY'
            from pathlib import Path
            import re
            root=Path('/tmp/qmdata')
            deny=re.compile(rb'(?i)(token|authorization|bearer|cookie|password|secret|private|clientp12|certificate|keystore|proof|signature)')
            url=re.compile(rb'https?://[A-Za-z0-9._:-]+(?:/[A-Za-z0-9._~!$&()*+,;=:@%/?#\-]*)?')
            host=re.compile(rb'(?i)(?:[a-z0-9-]+\.)+[a-z]{2,}')
            out=[]
            for p in root.rglob('*'):
                if not p.is_file(): continue
                try:d=p.read_bytes()
                except Exception: continue
                if b'baseImgUrl' not in d and b'AppConfig' not in d: continue
                for m in re.finditer(b'baseImgUrl',d):
                    c=d[max(0,m.start()-1024):min(len(d),m.end()+3072)]
                    for raw in url.findall(c)+host.findall(c):
                        if deny.search(raw): continue
                        s=raw.decode('utf-8','ignore').rstrip('\x00').lower()
                        if s and s not in out: out.append(s)
            print('safe_persisted_candidate_count='+str(len(out)))
            for i,s in enumerate(out[:40],1): print(f'candidate_{i}={s[:240]}')
            PY
