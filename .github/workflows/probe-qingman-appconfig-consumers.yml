name: Trace Qingman AppConfig URL Consumers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-appconfig-consumers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace URL field consumers and QxAppConfig initServices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile

          sensitive=re.compile(r'(?i)(token|secret|password|cookie|authorization|bearer|private|clientp12|certificate|proof|signature|sign/key|k1a|k1b|k2a|k2b|k3a|k3b|seed)')
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          # uxb AppConfig field map recovered from its parser constructor assignment.
          fields={0x4b:'baseImgUrl',0x4f:'freeUrl',0x53:'customerUrl',0x57:'officialUrl',0x5b:'promotionUrl'}
          print('=== CONFIRMED UXB FIELD MAP ===')
          for off,name in fields.items(): print(f'uxb.field_{off:x}={name}')

          print('=== BLUTTER FIELD CONSUMERS ===')
          asm=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              try: asm.append((p,p.read_text('utf-8',errors='replace').splitlines()))
              except Exception: pass
          total=0; seen=set()
          for p,lines in asm:
              for i,line in enumerate(lines):
                  low=line.lower()
                  matched=[(off,name) for off,name in fields.items() if f'field_{off:x}' in low]
                  if not matched: continue
                  key=(str(p),i)
                  if key in seen: continue
                  seen.add(key)
                  print(f'CONSUMER file={p.name} line={i+1} matches={[name for _,name in matched]}')
                  # Expand to enclosing function marker, then print a compact safe window.
                  start=i
                  while start>0 and '** addr:' not in lines[start]: start-=1
                  if '** addr:' not in lines[start]: start=max(0,i-45)
                  end=min(len(lines),i+90)
                  for n in range(start,end):
                      if n>start and '** addr:' in lines[n]: break
                      s=lines[n]
                      if sensitive.search(s): s=re.sub(r'"[^"]*"','"<redacted>"',s)
                      if len(s)>420: s=s[:420]+'...'
                      print(s)
                      total+=1
                      if total>=1800: break
                  if total>=1800: break
              if total>=1800: break
          print('CONSUMER_CONTEXT_LINES='+str(total))

          # Resolve the two startup log strings to code and inspect calls between them.
          targets={0x3750:'before_initServices',0x3758:'after_initServices'}
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          pending={}; hits=[]
          for ins in md.disasm(data,base):
              if ins.mnemonic.startswith('.'):
                  pending.clear(); continue
              pending={r:(b,t-1) for r,(b,t) in pending.items() if t>1}
              op=ins.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),12); continue
              if ins.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in targets: hits.append((int(ins.address),off))
          print('=== QXAPPCONFIG INITSERVICES MARKERS ===')
          for addr,off in hits: print(f'{targets[off]} ref=0x{addr:x} PP+0x{off:x}')
          if len(hits)>=2:
              addrs=sorted(a for a,_ in hits)
              start=max(base,addrs[0]-0x100); end=min(base+len(data),addrs[-1]+0x140)
              print(f'=== INITSERVICES DISASM {start:#x}-{end:#x} ===')
              pending={}
              for ins in md.disasm(data[start-base:end-base],start):
                  pending={r:(b,t-1) for r,(b,t) in pending.items() if t>1}
                  op=ins.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if ins.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),12)
                  elif ins.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              v=pp[off]
                              ann=f' ; PP+0x{off:x}=' + ('<redacted>' if sensitive.search(v) else v[:180])
                  if ann or ins.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'{ins.address:#x} {ins.mnemonic:<7} {ins.op_str}{ann}')
          PY
