name: Patch CopyManga Plus v4 OpenCC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-copymangaplus-opencc-v4.yml"

permissions:
  contents: read

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Patch CopyManga Plus conversion
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          kt = Path("src/zh/copymangaplus/src/eu/kanade/tachiyomi/extension/zh/copymangaplus/CopyMangaPlus.kt")
          s = kt.read_text("utf-8")

          if "import androidx.preference.SwitchPreferenceCompat" not in s:
              s = s.replace(
                  "import androidx.preference.PreferenceScreen\n",
                  "import androidx.preference.PreferenceScreen\nimport androidx.preference.SwitchPreferenceCompat\n",
                  1,
              )
          if "import openccjava.OpenCC" not in s:
              s = s.replace("import okhttp3.Request\n", "import okhttp3.Request\nimport openccjava.OpenCC\n", 1)

          replacements = {
              'title = o.string("name").orEmpty()': 'title = simplify(o.string("name")).orEmpty()',
              'description = o.string("brief")': 'description = simplify(o.string("brief"))',
              'title = comic.string("name").orEmpty()': 'title = simplify(comic.string("name")).orEmpty()',
              'comic.string("brief")?.takeIf(String::isNotBlank)?.let(::append)': 'simplify(comic.string("brief"))?.takeIf(String::isNotBlank)?.let(::append)',
              'comic.string("alias")?.takeIf(String::isNotBlank)?.let {': 'simplify(comic.string("alias"))?.takeIf(String::isNotBlank)?.let {',
              'val groupName = group?.string("name").orEmpty()': 'val groupName = simplify(group?.string("name")).orEmpty()',
              'val rawName = o.string("name").orEmpty().ifBlank { "章节" }': 'val rawName = simplify(o.string("name")).orEmpty().ifBlank { "章节" }',
              'comic.obj("last_chapter")?.string("name")?.takeIf(String::isNotBlank)?.let {': 'simplify(comic.obj("last_chapter")?.string("name"))?.takeIf(String::isNotBlank)?.let {',
              'val authorName = o.string("user_name") ?: user?.string("nickname") ?: user?.string("username") ?: "拷贝用户"': 'val authorName = simplify(o.string("user_name") ?: user?.string("nickname") ?: user?.string("username") ?: "拷贝用户").orEmpty()',
              'content = o.string("comment") ?: o.string("content") ?: ""': 'content = simplify(o.string("comment") ?: o.string("content")).orEmpty()',
              'val content = o.string("comment") ?: o.string("roast") ?: return null': 'val content = simplify(o.string("comment") ?: o.string("roast")) ?: return null',
              'val name = results.string("nickname") ?: results.string("username") ?: return null': 'val name = simplify(results.string("nickname") ?: results.string("username")) ?: return null',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)

          old_object_names = '''    private fun objectNames(array: JsonArray?, cache: ConcurrentHashMap<String, String>): List<String> {
              if (array == null) return emptyList()
              return array.mapNotNull { element ->
                  val obj = element as? JsonObject ?: return@mapNotNull (element as? JsonPrimitive)?.contentOrNull
                  val name = obj.string("name") ?: return@mapNotNull null
                  obj.string("path_word")?.takeIf(String::isNotBlank)?.let { cache[name] = it }
                  name
              }
          }
          '''
          new_object_names = '''    private fun objectNames(array: JsonArray?, cache: ConcurrentHashMap<String, String>): List<String> {
              if (array == null) return emptyList()
              return array.mapNotNull { element ->
                  val obj = element as? JsonObject
                  if (obj == null) {
                      return@mapNotNull simplify((element as? JsonPrimitive)?.contentOrNull)
                  }
                  val originalName = obj.string("name") ?: return@mapNotNull null
                  val displayName = simplify(originalName).orEmpty()
                  obj.string("path_word")?.takeIf(String::isNotBlank)?.let { pathWord ->
                      cache[originalName] = pathWord
                      cache[displayName] = pathWord
                  }
                  displayName
              }
          }
          '''
          if old_object_names in s:
              s = s.replace(old_object_names, new_object_names, 1)
          elif "val originalName = obj.string(\"name\")" not in s:
              raise SystemExit("objectNames anchor mismatch")

          old_display = '    private fun displayObject(o: JsonObject?): String? = o?.string("display") ?: o?.string("name") ?: o?.string("value")\n'
          new_display = '    private fun displayObject(o: JsonObject?): String? = simplify(o?.string("display") ?: o?.string("name") ?: o?.string("value"))\n'
          if old_display in s:
              s = s.replace(old_display, new_display, 1)

          helper_anchor = "    private fun normalizeHost(value: String) ="
          if "private fun simplify(text: String?)" not in s:
              helper = '''    private fun simplify(text: String?): String? {
                  if (text.isNullOrBlank() || !preferences.getBoolean(PREF_TRAD_TO_SIMP, true)) return text
                  return runCatching { OpenCC.convert(text, "t2s") }.getOrElse { text }
              }

          '''
              if helper_anchor not in s:
                  raise SystemExit("simplify helper anchor mismatch")
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          pref_anchor = '''        EditTextPreference(screen.context).apply {
              key = PREF_USERNAME
          '''
          if "key = PREF_TRAD_TO_SIMP" not in s:
              pref = '''        SwitchPreferenceCompat(screen.context).apply {
                  key = PREF_TRAD_TO_SIMP
                  title = "繁体转简体"
                  summary = "将标题、作者、标签、简介、章节名和评论文本转换为简体中文"
                  setDefaultValue(true)
              }.also(screen::addPreference)

          '''
              if pref_anchor not in s:
                  raise SystemExit("preference anchor mismatch")
              s = s.replace(pref_anchor, pref + pref_anchor, 1)

          const_anchor = '        private const val PREF_QUALITY = "quality"\n'
          if "PREF_TRAD_TO_SIMP" not in s.split("companion object", 1)[-1]:
              if const_anchor not in s:
                  raise SystemExit("preference constant anchor mismatch")
              s = s.replace(
                  const_anchor,
                  const_anchor + '        private const val PREF_TRAD_TO_SIMP = "traditional_to_simplified"\n',
                  1,
              )

          kt.write_text(s, "utf-8")

          doc = Path("docs/sources/copymangaplus.md")
          d = doc.read_text("utf-8")
          if "## 繁体转简体" not in d:
              d += '''

          ## 繁体转简体

          v4 增加可开关的繁体转简体功能，默认开启。实现使用 Maven Central 的纯 Java `io.github.laisuk:openccjava:1.4.2`，不依赖 JNI / NDK。转换范围包括漫画标题、作者、标签、简介、别名、章节分组名、章节名、详情字段，以及书评/章评的昵称和评论正文。关闭设置后保留源站原文。

          作者与标签点击搜索同时缓存“源站原名”和“简体显示名”到同一 `path_word`，避免开启转换后详情页点击作者/标签失效。用户主动发表的评论正文不在发送前强制改写，只转换服务端返回后的展示文本。

          此功能只处理文本显示，不修改漫画 URL、章节 UUID、评论 ID、登录参数、图片地址或线路协议。
          '''
          doc.write_text(d, "utf-8")
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay CopyManga Plus module
        shell: bash
        run: |
          rm -rf upstream/src/zh/copymangaplus
          cp -a source/src/zh/copymangaplus upstream/src/zh/copymangaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: upstream

      - name: Apply Spotless
        working-directory: upstream
        run: ./gradlew :src:zh:copymangaplus:spotlessApply

      - name: Copy formatted module back
        shell: bash
        run: |
          rm -rf source/src/zh/copymangaplus
          cp -a upstream/src/zh/copymangaplus source/src/zh/copymangaplus

      - name: Validate and build
        working-directory: upstream
        run: |
          ./gradlew :src:zh:copymangaplus:spotlessCheck
          ./gradlew :src:zh:copymangaplus:assembleDebug :src:zh:copymangaplus:lintRelease

      - name: Validate private source layout
        working-directory: source
        run: python3 scripts/validate_sources.py

      - name: Commit verified v4 changes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+huoguotiankong@users.noreply.github.com"
          git add src/zh/copymangaplus docs/sources/copymangaplus.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(copymangaplus): add traditional-to-simplified conversion"
            git push origin HEAD:main
          fi
