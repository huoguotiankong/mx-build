name: Repair Dongman Manhua Plus v2 build workflow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-dongmanmanhuaplus-v2-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Restrict Preference compatibility replacement to plain Preference only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-dongmanmanhuaplus-v2.yml')
          s = p.read_text('utf-8')
          old = "          s = s.replace('Preference(screen.context).apply {', 'Preference().apply {')\n"
          new = "          s = s.replace('\\n        Preference(screen.context).apply {', '\\n        Preference().apply {')\n"
          if old not in s:
              raise SystemExit('expected compatibility replacement not found')
          p.write_text(s.replace(old, new, 1), 'utf-8')
          PY
          git diff --check
          grep -Fq "s.replace('\\n        Preference(screen.context).apply {'" .github/workflows/build-dongmanmanhuaplus-v2.yml
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-dongmanmanhuaplus-v2.yml
          git commit -m 'fix: avoid mangling EditTextPreference in Dongman v2 build'
          git push origin HEAD:main
