name: Patch MX 1.14.12 marker refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-mx-v92-marker-refresh.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public build scripts
        uses: actions/checkout@v5
        with:
          path: build-control
          persist-credentials: false

      - name: Checkout private MX App maintenance branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: hotfix/v91-marker-refresh-v92
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply backport and push
        shell: bash
        run: |
          set -euo pipefail
          cp build-control/scripts/patch_mx_v92_marker_refresh.py source/.mx-v92-patch.py
          cd source
          python3 .mx-v92-patch.py
          rm .mx-v92-patch.py
          ./gradlew spotlessApply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt
          git diff --cached --quiet && exit 1
          git commit -m "fix: refresh whole-manga replacement markers after updates"
          git push origin HEAD:hotfix/v91-marker-refresh-v92
