name: Probe Qingman Bootstrap HTTP

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-bootstrap-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public bootstrap endpoint without credentials
        shell: bash
        run: |
          set -euo pipefail
          URL='https://mu8xm4cx.zermh.com/bootstrap/domain'
          echo '=== DNS/TLS ==='
          getent ahosts mu8xm4cx.zermh.com | head -4 || true
          curl -sSIL --connect-timeout 10 --max-time 20 "$URL" | sed -n '1,30p' || true
          probe() {
            label="$1"; shift
            echo "=== $label ==="
            tmp=$(mktemp)
            code=$(curl -sS --connect-timeout 10 --max-time 20 -o "$tmp" -w '%{http_code}' "$@" "$URL" || true)
            echo "http=$code"
            python3 - "$tmp" <<'PY'
          import sys,re,json
          p=sys.argv[1]
          b=open(p,'rb').read(4096)
          try:s=b.decode('utf-8','replace')
          except:s=repr(b)
          # Redact values for fields that could be tokens/signatures if the server unexpectedly returns them.
          s=re.sub(r'(?i)("?(?:token|accessToken|appAccessToken|proof|signature|sign)"?\s*[:=]\s*")[^"]+',r'\1<redacted>',s)
          print(s[:3500])
          PY
            rm -f "$tmp"
          }
          probe 'GET default' -X GET -H 'Accept: application/json'
          probe 'POST empty json' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{}'
          TS=$(date +%s%3N)
          NONCE='00000000000000000000000000000000'
          DID='00000000-0000-4000-8000-000000000000'
          probe 'POST public shape' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data "{\"timestamp\":\"$TS\",\"nonce\":\"$NONCE\",\"deviceId\":\"$DID\",\"platform\":\"android\",\"appVersion\":\"4.4.5\"}"
