name: Probe Qingman Bootstrap HTTP

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-bootstrap-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current official APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/qm_version
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print(a.get('version',''))
          print(a.get('versionCode',''))
          PY
          sed -n '2,3p' /tmp/qm_version | paste -sd ' ' - | sed 's/^/official_version=/'
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/qm_version)" -o /tmp/qingman.apk
          unzip -q -j /tmp/qingman.apk 'lib/arm64-v8a/libqx_security.so' -d /tmp/qm-native
          test -s /tmp/qm-native/libqx_security.so

      - name: Reproduce and decrypt bootstrap response
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64, hashlib, json, re, time, urllib.error, urllib.request, uuid
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile

          URL='https://mu8xm4cx.zermh.com/bootstrap/domain'
          SO='/tmp/qm-native/libqx_security.so'

          with open(SO,'rb') as f:
              elf=ELFFile(f)
              def read_va(va,n):
                  for seg in elf.iter_segments():
                      if seg['p_type'] != 'PT_LOAD':
                          continue
                      start=int(seg['p_vaddr']); end=start+int(seg['p_filesz'])
                      if start <= va and va+n <= end:
                          f.seek(int(seg['p_offset']) + va-start)
                          return f.read(n)
                  raise RuntimeError(f'VA 0x{va:x} is not file-backed')
              seed = read_va(0x14a40,16) + read_va(0x14af0,16)
              sign_cipher = read_va(0x17d1f,33)
              aes_cipher = read_va(0x17d40,32)

          base=hashlib.sha256(seed).digest()
          def deobfuscate(cipher,kind):
              stream=b''; counter=0
              while len(stream)<len(cipher):
                  stream += hashlib.sha256(base + bytes([kind]) + counter.to_bytes(4,'big')).digest()
                  counter += 1
              return bytes(a^b for a,b in zip(cipher,stream))

          sign_material=deobfuscate(sign_cipher,1)
          aes_key=deobfuscate(aes_cipher,2)
          if len(aes_key)!=32:
              raise RuntimeError('bootstrap AES material derivation failed')
          print('native_bootstrap_material=derived')

          def sign(ts,nonce,did):
              return hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sign_material).hexdigest()

          def redact_obj(v):
              if isinstance(v,dict):
                  out={}
                  for k,x in v.items():
                      lk=k.lower()
                      if any(t in lk for t in ('token','proof','signature')) or lk in ('sign','access'):
                          out[k]='<redacted>'
                      else:
                          out[k]=redact_obj(x)
                  return out
              if isinstance(v,list): return [redact_obj(x) for x in v]
              return v

          ts=str(int(time.time()*1000))
          did=uuid.uuid4().hex
          nonce=uuid.uuid4().hex
          sig=sign(ts,nonce,did)
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          headers={
              'Content-Type':'application/json',
              'Accept':'application/json, text/plain, */*',
              'User-Agent':'qingman/4.4.5 (Android)',
              'appVersion':'4.4.5',
              'platform':'android',
              'X-Device-Id':did,
          }
          req=urllib.request.Request(URL,data=body,headers=headers,method='POST')
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read(32768); status=r.status
          except urllib.error.HTTPError as e:
              status=e.code; raw=e.read(32768)
          resp=json.loads(raw.decode('utf-8','replace'))
          print(f'bootstrap_http={status} code={resp.get("code")} msg={resp.get("msg")}')
          enc=resp.get('data')
          if not isinstance(enc,str) or not enc:
              raise RuntimeError('bootstrap did not return encrypted data')
          payload=base64.urlsafe_b64decode(enc + '='*((4-len(enc)%4)%4))
          if len(payload)<29:
              raise RuntimeError('bootstrap encrypted payload too short')
          iv=payload[:12]
          cipher_and_tag=payload[12:]

          aad_candidates=[
              ('timestamp|nonce',ts,nonce),
              ('nonce|timestamp',nonce,ts),
              ('timestamp|deviceId',ts,did),
              ('deviceId|timestamp',did,ts),
              ('nonce|deviceId',nonce,did),
              ('deviceId|nonce',did,nonce),
          ]
          plaintext=None; aad_label=None
          for label,a,b in aad_candidates:
              aad=(a+'|'+b).encode()
              try:
                  plaintext=AESGCM(aes_key).decrypt(iv,cipher_and_tag,aad)
                  aad_label=label
                  break
              except Exception:
                  pass
          if plaintext is None:
              raise RuntimeError('bootstrap AES-GCM AAD candidates did not authenticate')
          print('bootstrap_decrypt_aad='+aad_label)
          text=plaintext.decode('utf-8')
          obj=json.loads(text)
          safe=redact_obj(obj)
          print('bootstrap_plain='+json.dumps(safe,ensure_ascii=False,separators=(',',':'))[:4000])

          def find_api_domain(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if k.lower()=='apidomain' and isinstance(x,str) and x:
                          return x
                      z=find_api_domain(x)
                      if z: return z
              elif isinstance(v,list):
                  for x in v:
                      z=find_api_domain(x)
                      if z: return z
              return None
          domain=find_api_domain(obj)
          if not domain:
              raise RuntimeError('bootstrap plaintext has no apiDomain')
          print('BOOTSTRAP_API_DOMAIN='+domain)
          PY
