name: Probe Qingman Bootstrap HTTP

on:
  push:
    paths:
      - '.github/workflows/probe-qingman-bootstrap-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve current official APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/qm_version
          import json, urllib.request
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print(a.get('version',''))
          print(a.get('versionCode',''))
          PY
          sed -n '2,3p' /tmp/qm_version | paste -sd ' ' - | sed 's/^/official_version=/'
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/qm_version)" -o /tmp/qingman.apk
          unzip -q -j /tmp/qingman.apk 'lib/arm64-v8a/libqx_security.so' -d /tmp/qm-native
          test -s /tmp/qm-native/libqx_security.so

      - name: Bootstrap and probe live comic APIs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-cryptography >/dev/null
          python3 - <<'PY'
          import base64, hashlib, json, time, urllib.error, urllib.parse, urllib.request, uuid
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from elftools.elf.elffile import ELFFile

          BOOTSTRAP='https://mu8xm4cx.zermh.com/bootstrap/domain'
          SO='/tmp/qm-native/libqx_security.so'

          with open(SO,'rb') as f:
              elf=ELFFile(f)
              def read_va(va,n):
                  for seg in elf.iter_segments():
                      if seg['p_type'] != 'PT_LOAD': continue
                      start=int(seg['p_vaddr']); end=start+int(seg['p_filesz'])
                      if start <= va and va+n <= end:
                          f.seek(int(seg['p_offset']) + va-start)
                          return f.read(n)
                  raise RuntimeError(f'VA 0x{va:x} is not file-backed')
              seed=read_va(0x14a40,16)+read_va(0x14af0,16)
              sign_cipher=read_va(0x17d1f,33)
              aes_cipher=read_va(0x17d40,32)

          base=hashlib.sha256(seed).digest()
          def deobfuscate(cipher,kind):
              stream=b''; counter=0
              while len(stream)<len(cipher):
                  stream += hashlib.sha256(base+bytes([kind])+counter.to_bytes(4,'big')).digest()
                  counter += 1
              return bytes(a^b for a,b in zip(cipher,stream))
          sign_material=deobfuscate(sign_cipher,1)
          aes_key=deobfuscate(aes_cipher,2)
          print('native_bootstrap_material=derived')

          def redact(v):
              if isinstance(v,dict):
                  out={}
                  for k,x in v.items():
                      lk=k.lower()
                      if any(t in lk for t in ('token','proof','signature')) or lk in ('sign','access'):
                          out[k]='<redacted>'
                      else: out[k]=redact(x)
                  return out
              if isinstance(v,list): return [redact(x) for x in v[:8]]
              return v

          def request(url,headers,data=None):
              req=urllib.request.Request(url,data=data,headers=headers,method='POST' if data is not None else 'GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status, r.headers.get('content-type',''), r.read(65536)
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get('content-type',''), e.read(65536)
              except Exception as e:
                  return 0, type(e).__name__, str(e).encode()

          ts=str(int(time.time()*1000)); did=uuid.uuid4().hex; nonce=uuid.uuid4().hex
          sig=hashlib.sha256(ts.encode()+nonce.encode()+did.encode()+sign_material).hexdigest()
          boot_headers={
              'Content-Type':'application/json','Accept':'application/json, text/plain, */*',
              'User-Agent':'qingman/4.4.5 (Android)','appVersion':'4.4.5','platform':'android','X-Device-Id':did,
          }
          body=json.dumps({'timestamp':ts,'nonce':nonce,'sign':sig,'deviceId':did},separators=(',',':')).encode()
          status,ctype,raw=request(BOOTSTRAP,boot_headers,body)
          resp=json.loads(raw.decode('utf-8','replace'))
          print(f'bootstrap_http={status} code={resp.get("code")} msg={resp.get("msg")}')
          enc=resp.get('data')
          payload=base64.urlsafe_b64decode(enc+'='*((4-len(enc)%4)%4))
          plaintext=AESGCM(aes_key).decrypt(payload[:12],payload[12:],(ts+'|'+nonce).encode())
          obj=json.loads(plaintext.decode())
          domain=obj.get('apiDomain')
          app_access=obj.get('appAccessToken')
          if not isinstance(domain,str) or not domain: raise RuntimeError('no apiDomain')
          if not isinstance(app_access,str) or not app_access: raise RuntimeError('no appAccessToken')
          domain=domain.rstrip('/')
          print('BOOTSTRAP_API_DOMAIN='+domain)
          print('bootstrap_expireAt='+str(obj.get('expireAt','')))

          common={
              'Accept':'application/json, text/plain, */*',
              'User-Agent':'qingman/4.4.5 (Android)',
              'appVersion':'4.4.5','platform':'android',
          }
          variants=[
              ('basic',{}),
              ('device',{'X-Device-Id':did}),
              ('app-access',{'X-QM-App-Access':app_access}),
              ('app-access+device',{'X-QM-App-Access':app_access,'X-Device-Id':did}),
          ]
          endpoints=[
              ('categories','api/comic/categories/list',{}),
              ('popular','api/comic/comics/v1/homeList',{'page':'1','pageNum':'1','pageSize':'20'}),
              ('latest','api/comic/comics/homerecentUpdates',{'page':'1','pageNum':'1','pageSize':'20'}),
          ]
          usable=False
          for ename,path,query in endpoints:
              qs=('?'+urllib.parse.urlencode(query)) if query else ''
              url=domain+'/'+path+qs
              for vname,extra in variants:
                  h=dict(common); h.update(extra)
                  st,ct,rb=request(url,h)
                  text=rb.decode('utf-8','replace')
                  summary=''
                  try:
                      parsed=json.loads(text)
                      summary=json.dumps(redact(parsed),ensure_ascii=False,separators=(',',':'))[:1200]
                      if st==200 and isinstance(parsed,(dict,list)):
                          low=summary.lower()
                          if not any(x in low for x in ('unauthorized','forbidden','signature error','签名错误','无权限')):
                              if ('comic' in low or 'category' in low or 'data' in low): usable=True
                  except Exception:
                      summary=text[:500].replace('\n',' ')
                  print(f'API {ename} variant={vname} http={st} ctype={ct[:80]} body={summary}')
          print('comic_api_baseline_usable='+str(usable).lower())
          PY
