name: Tencent v22 Docs Update

on:
  push:
    branches: [main]
    paths:
      - ".github/tencent-v22-docs-update-trigger"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout build infrastructure
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0

      - name: Update Tencent source maintenance record
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/sources/tencentcomics.md")
          text = path.read_text("utf-8")
          text = text.replace("- 当前开发版本：`versionCode = 19`", "- 当前开发版本：`versionCode = 22`", 1)
          text = text.replace("本文件当前聚焦 v17-v19 的 APP 章评、回复与排序验证。", "本文件当前聚焦 v17-v22 的 APP 章评、书评、回复、排序与正文替换能力验证。", 1)

          marker = "## v20-v22：APP 书评与正文替换能力"
          if marker not in text:
              text = text.rstrip() + '''\n\n## v20-v22：APP 书评与正文替换能力\n\n### v20：APP 作品书评主列表\n\n官方 12.19.9 APK 已确认作品社区接口：\n\n- `CommunityTag/detailPage`：通过 `target_type=1 / target_id=<comicId> / comic_id=<comicId>` 获取作品社区 `tag_id` 与首屏数据。\n- `CommunityTag/topicList`：参数 `tag_id / type / page_id / comic_id`，使用 `next_page_id` 游标连续分页。\n- `recommend_topic` 与用户实机截图的“精华”一致。\n- `new_publish_topic` 与“最新-发布”一致。\n- `new_topic` 对应按最新回复/活动排序的数据。\n\n扩展采用 APP 优先、PC `Community/topicList` 仅在 APP 请求失败时兜底；作品评论筛选显示为“精华 / 最新”。v20 已完成 Release 构建、固定签名和公开测试仓库发布，但当时尚未包含作品书评回复读取。\n\n### v21：作品书评回复\n\n线上探针确认作品书评话题同样可调用 `Comment/getTopicCommentList`，读取回复时 `target_type=3`，可复用已经实机验证的章评回复解密、签名与分页链路。\n\n- 书评回复源码提交：`6fb8cb8cb9870378269fe9631014bbe90f35372f`。\n- versionCode 21：`d257f257a880cd0386f814fb1be808e0a2a808a7`。\n- Trusted Check：`33819293409`，Debug / Release / lint / MX ABI-R8 全部通过。\n- 测试商店：`33819432629`，固定签名 Release、APK 证书校验、staging 索引校验全部通过。\n- 测试商店提升：`33819542426`，通过。\n- 公开测试版本：`1.4.21 / 104021`。\n\n书评“精华 / 最新”、连续游标分页和书评回复仍以用户 Android 实机反馈作为最终功能真值。\n\n### v22：正文替换入口能力\n\nMX 的正文替换引擎位于宿主 APP；漫画扩展只需要显式实现 `ChapterContentReplacementSource` 才暴露章节列表与阅读器中的替换入口。该设计与哔哩哔哩漫画扩展一致，普通未实现该接口的源继续隐藏入口。\n\n腾讯动漫已：\n\n- 加入 `ChapterContentReplacementSource` ABI。\n- 在 `TencentComics` 显式实现该能力，默认 `showInChapterList=true`、`showInReader=true`。\n- 能力提交：`d0a0139e418fb1a739c87f6fc13091ccffce3d3c`。\n- versionCode 22：`f8c7323faff2466f3e0ad2b4bcef40b09cbe6de5`。\n- 首次 v22 Trusted Check `33819829606` 因 `PC_COMMENT_TIME` 的 Kotlin 正则转义回归编译失败；源码在 `b646132a2c0bbd4b89e93a5653a1cac86ba5f073` 修复。\n- 修复后 Trusted Check `33819918897`：Debug / Release / lint / MX ABI-R8 通过。\n- 测试商店 `33820031284`：固定签名 Release、APK 证书校验、staging 生成和索引验证通过。\n- 测试商店提升 `33820146007`：通过。\n- 公开 `mx-repo/repo/test/index.json` 已确认腾讯动漫 `1.4.22 / 104022`。\n\nv22 当前属于“构建与发布已验证，Android 实机功能待验证”：需要确认腾讯动漫详情/章节列表与正文阅读器的替换入口是否按预期显示，并实际完成跨源章节匹配和正文替换。\n'''
          path.write_text(text, "utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sources/tencentcomics.md
          if git diff --cached --quiet; then
            echo "Tencent docs already up to date"
          else
            git commit -m "docs(tencentcomics): record v20-v22 APP review and replacement work"
            git push origin HEAD:main
          fi
