name: Check Qingman Runtime Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/qingman-runtime-check-trigger'

permissions:
  contents: read

concurrency:
  group: check-qingman-runtime-bootstrap
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || {
            echo "::error::Missing MX_PRIVATE_READ_TOKEN"
            exit 1
          }

      - name: Checkout private Qingman branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: fix/qingman-v3-runtime-clean
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Record private source commit
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "qingman_source_sha=$source_sha"

      - name: Validate private source layout
        working-directory: source
        run: python3 scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay Qingman
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/qingman
          cp -a source/src/zh/qingman upstream/src/zh/qingman

      - name: Prepare verified official bootstrap material
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyelftools >/dev/null
          python3 source/scripts/prepare_qingman_bootstrap.py --module upstream/src/zh/qingman

      - name: Spotless check
        working-directory: upstream
        run: ./gradlew :src:zh:qingman:spotlessCheck

      - name: Build Debug extension
        working-directory: upstream
        run: ./gradlew :src:zh:qingman:assembleDebug

      - name: Record result
        shell: bash
        run: |
          {
            echo '### Qingman runtime-clean validation'
            echo
            echo "- Private source commit: \`$SOURCE_SHA\`"
            echo '- Official bootstrap material was generated only inside the temporary build tree.'
            echo '- Spotless check passed.'
            echo '- Debug APK compilation passed.'
            echo '- No private source or APK artifact was uploaded.'
            echo '- Android real-device validation remains separate.'
          } >> "$GITHUB_STEP_SUMMARY"
