name: MX Stage 3 Surface Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mx-app-stage3-surface-fix.yml"
      - ".github/mx-app-stage3-surface-fix-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mx-app-stage3-surface-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_APP_SIGNING_BUNDLE" ]]
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]]

      - name: Checkout Stage 3 source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: integration/mx-stage3-ehentai-20260906
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare 1.14.9 surface-site fix
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'it.id == EH_SOURCE_ID' app/src/main/java/eu/kanade/domain/source/interactor/GetEnabledSources.kt
          grep -q 'EHENTAI_EXT_SOURCES.forEach' app/src/main/java/eu/kanade/tachiyomi/source/AndroidSourceManager.kt
          grep -q 'EH_SOURCE_ID to "all"' source-api/src/commonMain/kotlin/exh/source/SourceIds.kt
          sed -i -E '0,/versionCode = [0-9]+/s//versionCode = 89/' app/build.gradle.kts
          sed -i -E '0,/versionName = "[^"]+"/s//versionName = "1.14.9"/' app/build.gradle.kts
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Format and test
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew spotlessApply
          ./gradlew testReleaseUnitTest
          git diff --check

      - name: Commit Stage 3 surface fix
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: expose E-Hentai surface site and bump 1.14.9"
            git push origin HEAD:integration/mx-stage3-ehentai-20260906
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare stable signing key
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle=json.loads(os.environ['MX_APP_SIGNING_BUNDLE'])
          path=Path(os.environ['RUNNER_TEMP'])/'mx-app.jks'
          path.write_bytes(base64.b64decode(bundle['signingKey']))
          values={
              'MX_KEYSTORE_PATH':str(path),
              'MX_KEY_ALIAS':str(bundle['alias']),
              'MX_KEYSTORE_PASSWORD':str(bundle['storePassword']),
              'MX_KEY_PASSWORD':str(bundle['storePassword']),
          }
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for name,value in values.items():
                  print(f'::add-mask::{value}')
                  f.write(f'{name}<<__MX_EOF__\n{value}\n__MX_EOF__\n')
          PY

      - name: Verify stable signing identity
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]

      - name: Build signed Preview APK
        working-directory: source
        run: |
          set -euo pipefail
          ./gradlew assemblePreview -Pdisable-code-shrink --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"

      - name: Verify APK identity
        run: |
          set -euo pipefail
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          expected_cert="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          found=0
          while IFS= read -r apk; do
            found=1
            badging="$("$aapt_bin" dump badging "$apk")"
            [[ "$badging" == *"name='com.huoguotiankong.mx.beta'"* ]]
            [[ "$badging" == *"versionCode='89'"* ]]
            [[ "$badging" == *"versionName='1.14.9-"* ]]
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            [[ "$normalized" == *"$expected_cert"* ]]
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]]

      - name: Checkout publication target
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: publisher
          fetch-depth: 1

      - name: Publish 1.14.9 APKs
        run: |
          set -euo pipefail
          cd publisher
          git switch --orphan mx-stage3-surface-downloads
          git rm -rf . || true
          git clean -fdx
          mkdir -p apks
          found_arm64=0
          while IFS= read -r apk; do
            case "$(basename "$apk")" in
              *arm64-v8a*)
                found_arm64=1
                cp "$apk" apks/MX-Manga-arm64-v8a-preview.apk
                cp "$apk" apks/MX-Manga-arm64-v1.14.9-stage3-surface-preview.apk
                ;;
              *armeabi-v7a*) cp "$apk" apks/MX-Manga-armeabi-v7a-preview.apk ;;
            esac
          done < <(find ../source/app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | sort)
          [[ "$found_arm64" -eq 1 ]]
          cat > README.md <<EOF
          # MX漫画 Stage 3 Surface Fix

          - 版本：1.14.9 / versionCode 89
          - ARM64：\`apks/MX-Manga-arm64-v1.14.9-stage3-surface-preview.apk\`
          - 固定地址：\`apks/MX-Manga-arm64-v8a-preview.apk\`
          - 源码：\`$SOURCE_SHA\`
          - 修复：保留 ExHentai 里站，同时确保内置 E-Hentai 表站可在源列表中发现和使用。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apks
          git commit -m "Publish MX漫画 1.14.9 Stage 3 surface fix ${SOURCE_SHA:0:7}"
          git push --force origin HEAD:downloads

      - name: Cleanup signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
