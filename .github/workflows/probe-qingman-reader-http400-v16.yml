name: Trace Qingman v16 Reader HTTP400 Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-reader-http400-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare current official APK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=30))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('official='+str(a.get('version'))+'/'+str(a.get('versionCode')),file=sys.stderr)
          if (str(a.get('version')),str(a.get('versionCode'))) != ('4.4.5','445'):
              raise SystemExit('unexpected official version')
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/

      - uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Generate AOT metadata
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/blutter
          if ! python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1; then
            echo '=== blutter failure ==='
            tail -200 /tmp/blutter.log
            exit 1
          fi
          echo "blutter_files=$(find /tmp/blutter-out -type f | wc -l)"
          find /tmp/blutter-out -maxdepth 2 -type f -printf '%p %s\n' | head -80 || true

      - name: Trace reader URL, transforms and image request contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          pp_path=Path('/tmp/blutter-out/pp.txt')
          pp={}
          for line in pp_path.read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          wanted=(
              'pageUrls','referer','Referer','baseImgUrl','freeUrl','freeLine','ComicReadSelectedImageLine',
              'claimedImageUrl','imageUrl','imageUrls','decryptImage','decryptCacheImage',
              'QxComicCacheImageProvider','signature_url','x-custom-timestamp','x-custom-signature','X-Signature',
              'Timestamp not set','X-Signature not set','User-Agent','Accept','Origin'
          )
          targets={}
          print('=== TARGET PP ===')
          for off,val in sorted(pp.items()):
              for key in wanted:
                  if key.lower() in val.lower():
                      targets.setdefault(off,key)
                      print(f'0x{off:x} {key}: {val[:240]}')
                      break

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); text_base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          insns=list(md.disasm(data,text_base))

          pending={}; refs=[]
          for idx,ins in enumerate(insns):
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=ins.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if ins.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),40); continue
              if ins.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in targets: refs.append((idx,int(ins.address),off,targets[off]))

          print('\n=== XREFS ===')
          for _,addr,off,key in refs:
              print(f'0x{addr:x} pp=0x{off:x} {key}')

          focus_names={'pageUrls','referer','baseImgUrl','freeUrl','freeLine','ComicReadSelectedImageLine','claimedImageUrl','decryptImage','QxComicCacheImageProvider','signature_url','x-custom-timestamp','x-custom-signature','X-Signature'}
          focus=[]
          for idx,addr,off,key in refs:
              if key in focus_names:
                  focus.append((idx,addr,off,key))

          known=[0x45f368,0x45f398,0x460080,0x46068c,0x489d3c,0x48f000,0x4cfec8,0x4cfee0,0x7637e8,0x7639e4,0xaccfbc,0xb072b0,0xb681d8]
          addr_to_idx={int(i.address):n for n,i in enumerate(insns)}
          for addr in known:
              if addr in addr_to_idx:
                  focus.append((addr_to_idx[addr],addr,-1,'known'))

          seen=set()
          print('\n=== DISASM WINDOWS ===')
          for idx,addr,off,key in focus:
              bucket=addr//0x100
              if bucket in seen: continue
              seen.add(bucket)
              lo=max(0,idx-45); hi=min(len(insns),idx+75)
              print(f'--- around 0x{addr:x} trigger={key} ---')
              for j in range(lo,hi):
                  ins=insns[j]
                  print(f'0x{ins.address:x}: {ins.mnemonic:8s} {ins.op_str}')

          deny=re.compile(r'(?i)(password|passwd|pwd|cookie|authorization|bearer|clientp12|privatekey|certificate|keystore|storepassword|keypassword)')
          terms=('pageUrls','referer','baseImgUrl','freeUrl','freeLine','ComicReadSelectedImageLine','claimedImageUrl','decryptImage','QxComicCacheImageProvider','signature_url','x-custom-timestamp','x-custom-signature','X-Signature')
          print('\n=== GENERATED TEXT CONTEXT ===')
          emitted=0
          for p in Path('/tmp/blutter-out').rglob('*'):
              if not p.is_file() or p.name in ('pp.txt','blutter_frida.js') or p.stat().st_size>30*1024*1024: continue
              text=p.read_text('utf-8',errors='replace')
              lines=text.splitlines()
              for i,line in enumerate(lines):
                  if not any(t.lower() in line.lower() for t in terms): continue
                  print(f'FILE={p.relative_to("/tmp/blutter-out")} LINE={i+1}')
                  for n in range(max(0,i-25),min(len(lines),i+45)):
                      s=lines[n]
                      if deny.search(s): s='<redacted-sensitive-line>'
                      print(f'{n+1:06d}: {s[:420]}')
                  emitted+=1
                  if emitted>=35: break
              if emitted>=35: break
          print('contexts='+str(emitted))
          PY
