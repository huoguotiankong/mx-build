name: Probe XGYW site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-xgyouwu-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe XGYW detail reader tags and search
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Linux; Android 16; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          base='http://www.xgyouwu.com'
          out=/tmp/xgyw-probe
          mkdir -p "$out"
          declare -A urls=(
            [home]="$base/"
            [category]="$base/xing/ganyoum/24_1.html"
            [tag]="$base/chis/meinvwushengguangtuji/1.html"
            [detail]="$base/xing/ganyou/20360307/323786.html"
            [detail_us2]="$base/xing/ganyou/20360307/323786_2.html"
            [detail_slash2]="$base/xing/ganyou/20360307/2.html"
          )
          for key in "${!urls[@]}"; do
            url="${urls[$key]}"
            echo "=== $key $url ==="
            curl -L --compressed -A "$ua" -e "$base/" -m 20 -sS -D "$out/${key}.headers" -o "$out/${key}.bin" -w 'code=%{http_code} final=%{url_effective} size=%{size_download} type=%{content_type}\n' "$url" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          out=Path('/tmp/xgyw-probe')
          def decode(raw):
              head=raw[:6000].decode('ascii','ignore').lower()
              m=re.search(r'charset\s*=\s*["\']?([a-z0-9._-]+)', head)
              enc=m.group(1) if m else None
              for cand in [enc,'gb18030','utf-8','big5']:
                  if not cand: continue
                  try: return raw.decode(cand), cand
                  except Exception: pass
              return raw.decode('utf-8','replace'), 'utf-8?'
          for key in ['home','category','tag','detail','detail_us2','detail_slash2']:
              p=out/f'{key}.bin'
              if not p.exists(): continue
              raw=p.read_bytes(); text,enc=decode(raw)
              (out/f'{key}.utf8.txt').write_text(text,encoding='utf-8')
              print(f'\n### {key} bytes={len(raw)} enc={enc}')
              for pat,label in [
                  (r'<title[^>]*>(.*?)</title>','TITLE'),
                  (r'<h1[^>]*>(.*?)</h1>','H1'),
                  (r'<meta[^>]+name=["\']keywords["\'][^>]+content=["\']([^"\']+)','KEYWORDS'),
                  (r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)','DESCRIPTION'),
              ]:
                  m=re.search(pat,text,re.I|re.S)
                  if m:
                      val=re.sub(r'<[^>]+>',' ',m.group(1)); val=re.sub(r'\s+',' ',html.unescape(val)).strip()
                      print(label,val[:1000])
              # forms/search
              for m in re.finditer(r'<form\b[^>]*>.*?</form>',text,re.I|re.S):
                  block=re.sub(r'\s+',' ',m.group(0)).strip()
                  if 'search' in block.lower() or '搜' in block:
                      print('FORM',block[:1800])
              # links relevant to category/tag/pagination/detail
              links=[]
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  href=html.unescape(m.group(1)).strip(); lab=re.sub(r'<[^>]+>',' ',m.group(2)); lab=re.sub(r'\s+',' ',html.unescape(lab)).strip()
                  if href and (('/chis/' in href) or ('/xing/ganyoum/' in href) or re.search(r'(^|/|_)\d+\.html$',href) or '下一页' in lab or '末页' in lab):
                      item=(href,lab[:100])
                      if item not in links: links.append(item)
              for href,lab in links[:120]: print('LINK',repr(lab),href)
              # images including lazy attrs
              imgs=[]
              for m in re.finditer(r'<img\b[^>]*>',text,re.I|re.S):
                  tag=re.sub(r'\s+',' ',m.group(0)).strip()
                  if tag not in imgs: imgs.append(tag)
              print('IMG_COUNT',len(imgs))
              for tag in imgs[:120]: print('IMG',tag[:1400])
              # likely detail metadata blocks / scripts
              for line in text.splitlines():
                  s=re.sub(r'\s+',' ',line).strip(); low=s.lower()
                  if len(s) < 5000 and any(k in low for k in ('标签','分类','相关','page','pagelist','tag','keyword','pic','image','photo','content')):
                      if key.startswith('detail'):
                          print('LINE',s[:2200])
          PY
          # Probe representative image request headers/status.
          img=$(python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('/tmp/xgyw-probe/detail.utf8.txt').read_text(encoding='utf-8',errors='ignore')
          m=re.search(r'<img\b[^>]*(?:lazy-src|data-src|src)=["\'](http://img\.xgyouwu\.com/[^"\']+)',t,re.I)
          print(m.group(1) if m else '')
          PY
          )
          if [ -n "$img" ]; then
            echo "=== IMAGE $img ==="
            for mode in none root detail; do
              case "$mode" in
                none) ref='' ;;
                root) ref="$base/" ;;
                detail) ref="$base/xing/ganyou/20360307/323786.html" ;;
              esac
              if [ -n "$ref" ]; then
                curl -L --compressed -A "$ua" -e "$ref" -m 20 -sS -o /dev/null -w "$mode code=%{http_code} size=%{size_download} type=%{content_type} time=%{time_total}\n" "$img" || true
              else
                curl -L --compressed -A "$ua" -m 20 -sS -o /dev/null -w "$mode code=%{http_code} size=%{size_download} type=%{content_type} time=%{time_total}\n" "$img" || true
              fi
            done
          fi
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: xgyouwu-site-probe
          path: /tmp/xgyw-probe/
          if-no-files-found: error
