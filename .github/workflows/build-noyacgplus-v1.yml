name: Build And Stage NoyAcg Plus v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-noyacgplus-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-noyacgplus-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" ]]
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MX private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve NoyAcg Plus version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p=Path('dev/src/zh/noyacgplus/build.gradle.kts')
          text=p.read_text('utf-8')
          code=re.search(r'versionCode\s*=\s*(\d+)', text)
          lib=re.search(r'libVersion\s*=\s*"([0-9]+\.[0-9]+)"', text)
          if not code or not lib:
              raise SystemExit('Unable to resolve NoyAcg Plus version')
          code=int(code.group(1)); version=f'{lib.group(1)}.{code}'
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as f:
              f.write(f'source_code={code}\nversion_name={version}\n')
          print(f'NoyAcg Plus source versionCode={code}, versionName={version}')
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Overlay and repair NoyAcg Plus
        shell: bash
        run: |
          set -euo pipefail
          test -f dev/src/zh/noyacgplus/build.gradle.kts
          test -d dev/src/zh/noyacgplus/src
          rm -rf upstream/src/zh/noyacgplus
          cp -a dev/src/zh/noyacgplus upstream/src/zh/noyacgplus
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/src/zh/noyacgplus/src/eu/kanade/tachiyomi/extension/zh/noyacgplus/NoyAcgPlus.kt')
          text=p.read_text('utf-8')
          text=text.replace('private fun simp(text: String?): String? = text?.let {', 'private fun simp(text: String?): String? = text?.let { sourceText ->', 1)
          text=text.replace('runCatching { OpenCC.convert(it, "t2s").toString() }.getOrElse { it }', 'runCatching { OpenCC.convert(sourceText, "t2s").toString() }.getOrElse { sourceText }', 1)
          old='        } else {\n            it\n        }\n    }\n\n    private fun parseObject'
          new='        } else {\n            sourceText\n        }\n    }\n\n    private fun parseObject'
          text=text.replace(old, new, 1)
          if 'getOrElse { it }' in text or 'text?.let { sourceText ->' not in text:
              raise SystemExit('OpenCC fallback repair did not apply cleanly')
          p.write_text(text, 'utf-8')
          PY

      - name: Format and static validation
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:noyacgplus:spotlessApply
          ./gradlew :src:zh:noyacgplus:spotlessCheck

      - name: Prepare stable signing key
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          required=('signingKey','alias','storePassword','keyPassword')
          missing=[k for k in required if not b.get(k)]
          if missing: raise SystemExit('Signing bundle missing: '+', '.join(missing))
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for e,k in (('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')):
                  v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF_SIGN\n{v}\nEOF_SIGN\n')
          PY

      - name: Build debug release and lint
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:noyacgplus:assembleDebug :src:zh:noyacgplus:assembleRelease :src:zh:noyacgplus:lintRelease

      - name: Verify stable signing identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          expected="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          designated='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          [[ "$expected" == "$designated" ]] || { echo "::error::Unexpected signing identity"; exit 1; }
          apk="$(find upstream/src/zh/noyacgplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          echo "fingerprint=$expected" >> "$GITHUB_OUTPUT"

      - name: Sync validated source to private development repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/noyacgplus
          cp -a upstream/src/zh/noyacgplus dev/src/zh/noyacgplus
          rm -rf dev/src/zh/noyacgplus/build
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check
          git -C dev config user.name 'github-actions[bot]'
          git -C dev config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C dev add src/zh/noyacgplus
          if git -C dev diff --cached --quiet; then
            echo 'NoyAcg Plus source is already current'
          else
            git -C dev commit -m 'fix(noyacgplus): validate compile and formatting v1'
            git -C dev pull --rebase origin main
            git -C dev push origin HEAD:main
          fi

      - name: Checkout extension staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Generate isolated NoyAcg Plus test store
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/noyacgplus' > targets.txt
          python3 dev/scripts/publish_test_repo.py \
            --targets targets.txt \
            --upstream-root upstream \
            --source-root dev \
            --repo-dir staging/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/index.json
          test -f staging/test/repo.json
          test -f "staging/test/apk/tachiyomi-zh.noyacgplus-v${EXPECTED_VERSION}.apk"
          grep -q 'eu.kanade.tachiyomi.extension.zh.noyacgplus' staging/test/index.json

      - name: Commit validated test store snapshot
        working-directory: staging
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          if git diff --cached --quiet; then
            echo 'No staging changes'
          else
            git commit -m "Stage NoyAcg Plus v${EXPECTED_VERSION} test store"
            git push origin HEAD:extension-staging
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: noyacgplus-v${{ steps.version.outputs.source_code }}-signed-apk
          path: upstream/src/zh/noyacgplus/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: noyacgplus-v${{ steps.version.outputs.source_code }}-formatted-source
          path: upstream/src/zh/noyacgplus
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
