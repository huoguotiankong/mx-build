name: Patch Kuaikan v24 comment images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-kuaikan-comment-images-v24.yml"
      - ".github/kuaikan-v24-comment-images-trigger"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check private write token
        shell: bash
        env:
          MX_DEV_WRITE_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_DEV_WRITE_TOKEN" ]]

      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          path: helper

      - name: Checkout current private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Kuaikan v24
        working-directory: source
        run: python3 ../helper/.github/scripts/patch-kuaikan-v24.py

      - name: Commit Kuaikan v24
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zh/kuaikanmanhua docs/sources/kuaikanmanhua.md
          git commit -m "feat(kuaikanmanhua): preserve comment images v24"
          git pull --rebase origin main
          git push origin HEAD:main
