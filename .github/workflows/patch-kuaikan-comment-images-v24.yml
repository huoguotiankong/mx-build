name: Patch Kuaikan v24 comment images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-kuaikan-comment-images-v24.yml"
      - ".github/kuaikan-v24-comment-images-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          path: helper
          persist-credentials: true

      - name: Checkout current private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Kuaikan v24
        working-directory: source
        run: python3 ../helper/.github/scripts/patch-kuaikan-v24.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Format and build Kuaikan v24
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/kuaikanmanhua
          cp -a source/src/zh/kuaikanmanhua upstream/src/zh/kuaikanmanhua
          cd upstream
          ./gradlew :src:zh:kuaikanmanhua:spotlessApply
          ./gradlew \
            :src:zh:kuaikanmanhua:assembleDebug \
            :src:zh:kuaikanmanhua:assembleRelease \
            :src:zh:kuaikanmanhua:lintRelease
          cd ..
          rm -rf source/src/zh/kuaikanmanhua
          cp -a upstream/src/zh/kuaikanmanhua source/src/zh/kuaikanmanhua
          git -C source diff --check

      - name: Commit validated Kuaikan v24 to private source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zh/kuaikanmanhua docs/sources/kuaikanmanhua.md
          git diff --cached --quiet && { echo "::error::No Kuaikan v24 changes"; exit 1; }
          git commit -m "feat(kuaikanmanhua): preserve comment images v24"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Export validated handoff to build repo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf helper/.github/handoff/kuaikan-v24
          mkdir -p helper/.github/handoff/kuaikan-v24
          cp source/src/zh/kuaikanmanhua/src/eu/kanade/tachiyomi/extension/zh/kuaikanmanhua/Kuaikanmanhua.kt \
            helper/.github/handoff/kuaikan-v24/Kuaikanmanhua.kt
          cp source/src/zh/kuaikanmanhua/build.gradle.kts \
            helper/.github/handoff/kuaikan-v24/build.gradle.kts
          cp source/docs/sources/kuaikanmanhua.md \
            helper/.github/handoff/kuaikan-v24/kuaikanmanhua.md
          git -C helper config user.name "github-actions[bot]"
          git -C helper config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C helper add .github/handoff/kuaikan-v24
          if ! git -C helper diff --cached --quiet; then
            git -C helper commit -m "ci: refresh validated Kuaikan v24 handoff"
            git -C helper pull --rebase origin main
            git -C helper push origin HEAD:main
          fi
