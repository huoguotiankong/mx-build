name: Format MiHouTao v4 Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-mihoutao-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: 0ca8b46ec5229955a6a76b736de27642bca0808f
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MX development source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Format module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/mihoutao
          cp -a dev/src/zh/mihoutao upstream/src/zh/mihoutao
          cd upstream
          ./gradlew :src:zh:mihoutao:spotlessApply
          ./gradlew :src:zh:mihoutao:spotlessCheck
          cd ..
          mkdir -p formatted
          cp -a upstream/src/zh/mihoutao/. formatted/
          rm -rf formatted/build

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: mihoutao-v4-spotless-source
          path: formatted
          if-no-files-found: error
          retention-days: 7
