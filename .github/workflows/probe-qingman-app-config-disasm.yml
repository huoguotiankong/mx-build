name: Disassemble Qingman App Config Fetch Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-app-config-disasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect AppConfig control flow safely
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone >/dev/null
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(head -1 /tmp/apk_url)" -o /tmp/qingman.apk
          unzip -q -j /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' -d /tmp/qm-app

          python3 - <<'PY'
          import re
          from elftools.elf.elffile import ELFFile
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM

          lib='/tmp/qm-app/libapp.so'
          with open(lib,'rb') as f:
              elf=ELFFile(f)
              sec=elf.get_section_by_name('.text')
              text_va=int(sec['sh_addr']); text=sec.data()
              # Reconstruct object-pool strings indirectly from raw libapp is not
              # practical; use known PP offset labels plus generic nearby offset names.

          labels={
              0x1eae8:'AppConfig',
              0x1eba0:'baseImgUrl',
              0x1eba8:'freeUrl',
              0x1ebb0:'customerUrl',
              0x1ebb8:'officialUrl',
              0x1ebc0:'promotionUrl',
              0x1ec38:'Get app config failed',
              0x2e6f8:'api/radio/api/config/getAdConfig',
              0x2bfc8:'api/radio/api/config/homepage/interstitial',
              0x1ef98:'public version endpoint',
          }
          sensitive_offsets=set()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True

          ranges=[
              ('app_config_fetch',0xb02000,0xb02d80),
              ('app_config_startup',0xb18f00,0xb19700),
              ('app_config_codec',0x4cfb00,0x4d0800),
              ('ad_config_route',0x7e2200,0x7e3300),
          ]
          for name,start,end in ranges:
              if start<text_va or end>text_va+len(text):
                  print('RANGE_SKIP',name,hex(start),hex(end)); continue
              blob=text[start-text_va:end-text_va]
              pending={}
              print(f'\n=== RANGE {name} {start:#x}-{end:#x} ===')
              for ins in md.disasm(blob,start):
                  pending={r:(base,ttl-1) for r,(base,ttl) in pending.items() if ttl>1}
                  op=ins.op_str.lower(); annotation=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if ins.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),12)
                  elif ins.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None:
                              if off in sensitive_offsets: annotation=' PP=<redacted>'
                              else: annotation=f' PP+0x{off:x}' + (f' [{labels[off]}]' if off in labels else '')
                  # Print all branches and PP-related loads, plus prologue/return/error region.
                  if annotation or ins.mnemonic in ('bl','blr','b','ret','cbz','cbnz','tbz','tbnz','b.eq','b.ne','b.ls','b.hi'):
                      print(f'{ins.address:#x} {ins.mnemonic:<7} {ins.op_str}{annotation}')
          PY
