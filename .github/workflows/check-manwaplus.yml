name: Check Manwa Plus Extension

on:
  push:
    branches: [main]
    paths:
      - ".github/manwaplus-check-trigger"
      - ".github/workflows/check-manwaplus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source layout
        working-directory: source
        run: python3 scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay Manwa Plus module
        run: |
          rm -rf upstream/src/zh/manwaplus
          cp -a source/src/zh/manwaplus upstream/src/zh/manwaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless, debug build, release lint
        working-directory: upstream
        run: ./gradlew :src:zh:manwaplus:spotlessCheck :src:zh:manwaplus:assembleDebug :src:zh:manwaplus:lintRelease --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manwaplus-debug
          path: upstream/src/zh/manwaplus/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
