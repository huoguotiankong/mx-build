name: Build MiHouTao v6 Chapter Comments

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-mihoutao-v4-current.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mihoutao-v6-chapter-comments
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check secrets
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" && -n "$MX_PRIVATE_READ_TOKEN" ]]

      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: 0ca8b46ec5229955a6a76b736de27642bca0808f
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Validate current source
        run: |
          set -euo pipefail
          grep -q 'versionCode = 6' dev/src/zh/mihoutao/build.gradle.kts
          grep -q 'proguardFiles("proguard-rules.pro")' dev/src/zh/mihoutao/build.gradle.kts
          grep -q 'eu.kanade.tachiyomi.source.mx.\*\*' dev/src/zh/mihoutao/proguard-rules.pro
          grep -q 'MiHouTaoV6Base()' dev/src/zh/mihoutao/src/eu/kanade/tachiyomi/extension/zh/mihoutao/MiHouTaoManga.kt
          grep -q 'supportsChapterComments = true' dev/src/zh/mihoutao/src/eu/kanade/tachiyomi/extension/zh/mihoutao/MiHouTaoV6Base.kt
          grep -q 'chapter_id' dev/src/zh/mihoutao/src/eu/kanade/tachiyomi/extension/zh/mihoutao/MiHouTaoV6Base.kt
          grep -q 'CommentSource' dev/src/zh/mihoutao/src/eu/kanade/tachiyomi/extension/zh/mihoutao/MiHouTaoEnhancedBase.kt
          grep -q 'ExtraCookieInterceptor' dev/src/zh/mihoutao/src/eu/kanade/tachiyomi/extension/zh/mihoutao/MiHouTaoV4Base.kt
          grep -q 'ApiRedirectInterceptor' dev/src/zh/mihoutao/src/eu/kanade/tachiyomi/extension/zh/mihoutao/MiHouTaoV4Base.kt
          grep -q 'AesRefreshInterceptor' dev/src/zh/mihoutao/src/eu/kanade/tachiyomi/extension/zh/mihoutao/MiHouTaoV4Base.kt
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check

      - name: Verify live chapter comment contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          base='https://manwari.cc'; comic='3638'
          ua='Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json,text/html,*/*'})
              with urllib.request.urlopen(req,timeout=20) as r: return r.read()
          chapters=json.loads(get(f'{base}/api/comic/{comic}/chapters'))['data']['list']
          chapter=str(chapters[0]['id'])
          html=get(f'{base}/comic/{comic}/{chapter}').decode('utf-8','ignore')
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          matched=False
          for src in scripts:
              u=urllib.parse.urljoin(base+'/',src)
              js=get(u).decode('utf-8','ignore')
              if '/api/comments?comic_id=' in js and 'chapter_id=${window.COMIC_CID}' in js:
                  matched=True; print('chapter comment JS contract verified:',u); break
          assert matched, 'chapter comment JS contract not found'
          q=urllib.parse.urlencode({'comic_id':comic,'chapter_id':chapter,'page':1,'page_size':20,'sort':'time'})
          data=json.loads(get(base+'/api/comments?'+q))
          assert data.get('code')==200, data
          print('chapter comments endpoint verified; total=',(data.get('data') or {}).get('total'))
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Overlay and format
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/mihoutao
          cp -a dev/src/zh/mihoutao upstream/src/zh/mihoutao
          cd upstream
          ./gradlew :src:zh:mihoutao:spotlessApply
          ./gradlew :src:zh:mihoutao:spotlessCheck

      - name: Prepare signing key
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as f:
              for e,k in (('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')):
                  v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF_SIGN\n{v}\nEOF_SIGN\n')
          PY

      - name: Build debug release and lint
        working-directory: upstream
        run: |
          set -euo pipefail
          ./gradlew :src:zh:mihoutao:assembleDebug :src:zh:mihoutao:assembleRelease :src:zh:mihoutao:lintRelease

      - name: Verify MX comment ABI survives R8
        run: |
          set -euo pipefail
          apk="$(find upstream/src/zh/mihoutao -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          unzip -p "$apk" classes.dex > /tmp/mihoutao-release.dex
          grep -a -F -q 'Leu/kanade/tachiyomi/source/mx/CommentSource;' /tmp/mihoutao-release.dex
          grep -a -F -q 'Leu/kanade/tachiyomi/source/mx/CommentCapabilities;' /tmp/mihoutao-release.dex
          grep -a -F -q 'Leu/kanade/tachiyomi/source/mx/SortableCommentSource;' /tmp/mihoutao-release.dex
          grep -a -F -q 'supportsChapterComments' /tmp/mihoutao-release.dex || true
          echo 'MX comment ABI descriptors preserved in release dex'

      - name: Verify signing
        id: signing
        run: |
          set -euo pipefail
          expected="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          designated='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          [[ "$expected" == "$designated" ]]
          apk="$(find upstream/src/zh/mihoutao -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          echo "fingerprint=$expected" >> "$GITHUB_OUTPUT"

      - name: Prepare formatted source snapshot
        run: |
          set -euo pipefail
          rm -rf formatted-source
          mkdir -p formatted-source
          rsync -a --exclude build upstream/src/zh/mihoutao/ formatted-source/

      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Generate test store
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/mihoutao
          cp -a formatted-source dev/src/zh/mihoutao
          printf '%s\n' 'zh/mihoutao' > targets.txt
          python3 dev/scripts/publish_test_repo.py \
            --targets targets.txt \
            --upstream-root upstream \
            --source-root dev \
            --repo-dir staging/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/apk/tachiyomi-zh.mihoutao-v1.6.6.apk
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('staging/test/index.json').read_text('utf-8'))
          p='eu.kanade.tachiyomi.extension.zh.mihoutao'
          items=[x for x in data['extensionList']['extensions'] if x.get('packageName')==p]
          assert len(items)==1, items
          item=items[0]
          assert (item.get('versionName'),item.get('versionCode'))==('1.6.6',106006), item
          print('staged:',item.get('versionName'),item.get('versionCode'))
          PY

      - name: Commit staging
        working-directory: staging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Stage MiHouTao v1.6.6 test store'
            git push origin HEAD:extension-staging
          fi

      - name: Verify staging online
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 -o /tmp/index.json 'https://raw.githubusercontent.com/huoguotiankong/mx-build/extension-staging/test/index.json'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/index.json',encoding='utf-8'))
          p='eu.kanade.tachiyomi.extension.zh.mihoutao'
          item=[x for x in data['extensionList']['extensions'] if x.get('packageName')==p][0]
          assert (item.get('versionName'),item.get('versionCode'))==('1.6.6',106006), item
          print('online staging verified')
          PY

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mihoutao-v6-signed-test-apk
          path: upstream/src/zh/mihoutao/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: mihoutao-v6-formatted-source
          path: formatted-source
          if-no-files-found: error
          retention-days: 14

      - name: Upload test store
        uses: actions/upload-artifact@v4
        with:
          name: mihoutao-v6-test-store
          path: staging/test
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        run: rm -f upstream/signingkey.jks
