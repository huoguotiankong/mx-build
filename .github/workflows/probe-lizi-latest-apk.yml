name: Probe latest Lizi Manga APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-lizi-latest-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and inspect latest APK
        shell: bash
        run: |
          set -euo pipefail
          url='https://alicm.a.etoote.com/bs2/ad-app/YWQtYXBwOmFkX2RzcF9hcHA6NTMxMzQxOTE1MzpNRVJDSEFOVDpbQkAxZDZlMGRkZDoxOTQxOTgwMjM4MDE1Mw%3D%3D.apk'
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 -o /tmp/lizi.apk "$url"
          ls -lh /tmp/lizi.apk
          sha256sum /tmp/lizi.apk
          bt="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          "$bt/aapt2" dump badging /tmp/lizi.apk | head -n 30 || true
          rm -rf /tmp/lizi && mkdir /tmp/lizi && unzip -q /tmp/lizi.apk -d /tmp/lizi
          echo '=== LIBAPP STRINGS ==='
          so=/tmp/lizi/lib/arm64-v8a/libapp.so
          test -f "$so"
          strings -a "$so" | grep -E 'https?://|app/api/|lzsign|appsign256|pic_domain|deviceId|crypto-js|lizimh|lizi\.lat|myqcloud|\.json' | sort -u | head -n 1200 || true
          echo '=== CONFIG CIPHERTEXT ==='
          cfg="$(strings -a "$so" | grep -E '^https://.*myqcloud\.com/.*\.json$' | head -n1 || true)"
          echo "CFG=$cfg"
          if [ -n "$cfg" ]; then curl -fsSL --retry 2 "$cfg" | head -c 2000; echo; fi
