name: Patch MX Comment Media Recognition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-mx-comment-media.yml"
      - "scripts/patch_mx_comment_media.py"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check private repository token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || {
            echo "::error::Missing MX_PRIVATE_READ_TOKEN"
            exit 1
          }

      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          path: infra
          persist-credentials: false

      - name: Checkout MX feature branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: feat/comment-media-detection
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: app-src
          fetch-depth: 0
          persist-credentials: true

      - name: Apply generalized comment media patch
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/scripts/patch_mx_comment_media.py app-src
          git -C app-src diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply formatting
        working-directory: app-src
        run: ./gradlew spotlessApply

      - name: Spotless gate
        working-directory: app-src
        run: ./gradlew spotlessCheck

      - name: Comment parser unit tests
        working-directory: app-src
        run: ./gradlew :app:testReleaseUnitTest --tests 'eu.kanade.presentation.manga.comments.CommentRichContentTest'

      - name: Build debug APK
        working-directory: app-src
        run: ./gradlew assembleDebug

      - name: Commit verified feature branch
        working-directory: app-src
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: broaden comment image recognition"
          git push origin HEAD:feat/comment-media-detection
