name: Probe MiHouTao Chapter Comments

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mihoutao-chapter-comments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe current site chapter comment API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse

          UA = 'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          BASE = 'https://manwari.cc'
          COMIC_ID = '3638'

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json,text/html,*/*'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.headers.get('content-type',''), r.read()

          status, ctype, raw = get(f'{BASE}/api/comic/{COMIC_ID}/chapters')
          print('chapters', status, ctype, raw[:500])
          root = json.loads(raw)
          data = root.get('data') or {}
          items = data.get('list') or data.get('data') or []
          if not items:
              raise SystemExit('no chapters returned')
          chapter = items[0]
          chapter_id = str(chapter.get('id') or chapter.get('chapter_id') or chapter.get('chapterId') or '')
          print('chapter candidate:', chapter_id, chapter)
          if not chapter_id:
              raise SystemExit('unable to resolve chapter id')

          # Inspect chapter page and referenced JS for exact comment parameter names/endpoints.
          page_url = f'{BASE}/comic/{COMIC_ID}/{chapter_id}'
          try:
              _, _, page = get(page_url)
              text = page.decode('utf-8', 'ignore')
              print('chapter page url:', page_url, 'len=', len(text))
              for line in text.splitlines():
                  if 'comment' in line.lower() or '评论' in line or '評論' in line:
                      print('HTML-COMMENT:', line[:1000])
              scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', text, re.I)
              for src in scripts:
                  u = urllib.parse.urljoin(page_url, src)
                  try:
                      _, _, jsb = get(u)
                      js = jsb.decode('utf-8', 'ignore')
                  except Exception as e:
                      print('script fetch failed', u, repr(e)); continue
                  if '/api/comments' in js or 'chapter_id' in js or 'chapterId' in js:
                      print('MATCH SCRIPT', u, 'len=', len(js))
                      for m in re.finditer(r'.{0,350}(?:/api/comments|chapter_id|chapterId).{0,500}', js, re.I|re.S):
                          print('JS-COMMENT:', m.group(0).replace('\n',' ')[:1400])
          except Exception as e:
              print('chapter page inspection failed:', repr(e))

          candidates = [
              {'comic_id':COMIC_ID,'chapter_id':chapter_id,'page':'1','page_size':'20','sort':'time'},
              {'comic_id':COMIC_ID,'chapterId':chapter_id,'page':'1','page_size':'20','sort':'time'},
              {'chapter_id':chapter_id,'page':'1','page_size':'20','sort':'time'},
              {'chapterId':chapter_id,'page':'1','page_size':'20','sort':'time'},
              {'comic_id':COMIC_ID,'chapter':chapter_id,'page':'1','page_size':'20','sort':'time'},
          ]
          for q in candidates:
              url = BASE + '/api/comments?' + urllib.parse.urlencode(q)
              try:
                  st, ct, body = get(url)
                  preview = body.decode('utf-8','ignore')[:1200]
                  print('\nCANDIDATE', url, '=>', st, ct, preview)
              except Exception as e:
                  print('\nCANDIDATE', url, 'ERROR', repr(e))
          PY
