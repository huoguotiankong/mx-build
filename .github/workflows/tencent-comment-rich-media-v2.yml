'''
          if old not in text:
              raise SystemExit('decodeCommentText baseline not found')
          text = text.replace(old, new, 1)

          old = '        val TENCENT_EMOJI_CODE = Regex("\\\\[:(\\\\d{1,3}):]")\n'
          new = '        val TENCENT_EMOJI_TOKEN = Regex("\\\\[:([^:\\\\]\\\\r\\\\n]{1,24}):]")\n'
          if old not in text:
              raise SystemExit('emoji regex baseline not found')
          text = text.replace(old, new, 1)

          marker = '''            61 to "👍",
        )
'''
          replacement = '''            61 to "👍",
        )
        val TENCENT_EMOJI_NAME_TEXT = mapOf(
            "鼓掌" to "👏",
            "赞" to "👍",
            "点赞" to "👍",
            "爱心" to "❤️",
            "开心" to "😄",
            "微笑" to "🙂",
            "笑哭" to "😂",
            "大哭" to "😭",
            "哭" to "😭",
            "害羞" to "😊",
            "生气" to "😠",
            "惊讶" to "😮",
            "疑问" to "🤔",
            "666" to "🔥666",
        )
'''
          if marker not in text:
              raise SystemExit('emoji map marker not found')
          text = text.replace(marker, replacement, 1)
          src.write_text(text, encoding='utf-8')

          gradle = Path('src/zh/tencentcomics/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if 'versionCode = 24' not in g:
              raise SystemExit('Tencent versionCode 24 baseline not found')
          gradle.write_text(g.replace('versionCode = 24', 'versionCode = 25', 1), encoding='utf-8')

          doc = Path('docs/sources/tencentcomics.md')
          d = doc.read_text(encoding='utf-8')
          d = d.replace('当前开发版本：`versionCode = 24`', '当前开发版本：`versionCode = 25`', 1)
          section = '''

## v25：评论附件、CDN 图片与扩展表情兼容

### 2026-09-05 用户实机反馈

- 腾讯评论回复中存在 `manhua.acimg.cn/...jpg/0?tp=sharp` 这类带图片处理尾段的 URL，旧 MX 客户端未识别为图片。
- 评论中仍会出现 `[:b鼓掌:]`、`[:068:]` 等旧式/扩展表情标记。

### 扩展侧处理

- 回复 `commentInfo` 现在和主题评论一样读取官方附件字段，允许纯图片回复。
- 图片字段兼容 `attach / attachments / pics / images`，以及 `picUrl / pic_url / imageUrl / image_url / url / src` 等常见键。
- 腾讯表情解析从仅数字 `[:NNN:]` 扩展为通用 `[:token:]`：已知数字继续映射 Unicode；已知命名表情（例如 `b鼓掌`）映射为对应 emoji；未知数字/命名标记转为可读的 `【表情：...】`，不再原样泄漏协议标签。
- 不猜测未知编号的真实语义；例如 `[:068:]` 在未确认官方资源含义前显示为 `【表情：068】`。

### 验证边界

- 本轮只读评论增强不改变腾讯 APP 评论签名、3DES 解密、排序和回复 API。
- 源码构建/格式/lint 由专用 CI 验证；实际图片与表情最终显示仍以 Android 实机为准。
'''
          if '## v25：评论附件、CDN 图片与扩展表情兼容' not in d:
              d += section
          doc.write_text(d, encoding='utf-8')
          PY
          python3 scripts/validate_sources.py
          git diff --check
          grep -F 'versionCode = 25' src/zh/tencentcomics/build.gradle.kts
          grep -F 'TENCENT_EMOJI_TOKEN' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt
          grep -F 'topicImageUrls(info)' src/zh/tencentcomics/src/eu/kanade/tachiyomi/extension/zh/tencentcomics/TencentComics.kt

      - name: Patch MX app 1.14.6 rich-comment fallback
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt')
          text = screen.read_text(encoding='utf-8')

          old = '''        .replace(COMMENT_BBCODE_FORMATTING_REGEX, "")
        .replace(COMMENT_CUSTOM_EMOJI_TOKEN_REGEX) { match ->
'''
          new = '''        .replace(COMMENT_BBCODE_FORMATTING_REGEX, "")
        .replace(COMMENT_COLON_EMOJI_TOKEN_REGEX) { match ->
            val raw = match.groupValues.getOrNull(1)?.trim().orEmpty()
            val name = raw.removePrefix("b").removePrefix("B").trim().ifBlank { raw }
            if (name.isBlank()) match.value else "【表情：$name】"
        }
        .replace(COMMENT_CUSTOM_EMOJI_TOKEN_REGEX) { match ->
'''
          if old not in text:
              raise SystemExit('comment markup baseline not found')
          text = text.replace(old, new, 1)

          old = '''private val COMMENT_ALWAYS_IMAGE_HOST_SUFFIXES = setOf(
    "biliimg.com",
'''
          new = '''private val COMMENT_ALWAYS_IMAGE_HOST_SUFFIXES = setOf(
    "acimg.cn",
    "biliimg.com",
'''
          if old not in text:
              raise SystemExit('image host set baseline not found')
          text = text.replace(old, new, 1)

          old = '''private val COMMENT_IMAGE_FILE_REGEX = Regex(
    "\\\\.(?:jpe?g|jfif|pjpeg|pjp|png|apng|webp|gif|avif|bmp|dib|heic|heif|svg|svgz|wbmp)(?:[?#].*)?$",
    RegexOption.IGNORE_CASE,
)
'''
          new = '''private val COMMENT_IMAGE_FILE_REGEX = Regex(
    "\\\\.(?:jpe?g|jfif|pjpeg|pjp|png|apng|webp|gif|avif|bmp|dib|heic|heif|svg|svgz|wbmp)(?:(?:[/@!~])[^\\\\s<>\\\"'?#]*)*(?:[?#].*)?$",
    RegexOption.IGNORE_CASE,
)
'''
          if old not in text:
              raise SystemExit('image extension regex baseline not found')
          text = text.replace(old, new, 1)

          marker = '''private val COMMENT_CUSTOM_EMOJI_TOKEN_REGEX = Regex(
'''
          insertion = '''private val COMMENT_COLON_EMOJI_TOKEN_REGEX = Regex(
    "\\\\[:([^:\\\\]\\\\r\\\\n]{1,40}):]",
)
private val COMMENT_CUSTOM_EMOJI_TOKEN_REGEX = Regex(
'''
          if marker not in text:
              raise SystemExit('custom emoji regex marker not found')
          text = text.replace(marker, insertion, 1)
          screen.write_text(text, encoding='utf-8')

          tests = Path('app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt')
          t = tests.read_text(encoding='utf-8')
          marker = '''    @Test
    fun `normal links stay as comment text`() {
'''
          cases = '''    @Test
    fun `tencent transformed jpg urls become rich images`() {
        val url = "https://manhua.acimg.cn/manhua/0/15_09_39_13170f3f334f7e005496d9311df42127.jpg/0?tp=sharp"
        val result = parseCommentRichContent("画了一张图\\n$url")
        assertEquals("画了一张图", result.text)
