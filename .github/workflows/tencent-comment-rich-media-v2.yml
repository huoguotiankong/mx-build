        val result = parseCommentRichContent("重刷觉有没有[:b鼓掌:][:b鼓掌:] [:068:]")
        assertEquals("重刷觉有没有【表情：鼓掌】【表情：鼓掌】 【表情：068】", result.text)
        assertEquals(emptyList<String>(), result.imageUrls)
    }

'''
          if marker not in t:
              raise SystemExit('test insertion marker not found')
          if 'tencent transformed jpg urls become rich images' not in t:
              t = t.replace(marker, cases + marker, 1)
          tests.write_text(t, encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          if 'versionCode = 85' not in g or 'versionName = "1.14.5"' not in g:
              raise SystemExit('MX 1.14.5 baseline not found')
          g = g.replace('versionCode = 85', 'versionCode = 86', 1)
          g = g.replace('versionName = "1.14.5"', 'versionName = "1.14.6"', 1)
          gradle.write_text(g, encoding='utf-8')

          docs = Path('docs/COMMENTS.md')
          d = docs.read_text(encoding='utf-8')
          section = '''

## Tencent rich-media compatibility (1.14.6)

- Treat Tencent `manhua.acimg.cn` assets as image CDN content.
- Recognize image URLs whose extension is followed by CDN transform path segments, e.g. `.jpg/0?tp=sharp`.
- Convert unresolved legacy `[:token:]` comment emoji markup to readable fallback text instead of exposing raw protocol syntax.
- Tencent-specific exact emoji semantics remain the responsibility of the Tencent extension; the app fallback is intentionally generic.
'''
          if '## Tencent rich-media compatibility (1.14.6)' not in d:
              d += section
          docs.write_text(d, encoding='utf-8')
          PY
          git diff --check
          grep -F 'versionCode = 86' app/build.gradle.kts
          grep -F 'acimg.cn' app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt
          grep -F 'COMMENT_COLON_EMOJI_TOKEN_REGEX' app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay and format Tencent extension
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/tencentcomics
          mkdir -p upstream/src/zh
          cp -a extension/src/zh/tencentcomics upstream/src/zh/tencentcomics
          cd upstream
          ./gradlew :src:zh:tencentcomics:spotlessApply
          cd ..
          cp -a upstream/src/zh/tencentcomics/. extension/src/zh/tencentcomics/
          git -C extension diff --check

      - name: Build and lint Tencent v25
        working-directory: upstream
        run: |
          ./gradlew \
            :src:zh:tencentcomics:assembleDebug \
            :src:zh:tencentcomics:assembleRelease \
            :src:zh:tencentcomics:lintRelease

      - name: Prepare stable MX signing key
        shell: bash
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ['MX_APP_SIGNING_BUNDLE'])
          required = ('signingKey', 'alias', 'storePassword')
          missing = [k for k in required if not bundle.get(k)]
          if missing:
              raise SystemExit('Signing bundle missing: ' + ', '.join(missing))
          path = Path(os.environ['RUNNER_TEMP']) / 'mx-app.jks'
          path.write_bytes(base64.b64decode(bundle['signingKey']))
          values = {
              'MX_KEYSTORE_PATH': str(path),
              'MX_KEY_ALIAS': str(bundle['alias']),
              'MX_KEYSTORE_PASSWORD': str(bundle['storePassword']),
              'MX_KEY_PASSWORD': str(bundle['storePassword']),
          }
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for name, value in values.items():
                  print(f'::add-mask::{value}')
                  f.write(f'{name}<<__MX_EOF__\n{value}\n__MX_EOF__\n')
          PY

      - name: Verify stable MX signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(keytool -exportcert -alias "$MX_KEY_ALIAS" -keystore "$MX_KEYSTORE_PATH" -storepass "$MX_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::MX signing certificate mismatch"; exit 1; }

      - name: Format and test MX app
        working-directory: appsrc
        run: |
          ./gradlew spotlessApply
          ./gradlew spotlessCheck
          ./gradlew testReleaseUnitTest

      - name: Build signed MX 1.14.6 Preview
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assemblePreview \
            -Pdisable-code-shrink \
            --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"

      - name: Commit verified Tencent extension branch
        working-directory: extension
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zh/tencentcomics docs/sources/tencentcomics.md
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::No Tencent extension changes"; exit 1; }
          git commit -m "fix(tencent): expand comment images and emoji compatibility"
          git push origin HEAD:fix/tencent-comment-rich-media-v25

      - name: Commit verified MX app branch
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/eu/kanade/presentation/manga/comments/CommentScreen.kt app/src/test/java/eu/kanade/presentation/manga/comments/CommentRichContentTest.kt docs/COMMENTS.md
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::No MX app changes"; exit 1; }
          git commit -m "fix: recognize Tencent comment media and legacy emoji"
          git push origin HEAD:fix/tencent-comment-rich-media-v2

      - name: Normalize MX Preview APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          found=0
          while IFS= read -r apk; do
            found=1
            signed="${apk%.apk}.mx-signed.apk"
            "$apksigner" sign --ks "$MX_KEYSTORE_PATH" --ks-key-alias "$MX_KEY_ALIAS" --ks-pass env:MX_KEYSTORE_PASSWORD --key-pass env:MX_KEY_PASSWORD --out "$signed" "$apk"
            mv "$signed" "$apk"
          done < <(find appsrc/app/build/outputs/apk/preview -type f -name '*.apk' | sort)
          [[ "$found" -eq 1 ]] || { echo "::error::No Preview APK found"; exit 1; }

      - name: Verify MX 1.14.6 APK identity
        shell: bash
        run: |
          set -euo pipefail
          expected_cert="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          apk="$(find appsrc/app/build/outputs/apk/preview -type f -name '*arm64-v8a*.apk' | sort | head -n 1)"
          [[ -n "$apk" ]] || { echo "::error::ARM64 Preview APK not found"; exit 1; }
          badging="$("$aapt_bin" dump badging "$apk")"
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          [[ "$package_name" == "com.huoguotiankong.mx.beta" ]] || { echo "::error::Unexpected package: $package_name"; exit 1; }
          [[ "$version_code" == "86" ]] || { echo "::error::Unexpected versionCode: $version_code"; exit 1; }
          [[ "$version_name" == 1.14.6-* ]] || { echo "::error::Unexpected versionName: $version_name"; exit 1; }
          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$normalized" == *"$expected_cert"* ]] || { echo "::error::APK signing certificate mismatch"; exit 1; }

      - name: Upload MX Tencent rich-media ARM64 Preview
        uses: actions/upload-artifact@v4
        with:
          name: MX-Manga-v1.14.6-tencent-rich-media-arm64-v8a-preview
          path: appsrc/app/build/outputs/apk/preview/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
