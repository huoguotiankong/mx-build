name: Trace Qingman Login IP Field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-loginip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter
      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1
      - name: Trace login field literals and xrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version')) != '4.4.5' or int(a.get('versionCode',0)) != 445:
              raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION=4.4.5',file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          pp={}
          lines=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          for line in lines:
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          wanted={'loginip','loginIp','loginIP','clientIp','userName','password','deviceId'}
          for name in sorted(wanted):
              vals=[hex(o) for o,v in pp.items() if v==f'String: "{name}"']
              print(f'{name}='+','.join(vals))
          loginip={o for o,v in pp.items() if v.lower()=='string: "loginip"'}
          print('LOGINIP_CASE_INSENSITIVE_COUNT='+str(len(loginip)))
          for off in sorted(loginip):
              print(f'=== LOGINIP PP NEIGHBORHOOD 0x{off:x} ===')
              for o in sorted(pp):
                  if off-0x50 <= o <= off+0x50:
                      v=pp[o]
                      if 'String:' in v or 'Type' in v or 'Field <' in v:
                          print(f'PP+0x{o:x} {v[:240]}')

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base)); idx={x.address:i for i,x in enumerate(ins)}

          def is_prologue(x):
              return x.mnemonic=='stp' and x.op_str.replace(' ','').startswith('x29,x30,[x15,#-0x10]!')
          def bounds(addr):
              k=idx[addr]; s=k
              while s>0 and not is_prologue(ins[s]): s-=1
              e=k+1
              while e<len(ins) and not is_prologue(ins[e]): e+=1
              return ins[s].address, ins[e].address if e<len(ins) else ins[-1].address+4

          refs=[]; pending={}
          for x in ins:
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=x.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if x.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),30); continue
              if x.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in loginip: refs.append((x.address,off))
          print('LOGINIP_XREF_COUNT='+str(len(refs)))
          safe={'loginip','userName','password','deviceId','token','isGuest','code','data','msg'}
          seen=set()
          for addr,off in refs:
              st,en=bounds(addr)
              if st in seen: continue
              seen.add(st)
              print(f'=== LOGINIP OWNER xref=0x{addr:x} owner=0x{st:x}-0x{en:x} ===')
              pending={}
              for x in md.disasm(data[st-base:en-base],st):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  ann=''; op=x.op_str.lower()
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if x.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),30)
                  elif x.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          poff=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          v=pp.get(poff,'')
                          sm=re.fullmatch(r'String: "([^"]*)"',v)
                          if sm and sm.group(1) in safe: ann=f' ; PP+0x{poff:x}={v}'
                          elif 'TypeArguments:' in v or 'Field <' in v: ann=f' ; PP+0x{poff:x}={v[:220]}'
                  if ann or x.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}{ann}')
          PY
