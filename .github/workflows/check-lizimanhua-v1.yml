name: Check Lizi Manhua v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-lizimanhua-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: source/lizimanhua-v1
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false
      - name: Overlay module
        shell: bash
        run: |
          rm -rf upstream/src/zh/lizimanhua
          cp -a dev/src/zh/lizimanhua upstream/src/zh/lizimanhua
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply formatting then compile
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:lizimanhua:spotlessApply
          ./gradlew :src:zh:lizimanhua:assembleDebug
