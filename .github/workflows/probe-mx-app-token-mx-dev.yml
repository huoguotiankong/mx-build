name: Probe app publish token against mx-dev

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mx-app-token-mx-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check token presence
        shell: bash
        env:
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || { echo "::error::MX_APP_PUBLISH_TOKEN missing"; exit 1; }

      - name: Checkout mx-dev with app publish token
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: true

      - name: Dry-run write permission
        working-directory: dev
        shell: bash
        run: |
          set -euo pipefail
          git push --dry-run origin HEAD:refs/heads/mx-app-token-mx-dev-probe
          echo "MX_APP_PUBLISH_TOKEN_CAN_WRITE_MX_DEV=true"

