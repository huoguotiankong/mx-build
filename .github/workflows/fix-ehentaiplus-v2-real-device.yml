name: Fix E-Hentai Plus v2 After Real-Device Feedback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-ehentaiplus-v2-real-device.yml"
      - ".github/scripts/fix_ehentaiplus_v2.py"
      - ".github/scripts/smoke_ehentai_reader.py"
      - ".github/ehentaiplus-v2-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-ehentaiplus-v2-real-device
  cancel-in-progress: false

jobs:
  fix-build-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout build infrastructure
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Check required secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }
          [[ -n "$MANGA_SIGNING_BUNDLE" ]] || { echo "::error::Missing MANGA_SIGNING_BUNDLE"; exit 1; }

      - name: Checkout E-Hentai Plus feature branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: feat/ehentai-plus
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply v2 real-device fixes
        shell: bash
        run: python3 .github/scripts/fix_ehentaiplus_v2.py

      - name: Replace launcher with official E-Hentai favicon
        shell: bash
        run: |
          set -euo pipefail
          res="source/src/zh/ehentaiplus/res"
          rm -rf "$res/mipmap-anydpi" "$res/mipmap-mdpi" "$res/mipmap-hdpi" "$res/mipmap-xhdpi" "$res/mipmap-xxhdpi" "$res/mipmap-xxxhdpi"
          mkdir -p "$res/mipmap-xxxhdpi"
          curl -L --fail --retry 3 -o "$res/mipmap-xxxhdpi/ic_launcher.png" "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f4/E-Hentai_Favicon.svg/330px-E-Hentai_Favicon.svg.png"
          file "$res/mipmap-xxxhdpi/ic_launcher.png" | grep -q "PNG image data"
          test "$(wc -c < "$res/mipmap-xxxhdpi/ic_launcher.png")" -gt 1000

      - name: Validate patched source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_sources.py
          grep -q "versionCode = 2" src/zh/ehentaiplus/build.gradle.kts
          grep -q "override suspend fun getImageUrl(page: Page)" src/zh/ehentaiplus/src/eu/kanade/tachiyomi/extension/zh/ehentaiplus/EHentaiPlus.kt
          ! grep -q "IMAGE_LOOPBACK_HOST" src/zh/ehentaiplus/src/eu/kanade/tachiyomi/extension/zh/ehentaiplus/EHentaiPlus.kt
          grep -q "requiresLoginToPost = false" src/zh/ehentaiplus/src/eu/kanade/tachiyomi/extension/zh/ehentaiplus/EHentaiPlus.kt
          test -s src/zh/ehentaiplus/res/mipmap-xxxhdpi/ic_launcher.png
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay, format and build Debug
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/ehentaiplus
          cp -a source/src/zh/ehentaiplus upstream/src/zh/ehentaiplus
          cd upstream
          ./gradlew :src:zh:ehentaiplus:spotlessApply
          ./gradlew :src:zh:ehentaiplus:spotlessCheck
          ./gradlew :src:zh:ehentaiplus:assembleDebug

      - name: Copy Spotless result back
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude build/ upstream/src/zh/ehentaiplus/ source/src/zh/ehentaiplus/
          python3 source/scripts/validate_sources.py
          git -C source diff --check

      - name: Public E-Hentai viewer to image smoke test
        shell: bash
        run: python3 .github/scripts/smoke_ehentai_reader.py

      - name: Commit v2 source to feature branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zh/ehentaiplus docs/sources/ehentaiplus.md
          if git diff --cached --quiet; then
            echo "No E-Hentai Plus source changes to commit"
          else
            git commit -m "fix(ehentaiplus): repair reader login UX comments and icon v2"
            git push origin HEAD:feat/ehentai-plus
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare stable extension signing key
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 -c 'import base64,json,os,pathlib; b=json.loads(os.environ["MANGA_SIGNING_BUNDLE"]); req=("signingKey","alias","storePassword","keyPassword"); missing=[k for k in req if not b.get(k)]; missing and (_ for _ in ()).throw(SystemExit("missing signing fields: "+",".join(missing))); pathlib.Path("upstream/signingkey.jks").write_bytes(base64.b64decode(b["signingKey"])); p=pathlib.Path(os.environ["GITHUB_ENV"]); f=p.open("a",encoding="utf-8"); [(print("::add-mask::"+str(b[k])),f.write(n+"<<__EOF__\n"+str(b[k])+"\n__EOF__\n")) for n,k in (("ALIAS","alias"),("KEY_STORE_PASSWORD","storePassword"),("KEY_PASSWORD","keyPassword"))]; f.close()'

      - name: Build signed Release and lint
        working-directory: upstream
        shell: bash
        run: ./gradlew :src:zh:ehentaiplus:assembleRelease :src:zh:ehentaiplus:lintRelease

      - name: Verify stable signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected="1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620"
          configured="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}')"
          configured="$(printf '%s' "$configured" | tr '[:upper:]' '[:lower:]')"
          [[ "$configured" == "$expected" ]] || { echo "::error::Configured signing key mismatch"; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          apk="$(find upstream/src/zh/ehentaiplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n 1)"
          [[ -n "$apk" ]] || { echo "::error::No release APK"; exit 1; }
          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          normalized="$(printf '%s' "$cert_output" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$normalized" == *"$expected"* ]] || { printf '%s\n' "$cert_output"; echo "::error::APK certificate mismatch"; exit 1; }

      - name: Preserve signed v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ehentaiplus-v2-signed-test-apk
          path: upstream/src/zh/ehentaiplus/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Checkout extension staging branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          token: ${{ github.token }}
          ref: extension-staging
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Generate isolated MX test store
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/ehentaiplus' > /tmp/ehp-targets.txt
          python3 source/scripts/publish_test_repo.py --targets /tmp/ehp-targets.txt --upstream-root upstream --source-root source --repo-dir staging/test --owner huoguotiankong --repository mx-repo --signing-key "1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620"
          grep -Eq '1\.6\.2|106002|versionCode[^0-9]*2' staging/test/index.json staging/test/repo.json
          test -f staging/test/apk/tachiyomi-zh.ehentaiplus-v1.6.2.apk

      - name: Commit staged v2 test store
        working-directory: staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          if git diff --cached --quiet; then
            echo "No staged test-store changes"
          else
            git commit -m "Stage E-Hentai Plus v2 test store"
            git push origin HEAD:extension-staging
          fi

      - name: Verify staged test store
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/huoguotiankong/mx-build/extension-staging/test"
          for file in repo.json index.json; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              status="$(curl -L -sS -o "/tmp/$file" -w '%{http_code}' "$base/$file" || true)"
              if [[ "$status" == "200" ]]; then ok=1; break; fi
              sleep $((attempt * 2))
            done
            [[ "$ok" -eq 1 ]] || { echo "::error::Staged endpoint unavailable: $file"; exit 1; }
          done
          grep -Eq '1\.6\.2|106002|versionCode[^0-9]*2' /tmp/index.json /tmp/repo.json
          grep -q "ehentaiplus" /tmp/index.json

      - name: Record result
        shell: bash
        run: |
          echo "### E-Hentai Plus v2 candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Current Keiyoushi Spotless + Debug + Release + lint passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable MX extension signature verified." >> "$GITHUB_STEP_SUMMARY"
          echo "- Public E-Hentai viewer to actual image request passed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed v1.6.2 staged to extension-staging." >> "$GITHUB_STEP_SUMMARY"
          echo "- Account/ExHentai/comment write operations still require Android real-device validation." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f upstream/signingkey.jks
