name: Probe Miaowu AOT v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-miaowu-aot-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install Capstone
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.9
      - name: Disassemble targeted Miaowu AOT regions
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          regions={}
          regions['piclist'] = (3542656, base64.b64decode(''))
          regions['parser'] = (3536896, base64.b64decode(''))
          regions['read_entry'] = (5657088, base64.b64decode(''))

          md=Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          md.detail=True
          targets={0x360ec8:'piclist_transform',0x35fce0:'comic_read_parser',0x56568c:'comic_read_entry'}
          for name,(base,data) in regions.items():
              print(f'\n===== REGION {name} base={base:#x} size={len(data)} =====')
              for ins in md.disasm(data, base):
                  mark=' <<<' if ins.address in targets else ''
                  print(f'{ins.address:#010x}: {ins.mnemonic:<8} {ins.op_str}{mark}')
          PYCODE
