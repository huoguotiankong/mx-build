name: Check Manwa Plus v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-manwaplus-v1.yml"
      - ".github/manwaplus-v1-check-trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-manwaplus-v1
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay Manwa Plus
        shell: bash
        run: |
          set -euo pipefail
          test -f source/src/zh/manwaplus/build.gradle.kts
          rm -rf upstream/src/zh/manwaplus
          cp -a source/src/zh/manwaplus upstream/src/zh/manwaplus
          echo "SOURCE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: upstream

      - name: Compile Manwa Plus
        working-directory: upstream
        run: ./gradlew :src:zh:manwaplus:assembleDebug --stacktrace

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Manwa Plus v1"
            echo "- mx-dev commit: \`${SOURCE_SHA:-unknown}\`"
            echo "- Target: \`:src:zh:manwaplus:assembleDebug\`"
            echo "- This public workflow does not upload private source files or APK artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
