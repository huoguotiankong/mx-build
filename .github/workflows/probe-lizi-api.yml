name: Probe Lizi Manga API

on:
  push:
    paths:
      - '.github/workflows/probe-lizi-api.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe HTTPS and image routes
        shell: bash
        run: |
          set -u
          for base in https://ai.xajtl.com https://crm.weichu.asia http://ai.xajtl.com http://crm.weichu.asia; do
            echo "=== $base ==="
            curl -kLsS -o /dev/null -w 'health HTTP:%{http_code} final:%{url_effective}\n' --connect-timeout 8 --max-time 15 "$base/app/api/health" || true
          done
          path='/3/22613/656200/1.jpg'
          for base in https://img.kunmu.asia https://i.lzimg.xyz https://cf-1.imgio.club https://p.imgo.buzz; do
            echo "=== IMG $base$path ==="
            curl -kILsS --connect-timeout 8 --max-time 15 -A 'Dart/3.5 (dart:io)' "$base$path" | head -n 20 || true
          done
