name: Probe Lizi Manga API

on:
  push:
    paths:
      - '.github/workflows/probe-lizi-api.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test chapter client signature formats
        shell: bash
        run: |
          set -euo pipefail
          base='http://ai.xajtl.com'
          ua='Dart/3.5 (dart:io)'
          cid='223246'
          lower='cdd266df8b2399c24da38e408b6d9825c7bd2af073229847f551ea653ea096e1'
          upper='CDD266DF8B2399C24DA38E408B6D9825C7BD2AF073229847F551EA653EA096E1'
          for sig in "$lower" "$upper"; do
            echo "=== sig=$sig ==="
            curl -sS -A "$ua" -w '\nHTTP:%{http_code}\n' "$base/app/api/chapter/v2/$cid?packname=com.hbsclj.uth&appsign256=$sig" | head -c 8000
            echo
          done
