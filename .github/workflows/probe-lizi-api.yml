name: Probe Lizi Manga API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-lizi-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe current public endpoints
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DNS ==='
          for host in bkbfblh.xn--vhqr42drhf5k7b.com adnet.lizimh.com adnet.lizi.lat admod.lizi.lat lizimh.com; do
            echo "--- $host ---"
            getent ahosts "$host" || true
          done
          python3 - <<'PY'
          import ssl,urllib.request, urllib.parse
          bases=[
            'http://bkbfblh.xn--vhqr42drhf5k7b.com',
            'https://bkbfblh.xn--vhqr42drhf5k7b.com',
            'https://adnet.lizimh.com',
            'https://adnet.lizi.lat',
            'https://admod.lizi.lat',
          ]
          paths=[
            'app/api/health',
            'app/api/config',
            'app/api/home/data',
            'app/api/category/list',
            'app/api/rank/list',
            'app/api/search/suggest?q='+urllib.parse.quote('海贼王'),
            'app/api/search/full?q='+urllib.parse.quote('海贼王'),
          ]
          headers={'User-Agent':'Dart/3.0 (dart:io)','Accept':'application/json'}
          for base in bases:
              print('=== BASE',base,'===')
              for path in paths:
                  u=base+'/'+path
                  try:
                      q=urllib.request.Request(u,headers=headers)
                      ctx=ssl._create_unverified_context() if u.startswith('https://') else None
                      with urllib.request.urlopen(q,timeout=12,context=ctx) as r:
                          body=r.read(120000).decode('utf-8','replace')
                          print('PROBE',u,'STATUS',r.status,'TYPE',r.headers.get('content-type'),'FINAL',r.geturl(),'BODY',body[:12000])
                  except Exception as e:
                      print('PROBE',u,'ERROR',type(e).__name__,e)
          PY
