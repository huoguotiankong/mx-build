name: Probe Lizi Manga API

on:
  push:
    paths:
      - '.github/workflows/probe-lizi-api.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe discovered API bases
        shell: bash
        run: |
          set -u
          bases=(http://ai.xajtl.com http://crm.weichu.asia)
          paths=(app/api/health app/api/config app/api/home/data app/api/category/list app/api/rank/list 'app/api/search/full?q=斗罗')
          for base in "${bases[@]}"; do
            echo "######## $base ########"
            for path in "${paths[@]}"; do
              echo "=== /$path ==="
              curl -iLsS --connect-timeout 8 --max-time 15 -A 'Dart/3.5 (dart:io)' "$base/$path" | head -c 2500 || true
              echo; echo
            done
          done
