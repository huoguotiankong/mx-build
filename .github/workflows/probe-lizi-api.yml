name: Probe Lizi Manga API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-lizi-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe current public endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse
          base='http://bkbfblh.xn--vhqr42drhf5k7b.com'
          paths=[
            'app/api/health',
            'app/api/config',
            'app/api/home/data',
            'app/api/category/list',
            'app/api/rank/list',
            'app/api/search/suggest?q='+urllib.parse.quote('海贼王'),
            'app/api/search/full?q='+urllib.parse.quote('海贼王'),
          ]
          headers={'User-Agent':'Dart/3.0 (dart:io)','Accept':'application/json'}
          for path in paths:
              u=base+'/'+path
              try:
                  q=urllib.request.Request(u,headers=headers)
                  with urllib.request.urlopen(q,timeout=20) as r:
                      body=r.read(100000).decode('utf-8','replace')
                      print('PROBE',u,'STATUS',r.status,'TYPE',r.headers.get('content-type'),'BODY',body[:12000])
              except Exception as e:
                  print('PROBE',u,'ERROR',type(e).__name__,e)
          PY
