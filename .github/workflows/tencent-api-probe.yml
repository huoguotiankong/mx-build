name: Tencent Chapter Topic Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe signed anonymous APP request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, time, urllib.request, urllib.error, re
          from pathlib import Path

          version="12.19.9"
          channel="dm306015002"
          comic="644371"
          chapter="1296"
          secret="4jo2YHMm0d2VGt59tVYndX9P7eFcw8TvRv5lMqFP1TT"
          rows=[]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(host, ua, follow):
              path=f"/{version}/Community/getChapterTopicList/comic_id/{comic}/chapter_id/{chapter}/page/1/type/1"
              localtime=str(int(time.time()*1000))
              sc=hashlib.md5((path+host+"0"+localtime+secret).encode()).hexdigest()
              headers={
                  "Accept":"application/json, text/plain, */*",
                  "User-Agent":ua,
                  "fakeduin":"0",
                  "localtime":localtime,
                  "version":version,
                  "channel":channel,
                  "userstate":"1",
                  "oversea":"1",
                  "sc":sc,
              }
              opener=urllib.request.build_opener() if follow else urllib.request.build_opener(NoRedirect)
              status=0; ctype="unknown"; loc=""; raw=b""
              try:
                  resp=opener.open(urllib.request.Request("https://"+host+path,headers=headers),timeout=30)
                  status=resp.status; ctype=resp.headers.get("Content-Type","unknown"); loc=resp.headers.get("Location",""); raw=resp.read()
              except urllib.error.HTTPError as e:
                  status=e.code; ctype=e.headers.get("Content-Type","unknown"); loc=e.headers.get("Location",""); raw=e.read()
              text=raw[:4096].decode("utf-8","ignore")
              title=""
              m=re.search(r"<title[^>]*>(.*?)</title>",text,re.I|re.S)
              if m: title=re.sub(r"\s+"," ",m.group(1)).strip()[:120]
              stripped=raw.strip()
              b64chars=all(c in b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t " for c in stripped)
              rows.extend([
                  f"host={host} ua={ua} follow={follow}",
                  f"status={status}",
                  f"content_type={ctype}",
                  f"location={loc[:200]}",
                  f"bytes={len(raw)}",
                  f"html_title={title}",
                  f"looks_base64={b64chars}",
                  "",
              ])

          for host in ("a.ac.qq.com","android.ac.qq.com"):
              for ua in ("okhttp/4.10.0","okhttp/4.12.0"):
                  request(host,ua,False)
                  request(host,ua,True)

          out="\n".join(rows)
          print(out)
          Path("probe-results").mkdir(exist_ok=True)
          Path("probe-results/tencent-topic-probe.txt").write_text(out+"\n",encoding="utf-8")
          PY

      - name: Commit sanitized probe summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-results/tencent-topic-probe.txt
          if git diff --cached --quiet; then
            echo "Probe summary unchanged"
            exit 0
          fi
          git commit -m "probe: refresh Tencent signed chapter topic result"
          git push
