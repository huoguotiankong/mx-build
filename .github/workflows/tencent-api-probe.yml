name: Tencent API Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe signed app API
        shell: bash
        run: |
          set -u
          comic=644371
          chapter=1296
          version=12.19.9
          channel=dm306015002
          secret='4jo2YHMm0d2VGt59tVYndX9P7eFcw8TvRv5lMqFP1TT'
          endpoint="Community/getChapterTopicList/comic_id/$comic/chapter_id/$chapter/page/1/type/1"
          for host in a.ac.qq.com android.ac.qq.com; do
            path="/$version/$endpoint"
            url="https://$host$path"
            for scmode in slash noslash nofake fakeonly; do
              localtime=$(date +%s%3N)
              case "$scmode" in
                slash) sigbase="$path$host""0""$localtime$secret";;
                noslash) sigbase="${path#/}$host""0""$localtime$secret";;
                nofake) sigbase="$path$host$localtime$secret";;
                fakeonly) sigbase="$path$host""0""$secret";;
              esac
              sc=$(printf '%s' "$sigbase" | md5sum | awk '{print $1}')
              echo "=== host=$host scmode=$scmode ==="
              tmp=$(mktemp)
              code=$(curl -sS -L --connect-timeout 10 --max-time 20                 -H "Accept: application/json, text/plain, */*"                 -H "User-Agent: okhttp/4.12.0"                 -H "fakeduin: 0"                 -H "localtime: $localtime"                 -H "version: $version"                 -H "channel: $channel"                 -H "userstate: 1"                 -H "oversea: 1"                 -H "sc: $sc"                 -o "$tmp" -w '%{http_code}' "$url" || true)
              echo "HTTP $code bytes=$(wc -c < "$tmp")"
              head -c 3000 "$tmp" | tr '\n' ' '
              echo
              rm -f "$tmp"
            done
          done
