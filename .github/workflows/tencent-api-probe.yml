name: Tencent Chapter Topic Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe signed chapter topic replies
        shell: bash
        run: |
          set -euo pipefail
          host='a.ac.qq.com'
          version='12.19.9'
          channel='dm306015002'
          comic='644371'
          topic='49933575'
          target_type='3'
          page='1'
          listcnt='20'
          suffix='4jo2YHMm0d2VGt59tVYndX9P7eFcw8TvRv5lMqFP1TT'
          key='42e0d587d5bda41326c2000d'
          path="/$version/Comment/getTopicCommentList/topic_id/$topic/target_type/$target_type/page/$page/listcnt/$listcnt/comic_id/$comic"
          localtime=$(date +%s%3N)
          sc=$(printf '%s' "$path$host""0""$localtime$suffix" | md5sum | awk '{print $1}')
          curl -sS -L --fail --connect-timeout 10 --max-time 30             -H 'Accept: application/json, text/plain, */*'             -H 'User-Agent: okhttp/4.10.0'             -H 'fakeduin: 0'             -H "localtime: $localtime"             -H "version: $version"             -H "channel: $channel"             -H 'userstate: 1'             -H 'oversea: 1'             -H "sc: $sc"             "https://$host$path" -o reply.enc

          tr -d '\r\n\t ' < reply.enc | base64 -d > reply.bin
          keyhex=$(printf '%s' "$key" | xxd -p -c 256)
          openssl enc -des-ede3 -d -K "$keyhex" -nosalt -in reply.bin -out reply.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('reply.json').read_text('utf-8'))
          data=obj.get('data') or {}
          rows=[
              f"error_code={obj.get('error_code', obj.get('errorCode'))}",
              "root_keys="+','.join(sorted(obj.keys())),
              "data_keys="+','.join(sorted(data.keys())) if isinstance(data,dict) else "data_type="+type(data).__name__,
          ]
          if isinstance(data,dict):
              items=data.get('list') or data.get('comment_list') or data.get('commentList') or []
              rows.append('list_count='+str(len(items) if isinstance(items,list) else -1))
              for k in ('total','total_count','totalCount','end_of_list','endOfList','top_topic_info','topTopicInfo'):
                  if k in data: rows.append(f"{k}={data.get(k)}")
              if isinstance(items,list) and items:
                  first=items[0]
                  if isinstance(first,dict):
                      rows.append('item_keys='+','.join(sorted(first.keys())))
                      for k in ('comment_id','commentId','host_qq','hostQq','nick_name','nickName','qq_head','qqHead','date','good_count','goodCount','reply_count','replyCount'):
                          if k in first: rows.append(f"{k}={first.get(k)}")
                      reply_list=first.get('reply_list', first.get('replyList'))
                      if isinstance(reply_list,list):
                          rows.append('embedded_reply_count='+str(len(reply_list)))
                          if reply_list and isinstance(reply_list[0],dict):
                              rows.append('embedded_reply_keys='+','.join(sorted(reply_list[0].keys())))
          out='\n'.join(rows)+'\n'
          print(out)
          Path('probe-results').mkdir(exist_ok=True)
          Path('probe-results/tencent-topic-replies-probe.txt').write_text(out,encoding='utf-8')
          PY

      - name: Commit sanitized probe summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-results/tencent-topic-replies-probe.txt
          if git diff --cached --quiet; then
            echo "Probe summary unchanged"
            exit 0
          fi
          git commit -m "probe: record Tencent topic reply shape"
          git push
