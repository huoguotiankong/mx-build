name: Tencent Chapter Topic Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare anonymous APP header variants
        shell: bash
        run: |
          set -euo pipefail
          version='12.19.9'
          channel='dm306015002'
          comic='644371'
          chapter='2'
          path="/$version/Community/getChapterTopicList/comic_id/$comic/chapter_id/$chapter/page/1/type/1"
          : > tencent-topic-probe.txt

          probe() {
            local label="$1"
            local host="$2"
            local add_login_headers="$3"
            localtime=$(date +%s%3N)
            url="https://$host$path"
            headers=(-H 'Accept: application/json, text/plain, */*'
                     -H 'User-Agent: okhttp/4.10.0'
                     -H "version: $version"
                     -H "channel: $channel"
                     -H "localtime: $localtime"
                     -H 'userstate: 1'
                     -H 'oversea: 1')
            if [[ "$add_login_headers" == "yes" ]]; then
              headers+=(-H 'logintype: 0' -H 'fakeduin: 0')
            fi

            rm -f body.bin headers.txt
            status=$(curl -sS -L --connect-timeout 10 --max-time 30               -D headers.txt -o body.bin -w '%{http_code}'               "${headers[@]}" "$url" || true)
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(//,""); v=$0} END{print v}' headers.txt)
            bytes=$(wc -c < body.bin 2>/dev/null || echo 0)

            {
              echo "=== $label ==="
              echo "host=$host"
              echo "http_status=$status"
              echo "content_type=${ctype:-unknown}"
              echo "body_bytes=$bytes"
              python3 - "$label" <<'PY'
import base64, json, pathlib, sys
raw = pathlib.Path("body.bin").read_bytes() if pathlib.Path("body.bin").exists() else b""
try:
    text = raw.decode("utf-8").strip()
except UnicodeDecodeError:
    text = ""
try:
    obj = json.loads(text)
except Exception:
    obj = None
if isinstance(obj, dict):
    print("body_kind=json")
    print("errorCode=" + str(obj.get("errorCode", obj.get("error_code"))))
    msg = obj.get("msg", obj.get("message", obj.get("errorMsg")))
    if msg is not None:
        safe = str(msg).replace("\n", " ")[:160]
        print("msg=" + safe)
    data = obj.get("data")
    print("data_type=" + type(data).__name__)
    if isinstance(data, dict):
        print("data_keys=" + ",".join(sorted(data.keys())))
        topics = data.get("topicList")
        print("topicList_type=" + type(topics).__name__)
        if isinstance(topics, list):
            print("topic_count=" + str(len(topics)))
        print("totalCount=" + str(data.get("totalCount")))
        print("endOfList=" + str(data.get("endOfList")))
else:
    print("body_kind=non_json")
    compact = b"".join(raw.split())
    try:
        decoded = base64.b64decode(compact, validate=True)
        print("base64_valid=yes")
        print("base64_decoded_bytes=" + str(len(decoded)))
    except Exception:
        print("base64_valid=no")
PY
              echo
            } >> tencent-topic-probe.txt
          }

          for host in a.ac.qq.com android.ac.qq.com; do
            probe "v15-current" "$host" no
            probe "official-anonymous-login-headers" "$host" yes
          done

          cat tencent-topic-probe.txt

      - name: Commit sanitized probe summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-results
          cp tencent-topic-probe.txt probe-results/tencent-topic-probe.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-results/tencent-topic-probe.txt
          if git diff --cached --quiet; then
            echo "Probe summary unchanged"
            exit 0
          fi
          git commit -m "probe: record Tencent chapter topic result"
          git push
