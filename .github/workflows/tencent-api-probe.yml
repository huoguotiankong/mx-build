name: Tencent API Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PC comment markup
        shell: bash
        run: |
          set -euo pipefail
          url="https://ac.qq.com/Community/topicList?targetId=644371&page=1&_=$(date +%s%3N)"
          curl -sS -L --connect-timeout 10 --max-time 30             -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36'             -H 'Referer: https://ac.qq.com/Comic/comicInfo/id/644371'             -H 'X-Requested-With: XMLHttpRequest'             "$url" -o topic.html
          echo "bytes=$(wc -c < topic.html)"
          python3 - <<'PY'
          import re
          html=open("topic.html","r",encoding="utf-8",errors="replace").read()
          print("comment-content-detail count",html.count("comment-content-detail"))
          print("comment-content-a count",html.count("comment-content-a"))
          print("comment-userhead-wr count",html.count("comment-userhead-wr"))
          for term in ["comment-content-detail","comment-content-a","comment-userhead-wr","commen-ft-ts"]:
              print("\n#####",term,"#####")
              start=0
              for n in range(3):
                  i=html.find(term,start)
                  if i<0: break
                  print(html[max(0,i-1800):min(len(html),i+3800)])
                  print("\n---")
                  start=i+len(term)
          PY
