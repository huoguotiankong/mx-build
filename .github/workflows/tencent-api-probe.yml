name: Tencent API Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe versioned path API
        shell: bash
        run: |
          set -u
          comic=644371
          chapter=1296
          version=12.19.9
          ua_app='okhttp/4.12.0'
          paths=(
            "Community/getChapterTopicList/comic_id/$comic/chapter_id/$chapter/page/1/type/1"
            "Community/getChapterTopicList/comic_id/$comic/page/1/type/1/chapter_id/$chapter"
            "Community/getChapterTopicList/page/1/type/1/comic_id/$comic/chapter_id/$chapter"
          )
          for host in https://a.ac.qq.com https://android.ac.qq.com; do
            for p in "${paths[@]}"; do
              for prefix in "$version" "v1" ""; do
                if [[ -n "$prefix" ]]; then url="$host/$prefix/$p"; else url="$host/$p"; fi
                echo "=== $url ==="
                tmp=$(mktemp)
                code=$(curl -sS -L --connect-timeout 10 --max-time 20                   -H "Accept: application/json, text/plain, */*"                   -H "User-Agent: $ua_app"                   -H "version: $version"                   -H "channel: dm306015002"                   -o "$tmp" -w '%{http_code}' "$url" || true)
                echo "HTTP $code bytes=$(wc -c < "$tmp")"
                head -c 2000 "$tmp" | tr '\n' ' '
                echo
                rm -f "$tmp"
              done
            done
          done
