name: Tencent Chapter Topic Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare anonymous APP header variants
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = "12.19.9"
          channel = "dm306015002"
          comic = "644371"
          chapter = "2"
          path = f"/{version}/Community/getChapterTopicList/comic_id/{comic}/chapter_id/{chapter}/page/1/type/1"
          rows = []

          def probe(label, host, add_login_headers):
              url = f"https://{host}{path}"
              headers = {
                  "Accept": "application/json, text/plain, */*",
                  "User-Agent": "okhttp/4.10.0",
                  "version": version,
                  "channel": channel,
                  "localtime": str(int(time.time() * 1000)),
                  "userstate": "1",
                  "oversea": "1",
              }
              if add_login_headers:
                  headers["logintype"] = "0"
                  headers["fakeduin"] = "0"

              status = 0
              ctype = "unknown"
              raw = b""
              try:
                  req = urllib.request.Request(url, headers=headers, method="GET")
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status = resp.status
                      ctype = resp.headers.get("Content-Type", "unknown")
                      raw = resp.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  ctype = exc.headers.get("Content-Type", "unknown")
                  raw = exc.read()
              except Exception as exc:
                  rows.append([
                      f"=== {label} ===",
                      f"host={host}",
                      "transport_error=" + type(exc).__name__,
                      "",
                  ])
                  return

              out = [
                  f"=== {label} ===",
                  f"host={host}",
                  f"http_status={status}",
                  f"content_type={ctype}",
                  f"body_bytes={len(raw)}",
              ]
              try:
                  obj = json.loads(raw.decode("utf-8"))
              except Exception:
                  obj = None
              if isinstance(obj, dict):
                  out.append("body_kind=json")
                  out.append("errorCode=" + str(obj.get("errorCode", obj.get("error_code"))))
                  msg = obj.get("msg", obj.get("message", obj.get("errorMsg")))
                  if msg is not None:
                      out.append("msg=" + str(msg).replace("\n", " ")[:160])
                  data = obj.get("data")
                  out.append("data_type=" + type(data).__name__)
                  if isinstance(data, dict):
                      out.append("data_keys=" + ",".join(sorted(data.keys())))
                      topics = data.get("topicList")
                      out.append("topicList_type=" + type(topics).__name__)
                      if isinstance(topics, list):
                          out.append("topic_count=" + str(len(topics)))
                      out.append("totalCount=" + str(data.get("totalCount")))
                      out.append("endOfList=" + str(data.get("endOfList")))
              else:
                  out.append("body_kind=non_json")
                  compact = b"".join(raw.split())
                  try:
                      decoded = base64.b64decode(compact, validate=True)
                      out.append("base64_valid=yes")
                      out.append("base64_decoded_bytes=" + str(len(decoded)))
                  except Exception:
                      out.append("base64_valid=no")
              out.append("")
              rows.append(out)

          for host in ("a.ac.qq.com", "android.ac.qq.com"):
              probe("v15-current", host, False)
              probe("official-anonymous-login-headers", host, True)

          summary = "\n".join(line for row in rows for line in row)
          print(summary)
          Path("tencent-topic-probe.txt").write_text(summary + "\n", encoding="utf-8")
          PY

      - name: Commit sanitized probe summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-results
          cp tencent-topic-probe.txt probe-results/tencent-topic-probe.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probe-results/tencent-topic-probe.txt
          if git diff --cached --quiet; then
            echo "Probe summary unchanged"
            exit 0
          fi
          git commit -m "probe: record Tencent chapter topic result"
          git push
