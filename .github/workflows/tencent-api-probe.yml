name: Tencent API Probe

on:
  push:
    paths:
      - ".github/workflows/tencent-api-probe.yml"
      - ".github/tencent-api-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PC comment markup
        shell: bash
        run: |
          set -euo pipefail
          url="https://ac.qq.com/Community/topicList?targetId=644371&page=1&_=$(date +%s%3N)"
          curl -sS -L --connect-timeout 10 --max-time 30             -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36'             -H 'Referer: https://ac.qq.com/Comic/comicInfo/id/644371'             -H 'X-Requested-With: XMLHttpRequest'             "$url" -o topic.html
          echo "bytes=$(wc -c < topic.html)"
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          html=open("topic.html","rb").read()
          soup=BeautifulSoup(html,"html.parser")
          print("title/count:", soup.select_one(".commen-ft-ts"))
          details=soup.select(".comment-content-detail")
          print("detail count:",len(details))
          for i,d in enumerate(details[:3]):
              node=d
              for _ in range(5):
                  if node.parent is None: break
                  node=node.parent
              print("\n=== DETAIL",i,"TEXT ===")
              print(d.get_text(" ", strip=True)[:600])
              print("=== ANCESTOR HTML ===")
              print(str(node)[:7000])
          PY
