name: Probe MiHouTao Chapter Comments 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-mihoutao-chapter-comments-2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Find live chapter comments and verify latest hot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          BASE='https://manwari.cc'
          UA='Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          def get_json(path, params):
              u=BASE+path+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept':'application/json,*/*'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read().decode('utf-8','ignore')
              print('GET',u,'=>',body[:1200])
              return json.loads(body)
          root=get_json('/api/comments',{'page':1,'page_size':100,'sort':'time'})
          items=((root.get('data') or {}).get('list') or [])
          hit=next((x for x in items if int(x.get('chapter_id') or 0)>0 and int(x.get('comic_id') or 0)>0),None)
          if hit is None:
              raise SystemExit('No chapter comment found in latest 100 global comments')
          comic=str(hit['comic_id']); chapter=str(hit['chapter_id'])
          print('LIVE_CHAPTER_COMMENT',comic,chapter,hit.get('chapter_title'),hit.get('content'))
          for sort in ('time','hot'):
              r=get_json('/api/comments',{'comic_id':comic,'chapter_id':chapter,'page':1,'page_size':20,'sort':sort})
              d=r.get('data') or {}; arr=d.get('list') or []
              print('VALIDATED',sort,'total=',d.get('total'),'items=',len(arr))
              if r.get('code') != 200:
                  raise SystemExit(f'{sort} code != 200')
          # Check the page locator endpoint with chapter scoping using the live comment id.
          cid=str(hit['id'])
          for params in (
              {'commentId':cid,'comic_id':comic,'chapter_id':chapter,'page_size':20,'sort':'time'},
              {'commentId':cid,'comic_id':comic,'page_size':20,'sort':'time'},
          ):
              try:
                  r=get_json('/api/comments/page',params)
                  print('LOCATOR',params,'=>',r)
              except Exception as e:
                  print('LOCATOR_ERROR',params,repr(e))
          PY
