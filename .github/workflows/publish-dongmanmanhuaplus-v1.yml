name: Build Dongman Manhua Plus v1 Production Handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dongmanmanhuaplus-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dongmanmanhuaplus-v1-production-handoff
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$MX_PRIVATE_READ_TOKEN"
          test -n "$MANGA_SIGNING_BUNDLE"

      - name: Checkout build helper
        uses: actions/checkout@v5
        with:
          ref: main
          path: helper
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout private source repository
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and apply validated Dongman handoff locally
        shell: bash
        run: |
          set -euo pipefail
          handoff='helper/.github/handoff/dongmanmanhuaplus-v1'
          grep -Fxq '1.6.1 / source 1 / Android 106001' "$handoff/VALIDATED.txt"
          grep -Fxq 'Spotless Debug Release Lint signed and MX ABI verified' "$handoff/VALIDATED.txt"
          test -f "$handoff/module/build.gradle.kts"
          grep -Fq 'versionCode = 1' "$handoff/module/build.gradle.kts"
          file="$handoff/module/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt"
          grep -Fq 'private var loginStatusPreference: EditTextPreference? = null' "$file"
          test "$(grep -Fc 'EditTextPreference(screen.context).apply {' "$file")" -ge 3
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            find "$handoff/module/res/mipmap-$density" -maxdepth 1 -type f -name 'ic_launcher.*' | grep -q .
          done
          rm -rf source/src/zh/dongmanmanhuaplus
          cp -a "$handoff/module" source/src/zh/dongmanmanhuaplus
          python3 source/scripts/validate_sources.py
          echo 'SOURCE_SHA=25b6701cf1eb3f04a9384000f80c157a4cfdbe0f' >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay validated module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/dongmanmanhuaplus
          cp -a source/src/zh/dongmanmanhuaplus upstream/src/zh/dongmanmanhuaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless verification
        working-directory: upstream
        run: ./gradlew :src:zh:dongmanmanhuaplus:spotlessCheck

      - name: Prepare stable signing key
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for e,k in [('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')]:
                  v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF\n{v}\nEOF\n')
          PY

      - name: Verify configured signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          actual="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          echo "SIGNING_FINGERPRINT=$actual" >> "$GITHUB_ENV"

      - name: Build signed release
        working-directory: upstream
        run: ./gradlew :src:zh:dongmanmanhuaplus:assembleRelease :src:zh:dongmanmanhuaplus:lintRelease

      - name: Verify signed release
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream/src/zh/dongmanmanhuaplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          jar="$(find upstream/src/zh/dongmanmanhuaplus -path '*/build/outputs/jar/release/*.jar' -type f | head -n1)"
          test -f "$apk"
          test -f "$jar"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          cert="$("$apksigner" verify --print-certs "$apk" 2>&1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$cert" == *"$SIGNING_FINGERPRINT"* ]]
          jarsigner -verify "$jar" >/dev/null

      - name: Checkout production repository snapshot
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          ref: repo
          path: repo
          fetch-depth: 1
          persist-credentials: false

      - name: Generate formal production indexes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check protobuf
          python3 source/scripts/publish_repo.py \
            --artifacts-root upstream/src \
            --source-root source \
            --repo-dir repo \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT" \
            --upstream-root upstream
          grep -q 'eu.kanade.tachiyomi.extension.zh.dongmanmanhuaplus' repo/index.json
          grep -q '1.6.1' repo/index.json

      - name: Export production handoff
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/production-handoff"
          mkdir -p "$out"
          cd repo
          git status --porcelain=v1 | while IFS= read -r line; do
            rel="${line:3}"
            [[ -n "$rel" ]] || continue
            if [[ -f "$rel" ]]; then
              mkdir -p "$out/$(dirname "$rel")"
              cp -a "$rel" "$out/$rel"
            fi
          done
          printf '%s\n' "$SOURCE_SHA" > "$out/SOURCE_SHA.txt"
          find "$out" -type f | sort

      - name: Save production handoff to extension-staging
        shell: bash
        run: |
          set -euo pipefail
          git -C helper fetch origin extension-staging
          git -C helper worktree add "$RUNNER_TEMP/staging" origin/extension-staging
          staging="$RUNNER_TEMP/staging"
          rm -rf "$staging/production-handoff"
          mkdir -p "$staging/production-handoff"
          cp -a "$RUNNER_TEMP/production-handoff/." "$staging/production-handoff/"
          git -C "$staging" config user.name 'github-actions[bot]'
          git -C "$staging" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$staging" add production-handoff
          git -C "$staging" commit -m 'Stage Dongman Manhua Plus v1 production handoff'
          git -C "$staging" push origin HEAD:extension-staging

      - name: Upload production handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: dongmanmanhuaplus-v1-production-handoff
          path: ${{ runner.temp }}/production-handoff
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
