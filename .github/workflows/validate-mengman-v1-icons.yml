name: Validate Mengman v1 icons

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-mengman-v1-icons.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::MX_PRIVATE_READ_TOKEN missing"; exit 1; }

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Mengman development branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: source/mengman-v1
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Validate launcher resource set
        shell: bash
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            file="dev/src/zh/mengman/res/mipmap-${density}/ic_launcher.xml"
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
            grep -q '<vector' "$file"
            grep -q 'FF5B45' "$file"
          done
          if find dev/src/zh/mengman/res -path '*anydpi*' -name 'ic_launcher*' | grep -q .; then
            echo "::error::Unexpected anydpi launcher override found"
            find dev/src/zh/mengman/res -path '*anydpi*' -name 'ic_launcher*' -print
            exit 1
          fi
          echo "MENGMAN_ICON_SET_OK"

      - name: Overlay Mengman module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/mengman
          cp -a dev/src/zh/mengman upstream/src/zh/mengman

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format and build debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:mengman:spotlessApply
          ./gradlew :src:zh:mengman:spotlessCheck
          ./gradlew :src:zh:mengman:assembleDebug --stacktrace

      - name: Inspect packaged launcher resources
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream/src/zh/mengman/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "APK=$apk"
          unzip -l "$apk" | grep -E 'res/(mipmap|drawable).*ic_launcher' || true
          echo "MENGMAN_DEBUG_BUILD_OK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mengman-v1-icon-debug
          path: upstream/src/zh/mengman/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
