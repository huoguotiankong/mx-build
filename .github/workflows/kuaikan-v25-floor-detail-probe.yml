name: Kuaikan v25 Floor Detail Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kuaikan-v25-floor-detail-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe live chapter floor detail pagination
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          B='https://api.kkmh.com'; C=196392
          H={'User-Agent':'Kuaikan/5.75.0/575000(iPhone;Scale/3.00) (iPhone; CPU)','Accept':'application/json, text/plain, */*','X-Device':'0'}
          def get(path, params):
              u=B+path+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,json.loads(r.read().decode())
          st,o=get('/v2/comments/cruel/floor_list',{'target_type':'comic','target_id':C,'order':'score','offset':0,'limit':20,'total':'false','source':0})
          d=o.get('data') or {}; floors=d.get('comment_floors') or []
          chosen=None
          for f in floors:
              root=f.get('root') or {}
              if (f.get('children_total') or 0)>20 and root.get('id'):
                  chosen=(root.get('id'),f.get('children_total'))
                  break
          print('list.http=',st,'code=',o.get('code'),'chosen=',chosen)
          if not chosen:
              raise SystemExit('no floor with >20 replies in sample page')
          cid,total=chosen
          cursor=0
          seen=[]
          for page in range(1,5):
              st2,r=get('/v2/comments/cruel/floor_detail',{'comment_id':cid,'since':cursor,'limit':20,'direction':0})
              data=r.get('data') or {}; floor=data.get('comment_floors') or {}; children=floor.get('children_comments') or []
              ids=[str(x.get('id')) for x in children if isinstance(x,dict) and x.get('id')]
              next_cursor=data.get('down_since')
              print(f'page={page} http={st2} code={r.get("code")} cursor={cursor} count={len(children)} total={floor.get("children_total")} show_more={floor.get("show_more")} down_since={next_cursor} unique={len(set(ids))}')
              print('first=',ids[0] if ids else None,'last=',ids[-1] if ids else None,'overlap=',len(set(ids)&set(seen)))
              seen += ids
              if not children or next_cursor in (None,-1,cursor): break
              cursor=next_cursor
          print('all_seen=',len(seen),'all_unique=',len(set(seen)),'expected_total=',total)
          PY
