name: Patch JMComic Plus v6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-jmcomicplus-v5.yml"
      - "scripts/patch_jmcomicplus_v5.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check private source token
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MX_PRIVATE_READ_TOKEN"

      - name: Checkout build helpers
        uses: actions/checkout@v5
        with:
          path: buildrepo
          persist-credentials: false

      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Apply real-device route repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('buildrepo/scripts/patch_jmcomicplus_v5.py')
          s = p.read_text('utf-8')
          s, n = re.subn(r'd = DOC\.read_text\("utf-8"\)nd = d\.replace\(', 'd = DOC.read_text("utf-8")\n' + 'd = d.replace(', s, count=1)
          if n != 1:
              raise SystemExit(f'helper syntax repair failed: {n}')
          old = 'g = replace_once(g, "versionCode = 4", "versionCode = 5", "versionCode")'
          new = 'g = replace_once(g, "versionCode = 5", "versionCode = 6", "versionCode")'
          if old not in s:
              raise SystemExit('helper version rebase point missing')
          s = s.replace(old, new, 1)
          p.write_text(s, 'utf-8')
          PY
          python3 -m py_compile buildrepo/scripts/patch_jmcomicplus_v5.py
          python3 buildrepo/scripts/patch_jmcomicplus_v5.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/docs/sources/jmcomicplus.md')
          s = p.read_text('utf-8')
          s = s.replace('`1.6.5`，Android `versionCode=106005`', '`1.6.6`，Android `versionCode=106006`')
          s = s.replace('v5 正文解混淆修正：已按当前 Keiyoushi 禁漫天堂算法对照修改，待重新执行 Spotless、Release 编译、Lint 和固定签名测试发布。', 'v5 正文解混淆修正已合入；v6 在用户实机反馈基础上继续修复 APP/API 解压/请求头、Web 镜像/解析和扩展图标。')
          p.write_text(s, 'utf-8')
          PY

      - name: Validate source layout
        working-directory: source
        run: python3 scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Overlay patched source
        shell: bash
        run: |
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format, build and lint v6
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:jmcomicplus:spotlessApply
          ./gradlew :src:zh:jmcomicplus:spotlessCheck :src:zh:jmcomicplus:assembleDebug :src:zh:jmcomicplus:assembleRelease :src:zh:jmcomicplus:lintRelease

      - name: Copy formatted source back
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude build/ upstream/src/zh/jmcomicplus/ source/src/zh/jmcomicplus/
          python3 source/scripts/validate_sources.py

      - name: Commit and push v6 source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/zh/jmcomicplus docs/sources/jmcomicplus.md
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(jmcomicplus): repair APP and web routes v6"
          git push origin HEAD:main
