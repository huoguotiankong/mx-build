name: Inspect Qingman Public Target Web App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-web-target.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify public target page
        shell: bash
        run: |
          set -u
          base='https://rx6vxp6wil2ra0cg.f37.top/'
          work=/tmp/qmtarget
          rm -rf "$work" && mkdir -p "$work"
          curl -sSL --connect-timeout 10 --max-time 30 -D "$work/headers" -o "$work/index.html" "$base" || true
          echo "final_url=$(curl -sSL -o /dev/null -w '%{url_effective}' --connect-timeout 10 --max-time 30 "$base" || true)"
          echo "html_bytes=$(wc -c < "$work/index.html" 2>/dev/null || echo 0)"

          python3 - <<'PY'
          from pathlib import Path
          import re,html,urllib.parse
          p=Path('/tmp/qmtarget/index.html')
          s=p.read_text('utf-8',errors='replace') if p.exists() else ''
          print('=== PAGE_METADATA ===')
          for tag in ['title','h1','h2']:
              vals=[]
              for m in re.finditer(fr'<{tag}[^>]*>(.*?)</{tag}>',s,re.I|re.S):
                  v=re.sub(r'<[^>]+>',' ',m.group(1)); v=html.unescape(re.sub(r'\s+',' ',v)).strip()
                  if v and v not in vals: vals.append(v)
              for v in vals[:20]: print(tag.upper()+' '+v[:240])
          metas=[]
          for m in re.finditer(r'<meta\b[^>]*>',s,re.I):
              t=m.group(0)
              n=re.search(r'(?:name|property)=["\']([^"\']+)',t,re.I)
              c=re.search(r'content=["\']([^"\']*)',t,re.I)
              if n and c: metas.append((n.group(1),html.unescape(c.group(1))))
          for n,c in metas[:80]: print(f'META {n}={c[:300]}')

          print('=== TEXT_MARKERS ===')
          for key in ['青漫','漫画','下载','安卓','Android','iOS','APP','安装','备用网址','域名','线路','最新网址','comicId','chapterId','pageUrls','api/','axios','fetch(','XMLHttpRequest','WebSocket','localStorage','search']:
              print(f'{key}={len(re.findall(re.escape(key),s,re.I))}')

          print('=== URL_CONTEXTS ===')
          urls=[]
          for m in re.finditer(r'https?://[A-Za-z0-9._~:/?#\[\]@!$&()*+,;=%-]+',s):
              u=m.group(0).rstrip('"\'<>);,')
              if u in urls: continue
              urls.append(u)
              lo=max(0,m.start()-180); hi=min(len(s),m.end()+260)
              ctx=re.sub(r'\s+',' ',s[lo:hi])
              ctx=re.sub(r'[A-Za-z0-9_-]{80,}','<opaque>',ctx)
              print('URL '+u)
              print('CTX '+ctx[:650])

          print('=== NETWORK_CALL_SNIPPETS ===')
          shown=0
          for pat in [r'fetch\s*\(',r'axios',r'XMLHttpRequest',r'\.get\s*\(',r'\.post\s*\(']:
              for m in re.finditer(pat,s,re.I):
                  lo=max(0,m.start()-220); hi=min(len(s),m.start()+500)
                  ctx=re.sub(r'\s+',' ',s[lo:hi])
                  ctx=re.sub(r'[A-Za-z0-9_-]{80,}','<opaque>',ctx)
                  print('NET '+ctx[:700]); shown+=1
                  if shown>=40: break
              if shown>=40: break
          print('network_snippet_count='+str(shown))
          PY
