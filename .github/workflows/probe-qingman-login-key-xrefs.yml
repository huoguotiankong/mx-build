name: Map Qingman Login Caller Graph

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-login-key-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace direct callers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version')) != '4.4.5' or int(a.get('versionCode',0)) != 445:
              raise SystemExit('Unexpected Qingman version; refresh static addresses first')
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION=4.4.5',file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re,bisect

          targets={
              0x7e2f3c:'login_route_getter',
              0x5013f8:'username_map_helper',
              0x505940:'password_map_helper',
          }
          allowed={
              'userName','password','deviceId','type','platform','android','userId','uid','memberId',
              'qm_auth_token','qm_user_id','user_info','qm_identity_type','qm_is_guest',
              'code','msg','data','result','accessToken','refreshToken','token','appVersion',
              'deviceModel','mobileOs','appCode','clientIp','userPlatform','X-Register-Channel',
          }
          deny=re.compile(r'(?i)(clientp12|private|certificate|keystore|bootstrapproof|bootstrapsign|k1a|k1b|k2a|k2b|k3a|k3b|secret)')
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          def safe(v):
              if deny.search(v): return '<redacted-sensitive-entry>'
              m=re.fullmatch(r'String: "([^"]*)"',v)
              if m:
                  s=m.group(1)
                  if s in allowed or s == 'api/appapi/user/f9384dh/login': return v
                  return ''
              if any(x in v for x in ('Type','TypeArguments','Field <','Closure','AnonymousClosure','Function')):
                  return v[:240]
              return ''

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base)); addr_index={x.address:i for i,x in enumerate(ins)}

          funcs=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  m=re.search(r'\*\* addr: 0x([0-9a-fA-F]+), size: 0x([0-9a-fA-F]+)',s)
                  if not m: continue
                  st=int(m.group(1),16); sz=int(m.group(2),16)
                  decl=''
                  for j in range(i-1,max(-1,i-9),-1):
                      z=lines[j].strip()
                      if z and not z.startswith('//'):
                          decl=re.sub(r'"[^"]*"','"<literal-omitted>"',z); break
                  if sz>0: funcs.append((st,st+sz,p.name,decl))
          funcs.sort(); starts=[x[0] for x in funcs]
          def owner(addr):
              k=bisect.bisect_right(starts,addr)-1
              return funcs[k] if k>=0 and funcs[k][0]<=addr<funcs[k][1] else None

          calls=[]
          for i,x in enumerate(ins):
              if x.mnemonic not in ('bl','b'): continue
              m=re.fullmatch(r'#(0x[0-9a-f]+|\d+)',x.op_str.lower())
              if not m: continue
              dst=int(m.group(1),0)
              if dst in targets:
                  calls.append((i,x.address,dst,targets[dst]))

          print('=== DIRECT CALLERS ===')
          for _,addr,dst,label in calls:
              f=owner(addr)
              print(f'{label}: call=0x{addr:x} target=0x{dst:x} owner=' + (f'0x{f[0]:x}-0x{f[1]:x} {f[2]} {f[3]}' if f else '<raw-unmapped>'))

          def annotate_range(lo,hi):
              pending={}
              for j in range(lo,hi):
                  x=ins[j]
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=x.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if x.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),28)
                  elif x.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              s=safe(pp[off])
                              if s: ann=f' ; PP+0x{off:x}={s}'
                  yield x,ann

          print('\n=== CALLER CONTEXTS ===')
          seen=set()
          for idx,addr,dst,label in calls:
              key=(addr,label)
              if key in seen: continue
              seen.add(key)
              lo=max(0,idx-55); hi=min(len(ins),idx+90)
              print(f'\n--- {label} caller @0x{addr:x} ---')
              for x,ann in annotate_range(lo,hi):
                  if ann or x.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','b.ls','b.hi','cbz','cbnz','tbz','tbnz') or x.mnemonic.startswith('st'):
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}{ann}')

          # Also find functions that call two or more of our targets indirectly/directly in the same mapped owner.
          grouped={}
          for _,addr,dst,label in calls:
              f=owner(addr); key=(f[0],f[1],f[2],f[3]) if f else ('raw',addr,'','')
              grouped.setdefault(key,set()).add(label)
          print('\n=== CO-OCCURRENCE ===')
          for key,labs in grouped.items():
              if len(labs)>=2:
                  print(str(key)+' => '+','.join(sorted(labs)))

          # Session persistence: compact annotated contexts only, no values.
          print('\n=== SESSION PERSISTENCE SAFE CONTEXT ===')
          session_keys={'qm_auth_token','qm_user_id','user_info','qm_identity_type','qm_is_guest','token','accessToken','userId','uid','memberId'}
          for start,end in ((0xb126c0,0xb13680),):
              pending={}
              for x in md.disasm(data[start-base:end-base],start):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=x.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if x.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),28)
                  elif x.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              v=pp[off]
                              sm=re.fullmatch(r'String: "([^"]*)"',v)
                              if sm and sm.group(1) in session_keys: ann=f' ; PP+0x{off:x}={v}'
                  if ann or x.mnemonic in ('bl','blr','ret'):
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}{ann}')
          PY
