name: Resolve Qingman Final Auth Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-login-key-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Resolve final login response and Authorization value
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version')) != '4.4.5' or int(a.get('versionCode',0)) != 445:
              raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION=4.4.5',file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          deny=re.compile(r'(?i)(clientp12|private|certificate|keystore|bootstrapproof|bootstrapsign|k1a|k1b|k2a|k2b|k3a|k3b|secret)')
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base)); idx={x.address:i for i,x in enumerate(ins)}

          safe={'token','accessToken','authToken','userId','uid','memberId','qm_auth_token','qm_user_id','Authorization','Bearer','data','result','code','msg','status','isGuest','userName','password','loginip','appVersion','deviceModel','mobileOs','appCode','clientIp','userPlatform','X-Register-Channel'}
          def is_prologue(x):
              return x.mnemonic=='stp' and x.op_str.replace(' ','').startswith('x29,x30,[x15,#-0x10]!')
          def bounds(addr):
              k=idx[addr]; s=k
              while s>0 and not is_prologue(ins[s]): s-=1
              e=k+1
              while e<len(ins) and not is_prologue(ins[e]): e+=1
              return ins[s].address, ins[e].address if e<len(ins) else ins[-1].address+4
          def callers(st):
              out=[]
              for x in ins:
                  if x.mnemonic!='bl': continue
                  m=re.fullmatch(r'#(0x[0-9a-f]+|\d+)',x.op_str.lower())
                  if m and int(m.group(1),0)==st: out.append(x.address)
              return out
          def dump(addr,title):
              st,en=bounds(addr)
              print(f'\n=== {title} 0x{st:x}-0x{en:x} callers={",".join(hex(x) for x in callers(st))} ===')
              pending={}
              for x in md.disasm(data[st-base:en-base],st):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=x.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if x.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),36)
                  elif x.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              v=pp[off]; sm=re.fullmatch(r'String: "([^"]*)"',v)
                              if sm and (sm.group(1) in safe or len(sm.group(1))<=60) and not deny.search(v): ann=f' ; PP+0x{off:x}={v}'
                              elif any(q in v for q in ('Type','TypeArguments','Field <','Closure','Function')) and not deny.search(v): ann=f' ; PP+0x{off:x}={v[:230]}'
                  if ann or x.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}{ann}')

          # Exact functions used by login-success continuation.
          for a,t in ((0xb13560,'LOGIN TOKEN EXTRACTOR'),(0xb1300c,'LOGIN USERID/IDENTITY EXTRACTOR'),(0xb13478,'SAVE AUTH TOKEN'),(0xb1323c,'SAVE USER ID')):
              dump(a,t)

          # Exact function called by business header builder immediately before Authorization insertion.
          dump(0xaaceac,'BUSINESS AUTH VALUE PROVIDER')
          ast,aen=bounds(0xaaceac)
          for ca in callers(ast):
              dump(ca,f'BUSINESS AUTH PROVIDER CALLER @{ca:x}')

          # Find model/type declarations for the opaque awaited types observed in login success path.
          print('\n=== BLUTTER TYPE/CLASS DECLARATIONS kqb Ppb ===')
          for p in Path('/tmp/blutter-out').rglob('*'):
              if not p.is_file() or p.suffix not in ('.dart','.txt'): continue
              text=p.read_text('utf-8',errors='replace')
              if not re.search(r'\b(kqb|Ppb)\b',text): continue
              for i,line in enumerate(text.splitlines()):
                  if re.search(r'\b(kqb|Ppb)\b',line):
                      excerpt=[]
                      for z in text.splitlines()[max(0,i-3):i+5]:
                          if deny.search(z): z='<redacted-sensitive-line>'
                          z=re.sub(r'"[^"\n]{100,}"','"<long-literal-omitted>"',z)
                          excerpt.append(z[:320])
                      print(f'FILE {p.name} LINE {i+1}')
                      print('\n'.join(excerpt))

          # Find exact generated JSON helpers that reference token + isGuest, and userId aliases.
          token_off=[o for o,v in pp.items() if v=='String: "token"']
          user_off=[o for o,v in pp.items() if v in ('String: "userId"','String: "uid"','String: "memberId"')]
          refs=[]; pending={}
          for x in ins:
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=x.op_str.lower(); m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if x.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),24); continue
              if x.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in token_off+user_off: refs.append((x.address,off,pp[off]))
          print('\n=== GENERATED JSON OWNER FUNCTIONS ===')
          seen=set()
          for a,o,v in refs:
              st,en=bounds(a)
              if st in seen: continue
              # Limit to compact generated helpers around 0x48..0x56 million to avoid unrelated business UI.
              if not (0x480000 <= st <= 0x560000): continue
              seen.add(st)
              print(f'owner=0x{st:x}-0x{en:x} xref=0x{a:x} {v} callers={",".join(hex(x) for x in callers(st))}')
              if en-st <= 0x500: dump(a,f'JSON HELPER @{a:x}')
          PY
