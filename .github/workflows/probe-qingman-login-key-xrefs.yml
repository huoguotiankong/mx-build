name: Resolve Qingman Session Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-login-key-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Resolve session persistence and wire header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version')) != '4.4.5' or int(a.get('versionCode',0)) != 445:
              raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION=4.4.5',file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          deny=re.compile(r'(?i)(clientp12|private|certificate|keystore|bootstrapproof|bootstrapsign|k1a|k1b|k2a|k2b|k3a|k3b|secret)')
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          wanted={
              'qm_auth_token','qm_user_id','user_info','Authorization','authorization','token','accessToken',
              'authToken','userId','uid','memberId','X-Token','X-Auth-Token','Bearer','loginip','userName','password',
          }
          key_offsets={}
          print('=== AUTH STRING OFFSETS ===')
          for off,v in sorted(pp.items()):
              m=re.fullmatch(r'String: "([^"]*)"',v)
              if m and m.group(1) in wanted:
                  key_offsets.setdefault(m.group(1),[]).append(off)
                  print(f'{m.group(1)} PP+0x{off:x}')

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base)); idx={x.address:i for i,x in enumerate(ins)}

          # Generic PP reference detector with bounded register tracking.
          refs=[]; pending={}
          for x in ins:
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=x.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if x.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),24)
                  continue
              if x.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off is not None and off in pp:
                      sm=re.fullmatch(r'String: "([^"]*)"',pp[off])
                      if sm and sm.group(1) in wanted: refs.append((x.address,off,sm.group(1)))

          print('\n=== AUTH STRING XREFS ===')
          for a,o,s in refs:
              print(f'0x{a:x} PP+0x{o:x} {s}')

          def is_prologue(x):
              return x.mnemonic=='stp' and x.op_str.replace(' ','').startswith('x29,x30,[x15,#-0x10]!')
          def bounds(addr):
              k=idx[addr]; s=k
              while s>0 and not is_prologue(ins[s]): s-=1
              e=k+1
              while e<len(ins) and not is_prologue(ins[e]): e+=1
              return ins[s].address, ins[e].address if e<len(ins) else ins[-1].address+4

          targets=(0xb11608,0xb128e4,0xb1323c,0xb13268,0xb13324,0xb134a4,0xb12c04,0xb13040)
          print('\n=== RAW BOUNDS AND DIRECT CALLERS ===')
          for t in targets:
              if t not in idx: continue
              st,en=bounds(t)
              print(f'TARGET 0x{t:x} bounds=0x{st:x}-0x{en:x}')
              for x in ins:
                  if x.mnemonic!='bl': continue
                  m=re.fullmatch(r'#(0x[0-9a-f]+|\d+)',x.op_str.lower())
                  if m and int(m.group(1),0)==st: print(f'  caller 0x{x.address:x}')

          safe_names=wanted | {'code','msg','data','result','isGuest','identityType','status','username','email','mobile','phone'}
          def dump(addr,title):
              st,en=bounds(addr)
              print(f'\n=== {title} 0x{st:x}-0x{en:x} ===')
              pending={}
              for x in md.disasm(data[st-base:en-base],st):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=x.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if x.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),28)
                  elif x.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              v=pp[off]; sm=re.fullmatch(r'String: "([^"]*)"',v)
                              if sm and sm.group(1) in safe_names: ann=f' ; PP+0x{off:x}={v}'
                              elif any(q in v for q in ('Type','TypeArguments','Field <')) and not deny.search(v): ann=f' ; PP+0x{off:x}={v[:220]}'
                  if ann or x.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}{ann}')

          dump(0xb11608,'POST-LOGIN SUCCESS HANDLER')
          dump(0xb13268,'USER ID PERSISTENCE')
          dump(0xb134a4,'AUTH TOKEN PERSISTENCE')

          # Print compact contexts around every Authorization/token xref to identify header insertion.
          print('\n=== WIRE AUTH XREF CONTEXTS ===')
          for a,o,s in refs:
              if s not in {'Authorization','authorization','token','accessToken','authToken','X-Token','X-Auth-Token','Bearer','qm_auth_token'}: continue
              k=idx[a]; lo=max(0,k-28); hi=min(len(ins),k+45)
              print(f'\n--- {s} @0x{a:x} ---')
              for x in ins[lo:hi]:
                  if x.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz') or x.address==a:
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}')
          PY
