name: Map Qingman Login Field And Session Xrefs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-login-key-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Resolve login field and session xrefs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          print('OFFICIAL_VERSION_CODE='+str(a.get('versionCode','')),file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import bisect,re

          # Static identifiers only. Never print credential values.
          labels={
              'user_name':'userName',
              'password_key':'password',
              'device_id':'deviceId',
              'login_route':'api/appapi/user/f9384dh/login',
              'auth_token_key':'qm_auth_token',
              'user_id_key':'qm_user_id',
              'user_info_key':'user_info',
              'identity_type_key':'qm_identity_type',
              'is_guest_key':'qm_is_guest',
          }
          deny=re.compile(r'(?i)(clientp12|private|certificate|keystore|bootstrapproof|bootstrapsign|k1a|k1b|k2a|k2b|k3a|k3b|secret)')
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)

          targets={}
          print('=== TARGET OFFSETS ===')
          for label,needle in labels.items():
              xs=[]
              for off,val in pp.items():
                  if deny.search(val): continue
                  if needle.lower() in val.lower(): xs.append(off)
              xs=sorted(xs)
              print(label+'='+','.join(hex(x) for x in xs))
              for x in xs: targets[x]=label

          funcs=[]
          for p in Path('/tmp/blutter-out/asm').rglob('*.dart'):
              lines=p.read_text('utf-8',errors='replace').splitlines()
              for i,s in enumerate(lines):
                  m=re.search(r'\*\* addr: 0x([0-9a-fA-F]+), size: 0x([0-9a-fA-F]+)',s)
                  if not m: continue
                  st=int(m.group(1),16); sz=int(m.group(2),16)
                  decl=''
                  for j in range(i-1,max(-1,i-8),-1):
                      t=lines[j].strip()
                      if t and not t.startswith('//'):
                          decl=t; break
                  funcs.append((st,st+sz,p.name,decl,lines,i))
          funcs.sort(key=lambda x:x[0]); starts=[f[0] for f in funcs]
          def owner(addr):
              k=bisect.bisect_right(starts,addr)-1
              return funcs[k] if k>=0 and funcs[k][0]<=addr<funcs[k][1] else None

          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base))
          addr_to_index={x.address:i for i,x in enumerate(ins)}

          pending={}; refs=[]
          for x in ins:
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=x.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if x.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),18)
                  continue
              if x.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in targets: refs.append((x.address,off,targets[off]))

          print('\n=== XREFS GROUPED BY OWNER ===')
          grouped={}
          for addr,off,label in refs:
              f=owner(addr)
              key=(f[0],f[2],f[3]) if f else ('raw',addr,'')
              grouped.setdefault(key,[]).append((addr,off,label,f))
          for key,items in sorted(grouped.items(),key=lambda kv:str(kv[0])):
              labs=sorted(set(x[2] for x in items))
              f=items[0][3]
              if f:
                  print(f'OWNER 0x{f[0]:x}-0x{f[1]:x} file={f[2]} decl={f[3][:220]} labels={labs}')
              else:
                  print('OWNER <raw-unmapped> labels='+str(labs))
              for addr,off,label,_ in items:
                  print(f'  XREF 0x{addr:x} label={label} pp=0x{off:x}')

              # Compact raw context, annotations are identifier labels only.
              if f:
                  center=min(addr_to_index.get(x[0],0) for x in items)
                  lo=max(0,center-28); hi=min(len(ins),center+75)
                  pend={}; anns={}
                  for j in range(lo,hi):
                      it=ins[j]; pend={r:(b,n-1) for r,(b,n) in pend.items() if n>1}; op=it.op_str.lower()
                      m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                      if it.mnemonic=='add' and m:
                          pend[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),18)
                      elif it.mnemonic in ('ldr','ldur','ldrsw'):
                          m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                          if m:
                              br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                              off=disp if br=='x27' else (pend[br][0]+disp if br in pend else None)
                              if off in targets: anns[j]=' ; '+targets[off]
                  for j in range(lo,hi):
                      it=ins[j]
                      if j in anns or it.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz') or it.mnemonic.startswith('st'):
                          print(f'    0x{it.address:x} {it.mnemonic:<7} {it.op_str}{anns.get(j,"")}')

          print('\n=== HIGH-VALUE CO-OCCURRENCES ===')
          for key,items in grouped.items():
              labs=set(x[2] for x in items)
              if {'user_name','password_key'} <= labs or {'auth_token_key','user_id_key'} <= labs or ('login_route' in labs and ({'user_name','password_key','device_id'} & labs)):
                  f=items[0][3]
                  print((f'0x{f[0]:x} {f[2]} {f[3][:180]}' if f else '<raw>')+' => '+','.join(sorted(labs)))
          PY
