name: Resolve Qingman Login Response And Auth Injection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-login-key-xrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xref:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace response fields and auth injection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request,sys
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version')) != '4.4.5' or int(a.get('versionCode',0)) != 445:
              raise SystemExit('Unexpected Qingman version')
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION=4.4.5',file=sys.stderr)
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          deny=re.compile(r'(?i)(clientp12|private|certificate|keystore|bootstrapproof|bootstrapsign|k1a|k1b|k2a|k2b|k3a|k3b|secret)')
          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base)); idx={x.address:i for i,x in enumerate(ins)}

          safe={
              'token','accessToken','authToken','userId','uid','memberId','userName','username','isGuest','identityType',
              'qm_auth_token','qm_user_id','Authorization','authorization','Bearer','X-Token','X-Auth-Token',
              'data','result','code','msg','status','deviceId','X-Device-Id','X-QM-App-Access',
          }
          def is_prologue(x):
              return x.mnemonic=='stp' and x.op_str.replace(' ','').startswith('x29,x30,[x15,#-0x10]!')
          def bounds(addr):
              k=idx[addr]; s=k
              while s>0 and not is_prologue(ins[s]): s-=1
              e=k+1
              while e<len(ins) and not is_prologue(ins[e]): e+=1
              return ins[s].address, ins[e].address if e<len(ins) else ins[-1].address+4
          def direct_callers(target_start):
              out=[]
              for x in ins:
                  if x.mnemonic!='bl': continue
                  m=re.fullmatch(r'#(0x[0-9a-f]+|\d+)',x.op_str.lower())
                  if m and int(m.group(1),0)==target_start: out.append(x.address)
              return out
          def dump(addr,title,all_strings=False):
              st,en=bounds(addr)
              print(f'\n=== {title} 0x{st:x}-0x{en:x} callers={",".join(hex(x) for x in direct_callers(st))} ===')
              pending={}
              for x in md.disasm(data[st-base:en-base],st):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=x.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if x.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),32)
                  elif x.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              v=pp[off]; sm=re.fullmatch(r'String: "([^"]*)"',v)
                              if sm and ((sm.group(1) in safe) or (all_strings and len(sm.group(1))<=80)) and not deny.search(v):
                                  ann=f' ; PP+0x{off:x}={v}'
                              elif any(q in v for q in ('Type','TypeArguments','Field <')) and not deny.search(v):
                                  ann=f' ; PP+0x{off:x}={v[:220]}'
                  if ann or x.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}{ann}')

          # Actual success continuation called after parsed login response.
          dump(0xb11750,'LOGIN SUCCESS CONTINUATION',True)
          # Token/userId JSON generated getter/fromJson helpers referenced near persistence path.
          for a,t in ((0x5057b4,'TOKEN MODEL HELPER A'),(0x505250,'USER MODEL HELPER'),(0x505354,'AUTH SERVICE MODEL HELPER'),(0x505470,'AUTH SERVICE MODEL HELPER 2')):
              dump(a,t,True)

          # Preference token getters that may feed interceptors/network headers.
          for a,t in ((0xa8d528,'AUTH TOKEN READER A'),(0xb90e44,'AUTH TOKEN READER B'),(0xbbad70,'AUTH TOKEN READER C'),(0xbbb7d8,'AUTH TOKEN READER D')):
              dump(a,t,True)

          # Trace callers recursively one level for the app-specific auth-token getter around a8d4f0.
          st,en=bounds(0xa8d528)
          c1=direct_callers(st)
          print('\n=== AUTH TOKEN READER CALLER FUNCTIONS ===')
          seen=set()
          for ca in c1:
              cst,cen=bounds(ca)
              if cst in seen: continue
              seen.add(cst)
              print(f'READER 0x{st:x} caller-site=0x{ca:x} caller-func=0x{cst:x}-0x{cen:x} parent-callers={",".join(hex(x) for x in direct_callers(cst))}')
              dump(ca,f'AUTH READER CALLER @{ca:x}',True)

          # Map all exact Authorization xrefs and inspect their owning raw functions.
          auth_offs=[o for o,v in pp.items() if v in ('String: "Authorization"','String: "authorization"')]
          refs=[]; pending={}
          for x in ins:
              pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
              op=x.op_str.lower()
              m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
              if x.mnemonic=='add' and m:
                  pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),24); continue
              if x.mnemonic in ('ldr','ldur','ldrsw'):
                  m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                  if not m: continue
                  br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                  off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                  if off in auth_offs: refs.append(x.address)
          print('\n=== AUTHORIZATION OWNERS ===')
          seen=set()
          for a in refs:
              st,en=bounds(a)
              if st in seen: continue
              seen.add(st)
              print(f'xref=0x{a:x} owner=0x{st:x}-0x{en:x} callers={",".join(hex(x) for x in direct_callers(st))}')
              dump(a,f'AUTHORIZATION OWNER @{a:x}',True)
          PY
