name: Promote Bilibili and Tencent comment image test store

on:
  push:
    branches: [main]
    paths:
      - ".github/bilibili-tencent-comment-images-promote-trigger"
      - ".github/workflows/promote-bilibili-tencent-comment-images-test.yml"

permissions:
  contents: read

concurrency:
  group: promote-bilibili-tencent-comment-images-test
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check repository token
        shell: bash
        env:
          MX_REPO_TOKEN: ${{ secrets.MX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_REPO_TOKEN" ]] || { echo "::error::Missing MX_REPO_TOKEN"; exit 1; }

      - name: Checkout staged test store
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 1
          persist-credentials: false

      - name: Verify staged versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          versions = {x['packageName']: (x['versionName'], x['versionCode']) for x in data['extensionList']['extensions']}
          expected = {
              'eu.kanade.tachiyomi.extension.zh.bilibilimanga': ('1.6.22', 106022),
              'eu.kanade.tachiyomi.extension.zh.tencentcomics': ('1.4.24', 104024),
          }
          for pkg, version in expected.items():
              if versions.get(pkg) != version:
                  raise SystemExit(f'{pkg}: expected {version}, got {versions.get(pkg)}')
          print('Staged Bilibili v22 and Tencent v24 verified')
          PY
          test -f staging/test/apk/tachiyomi-zh.bilibilimanga-v1.6.22.apk
          test -f staging/test/apk/tachiyomi-zh.tencentcomics-v1.4.24.apk

      - name: Checkout public repository
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          ref: repo
          token: ${{ secrets.MX_REPO_TOKEN }}
          path: repo
          fetch-depth: 0
          persist-credentials: true

      - name: Promote staged test store
        shell: bash
        run: |
          set -euo pipefail
          rm -rf repo/test
          mkdir -p repo/test
          cp -a staging/test/. repo/test/
          git -C repo status --short

      - name: Commit public test store
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No test-store changes to promote"
          else
            git commit -m "Publish Bilibili v22 and Tencent v24 comment image tests"
            git push origin HEAD:repo
          fi

      - name: Verify promoted tree locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('repo/test/index.json').read_text('utf-8'))
          versions = {x['packageName']: (x['versionName'], x['versionCode']) for x in data['extensionList']['extensions']}
          assert versions['eu.kanade.tachiyomi.extension.zh.bilibilimanga'] == ('1.6.22', 106022)
          assert versions['eu.kanade.tachiyomi.extension.zh.tencentcomics'] == ('1.4.24', 104024)
          print('Promoted index verified')
          PY
