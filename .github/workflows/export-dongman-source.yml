name: Export Dongman source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-dongman-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: 4b0ba9b945234520918610701642bb0fe7da8cf8
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Stage Dongman files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp source/src/zh/dongmanmanhuaplus/src/eu/kanade/tachiyomi/extension/zh/dongmanmanhuaplus/DongmanManhuaPlus.kt out/
          cp source/src/zh/dongmanmanhuaplus/build.gradle.kts out/
          cp source/docs/sources/dongmanmanhuaplus.md out/
      - name: Upload Dongman source
        uses: actions/upload-artifact@v4
        with:
          name: dongman-source
          path: out
          if-no-files-found: error
