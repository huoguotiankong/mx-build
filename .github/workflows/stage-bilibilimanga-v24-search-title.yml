name: Stage Bilibili Manga v24 Search Title Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage-bilibilimanga-v24-search-title.yml"
      - ".github/bilibilimanga-v24-search-title-trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-bilibilimanga-v24-search-title
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MANGA_SIGNING_BUNDLE" ]] || { echo "::error::Missing MANGA_SIGNING_BUNDLE"; exit 1; }
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }

      - name: Checkout current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout validated v23 handoff and test store
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          token: ${{ github.token }}
          path: staging
          fetch-depth: 0
          persist-credentials: true

      - name: Restore validated Bilibili v23 payload
        shell: bash
        run: |
          set -euo pipefail
          handoff='staging/source-handoff/bilibili-v23-tencent-v25'
          test -f "$handoff/BASE_SOURCE_SHA.txt"
          base_sha="$(tr -d '\r\n' < "$handoff/BASE_SOURCE_SHA.txt")"
          git -C dev cat-file -e "$base_sha^{commit}"
          git -C dev diff --quiet "$base_sha" HEAD -- \
            src/zh/bilibilimanga \
            docs/sources/bilibilimanga.md || {
              echo "::error::Bilibili target files changed after validated v23 handoff base $base_sha"
              exit 1
            }
          test -f "$handoff/src/zh/bilibilimanga/build.gradle.kts"
          test -f "$handoff/docs/sources/bilibilimanga.md"
          rm -rf dev/src/zh/bilibilimanga
          mkdir -p dev/src/zh/bilibilimanga
          cp -a "$handoff/src/zh/bilibilimanga/." dev/src/zh/bilibilimanga/
          cp "$handoff/docs/sources/bilibilimanga.md" dev/docs/sources/bilibilimanga.md
          grep -F 'versionCode = 23' dev/src/zh/bilibilimanga/build.gradle.kts
          test -f dev/src/zh/bilibilimanga/src/eu/kanade/tachiyomi/source/mx/Comment.kt

      - name: Apply v24 search title sanitizer
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path('dev/src/zh/bilibilimanga/src/eu/kanade/tachiyomi/extension/zh/bilibilimanga/BilibiliManga.kt')
          text = source.read_text('utf-8')
          old = '        val title = obj.string("org_title") ?: obj.string("title") ?: return null\n'
          new = (
              '        val title = (obj.string("org_title") ?: obj.string("title") ?: return null)\n'
              '            .replace(Regex("""</?em\\b[^>]*>""", RegexOption.IGNORE_CASE), "")\n'
              '            .trim()\n'
          )
          if old not in text:
              raise SystemExit('Bilibili manga title anchor not found in validated v23 payload')
          source.write_text(text.replace(old, new, 1), 'utf-8')

          gradle = Path('dev/src/zh/bilibilimanga/build.gradle.kts')
          gradle_text = gradle.read_text('utf-8')
          if '    versionCode = 23\n' not in gradle_text:
              raise SystemExit('Expected Bilibili versionCode 23 not found')
          gradle.write_text(gradle_text.replace('    versionCode = 23\n', '    versionCode = 24\n', 1), 'utf-8')

          docs = Path('dev/docs/sources/bilibilimanga.md')
          docs_text = docs.read_text('utf-8')
          if '- 当前版本：`versionCode = 23`' not in docs_text:
              raise SystemExit('Expected Bilibili docs versionCode 23 not found')
          docs_text = docs_text.replace('- 当前版本：`versionCode = 23`', '- 当前版本：`versionCode = 24`', 1)
          note = (
              '\n\n## 2026-09-07 v24：搜索标题高亮标签清理\n\n'
              '- 用户实机反馈：搜索结果标题会直接显示 Bilibili 搜索接口返回的 `<em class="keyword">...</em>` 高亮标签。\n'
              '- 根因：`search.v1.Search/SearchKeyword` 的 `org_title` 会嵌入 HTML 高亮标记，旧实现直接写入 `SManga.title`。\n'
              '- 修复：在 `mangaFromObject()` 中仅清理 `<em ...>` / `</em>` 搜索高亮标签并执行 `trim()`；漫画 ID、URL、封面、详情、章节与正文逻辑保持不变。\n'
              '- 版本衔接：基于已构建验证的 v23 富媒体评论 payload 继续修复，避免复用已生成过 APK 的 v23 版本号。\n'
              '- 验证状态：CI 构建/签名/测试商店完成后标记为构建已验证；标题显示仍需用户实机确认。\n'
          )
          if 'v24：搜索标题高亮标签清理' not in docs_text:
              docs_text += note
          docs.write_text(docs_text, 'utf-8')

          sample = '<em class="keyword">小智怪</em>谈'
          import re
          cleaned = re.sub(r'</?em\b[^>]*>', '', sample, flags=re.I).strip()
          if cleaned != '小智怪谈':
              raise SystemExit(f'Sanitizer fixture failed: {cleaned!r}')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as f:
              f.write('source_code=24\nversion_name=1.6.24\nandroid_code=106024\n')
          PY
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check
          grep -F 'versionCode = 24' dev/src/zh/bilibilimanga/build.gradle.kts
          grep -F '.replace(Regex("""</?em\b[^>]*>""", RegexOption.IGNORE_CASE), "")' \
            dev/src/zh/bilibilimanga/src/eu/kanade/tachiyomi/extension/zh/bilibilimanga/BilibiliManga.kt

      - name: Overlay Bilibili v24 into upstream
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/bilibilimanga
          cp -a dev/src/zh/bilibilimanga upstream/src/zh/bilibilimanga

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply and verify formatting
        working-directory: upstream
        run: |
          ./gradlew :src:zh:bilibilimanga:spotlessApply
          ./gradlew :src:zh:bilibilimanga:spotlessCheck

      - name: Copy formatted source back and revalidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/bilibilimanga
          cp -a upstream/src/zh/bilibilimanga dev/src/zh/bilibilimanga
          python3 dev/scripts/validate_sources.py
          git -C dev diff --check
          grep -F 'versionCode = 24' dev/src/zh/bilibilimanga/build.gradle.kts
          grep -F '.replace(Regex("""</?em\b[^>]*>""", RegexOption.IGNORE_CASE), "")' \
            dev/src/zh/bilibilimanga/src/eu/kanade/tachiyomi/extension/zh/bilibilimanga/BilibiliManga.kt

      - name: Prepare stable signing key
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          required = ('signingKey', 'alias', 'storePassword', 'keyPassword')
          missing = [key for key in required if not bundle.get(key)]
          if missing:
              raise SystemExit('Signing bundle missing: ' + ', '.join(missing))
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(bundle['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as f:
              for env_name, key in (('ALIAS','alias'), ('KEY_STORE_PASSWORD','storePassword'), ('KEY_PASSWORD','keyPassword')):
                  value = str(bundle[key])
                  print(f'::add-mask::{value}')
                  f.write(f'{env_name}<<EOF_SIGN\n{value}\nEOF_SIGN\n')
          PY

      - name: Build debug, signed release and lint
        working-directory: upstream
        run: ./gradlew :src:zh:bilibilimanga:assembleDebug :src:zh:bilibilimanga:assembleRelease :src:zh:bilibilimanga:lintRelease

      - name: Verify APK version and signing identity
        id: signing
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version_name }}
          EXPECTED_ANDROID_CODE: ${{ steps.version.outputs.android_code }}
        run: |
          set -euo pipefail
          actual="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          designated='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          [[ "$actual" == "$designated" ]] || { echo "::error::Signing certificate mismatch"; exit 1; }
          apk="$(find upstream/src/zh/bilibilimanga -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          badging="$("$aapt" dump badging "$apk")"
          android_code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n1)"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          [[ "$android_code" == "$EXPECTED_ANDROID_CODE" ]] || { echo "::error::Unexpected Android versionCode $android_code"; exit 1; }
          [[ "$version_name" == "$EXPECTED_VERSION" ]] || { echo "::error::Unexpected versionName $version_name"; exit 1; }
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "Bilibili v24 signed APK verified: versionName=$version_name androidVersionCode=$android_code"

      - name: Commit validated Bilibili v24 to private main
        working-directory: dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f .github/workflows/patch-bilibilimanga-v23-search-title.yml; then
            git rm .github/workflows/patch-bilibilimanga-v23-search-title.yml
          fi
          git add src/zh/bilibilimanga docs/sources/bilibilimanga.md
          git diff --cached --check
          git diff --cached --quiet && { echo "::error::No validated Bilibili v24 source changes"; exit 1; }
          git commit -m 'fix(bilibilimanga): sanitize search titles v24'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Generate isolated Bilibili v24 test store snapshot
        shell: bash
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          printf '%s\n' 'zh/bilibilimanga' > targets.txt
          python3 dev/scripts/publish_test_repo.py \
            --targets targets.txt \
            --upstream-root upstream \
            --source-root dev \
            --repo-dir staging/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/index.json
          test -f staging/test/repo.json
          test -f "staging/test/apk/tachiyomi-zh.bilibilimanga-v${EXPECTED_VERSION}.apk"
          test -f 'staging/test/icon/eu.kanade.tachiyomi.extension.zh.bilibilimanga-v106024.png'
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = 'eu.kanade.tachiyomi.extension.zh.bilibilimanga'
          data = json.loads(Path('staging/test/index.json').read_text('utf-8'))
          items = [x for x in data['extensionList']['extensions'] if x.get('packageName') == package]
          if len(items) != 1:
              raise SystemExit(f'Expected one Bilibili entry, got {len(items)}')
          actual = (items[0].get('versionName'), items[0].get('versionCode'))
          if actual != ('1.6.24', 106024):
              raise SystemExit(f'Unexpected staged Bilibili version: {actual}')
          print('Staged Bilibili verified:', actual)
          PY

      - name: Commit staged test store
        working-directory: staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No staging changes'
          else
            git commit -m 'Stage Bilibili Manga v1.6.24 test store'
            git push origin HEAD:extension-staging
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: bilibilimanga-v24-signed-apk
          path: upstream/src/zh/bilibilimanga/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
