name: Trace Qingman AppConfig InitServices Call Tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-appconfig-initservice-calltree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyelftools python3-capstone cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Trace AppConfig initServices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/apk_url
          import json,urllib.request
          a=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))['data']['datas']['android']
          if str(a.get('version'))!='4.4.5' or str(a.get('versionCode'))!='445':
              raise SystemExit('Unexpected Qingman official version')
          print(a['downloadUrl'])
          PY
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 180 "$(cat /tmp/apk_url)" -o /tmp/qingman.apk
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import re

          pp={}
          for line in Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines():
              m=re.match(r'\[pp\+0x([0-9a-fA-F]+)\]\s+(.*)$',line)
              if m: pp[int(m.group(1),16)]=m.group(2)
          with open('/tmp/app-lib/libapp.so','rb') as f:
              elf=ELFFile(f); sec=elf.get_section_by_name('.text'); base=int(sec['sh_addr']); data=sec.data()
          md=Cs(CS_ARCH_ARM64,CS_MODE_ARM); md.skipdata=True
          ins=list(md.disasm(data,base)); idx={x.address:i for i,x in enumerate(ins)}
          deny=re.compile(r'(?i)(password|token|authorization|bearer|cookie|secret|private|clientp12|certificate|keystore|proof|signature|sign/key|seed|k1a|k1b|k2a|k2b|k3a|k3b)')
          interesting=re.compile(r'(?i)(appconfig|baseimg|image|img|cdn|domain|host|url|config|api/|http|request|dio|service|init|comic|chapter)')

          def is_prologue(x):
              return x.mnemonic=='stp' and x.op_str.replace(' ','').startswith('x29,x30,[x15,#-0x10]!')
          def bounds(addr):
              if addr not in idx: return None
              k=idx[addr]; s=k
              while s>0 and not is_prologue(ins[s]): s-=1
              e=k+1
              while e<len(ins) and not is_prologue(ins[e]): e+=1
              return ins[s].address, ins[e].address if e<len(ins) else ins[-1].address+4
          def direct_calls(st,en):
              out=[]
              for x in md.disasm(data[st-base:en-base],st):
                  if x.mnemonic!='bl': continue
                  m=re.fullmatch(r'#(0x[0-9a-f]+|\d+)',x.op_str.lower())
                  if m:
                      a=int(m.group(1),0)
                      if base<=a<base+len(data): out.append(a)
              return out
          def dump(addr,label):
              be=bounds(addr)
              if not be: return []
              st,en=be
              print(f'\n=== {label} function=0x{st:x}-0x{en:x} ===')
              pending={}; calls=[]
              for x in md.disasm(data[st-base:en-base],st):
                  pending={r:(b,n-1) for r,(b,n) in pending.items() if n>1}
                  op=x.op_str.lower(); ann=''
                  m=re.match(r'(x\d+),\s*x27,\s*#(0x[0-9a-f]+|\d+)(?:,\s*lsl\s*#(\d+))?$',op)
                  if x.mnemonic=='add' and m:
                      pending[m.group(1)]=(int(m.group(2),0)<<int(m.group(3) or 0),30)
                  elif x.mnemonic in ('ldr','ldur','ldrsw'):
                      m=re.match(r'([wx]\d+),\s*\[(x\d+)(?:,\s*#(-?(?:0x[0-9a-f]+|\d+)))?\]',op)
                      if m:
                          br=m.group(2); disp=int(m.group(3),0) if m.group(3) else 0
                          off=disp if br=='x27' else (pending[br][0]+disp if br in pending else None)
                          if off is not None and off in pp:
                              v=pp[off]
                              if not deny.search(v) and interesting.search(v): ann=f' ; PP+0x{off:x}={v[:240]}'
                  if x.mnemonic=='bl':
                      m=re.fullmatch(r'#(0x[0-9a-f]+|\d+)',op)
                      if m: calls.append(int(m.group(1),0))
                  if ann or x.mnemonic in ('bl','blr','ret','b','b.eq','b.ne','cbz','cbnz','tbz','tbnz'):
                      print(f'0x{x.address:x} {x.mnemonic:<7} {x.op_str}{ann}')
              return [a for a in calls if base<=a<base+len(data)]

          # Startup analysis established QxAppConfig.initServices starts at 0xbb9368 in official 4.4.5.
          root=0xbb9368
          seen=set(); frontier=[(root,0,'QXAPPCONFIG INITSERVICES')]
          while frontier:
              addr,depth,label=frontier.pop(0)
              be=bounds(addr)
              if not be: continue
              st,en=be
              if st in seen: continue
              seen.add(st)
              calls=dump(addr,label)
              if depth<3:
                  for c in calls:
                      cb=bounds(c)
                      if cb and cb[0] not in seen and 0x400000 <= cb[0] <= 0xbbffff:
                          frontier.append((c,depth+1,f'CALLEE depth={depth+1} from=0x{st:x}'))
              if len(seen)>=80: break

          print('\n=== SAFE CONFIG/IMAGE/ROUTE STRING INVENTORY ===')
          count=0
          for off,v in sorted(pp.items()):
              if deny.search(v): continue
              m=re.fullmatch(r'String: "([^"]*)"',v)
              if not m: continue
              s=m.group(1)
              if not interesting.search(s): continue
              if len(s)>180: continue
              print(f'PP+0x{off:x} {s}')
              count+=1
              if count>=500: break
          print('safe_string_count='+str(count))
          PY
