name: MX App Preview

run-name: MX App Preview · ${{ inputs.ref || 'feat/replacement-target-and-detail-metadata' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "mx-app branch, tag, or commit SHA"
        required: true
        default: "main"
        type: string
      publish:
        description: "Publish signed phone APKs to private mx-app/downloads"
        required: true
        default: true
        type: boolean

  push:
    branches: [main]
    paths:
      - ".github/mx-app-build-trigger"

permissions:
  contents: read

concurrency:
  group: mx-app-preview-${{ inputs.ref || 'feat/replacement-target-and-detail-metadata' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check required secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
          MX_APP_PUBLISH_TOKEN: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || {
            echo "::error::Missing MX_PRIVATE_READ_TOKEN"
            exit 1
          }
          [[ -n "$MX_APP_SIGNING_BUNDLE" ]] || {
            echo "::error::Missing MX_APP_SIGNING_BUNDLE"
            exit 1
          }
          if [[ "${{ github.event_name == 'push' || inputs.publish }}" == "true" ]]; then
            [[ -n "$MX_APP_PUBLISH_TOKEN" ]] || {
              echo "::error::Missing MX_APP_PUBLISH_TOKEN"
              exit 1
            }
          fi

      - name: Checkout private MX App source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: ${{ inputs.ref || 'feat/replacement-target-and-detail-metadata' }}
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Record private source revision
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          {
            echo "### MX App source"
            echo
            echo "- Requested ref: \`${{ inputs.ref || 'feat/replacement-target-and-detail-metadata' }}\`"
            echo "- Resolved commit: \`$source_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: source

      - name: Prepare stable signing key
        shell: bash
        env:
          MX_APP_SIGNING_BUNDLE: ${{ secrets.MX_APP_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(os.environ["MX_APP_SIGNING_BUNDLE"])
          required = ("signingKey", "alias", "storePassword")
          missing = [key for key in required if not bundle.get(key)]
          if missing:
              raise SystemExit(f"Signing bundle missing fields: {', '.join(missing)}")

          path = Path(os.environ["RUNNER_TEMP"]) / "mx-app.jks"
          path.write_bytes(base64.b64decode(bundle["signingKey"]))

          values = {
              "MX_KEYSTORE_PATH": str(path),
              "MX_KEY_ALIAS": str(bundle["alias"]),
              "MX_KEYSTORE_PASSWORD": str(bundle["storePassword"]),
              "MX_KEY_PASSWORD": str(bundle["storePassword"]),
          }

          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as f:
              for name, value in values.items():
                  print(f"::add-mask::{value}")
                  f.write(f"{name}<<__MX_SIGNING_EOF__\n{value}\n__MX_SIGNING_EOF__\n")
          PY

      - name: Verify stable signing identity
        shell: bash
        run: |
          set -euo pipefail
          expected="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          actual="$(
            keytool -exportcert \
              -alias "$MX_KEY_ALIAS" \
              -keystore "$MX_KEYSTORE_PATH" \
              -storepass "$MX_KEYSTORE_PASSWORD" |
              sha256sum | awk '{print $1}'
          )"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::MX signing certificate mismatch"
            echo "Expected certificate SHA-256: $expected"
            echo "Actual certificate SHA-256:   $actual"
            exit 1
          }
          echo "Stable signing certificate verified: $actual"

      - name: Spotless
        working-directory: source
        run: ./gradlew spotlessCheck

      - name: Build signed Preview APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assemblePreview \
            -Pdisable-code-shrink \
            --no-configuration-cache \
            -Pandroid.injected.signing.store.file="$MX_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$MX_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$MX_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$MX_KEY_PASSWORD"

      - name: Unit tests
        working-directory: source
        run: ./gradlew testReleaseUnitTest

      - name: Normalize Preview APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -n "$apksigner" ]] || {
            echo "::error::apksigner not found"
            exit 1
          }

          found=0
          while IFS= read -r apk; do
            found=1
            signed="${apk%.apk}.mx-signed.apk"
            rm -f "$signed"
            "$apksigner" sign \
              --ks "$MX_KEYSTORE_PATH" \
              --ks-key-alias "$MX_KEY_ALIAS" \
              --ks-pass env:MX_KEYSTORE_PASSWORD \
              --key-pass env:MX_KEY_PASSWORD \
              --out "$signed" \
              "$apk"
            mv "$signed" "$apk"
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)

          [[ "$found" -eq 1 ]] || {
            echo "::error::No Preview APK found"
            exit 1
          }

      - name: Verify APK identity and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          expected_cert="c230be9c78bf5d28a101c2cb785923b899aa569ead15961309dea8bbcb34ec33"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -n "$aapt_bin" && -n "$apksigner" ]] || {
            echo "::error::Android build-tools verification binaries not found"
            exit 1
          }

          found=0
          while IFS= read -r apk; do
            found=1
            badging="$("$aapt_bin" dump badging "$apk")"
            package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
            app_label="$(printf '%s\n' "$badging" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1)"

            [[ "$package_name" == "com.huoguotiankong.mx.beta" ]] || {
              echo "::error::Unexpected package name: $package_name"
              exit 1
            }
            [[ "$app_label" == "MX漫画" ]] || {
              echo "::error::Unexpected app label: $app_label"
              exit 1
            }

            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            normalized="$(
              printf '%s' "$cert_output" |
                tr '[:upper:]' '[:lower:]' |
                tr -d ':[:space:]'
            )"
            [[ "$normalized" == *"$expected_cert"* ]] || {
              echo "::error::APK signing certificate mismatch for $(basename "$apk")"
              exit 1
            }
          done < <(find source/app/build/outputs/apk/preview -type f -name '*.apk' | sort)

          [[ "$found" -eq 1 ]] || {
            echo "::error::No Preview APK found"
            exit 1
          }

      - name: Checkout private APK publication target
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: main
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: publisher
          fetch-depth: 1

      - name: Publish signed phone APKs to private downloads branch
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail

          cd publisher
          git switch --orphan mx-public-builder-downloads
          git rm -rf . || true
          git clean -fdx

          mkdir -p apks

          found=0
          while IFS= read -r apk; do
            base="$(basename "$apk")"
            case "$base" in
              *arm64-v8a*)
                target="MX-Manga-arm64-v8a-preview.apk"
                ;;
              *armeabi-v7a*)
                target="MX-Manga-armeabi-v7a-preview.apk"
                ;;
              *)
                continue
                ;;
            esac
            found=1
            cp "$apk" "apks/$target"
          done < <(find ../source/app/build/outputs/apk/preview -maxdepth 1 -type f -name '*.apk' | sort)

          [[ "$found" -eq 1 ]] || {
            echo "::error::No phone Preview APK found for private downloads branch"
            exit 1
          }

          cat > README.md <<EOF
          # MX漫画 Private Preview

          此分支保存由 MX 公共构建基础设施编译、使用长期稳定签名签署的最新手机 Preview APK。

          - ARM64：\`apks/MX-Manga-arm64-v8a-preview.apk\`
          - 32 位 ARM：\`apks/MX-Manga-armeabi-v7a-preview.apk\`
          - 私有源码提交：\`$SOURCE_SHA\`

          APK 仍保存在私有 \`mx-app\` 仓库；公开 \`mx-build\` 不保存 APK 或私有源码。
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apks
          git commit -m "Publish MX漫画 Preview ${SOURCE_SHA:0:7}"
          git push --force origin HEAD:downloads

          {
            echo
            echo "### Publication"
            echo
            echo "- Signed phone APKs published to private \`mx-app/downloads\`."
            echo "- Source commit: \`$SOURCE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mx-app.jks"
