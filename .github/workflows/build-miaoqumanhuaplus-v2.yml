name: Build Miaoqu Manhua Plus v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-miaoqumanhuaplus-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-miaoqumanhuaplus-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check secrets
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          test -n "$MX_PRIVATE_READ_TOKEN"
          test -n "$MANGA_SIGNING_BUNDLE"

      - name: Checkout helper
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: main
          path: helper
          fetch-depth: 0

      - name: Checkout development source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: dev
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/miaoqumanhuaplus
          cp -a dev/src/zh/miaoqumanhuaplus upstream/src/zh/miaoqumanhuaplus
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            find "upstream/src/zh/miaoqumanhuaplus/res/mipmap-$density" -maxdepth 1 -type f -name 'ic_launcher.*' | grep -q .
          done
          grep -Fq 'versionCode = 2' upstream/src/zh/miaoqumanhuaplus/build.gradle.kts
          grep -Fq 'libVersion = "1.6"' upstream/src/zh/miaoqumanhuaplus/build.gradle.kts
          grep -Fq '"geshu"' upstream/src/zh/miaoqumanhuaplus/src/eu/kanade/tachiyomi/extension/zh/miaoqumanhuaplus/MiaoquManhuaPlus.kt
          grep -Fq '"paixuid"' upstream/src/zh/miaoqumanhuaplus/src/eu/kanade/tachiyomi/extension/zh/miaoqumanhuaplus/MiaoquManhuaPlus.kt
          python3 dev/scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format and check
        working-directory: upstream
        run: |
          ./gradlew :src:zh:miaoqumanhuaplus:spotlessApply
          ./gradlew :src:zh:miaoqumanhuaplus:spotlessCheck

      - name: Prepare signing
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64,json,os
          from pathlib import Path
          b=json.loads(os.environ['MANGA_SIGNING_BUNDLE'])
          Path('upstream/signingkey.jks').write_bytes(base64.b64decode(b['signingKey']))
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
            for e,k in [('ALIAS','alias'),('KEY_STORE_PASSWORD','storePassword'),('KEY_PASSWORD','keyPassword')]:
              v=str(b[k]); print(f'::add-mask::{v}'); f.write(f'{e}<<EOF\n{v}\nEOF\n')
          PY

      - name: Build Debug Release and lint
        working-directory: upstream
        run: ./gradlew :src:zh:miaoqumanhuaplus:assembleDebug :src:zh:miaoqumanhuaplus:assembleRelease :src:zh:miaoqumanhuaplus:lintRelease

      - name: Verify release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected='1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620'
          actual="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          echo "fingerprint=$actual" >> "$GITHUB_OUTPUT"
          apk="$(find upstream/src/zh/miaoqumanhuaplus -path '*/build/outputs/apk/release/*.apk' -type f | head -n1)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify "$apk"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            find "upstream/src/zh/miaoqumanhuaplus/res/mipmap-$density" -name 'ic_launcher.*' | grep -q .
          done
          unzip -l "$apk" | grep -Fq 'classes.dex'

      - name: Save validated handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff='helper/.github/handoff/miaoqumanhuaplus-v2'
          rm -rf "$handoff"
          mkdir -p "$handoff"
          cp -a upstream/src/zh/miaoqumanhuaplus "$handoff/module"
          rm -rf "$handoff/module/build"
          cp dev/docs/sources/miaoqu.md "$handoff/miaoqu.md"
          printf '%s\n' '1.6.2 / source 2 / Android 106002' 'Live config/search/detail/reader protocol verified; Spotless Debug Release Lint signed' > "$handoff/VALIDATED.txt"
          git -C helper config user.name 'github-actions[bot]'
          git -C helper config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C helper add .github/handoff/miaoqumanhuaplus-v2
          if ! git -C helper diff --cached --quiet; then
            git -C helper commit -m 'handoff: validated Miaoqu Manhua Plus v2'
            git -C helper pull --rebase origin main
            git -C helper push origin HEAD:main
          fi

      - name: Checkout staging
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-build
          ref: extension-staging
          path: staging
          fetch-depth: 0

      - name: Generate isolated test store
        env:
          SIGNING_FINGERPRINT: ${{ steps.verify.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dev/src/zh/miaoqumanhuaplus
          cp -a upstream/src/zh/miaoqumanhuaplus dev/src/zh/miaoqumanhuaplus
          rm -rf dev/src/zh/miaoqumanhuaplus/build
          printf '%s\n' 'zh/miaoqumanhuaplus' > targets.txt
          python3 dev/scripts/publish_test_repo.py --targets targets.txt --upstream-root upstream --source-root dev --repo-dir staging/test --owner huoguotiankong --repository mx-repo --signing-key "$SIGNING_FINGERPRINT"
          test -f staging/test/apk/tachiyomi-zh.miaoqumanhuaplus-v1.6.2.apk
          grep -q 'eu.kanade.tachiyomi.extension.zh.miaoqumanhuaplus' staging/test/index.json
          git -C staging config user.name 'github-actions[bot]'
          git -C staging config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C staging add test
          if ! git -C staging diff --cached --quiet; then
            git -C staging commit -m 'Stage Miaoqu Manhua Plus v1.6.2 test store'
            git -C staging pull --rebase origin extension-staging
            git -C staging push origin HEAD:extension-staging
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: miaoqumanhuaplus-v2-signed-apk
          path: upstream/src/zh/miaoqumanhuaplus/**/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -f upstream/signingkey.jks
