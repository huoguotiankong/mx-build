name: Check CopyManga Plus Extension

on:
  push:
    branches: [main]
    paths:
      - ".github/copymangaplus-check-trigger"
      - ".github/workflows/check-copymangaplus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source layout
        working-directory: source
        run: python3 scripts/validate_sources.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay CopyManga Plus module
        run: |
          rm -rf upstream/src/zh/copymangaplus
          cp -a source/src/zh/copymangaplus upstream/src/zh/copymangaplus

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Spotless check
        working-directory: upstream
        run: ./gradlew :src:zh:copymangaplus:spotlessCheck

      - name: Build debug and lint release
        working-directory: upstream
        run: ./gradlew :src:zh:copymangaplus:assembleDebug :src:zh:copymangaplus:lintRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: copymangaplus-debug-apk
          path: upstream/src/zh/copymangaplus/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
