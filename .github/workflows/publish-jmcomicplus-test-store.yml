name: Publish JMComic Plus Test Store

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-jmcomicplus-test-store.yml"
      - "scripts/patch_jmcomicplus_v5.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-jmcomicplus-test-store
  cancel-in-progress: false

# Build and publish the real-device repair candidate from mx-dev v5 + the validated v6 patch.
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        shell: bash
        env:
          MX_PRIVATE_READ_TOKEN: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
          MX_REPO_TOKEN: ${{ secrets.MX_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$MX_PRIVATE_READ_TOKEN" ]] || { echo "::error::Missing MX_PRIVATE_READ_TOKEN"; exit 1; }
          [[ -n "$MANGA_SIGNING_BUNDLE" ]] || { echo "::error::Missing MANGA_SIGNING_BUNDLE"; exit 1; }
          [[ -n "$MX_REPO_TOKEN" ]] || { echo "::error::Missing MX_REPO_TOKEN"; exit 1; }

      - name: Checkout build helpers
        uses: actions/checkout@v5
        with:
          path: buildrepo
          persist-credentials: false

      - name: Checkout private MX source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: 5dbfc785a4811037e3b5bd46971843a031adbdcf
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Keiyoushi source for patch references
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Apply validated v6 route repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('buildrepo/scripts/patch_jmcomicplus_v5.py')
          s = p.read_text('utf-8')
          s, n = re.subn(
              r'd = DOC\.read_text\("utf-8"\)nd = d\.replace\(',
              'd = DOC.read_text("utf-8")\n' + 'd = d.replace(',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'helper syntax repair failed: {n}')
          old = 'g = replace_once(g, "versionCode = 4", "versionCode = 5", "versionCode")'
          new = 'g = replace_once(g, "versionCode = 5", "versionCode = 6", "versionCode")'
          if old not in s:
              raise SystemExit('helper version rebase point missing')
          s = s.replace(old, new, 1)
          p.write_text(s, 'utf-8')
          PY
          python3 -m py_compile buildrepo/scripts/patch_jmcomicplus_v5.py
          python3 buildrepo/scripts/patch_jmcomicplus_v5.py
          python3 - <<'PY'
          from pathlib import Path

          kp = Path('source/src/zh/jmcomicplus/src/eu/kanade/tachiyomi/extension/zh/jmcomicplus/JmComicPlus.kt')
          lines = kp.read_text('utf-8').splitlines()
          domain_hits = 0
          bom_hits = 0
          for i, line in enumerate(lines):
              indent = line[:len(line) - len(line.lstrip())]
              if 'DOMAIN_REGEX.findAll(html).map' in line:
                  lines[i] = indent + "DOMAIN_REGEX.findAll(html).map { it.value.trimEnd('/', '\\\\', '\"') }.filterNot(::isLegacyWebBase).forEach(out::add)"
                  domain_hits += 1
              if 'val raw = response.body.string().trimStart(' in line:
                  lines[i] = indent + "val raw = response.body.string().trimStart('\\uFEFF')"
                  bom_hits += 1
          if domain_hits != 1:
              raise SystemExit(f'generated Kotlin domain line repair expected 1 hit, found {domain_hits}')
          if bom_hits != 1:
              raise SystemExit(f'generated Kotlin BOM line repair expected 1 hit, found {bom_hits}')
          kp.write_text('\n'.join(lines) + '\n', 'utf-8')

          dp = Path('source/docs/sources/jmcomicplus.md')
          s = dp.read_text('utf-8')
          s = s.replace('`1.6.5`，Android `versionCode=106005`', '`1.6.6`，Android `versionCode=106006`')
          s = s.replace(
              'v5 正文解混淆修正：已按当前 Keiyoushi 禁漫天堂算法对照修改，待重新执行 Spotless、Release 编译、Lint 和固定签名测试发布。',
              'v5 正文解混淆修正已合入；v6 在用户实机反馈基础上继续修复 APP/API 解压/请求头、Web 镜像/解析和扩展图标。',
          )
          dp.write_text(s, 'utf-8')
          PY

      - name: Validate target source
        shell: bash
        run: |
          set -euo pipefail
          python3 source/scripts/validate_sources.py
          test -f source/src/zh/jmcomicplus/build.gradle.kts
          grep -q 'versionCode = 6' source/src/zh/jmcomicplus/build.gradle.kts
          printf '%s\n' 'zh/jmcomicplus' > jm-targets.txt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Refresh current Keiyoushi framework
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay and format JMComic Plus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/zh/jmcomicplus
          cp -a source/src/zh/jmcomicplus upstream/src/zh/jmcomicplus
          cd upstream
          ./gradlew :src:zh:jmcomicplus:spotlessApply
          ./gradlew :src:zh:jmcomicplus:spotlessCheck

      - name: Copy formatted v6 source back
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude build/ upstream/src/zh/jmcomicplus/ source/src/zh/jmcomicplus/
          python3 source/scripts/validate_sources.py

      - name: Preserve exact v6 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: jmcomicplus-v6-source-candidate
          path: |
            source/src/zh/jmcomicplus
            source/docs/sources/jmcomicplus.md
          if-no-files-found: error
          retention-days: 14

      - name: Prepare stable extension signing key
        shell: bash
        env:
          MANGA_SIGNING_BUNDLE: ${{ secrets.MANGA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          bundle = json.loads(os.environ["MANGA_SIGNING_BUNDLE"])
          required = ("signingKey", "alias", "storePassword", "keyPassword")
          missing = [key for key in required if not bundle.get(key)]
          if missing:
              raise SystemExit(f"Signing bundle missing fields: {', '.join(missing)}")

          Path("upstream/signingkey.jks").write_bytes(base64.b64decode(bundle["signingKey"]))
          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as f:
              for env_name, key in (
                  ("ALIAS", "alias"),
                  ("KEY_STORE_PASSWORD", "storePassword"),
                  ("KEY_PASSWORD", "keyPassword"),
              ):
                  value = str(bundle[key])
                  print(f"::add-mask::{value}")
                  f.write(f"{env_name}<<__SIGNING_EOF__\n{value}\n__SIGNING_EOF__\n")
          PY

      - name: Build signed release extension
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :src:zh:jmcomicplus:assembleRelease :src:zh:jmcomicplus:lintRelease

      - name: Verify stable APK signing certificate
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          expected="$(keytool -exportcert -alias "$ALIAS" -keystore upstream/signingkey.jks -storepass "$KEY_STORE_PASSWORD" | sha256sum | awk '{print $1}')"
          expected="$(printf '%s' "$expected" | tr '[:upper:]' '[:lower:]')"
          designated="1bbfbdc401ab81dc227bf771c43d5b616d00149f5755691a317a819f5a88f620"
          [[ "$expected" == "$designated" ]] || { echo "::error::Configured signing key is not the designated long-term certificate"; exit 1; }
          echo "fingerprint=$expected" >> "$GITHUB_OUTPUT"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -n "$apksigner" ]] || { echo "::error::apksigner not found"; exit 1; }
          found=0
          while IFS= read -r apk; do
            found=1
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            actual="$(printf '%s\n' "$cert_output" | python3 -c 'import re,sys; lines=[line.replace(":", "") for line in sys.stdin if "sha-256" in line.lower()]; matches=[re.search(r"(?i)(?<![0-9a-f])[0-9a-f]{64}(?![0-9a-f])", line) for line in lines]; match=next((m for m in matches if m), None); print(match.group(0).lower() if match else "")')"
            [[ -n "$actual" ]] || { printf '%s\n' "$cert_output"; echo "::error::Unable to parse APK certificate"; exit 1; }
            [[ "$actual" == "$expected" ]] || { printf '%s\n' "$cert_output"; echo "::error::Signing certificate mismatch"; exit 1; }
          done < <(find upstream/src/zh/jmcomicplus -path '*/build/outputs/apk/release/*.apk' -type f | sort)
          [[ "$found" -eq 1 ]] || { echo "::error::No release APK found"; exit 1; }

      - name: Preserve signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmcomicplus-v6-signed-test-apk
          path: upstream/src/zh/jmcomicplus/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Checkout public distribution repository
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-repo
          token: ${{ secrets.MX_REPO_TOKEN }}
          ref: repo
          path: repo
          fetch-depth: 0

      - name: Generate isolated JMComic Plus test store entry
        shell: bash
        env:
          SIGNING_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python3 source/scripts/publish_test_repo.py \
            --targets jm-targets.txt \
            --upstream-root upstream \
            --source-root source \
            --repo-dir repo/test \
            --owner huoguotiankong \
            --repository mx-repo \
            --signing-key "$SIGNING_FINGERPRINT"

      - name: Preserve generated test store artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmcomicplus-v6-test-store
          path: repo/test
          if-no-files-found: error
          retention-days: 14

      - name: Commit test store
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          if git diff --cached --quiet; then
            echo "No test-store changes to publish"
            exit 0
          fi
          git commit -m "Publish JMComic Plus test v6 from ${GITHUB_SHA:0:7}"
          git push origin HEAD:repo

      - name: Verify published test store endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/huoguotiankong/mx-repo/repo/test"
          for file in repo.json index.json; do
            ok=0
            for attempt in 1 2 3 4 5; do
              status="$(curl -L -sS -o "/tmp/$file" -w '%{http_code}' "$base/$file" || true)"
              if [[ "$status" == "200" ]]; then
                ok=1
                break
              fi
              sleep $((attempt * 2))
            done
            [[ "$ok" -eq 1 ]] || { echo "::error::Published test store endpoint unavailable: $file"; exit 1; }
          done
          python3 -m json.tool /tmp/repo.json >/dev/null
          python3 -m json.tool /tmp/index.json >/dev/null
          grep -q 'jmcomicplus' /tmp/index.json || { echo "::error::JMComic Plus missing from published test index"; exit 1; }
          grep -Eq '1\.6\.6|106006|versionCode[^0-9]*6' /tmp/index.json /tmp/repo.json || { echo "::error::Published test metadata does not show v6"; exit 1; }

      - name: Cleanup signing material
        if: always()
        run: rm -f upstream/signingkey.jks
