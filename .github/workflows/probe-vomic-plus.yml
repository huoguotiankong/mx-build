name: Probe Vomic Plus Reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vomic-plus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Extract concise VomicMHPlus report
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 -o /tmp/vomic.apk 'https://raw.githubusercontent.com/LittleSurvival/copymanga-copy20/main/apk/tachiyomi-zh.vomicmh-v1.4.4.apk'
          curl -L --fail --retry 4 -o /tmp/jadx.zip 'https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip'
          mkdir -p /tmp/jadx /tmp/vomic-src
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res -d /tmp/vomic-src /tmp/vomic.apk >/tmp/jadx.log 2>&1 || { cat /tmp/jadx.log; exit 1; }
          root=/tmp/vomic-src/sources/eu/kanade/tachiyomi/extension/zh/vomicmh
          echo '=== FILES ==='
          find "$root" -maxdepth 2 -type f -printf '%P\n' | sort
          echo '=== UNIQUE URL/API STRINGS ==='
          grep -RhoE 'https?://[^"[:space:]]+|/[A-Za-z0-9_./?=&{}$:-]*(api|comment|tucao|tsukkomi|chapter|comic|search|rank|login)[A-Za-z0-9_./?=&{}$:-]*' "$root" | sed 's/[);,]$//' | sort -u | head -n 250 || true
          echo '=== PREFERENCES/FUNCTIONS ==='
          grep -RniE 'ListPreference|SwitchPreference|EditTextPreference|PreferenceScreen|title =|key =|entries =|entryValues =|getPopular|popular|latest|search|filter|mangaDetails|chapterList|getPageList|imageRequest|Interceptor|headers|baseUrl|mirror|login|token|cookie' "$root" | head -n 300 || true
          echo '=== COMMENT/TUCAO CONTEXT ==='
          grep -RniE -C 5 '吐槽|评论|評論|comment|tucao|tsukkomi|danmaku|review' "$root" | head -n 400 || true
