name: Probe Vomic Plus Reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vomic-plus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Extract VomicMHPlus core DTO mapping
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 -o /tmp/vomic.apk 'https://raw.githubusercontent.com/LittleSurvival/copymanga-copy20/main/apk/tachiyomi-zh.vomicmh-v1.4.4.apk'
          curl -L --fail --retry 4 -o /tmp/jadx.zip 'https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip'
          mkdir -p /tmp/jadx /tmp/vomic-src
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res -d /tmp/vomic-src /tmp/vomic.apk >/dev/null 2>&1
          root=/tmp/vomic-src/sources/eu/kanade/tachiyomi/extension/zh/vomicmh
          echo '=== DTO FILES ==='
          find "$root/api/dto" -maxdepth 1 -type f -printf '%f\n' | sort
          echo '=== KEY DTO MAPPERS ==='
          for f in "$root"/api/dto/*.java; do
            if grep -qE 'toSManga|toSChapter|toPageList|chapter_list|img_list|cover|commentNum' "$f"; then
              echo "===== $(basename "$f") ====="
              grep -nE -C 5 'toSManga|toSChapter|toPageList|chapter_list|img_list|cover|commentNum|carId|car_id|group|process|author|intro|name|content' "$f" | head -n 320 || true
            fi
          done
          echo '=== CORE REQUEST/PARSE METHODS ==='
          grep -nE -C 8 'popularMangaRequest|popularMangaParse|latestUpdatesRequest|latestUpdatesParse|searchMangaRequest|searchMangaParse|mangaDetailsRequest|mangaDetailsParse|fetchChapterList|chapterListParse|pageListRequest|pageListParse|getMangaUrl|getChapterUrl' "$root/VomicMHPlus.java" | head -n 700
