name: Probe Vomic Plus Reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vomic-plus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Extract exact VomicMHPlus login contract
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 -o /tmp/vomic.apk 'https://raw.githubusercontent.com/LittleSurvival/copymanga-copy20/main/apk/tachiyomi-zh.vomicmh-v1.4.4.apk'
          curl -L --fail --retry 4 -o /tmp/jadx.zip 'https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip'
          mkdir -p /tmp/jadx /tmp/vomic-src
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res -d /tmp/vomic-src /tmp/vomic.apk >/dev/null 2>&1
          root=/tmp/vomic-src/sources/eu/kanade/tachiyomi/extension/zh/vomicmh
          echo '===== TOKEN PROVIDER LOGIN IMPLEMENTATION ====='
          sed -n '312,620p' "$root/special/TokenProvider.java"
          echo '===== MAIN INIT/PREFERENCES ====='
          grep -nE -C 5 'TokenProvider|setupPreference|preferences|initPreferences|configureClient|client' "$root/VomicMHPlus.java" | head -n 260 || true
          echo '===== TRANSLATION FILES ====='
          find "$root" -maxdepth 2 -type f | grep -Ei 'trans|chinese|convert|cc' || true
