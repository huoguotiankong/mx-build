name: Probe Vomic Plus Reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vomic-plus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Extract reference implementation details
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 -o /tmp/vomic.apk 'https://raw.githubusercontent.com/LittleSurvival/copymanga-copy20/main/apk/tachiyomi-zh.vomicmh-v1.4.4.apk'
          curl -L --fail --retry 4 -o /tmp/jadx.zip 'https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip'
          mkdir -p /tmp/jadx /tmp/vomic-src
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res -d /tmp/vomic-src /tmp/vomic.apk >/tmp/jadx.log 2>&1 || { cat /tmp/jadx.log; exit 1; }
          root=/tmp/vomic-src/sources/eu/kanade/tachiyomi/extension/zh/vomicmh
          for f in api/ApiRepo.java FilterKt.java CCOption.java ResolutionOption.java PreferencesKeys.java interceptor/AuthorizationInterceptor.java interceptor/HeadersInterceptor.java interceptor/CacheInterceptor.java; do
            echo "===== $f ====="
            sed -n '1,420p' "$root/$f"
          done
          echo '===== VomicMHPlus core methods ====='
          sed -n '70,470p' "$root/VomicMHPlus.java"
          echo '===== Comment DTO ====='
          sed -n '1,260p' "$root/api/dto/Comment.java"
          echo '===== User DTO ====='
          sed -n '1,240p' "$root/api/dto/User.java"
          echo '===== ChapterCommentResult DTO ====='
          sed -n '1,190p' "$root/api/dto/ChapterCommentResult.java"
