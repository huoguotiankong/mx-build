name: Patch MX 1.14.13 marker stability

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-mx-v93-marker-stability.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public build scripts
        uses: actions/checkout@v5
        with:
          path: build-control
          persist-credentials: false

      - name: Checkout private MX App marker-stability branch
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-app
          ref: hotfix/v92-marker-stability-v93
          token: ${{ secrets.MX_APP_PUBLISH_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply stable marker snapshot fix and push
        shell: bash
        run: |
          set -euo pipefail
          cp build-control/scripts/patch_mx_v93_marker_stability.py source/.mx-v93-patch.py
          cd source
          python3 .mx-v93-patch.py
          rm .mx-v93-patch.py
          ./gradlew spotlessApply
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
            app/src/main/java/eu/kanade/tachiyomi/ui/manga/MangaScreen.kt \
            app/src/main/java/eu/kanade/tachiyomi/ui/reader/setting/ReaderPreferences.kt
          git diff --cached --quiet && exit 1
          git commit -m "fix: keep replacement markers stable during refresh"
          git push origin HEAD:hotfix/v92-marker-stability-v93
