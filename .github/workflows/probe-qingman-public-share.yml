name: Trace Qingman Public Share And H5 Routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-public-share.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download current official APK robustly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          print('OFFICIAL_CODE='+str(a.get('versionCode','')),file=sys.stderr)
          PY
          url="$(head -1 /tmp/apk_url)"
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f /tmp/qingman.apk
            meta=$(curl -L --compressed -A 'Mozilla/5.0 (Linux; Android 16)' --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors -sS -o /tmp/qingman.apk -w '%{http_code} %{size_download} %{content_type}' "$url" || true)
            echo "download_attempt=$attempt meta=$meta"
            if unzip -tq /tmp/qingman.apk >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo "apk_bytes=$(wc -c < /tmp/qingman.apk)"

      - name: Trace non-sensitive public and local bridge strings
        shell: bash
        run: |
          set -euo pipefail
          unzip -p /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' > /tmp/libapp.so
          test -s /tmp/libapp.so
          strings -a /tmp/libapp.so > /tmp/app-strings
          unzip -Z1 /tmp/qingman.apk | grep '^assets/flutter_assets/' > /tmp/asset_names || true
          python3 - <<'PY'
          from pathlib import Path
          import re,urllib.parse
          lines=Path('/tmp/app-strings').read_text('utf-8',errors='replace').splitlines()

          print('=== PUBLIC_URLS ===')
          urls=[]
          for s in lines:
              for u in re.findall(r'https?://[^\s"<>]+',s):
                  try:
                      p=urllib.parse.urlsplit(u)
                      q=urllib.parse.parse_qsl(p.query,keep_blank_values=True)
                      safeq='&'.join(f'{k}=<value>' for k,_ in q)
                      su=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,safeq,''))
                  except Exception:
                      su=u.split('?',1)[0]
                  if re.search(r'(?i)(token|secret|password|signature|proof|authorization)',su): continue
                  if su not in urls: urls.append(su)
          for u in urls[:300]: print('URL '+u[:500])

          def emit(title,keys,limit=300):
              print('=== '+title+' ===')
              seen=set()
              for line in lines:
                  low=line.lower()
                  if not any(k.lower() in low for k in keys): continue
                  if re.search(r'(?i)(clientp12|privatekey|certificate|password|secret|token|authorization|cookie)',line): continue
                  t=re.sub(r'[A-Za-z0-9_-]{80,}','<opaque>',line)[:600]
                  if t in seen: continue
                  seen.add(t); print('STR '+t)
                  if len(seen)>=limit: break
              print('marker_count='+str(len(seen)))

          emit('SHARE_H5_MARKERS',('share','分享','h5','webview','web_url','weburl','shareurl','share_url','comicshare','comic_share','deeplink','deep_link','qingman.vip','qingman.dev','qingman.pro','qingman.xyz','qingman.my','qingman.app'))
          emit('LOCAL_BRIDGE_MARKERS',('127.0.0.1','localhost','0.0.0.0','httpserver','serversocket','loopback','content://','intent://','bindservice','startservice'))

          print('=== APP_ROUTE_MARKERS ===')
          routes=[]
          for line in lines:
              if re.fullmatch(r'/?(?:api/)?(?:comic|circle|user|radio)/[A-Za-z0-9_./-]{2,180}',line,re.I):
                  if line not in routes: routes.append(line)
          for r in routes[:500]: print('ROUTE '+r)
          print('route_count='+str(len(routes)))

          print('=== FLUTTER_ASSET_NAMES ===')
          ap=Path('/tmp/asset_names')
          names=ap.read_text('utf-8',errors='replace').splitlines() if ap.exists() else []
          marked=[n for n in names if re.search(r'(?i)(config|domain|url|share|web|h5|comic|route|env)',n)]
          for n in marked[:300]: print('ASSET '+n)
          print('asset_marker_count='+str(len(marked)))
          PY
