name: Trace Qingman Public Share And H5 Routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-qingman-public-share.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare analyzer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev >/dev/null
          git clone -q --depth=1 https://github.com/worawit/blutter.git /tmp/blutter

      - name: Restore analyzer cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/blutter/bin
            /tmp/blutter/dartsdk
            /tmp/blutter/packages
          key: qingman-blutter-dart-3.12.2-arm64-v1

      - name: Download current official APK robustly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/apk_url
          import json,urllib.request,sys
          o=json.load(urllib.request.urlopen('https://bass8ycl.zermh.com/api/radio/api/config/version',timeout=20))
          a=o['data']['datas']['android']
          print(a['downloadUrl'])
          print('OFFICIAL_VERSION='+str(a.get('version','')),file=sys.stderr)
          print('OFFICIAL_CODE='+str(a.get('versionCode','')),file=sys.stderr)
          PY
          url="$(head -1 /tmp/apk_url)"
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f /tmp/qingman.apk /tmp/qm-headers
            meta=$(curl -L --compressed -A 'Mozilla/5.0 (Linux; Android 16)' --connect-timeout 20 --max-time 240 --retry 2 --retry-all-errors -sS -D /tmp/qm-headers -o /tmp/qingman.apk -w '%{http_code} %{size_download} %{content_type}' "$url" || true)
            echo "download_attempt=$attempt meta=$meta"
            if unzip -tq /tmp/qingman.apk >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          echo "apk_bytes=$(wc -c < /tmp/qingman.apk)"

      - name: Trace public URL share and local bridge markers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          mkdir -p /tmp/app-lib /tmp/blutter-out /tmp/apk-extract
          unzip -q /tmp/qingman.apk 'lib/arm64-v8a/libapp.so' 'lib/arm64-v8a/libflutter.so' -d /tmp/apk-extract
          cp /tmp/apk-extract/lib/arm64-v8a/libapp.so /tmp/app-lib/
          cp /tmp/apk-extract/lib/arm64-v8a/libflutter.so /tmp/app-lib/
          unzip -Z1 /tmp/qingman.apk | grep '^assets/flutter_assets/' > /tmp/asset_names || true
          cd /tmp/blutter
          python3 blutter.py /tmp/app-lib /tmp/blutter-out >/tmp/blutter.log 2>&1

          python3 - <<'PY'
          from pathlib import Path
          import re,urllib.parse
          lines=Path('/tmp/blutter-out/pp.txt').read_text('utf-8',errors='replace').splitlines()
          print('=== PUBLIC_URLS ===')
          urls=[]
          for line in lines:
              m=re.search(r'String: "(.*?)"$',line)
              if not m: continue
              s=m.group(1)
              for u in re.findall(r'https?://[^\s"<>]+',s):
                  try:
                      p=urllib.parse.urlsplit(u)
                      q=urllib.parse.parse_qsl(p.query,keep_blank_values=True)
                      safeq='&'.join(f'{k}=<value>' for k,_ in q)
                      su=urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,safeq,''))
                  except Exception:
                      su=u.split('?',1)[0]
                  if su not in urls: urls.append(su)
          for u in urls[:320]: print('URL '+u)

          def emit(title,keys,limit=500):
              print('=== '+title+' ===')
              seen=set()
              for line in lines:
                  low=line.lower()
                  if not any(k.lower() in low for k in keys): continue
                  if re.search(r'(?i)(clientp12|privatekey|certificate|password|secret|token|authorization|cookie)',line): continue
                  t=re.sub(r'([A-Za-z0-9_-]{80,})','<opaque>',line)[:650]
                  if t in seen: continue
                  seen.add(t); print(t)
                  if len(seen)>=limit: break
              print('marker_count='+str(len(seen)))

          emit('SHARE_H5_MARKERS',('share','分享','h5','webview','web_url','weburl','shareurl','share_url','comicshare','comic_share','deeplink','deep_link','scheme','qingman.vip','qingman.dev','qingman.pro','qingman.xyz','qingman.my','qingman.app'))
          emit('LOCAL_BRIDGE_MARKERS',('127.0.0.1','localhost','0.0.0.0','httpserver','serversocket','loopback','methodchannel','eventchannel','basicmessagechannel','content://','fileprovider','intent://','broadcast','startservice','bindservice'))

          print('=== FLUTTER_ASSET_NAMES ===')
          ap=Path('/tmp/asset_names')
          names=ap.read_text('utf-8',errors='replace').splitlines() if ap.exists() else []
          marked=[n for n in names if re.search(r'(?i)(config|domain|url|share|web|h5|comic|route|env)',n)]
          for n in marked[:300]: print('ASSET '+n)
          print('asset_marker_count='+str(len(marked)))
          PY
