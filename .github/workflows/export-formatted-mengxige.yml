name: Export formatted MengXiGe source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-formatted-mengxige.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-formatted-mengxige
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v5
        with:
          ref: main
          path: helper
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: huoguotiankong/mx-dev
          ref: main
          token: ${{ secrets.MX_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current Keiyoushi
        uses: actions/checkout@v5
        with:
          repository: keiyoushi/extensions-source
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay source
        run: |
          rm -rf upstream/src/zh/mengxige
          cp -a source/src/zh/mengxige upstream/src/zh/mengxige

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply and verify formatting
        working-directory: upstream
        run: |
          ./gradlew :src:zh:mengxige:spotlessApply
          ./gradlew :src:zh:mengxige:spotlessCheck

      - name: Export formatted module
        run: |
          rm -rf helper/formatted/mengxige
          mkdir -p helper/formatted/mengxige
          rsync -a --exclude build/ upstream/src/zh/mengxige/ helper/formatted/mengxige/
          echo "$(git -C source rev-parse HEAD)" > helper/formatted/mengxige/source-commit.txt
          cd helper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formatted/mengxige
          if git diff --cached --quiet; then
            echo "No exported changes"
            exit 0
          fi
          git commit -m "ci: export formatted MengXiGe source"
          git push origin HEAD:main

